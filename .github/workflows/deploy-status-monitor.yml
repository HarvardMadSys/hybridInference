name: Deploy Status Monitor

# Builds, tests, and deploys the Cloudflare freeinference-monitor Worker
# (services/status-monitor-worker) whenever its source lands on dev. The Worker
# probes the production gateway but its own code still ships from dev: it is a
# standalone observer that touches no gateway code path, and the same dev-first
# flow keeps a probe change reviewable on the live dashboard before it can be
# promoted anywhere else. Runs on manual dispatch too.
on:
  push:
    branches: [dev]
    paths:
      - 'services/status-monitor-worker/**'
      - '.github/workflows/deploy-status-monitor.yml'
  workflow_dispatch:

# Never let two deploys of the same Worker overlap.
concurrency:
  group: status-monitor-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy freeinference-monitor Worker
    runs-on: [self-hosted, Linux, deploy-edge]
    environment: staging
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/status-monitor-worker
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN is not configured for this repository. Add a Cloudflare API token with Workers Scripts edit + D1 access."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The environment a page names now comes from the deployment record, so it
      # has to be proven against the config being shipped rather than restated
      # beside it. #1252 moved GATEWAY_BASE_URL and left the label behind
      # precisely because those were two independent edits; this makes the pair
      # inseparable — a URL change with no matching target fails the deploy.
      - name: Derive the probed environment from the config being deployed
        id: target
        run: |
          set -euo pipefail
          # Imports the Worker's own derivation rather than restating it: a
          # second copy of these rules is the thing that drifts. `src/env.ts`
          # has only type-only imports, so stripping types leaves it standalone.
          node --experimental-strip-types --no-warnings \
            --input-type=module <<'NODE' >> "${GITHUB_OUTPUT}"
          import { readFileSync } from "node:fs";
          import { deriveEnvironment } from "./src/env.ts";

          const toml = readFileSync("wrangler.toml", "utf8");
          const match = /^\s*GATEWAY_BASE_URL\s*=\s*"([^"]+)"/m.exec(toml);
          if (match === null) {
            throw new Error("wrangler.toml does not set GATEWAY_BASE_URL");
          }
          const target = deriveEnvironment(match[1].replace(/\/+$/, ""));
          // `local` and `unknown` mean the host could not be placed. Registering
          // one would attribute real pages to an environment nobody operates.
          if (target !== "staging" && target !== "production") {
            throw new Error(`GATEWAY_BASE_URL is not a deployment we alert on: ${match[1]}`);
          }
          console.log(`environment=${target}`);
          console.log(`principal=status-monitor-${target}`);
          NODE
        working-directory: services/status-monitor-worker

      # Applied before the new version can serve, so a version that reads a
      # column is never live against a database without it.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run migrate:remote

      # Upload without activating: attestation and the incident-state gate both
      # have to pass while the currently-serving version is still the old one.
      # The previous order deployed first and only then attested, so a rejected
      # attestation left an unregistered version live — which is how a build
      # carrying a stale prober key probed nothing for eleven hours on 08-11.
      - name: Upload the Worker version without activating it
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/status-monitor-wrangler-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.ndjson"
          rm -f "${output}"
          WRANGLER_OUTPUT_FILE_PATH="${output}" npx wrangler versions upload
          OUTPUT_PATH="${output}" node <<'NODE'
          const fs = require("node:fs");
          const output = process.env.OUTPUT_PATH;
          const lines = fs.readFileSync(output, "utf8").split(/\r?\n/).filter(Boolean);
          const uploads = lines
            .map((line) => JSON.parse(line))
            .filter(
              (item) =>
                item.type === "version-upload" &&
                item.worker_name === "freeinference-monitor",
            );
          if (uploads.length !== 1) throw new Error("expected one status-monitor version upload");
          const versionId = uploads[0].version_id;
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(versionId)) {
            throw new Error("upload record did not contain a Cloudflare Worker version ID");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version_id=${versionId}\n`);
          NODE
          rm -f "${output}"

      - name: Attest the exact deployed Worker version
        env:
          CONTROL_PLANE_URL: ${{ vars.ALERT_CONTROL_PLANE_STAGING_URL }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.version_id }}
          TARGET_ENVIRONMENT: ${{ steps.target.outputs.environment }}
          TARGET_PRINCIPAL: ${{ steps.target.outputs.principal }}
        run: |
          set -euo pipefail
          if [ -z "${CONTROL_PLANE_URL:-}" ]; then
            echo "::error title=Missing variable::ALERT_CONTROL_PLANE_STAGING_URL is not configured for the staging environment."
            exit 1
          fi
          origin="${CONTROL_PLANE_URL%/}"
          artifact_hex="$(git -C "${GITHUB_WORKSPACE}" archive "${GITHUB_SHA}" \
            services/status-monitor-worker .github/workflows/deploy-status-monitor.yml \
            | sha256sum | awk '{print $1}')"
          activated_at="$(($(date +%s) * 1000))"
          oidc_response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=alert-control-plane-deployment-attestation")"
          oidc_token="$(printf '%s' "${oidc_response}" | node -e '
            let body = "";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(body);
              if (typeof value.value !== "string" || value.value.length === 0) process.exit(1);
              process.stdout.write(value.value);
            });
          ')"
          echo "::add-mask::${oidc_token}"
          activation_body="$(node -e '
            const [deploymentId, digest, sha, activatedAt] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({
              action: "activate",
              deployment: {
                // The trust domain: which GitHub Environment signs this
                // attestation. Unrelated to the gateway probed below.
                environment: "staging",
                service: "status-monitor",
                deployment_id: deploymentId,
                artifact_digest: `sha256:${digest}`,
              },
              deployment_sha: sha,
              target_environment: process.env.TARGET_ENVIRONMENT,
              activated_at: Number(activatedAt),
              source: "status-monitor",
              principal: process.env.TARGET_PRINCIPAL,
            }));
          ' "${DEPLOYMENT_ID}" "${artifact_hex}" "${GITHUB_SHA}" "${activated_at}")"
          activation_response="$(curl -fsS \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            --data "${activation_body}" \
            "${origin}/v1/deployments/attest")"
          ACTIVATION_RESPONSE="${activation_response}" \
          ARTIFACT_HEX="${artifact_hex}" \
          node -e '
            const value = JSON.parse(process.env.ACTIVATION_RESPONSE || "{}");
            const deployment = value.deployment;
            const expected = {
              environment: "staging",
              service: "status-monitor",
              deploymentId: process.env.DEPLOYMENT_ID,
              artifactDigest: `sha256:${process.env.ARTIFACT_HEX}`,
              deploymentSha: process.env.GITHUB_SHA,
            };
            if (Object.keys(value).length !== 1 || deployment === null ||
                typeof deployment !== "object" ||
                Object.keys(deployment).length !== 9 ||
                deployment.environment !== expected.environment ||
                deployment.targetEnvironment !== process.env.TARGET_ENVIRONMENT ||
                deployment.service !== expected.service ||
                deployment.deploymentId !== expected.deploymentId ||
                deployment.artifactDigest !== expected.artifactDigest ||
                deployment.deploymentSha !== expected.deploymentSha ||
                !Number.isSafeInteger(deployment.activatedAt) ||
                deployment.retiredAt !== null ||
                !Number.isSafeInteger(deployment.registryVersion)) {
              process.exit(1);
            }
          '

      # Take the probe cycle's own lock for the duration of the cutover.
      #
      # Checking for in-flight incidents and then activating is not enough on its
      # own: the old version's cron can start a cycle in between, open an
      # incident under the old principal, and leave the new version to resolve it
      # under the new one — into a different Durable Object. Holding the lock the
      # cycle itself takes means no cycle can start, which closes that window
      # rather than narrowing it.
      #
      # Same semantics as `acquireCycleLock`: take it only if absent or expired,
      # and identify ourselves by token so the release can only ever drop our
      # own. The TTL is what makes a killed job self-healing — probing resumes
      # on its own rather than staying wedged behind a lock nobody will release.
      #
      # It must outlive `timeout-minutes`, or a slow cutover keeps running after
      # its own lock expires and a cron takes it back mid-flight — the exclusion
      # lapsing exactly when it is being relied on. 20 minutes clears the
      # 15-minute job timeout, and costs at most one skipped cycle if a runner
      # dies without running the release.
      - name: Acquire the cutover lock
        id: lock
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          token="cutover-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          expiry=$(( ($(date +%s) + 1200) * 1000 ))
          now=$(( $(date +%s) * 1000 ))
          echo "token=${token}" >> "${GITHUB_OUTPUT}"
          npx wrangler d1 execute freeinference-monitor --remote --json --command "
            INSERT INTO meta (key, value) VALUES ('cycle_lock', '${expiry}:${token}')
            ON CONFLICT(key) DO UPDATE SET value = '${expiry}:${token}'
             WHERE CAST(meta.value AS INTEGER) < ${now}
          " > "${RUNNER_TEMP}/lock.json"
          LOCK_PATH="${RUNNER_TEMP}/lock.json" node <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.env.LOCK_PATH, "utf8"));
          const changes = (Array.isArray(payload) ? payload : [payload])
            .map((entry) => entry?.meta?.changes)
            .find((value) => Number.isInteger(value));
          if (changes !== 1) {
            throw new Error(
              "a probe cycle is running; re-run once it finishes — activating now " +
                "would split one outage across two incident objects",
            );
          }
          NODE
          rm -f "${RUNNER_TEMP}/lock.json"

      # `target_environment` and `principal` are both incident-route material, so
      # activating a version that changes either moves every incident to a new
      # Durable Object. An incident open across that move would have its recovery
      # routed away from the object holding it and would never resolve — so the
      # cutover only proceeds while nothing is in flight.
      #
      # Read under the lock, so nothing can open an incident between this answer
      # and the activation it authorises.
      #
      # The monitor's own state is the authority here: it is the only writer of
      # status-monitor incidents, and it clears a model's entry only once that
      # model's recovery is confirmed delivered.
      - name: Require no incident in flight before cutting over
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: services/status-monitor-worker
        run: |
          set -euo pipefail
          npx wrangler d1 execute freeinference-monitor --remote --json --command "
            SELECT COUNT(*) AS in_flight FROM meta
             WHERE (key = 'alert_state' AND value NOT IN ('{}', ''))
                OR key = 'cycle_alert'
                OR key LIKE 'alert_delivery_owner:v1:%'
                OR key LIKE 'alert_delivery_pending:v1:%'
          " > "${RUNNER_TEMP}/in-flight.json"
          IN_FLIGHT_PATH="${RUNNER_TEMP}/in-flight.json" node <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.env.IN_FLIGHT_PATH, "utf8"));
          const rows = (Array.isArray(payload) ? payload : [payload])
            .flatMap((entry) => entry?.results ?? []);
          if (rows.length !== 1 || !Number.isInteger(rows[0].in_flight)) {
            throw new Error("could not read incident state; refusing to cut over blind");
          }
          if (rows[0].in_flight !== 0) {
            throw new Error(
              `${rows[0].in_flight} incident record(s) in flight — re-run once they resolve, ` +
                "or their recovery will be routed to a different incident object",
            );
          }
          NODE
          rm -f "${RUNNER_TEMP}/in-flight.json"

      # Only now does the uploaded version start serving. Pinned explicitly to
      # the attested version at 100%: a bare `versions deploy` prompts, and CI
      # must never resolve that by picking something for us.
      - name: Activate the attested version
        id: activate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.version_id }}
        working-directory: services/status-monitor-worker
        run: npx wrangler versions deploy "${DEPLOYMENT_ID}@100%" --yes

      # Always: a cutover that failed must not leave probing wedged behind a lock
      # nobody owns. Scoped to our own token, so a lock a live cycle has since
      # taken over is never dropped from under it.
      - name: Release the cutover lock
        if: always() && steps.lock.outputs.token != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LOCK_TOKEN: ${{ steps.lock.outputs.token }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute freeinference-monitor --remote --command "
            DELETE FROM meta
             WHERE key = 'cycle_lock'
               AND substr(value, instr(value, ':') + 1) = '${LOCK_TOKEN}'
          "

      # Attested but never activated: the record would otherwise keep vouching
      # for a version that is not serving, and the next run's attestation would
      # collide with it.
      #
      # Conditioned on the activation's own outcome, not on `failure()` alone.
      # `failure()` is true for anything that went wrong anywhere in the job, so
      # a failure *after* a successful activation — releasing the lock, applying
      # triggers, the binding gate — would deregister a version that is serving:
      # the Worker keeps probing while the control plane stops trusting it, and
      # alerting goes quiet. Ordering alone cannot fix that, because some of
      # those steps have to run after activation. `outcome` is `skipped` when
      # activation never ran, which is exactly when retiring is right.
      - name: Retire the attested version if it never went live
        if: failure() && steps.activate.outcome != 'success' && steps.deploy.outputs.version_id != ''
        env:
          CONTROL_PLANE_URL: ${{ vars.ALERT_CONTROL_PLANE_STAGING_URL }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.version_id }}
        run: |
          set -euo pipefail
          if [ -z "${CONTROL_PLANE_URL:-}" ]; then
            echo "::warning title=Not retired::control plane URL unset; retire ${DEPLOYMENT_ID} by hand."
            exit 0
          fi
          origin="${CONTROL_PLANE_URL%/}"
          artifact_hex="$(git -C "${GITHUB_WORKSPACE}" archive "${GITHUB_SHA}" \
            services/status-monitor-worker .github/workflows/deploy-status-monitor.yml \
            | sha256sum | awk '{print $1}')"
          oidc_response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=alert-control-plane-deployment-attestation")"
          oidc_token="$(printf '%s' "${oidc_response}" | node -e '
            let body = "";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(body);
              if (typeof value.value !== "string" || value.value.length === 0) process.exit(1);
              process.stdout.write(value.value);
            });
          ')"
          echo "::add-mask::${oidc_token}"
          retire_body="$(node -e '
            const [deploymentId, digest] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({
              action: "retire",
              deployment: {
                environment: "staging",
                service: "status-monitor",
                deployment_id: deploymentId,
                artifact_digest: `sha256:${digest}`,
              },
              retired_at: Date.now(),
            }));
          ' "${DEPLOYMENT_ID}" "${artifact_hex}")"
          curl -fsS --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            --data "${retire_body}" \
            "${origin}/v1/deployments/attest" > /dev/null

      # Triggers are Worker-level settings, not part of a version, and the
      # versions flow does not touch them — `wrangler deploy` used to. Without
      # this a change to the cron in wrangler.toml would upload, attest and
      # activate cleanly while the Worker kept running on the old schedule.
      - name: Apply trigger changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: services/status-monitor-worker
        run: npx wrangler triggers deploy

      - name: Run the non-public Service Binding RPC gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.version_id }}
        run: |
          set -euo pipefail
          gate_dir="${RUNNER_TEMP}/status-monitor-binding-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gate_env="${gate_dir}/gate.env"
          gate_log="${gate_dir}/wrangler.log"
          mkdir -m 700 "${gate_dir}"
          GATE_ENV_PATH="${gate_env}" \
          GATE_DEPLOYMENT_ID="${DEPLOYMENT_ID}" \
          GATE_OCCURRED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
          GATE_RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          node <<'NODE'
          const fs = require("node:fs");
          const names = [
            "GATE_DEPLOYMENT_ID",
            "GATE_OCCURRED_AT",
            "GATE_RUN_ID",
          ];
          fs.writeFileSync(
            process.env.GATE_ENV_PATH,
            names.map((name) => `${name}=${JSON.stringify(process.env[name])}`).join("\n") + "\n",
            { mode: 0o600 },
          );
          NODE
          gate_pid=""
          cleanup() {
            if [ -n "${gate_pid}" ]; then
              kill "${gate_pid}" 2>/dev/null || true
              wait "${gate_pid}" 2>/dev/null || true
            fi
            rm -f "${gate_env}" "${gate_log}"
            rmdir "${gate_dir}" 2>/dev/null || true
          }
          trap cleanup EXIT
          WRANGLER_LOG=error npm exec -- wrangler dev \
            --config wrangler.service-binding-gate.toml \
            --env-file "${gate_env}" \
            --ip 127.0.0.1 \
            --port 8799 \
            --show-interactive-dev-session=false \
            >"${gate_log}" 2>&1 &
          gate_pid="$!"
          ready=false
          for _attempt in $(seq 1 30); do
            if curl -fsS --output /dev/null http://127.0.0.1:8799/healthz; then
              ready=true
              break
            fi
            if ! kill -0 "${gate_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "${ready}" != "true" ]; then
            echo "::error title=Service Binding gate unavailable::Runner-local Wrangler gate did not become ready."
            exit 1
          fi
          status="$(curl -sS \
            --output /dev/null \
            --write-out '%{http_code}' \
            -X POST \
            -H "X-Gate-Run-Id: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            http://127.0.0.1:8799/run)"
          if [ "${status}" != "204" ]; then
            echo "::error title=Service Binding gate rejected::Synthetic RPC returned HTTP ${status}."
            exit 1
          fi
