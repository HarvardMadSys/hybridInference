name: Publish Images

# The only way a backend or console image is published from this repository.
# Nothing publishes or deploys on a push any more: the automatic candidate
# publishing in ci.yml, and the self-hosted runners it ran on, were retired
# after the 2026-11-22 incident. A maintainer publishes a candidate by hand,
# then deploys it by hand:
#
#   1. Run this workflow from `dev` (Actions -> Publish Images -> Run workflow,
#      or `gh workflow run publish-images.yml --ref dev`). It publishes dev's
#      HEAD at dispatch time, and only once CI's push run for that exact
#      commit has succeeded.
#   2. Take the two `@sha256:` digests from the run summary and deploy them:
#      `make deploy BACKEND_IMAGE=...@sha256:... FRONTEND_IMAGE=...@sha256:... MODEL=...`
#      on the host, or a hand-written upstream.lock change in a distribution
#      repository followed by that repository's manual deploy.
#
# Output is unchanged from the old automatic path: one native arm64 and one
# native amd64 build per image, stitched into a multi-arch index under the
# dev-<full-sha> and dev-<short-sha> tags, with the revision label a digest
# deploy checks. Publishing is idempotent per commit: a commit that already
# has a candidate is not rebuilt.
#
# Credentials: every job that logs in to the registry keeps the login in a
# Docker config of its own under RUNNER_TEMP and removes it in a last step,
# and no checkout leaves a token in .git/config. Hosted runners are discarded
# with the job, so this is defence in depth, kept so that moving a job to a
# persistent runner cannot quietly leave a packages: write login behind.

on:
  workflow_dispatch:

# Read-only unless a job asks for more; the publish jobs name the package
# scope they need.
permissions:
  contents: read

# One publication at a time, so two dispatches never race on the same tags.
# GitHub keeps at most one pending run per group: a newer dispatch replaces a
# queued one, which is harmless because both publish dev's HEAD.
concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the commit is green on dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      timestamp: ${{ steps.check.outputs.timestamp }}
    steps:
      - name: Require dev and a successful CI push run for this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # A candidate is a dev snapshot; a dispatch from any other ref would
          # publish code that never went through dev under a dev-* tag.
          if [ "${REF}" != "refs/heads/dev" ]; then
            echo "::error title=Run from dev::Publish Images publishes dev only; dispatch it with ref dev (got ${REF})"
            exit 1
          fi
          # Fail closed: zero successful runs means "not proven", and an API
          # error stops the run rather than publishing unverified code.
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=dev&event=push&status=success&head_sha=${GITHUB_SHA}&per_page=1" \
                   --jq '.total_count')"
          if [ "${runs}" -lt 1 ]; then
            echo "::error title=CI not green::No successful CI push run on dev for ${GITHUB_SHA}. Wait for it, or re-run it, then dispatch again."
            exit 1
          fi
          # The console shows this as its build time; a dispatch has no
          # head_commit, so read the commit's own date.
          timestamp="$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.committer.date')"
          echo "timestamp=${timestamp}" >> "${GITHUB_OUTPUT}"
          echo "CI is green for ${GITHUB_SHA}; publishing"

  publish-backend-precheck:
    name: Publish backend candidate (precheck)
    # ONE existence query, shared by both arch builds and the stitch. When
    # each job asked the Packages API independently, the answers could
    # disagree — only ever through a transient API error, since nothing
    # mints the tag between the checks — and a disagreement wedged the
    # pipeline: the erring side built, the other side skipped, and the
    # stitch had neither a full digest pair nor an existing verdict it
    # trusted (the round-1 P2). A single verdict makes that impossible.
    # Query errors deliberately report "no candidate" (fail-open): the cost
    # is a rebuild that re-points the tag at an equivalent but not
    # bit-identical image, never a publish of a different commit.
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The Packages API lookup below reads this repository's container images.
    permissions:
      contents: read
      packages: read
    outputs:
      existing: ${{ steps.existing.outputs.digest }}
    steps:
      - name: Look up an existing candidate for this SHA
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --paginate: every publish adds several versions (per-arch digests,
          # attestations, the index), so the newest page alone misses an older
          # SHA's tag, and a rebuild would move that tag to a new digest.
          if ! digest="$(gh api --paginate "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/hybridinference-backend/versions?per_page=100" \
                    --jq ".[] | select(.metadata.container.tags[]? == \"dev-${GITHUB_SHA}\") | .name")"; then
            echo "::warning title=Package lookup failed::Treating the lookup failure as no candidate; publication will rebuild"
            digest=""
          fi
          if [ -n "${digest}" ]; then
            echo "candidate dev-${GITHUB_SHA} already published (${digest}); downstream jobs will skip"
          else
            echo "no candidate for dev-${GITHUB_SHA} (or the lookup errored); downstream jobs will build"
          fi
          digest="$(printf '%s\n' "${digest}" | head -n 1)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  publish-backend-arm64:
    name: Publish backend candidate (arm64)
    needs: [verify, publish-backend-precheck]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Keep the registry login in this job's own Docker config
        # See "Credentials" at the top of this file.
        run: |
          set -euo pipefail
          plugins="${DOCKER_CONFIG:-${HOME}/.docker}/cli-plugins"
          docker_config="${RUNNER_TEMP}/docker-config"
          rm -rf "${docker_config}"
          mkdir -m 0700 "${docker_config}"
          if [ -d "${plugins}" ]; then
            ln -s "${plugins}" "${docker_config}/cli-plugins"
          fi
          echo "DOCKER_CONFIG=${docker_config}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: needs.publish-backend-precheck.outputs.existing == ''
        with:
          # Full fetch avoids the intermittent unresolved-delta failures seen
          # with shallow clones of this repository.
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate the Buildx config per job
        run: echo "BUILDX_CONFIG=${RUNNER_TEMP}/buildx" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        if: needs.publish-backend-precheck.outputs.existing == ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: needs.publish-backend-precheck.outputs.existing == ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (native arm64)
        if: needs.publish-backend-precheck.outputs.existing == ''
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          platforms: linux/arm64
          # Push by digest, no tags: the per-arch halves are anonymous until
          # the stitch job assembles them under the dev-<sha> tags.
          outputs: type=image,name=ghcr.io/harvardmadsys/hybridinference-backend,name-canonical=true,push-by-digest=true,push=true
          # The digest deploy and the lock tooling both read the revision label
          # back and compare it against their SHA truth; a candidate without
          # it is refused at deploy time.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=min,scope=backend-arm64

      - name: Remove the registry login
        if: always()
        run: rm -f "${RUNNER_TEMP}/docker-config/config.json"

  publish-backend-amd64:
    name: Publish backend candidate (amd64)
    # Native twin of the arm64 half, on a hosted x86_64 runner.
    needs: [verify, publish-backend-precheck]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Keep the registry login in this job's own Docker config
        # See "Credentials" at the top of this file.
        run: |
          set -euo pipefail
          plugins="${DOCKER_CONFIG:-${HOME}/.docker}/cli-plugins"
          docker_config="${RUNNER_TEMP}/docker-config"
          rm -rf "${docker_config}"
          mkdir -m 0700 "${docker_config}"
          if [ -d "${plugins}" ]; then
            ln -s "${plugins}" "${docker_config}/cli-plugins"
          fi
          echo "DOCKER_CONFIG=${docker_config}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: needs.publish-backend-precheck.outputs.existing == ''
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate the Buildx config per job
        run: echo "BUILDX_CONFIG=${RUNNER_TEMP}/buildx" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        if: needs.publish-backend-precheck.outputs.existing == ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: needs.publish-backend-precheck.outputs.existing == ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (native amd64)
        if: needs.publish-backend-precheck.outputs.existing == ''
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/harvardmadsys/hybridinference-backend,name-canonical=true,push-by-digest=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend-amd64
          cache-to: type=gha,mode=min,scope=backend-amd64

      - name: Remove the registry login
        if: always()
        run: rm -f "${RUNNER_TEMP}/docker-config/config.json"

  publish-backend:
    name: Publish backend candidate
    # The stitch: assemble both native halves into one manifest list under
    # the dev-<sha> tags. This is the job whose success means "a complete
    # candidate exists for this SHA". Requires BOTH
    # arch results explicitly: a half-published candidate must never get a
    # tag (the tag is the completeness signal). The skip verdict comes from
    # the precheck's single query, the same one the arch jobs obeyed.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.publish-backend-arm64.result == 'success' && needs.publish-backend-amd64.result == 'success' }}
    needs: [verify, publish-backend-precheck, publish-backend-arm64, publish-backend-amd64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.stitch.outputs.digest }}
    steps:
      - name: Keep the registry login in this job's own Docker config
        # See "Credentials" at the top of this file.
        run: |
          set -euo pipefail
          plugins="${DOCKER_CONFIG:-${HOME}/.docker}/cli-plugins"
          docker_config="${RUNNER_TEMP}/docker-config"
          rm -rf "${docker_config}"
          mkdir -m 0700 "${docker_config}"
          if [ -d "${plugins}" ]; then
            ln -s "${plugins}" "${docker_config}/cli-plugins"
          fi
          echo "DOCKER_CONFIG=${docker_config}" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        if: needs.publish-backend-precheck.outputs.existing == ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stitch and tag the multi-arch manifest
        id: stitch
        env:
          ARM_DIGEST: ${{ needs.publish-backend-arm64.outputs.digest }}
          AMD_DIGEST: ${{ needs.publish-backend-amd64.outputs.digest }}
          EXISTING: ${{ needs.publish-backend-precheck.outputs.existing }}
        run: |
          set -euo pipefail
          img="ghcr.io/harvardmadsys/hybridinference-backend"
          short="${GITHUB_SHA:0:8}"
          if [ -n "${EXISTING}" ]; then
            echo "candidate dev-${GITHUB_SHA} already published (${EXISTING}); nothing to stitch"
            echo "digest=${EXISTING}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${ARM_DIGEST}" ] || [ -z "${AMD_DIGEST}" ]; then
            echo "::error title=Missing arch digest::arm64='${ARM_DIGEST}' amd64='${AMD_DIGEST}' — precheck said build, but an arch job produced no digest"
            exit 1
          fi
          # Full-SHA tag is what a lock bump resolves (an 8-char prefix is
          # not a SHA claim); the short tag stays for humans. imagetools
          # flattens the per-arch indexes (image + provenance manifests)
          # into one list; the revision-label walk is index-aware and
          # already proven against attestation children.
          docker buildx imagetools create \
            -t "${img}:dev-${GITHUB_SHA}" \
            -t "${img}:dev-${short}" \
            "${img}@${ARM_DIGEST}" \
            "${img}@${AMD_DIGEST}"
          index="$(docker buildx imagetools inspect "${img}:dev-${GITHUB_SHA}" --format '{{ json .Manifest.Digest }}' | tr -d '"')"
          echo "digest=${index}" >> "$GITHUB_OUTPUT"

      - name: Candidate summary
        env:
          EXISTING: ${{ needs.publish-backend-precheck.outputs.existing }}
          INDEX: ${{ steps.stitch.outputs.digest }}
        run: |
          {
            echo "## Backend candidate"
            echo ""
            echo "- source SHA: \`${GITHUB_SHA}\`"
            if [ -n "${EXISTING}" ]; then
              echo "- already published: \`ghcr.io/harvardmadsys/hybridinference-backend@${EXISTING}\`"
            else
              echo "- pushed multi-arch (arm64+amd64): \`ghcr.io/harvardmadsys/hybridinference-backend@${INDEX}\` (tag \`dev-${GITHUB_SHA:0:8}\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the registry login
        if: always()
        run: rm -f "${RUNNER_TEMP}/docker-config/config.json"

  publish-console-precheck:
    name: Publish console candidate (precheck)
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The Packages API lookup below reads this repository's container images.
    permissions:
      contents: read
      packages: read
    outputs:
      existing: ${{ steps.existing.outputs.digest }}
    steps:
      - name: Look up an existing console candidate for this SHA
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --paginate: every publish adds several versions (per-arch digests,
          # attestations, the index), so the newest page alone misses an older
          # SHA's tag, and a rebuild would move that tag to a new digest.
          if ! digest="$(gh api --paginate "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/hybridinference-console/versions?per_page=100" \
                    --jq ".[] | select(.metadata.container.tags[]? == \"dev-${GITHUB_SHA}\") | .name")"; then
            echo "::warning title=Package lookup failed::Treating the lookup failure as no candidate; publication will rebuild"
            digest=""
          fi
          if [ -n "${digest}" ]; then
            echo "console candidate dev-${GITHUB_SHA} already published (${digest}); downstream jobs will skip"
          else
            echo "no console candidate for dev-${GITHUB_SHA} (or the lookup errored); downstream jobs will build"
          fi
          digest="$(printf '%s\n' "${digest}" | head -n 1)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  publish-console-arm64:
    name: Publish console candidate (arm64)
    needs: [verify, publish-console-precheck]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Keep the registry login in this job's own Docker config
        # See "Credentials" at the top of this file.
        run: |
          set -euo pipefail
          plugins="${DOCKER_CONFIG:-${HOME}/.docker}/cli-plugins"
          docker_config="${RUNNER_TEMP}/docker-config"
          rm -rf "${docker_config}"
          mkdir -m 0700 "${docker_config}"
          if [ -d "${plugins}" ]; then
            ln -s "${plugins}" "${docker_config}/cli-plugins"
          fi
          echo "DOCKER_CONFIG=${docker_config}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: needs.publish-console-precheck.outputs.existing == ''
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate the Buildx config per job
        run: echo "BUILDX_CONFIG=${RUNNER_TEMP}/buildx" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        if: needs.publish-console-precheck.outputs.existing == ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: needs.publish-console-precheck.outputs.existing == ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push neutral console by digest (native arm64)
        if: needs.publish-console-precheck.outputs.existing == ''
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/harvardmadsys/hybridinference-console,name-canonical=true,push-by-digest=true,push=true
          # Same-origin is the portable browser contract. No branding or
          # AGENT_* build argument is allowed on this canonical image.
          build-args: |
            NEXT_PUBLIC_API_BASE=
            NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_BUILD_TIMESTAMP=${{ needs.verify.outputs.timestamp }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=console-arm64
          cache-to: type=gha,mode=min,scope=console-arm64

      - name: Refuse distribution identity in the arm64 payload
        if: needs.publish-console-precheck.outputs.existing == ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/harvardmadsys/hybridinference-console@${DIGEST}"
          docker pull "${image}"
          docker run --rm --entrypoint sh "${image}" -eu -c '
            if grep -r -i -n -E "freeinference|http://web:3000|http://control-plane:8000" /app; then
              echo "neutral console contains distribution branding or a private proxy target" >&2
              exit 1
            fi
          '

      - name: Remove the registry login
        if: always()
        run: rm -f "${RUNNER_TEMP}/docker-config/config.json"

  publish-console-amd64:
    name: Publish console candidate (amd64)
    needs: [verify, publish-console-precheck]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Keep the registry login in this job's own Docker config
        # See "Credentials" at the top of this file.
        run: |
          set -euo pipefail
          plugins="${DOCKER_CONFIG:-${HOME}/.docker}/cli-plugins"
          docker_config="${RUNNER_TEMP}/docker-config"
          rm -rf "${docker_config}"
          mkdir -m 0700 "${docker_config}"
          if [ -d "${plugins}" ]; then
            ln -s "${plugins}" "${docker_config}/cli-plugins"
          fi
          echo "DOCKER_CONFIG=${docker_config}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: needs.publish-console-precheck.outputs.existing == ''
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Isolate the Buildx config per job
        run: echo "BUILDX_CONFIG=${RUNNER_TEMP}/buildx" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        if: needs.publish-console-precheck.outputs.existing == ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: needs.publish-console-precheck.outputs.existing == ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push neutral console by digest (native amd64)
        if: needs.publish-console-precheck.outputs.existing == ''
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/harvardmadsys/hybridinference-console,name-canonical=true,push-by-digest=true,push=true
          build-args: |
            NEXT_PUBLIC_API_BASE=
            NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_BUILD_TIMESTAMP=${{ needs.verify.outputs.timestamp }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=console-amd64
          cache-to: type=gha,mode=min,scope=console-amd64

      - name: Refuse distribution identity in the amd64 payload
        if: needs.publish-console-precheck.outputs.existing == ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/harvardmadsys/hybridinference-console@${DIGEST}"
          docker pull "${image}"
          docker run --rm --entrypoint sh "${image}" -eu -c '
            if grep -r -i -n -E "freeinference|http://web:3000|http://control-plane:8000" /app; then
              echo "neutral console contains distribution branding or a private proxy target" >&2
              exit 1
            fi
          '

      - name: Remove the registry login
        if: always()
        run: rm -f "${RUNNER_TEMP}/docker-config/config.json"

  publish-console:
    name: Publish console candidate
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.publish-console-arm64.result == 'success' && needs.publish-console-amd64.result == 'success' }}
    needs: [verify, publish-console-precheck, publish-console-arm64, publish-console-amd64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.stitch.outputs.digest }}
    steps:
      - name: Keep the registry login in this job's own Docker config
        # See "Credentials" at the top of this file.
        run: |
          set -euo pipefail
          plugins="${DOCKER_CONFIG:-${HOME}/.docker}/cli-plugins"
          docker_config="${RUNNER_TEMP}/docker-config"
          rm -rf "${docker_config}"
          mkdir -m 0700 "${docker_config}"
          if [ -d "${plugins}" ]; then
            ln -s "${plugins}" "${docker_config}/cli-plugins"
          fi
          echo "DOCKER_CONFIG=${docker_config}" >> "${GITHUB_ENV}"

      - name: Log in to GHCR
        if: needs.publish-console-precheck.outputs.existing == ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stitch and tag the neutral multi-arch console
        id: stitch
        env:
          ARM_DIGEST: ${{ needs.publish-console-arm64.outputs.digest }}
          AMD_DIGEST: ${{ needs.publish-console-amd64.outputs.digest }}
          EXISTING: ${{ needs.publish-console-precheck.outputs.existing }}
        run: |
          set -euo pipefail
          img="ghcr.io/harvardmadsys/hybridinference-console"
          short="${GITHUB_SHA:0:8}"
          if [ -n "${EXISTING}" ]; then
            echo "console candidate dev-${GITHUB_SHA} already published (${EXISTING}); nothing to stitch"
            echo "digest=${EXISTING}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${ARM_DIGEST}" ] || [ -z "${AMD_DIGEST}" ]; then
            echo "::error title=Missing console arch digest::arm64='${ARM_DIGEST}' amd64='${AMD_DIGEST}' — precheck said build, but an arch job produced no digest"
            exit 1
          fi
          docker buildx imagetools create \
            -t "${img}:dev-${GITHUB_SHA}" \
            -t "${img}:dev-${short}" \
            "${img}@${ARM_DIGEST}" \
            "${img}@${AMD_DIGEST}"
          index="$(docker buildx imagetools inspect "${img}:dev-${GITHUB_SHA}" --format '{{ json .Manifest.Digest }}' | tr -d '"')"
          echo "digest=${index}" >> "$GITHUB_OUTPUT"

      - name: Candidate summary
        env:
          EXISTING: ${{ needs.publish-console-precheck.outputs.existing }}
          INDEX: ${{ steps.stitch.outputs.digest }}
        run: |
          {
            echo "## Neutral console candidate"
            echo ""
            echo "- source SHA: \`${GITHUB_SHA}\`"
            if [ -n "${EXISTING}" ]; then
              echo "- already published: \`ghcr.io/harvardmadsys/hybridinference-console@${EXISTING}\`"
            else
              echo "- pushed multi-arch (arm64+amd64): \`ghcr.io/harvardmadsys/hybridinference-console@${INDEX}\` (tag \`dev-${GITHUB_SHA:0:8}\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the registry login
        if: always()
        run: rm -f "${RUNNER_TEMP}/docker-config/config.json"

  summary:
    name: Deploy command
    needs: [publish-backend, publish-console]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print the manual deploy command
        env:
          BACKEND: ${{ needs.publish-backend.outputs.digest }}
          CONSOLE: ${{ needs.publish-console.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## Deploy by hand"
            echo ""
            echo "Nothing was deployed. To deploy \`${GITHUB_SHA}\`, on the deployment host:"
            echo ""
            echo '```bash'
            echo "make deploy \\"
            echo "  BACKEND_IMAGE=ghcr.io/harvardmadsys/hybridinference-backend@${BACKEND} \\"
            echo "  FRONTEND_IMAGE=ghcr.io/harvardmadsys/hybridinference-console@${CONSOLE} \\"
            echo "  MODEL=<a model id for the acceptance smoke>"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
