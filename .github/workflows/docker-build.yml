name: Docker Build

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Docker Build (${{ matrix.image }})
    # Buildx needs Docker daemon access; route these builds to the ARM64
    # self-hosted pool that already passes docker-based jobs.
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      matrix:
        image: [frontend, backend, oncall]
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        id: build
        # A transient buildkit/runner recycle surfaces as
        # "received prior goaway: graceful_stop" (or a dropped gRPC transport)
        # and fails the build through no fault of the image. Don't fail the job
        # on the first attempt — recreate the builder and build once more below,
        # so an infra blip self-heals instead of needing a manual re-run.
        continue-on-error: true
        uses: docker/build-push-action@v6
        with: &build_args
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image }}
          push: false
          secrets: |
            github_token=${{ secrets.ROUTEWISE_GITHUB_TOKEN || github.token }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}

      # Fresh builder for the retry: a graceful_stop means the previous buildkit
      # instance is gone, so reusing it would fail again. The gha cache lets this
      # resume from where the first attempt left off rather than rebuilding cold.
      - name: Set up Docker Buildx (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with: *build_args
