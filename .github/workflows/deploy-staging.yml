name: Deploy Staging

# DISPATCH-ONLY since the W6 cutover (2026-08-21): staging is deployed by the
# freeInference repository from its upstream.lock — automatically, on every
# lock change. This classic chain no longer fires per dev push (two automatic
# deployers of the same compose stack cannot be serialized across
# repositories), but it stays fully operational as the manual escape hatch:
# it rebuilds from source with no registry or lock dependency, which the
# 08-21 drill exercised end to end (release 20260821 redeploy). Keep it
# working; just never re-arm the push-follow trigger without retiring the
# lock chain first.

on:
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Docker Compose stack
    runs-on: [self-hosted, Linux, deploy-staging]
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_HOST_KEY: ${{ secrets.STAGING_HOST_KEY }}
          STAGING_PORT: ${{ secrets.STAGING_PORT || '22' }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          printf '%s\n' "${STAGING_SSH_KEY}" > "${HOME}/.ssh/staging_deploy_key"
          chmod 600 "${HOME}/.ssh/staging_deploy_key"

          # Sanitize: keep only well-formed known_hosts entries. The
          # STAGING_HOST_KEY secret can include ssh-keyscan banner lines
          # (e.g. "<host>:<port> SSH-2.0-OpenSSH_9.6p1") when stderr was
          # captured alongside stdout. Those malformed lines cause ssh to
          # fail with "No ED25519 host key is known" under strict checking.
          printf '%s\n' "${STAGING_HOST_KEY}" \
            | awk 'NF>=3 && $1 !~ /^#/ && ($2 == "ssh-rsa" || $2 == "ssh-ed25519" || $2 ~ /^ecdsa-sha2-/)' \
            > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          for var in STAGING_HOST STAGING_HOST_KEY STAGING_USER STAGING_SSH_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error title=Missing secret::${var} is not configured for the 'staging' environment"
              exit 1
            fi
          done

          echo "known_hosts entries (host_token algorithm):"
          awk 'NF>=3 && $1 !~ /^#/ {printf "  %s %s\n", $1, $2}' "${HOME}/.ssh/known_hosts"

          LOOKUP_KEY="${STAGING_HOST}"
          if [ "${STAGING_PORT}" != "22" ]; then
            LOOKUP_KEY="[${STAGING_HOST}]:${STAGING_PORT}"
          fi

          MATCHED_HOST_KEYS="$(ssh-keygen -F "${LOOKUP_KEY}" -f "${HOME}/.ssh/known_hosts" || true)"

          if [ -z "${MATCHED_HOST_KEYS}" ]; then
            echo "::error title=Invalid STAGING_HOST_KEY::known_hosts has no entry for ${LOOKUP_KEY}"
            echo "Re-generate the secret with: ssh-keyscan -p ${STAGING_PORT} -t ed25519,rsa,ecdsa ${STAGING_HOST}"
            exit 1
          fi

          if ! printf '%s\n' "${MATCHED_HOST_KEYS}" | awk '
            /^#/ { next }
            {
              for (i = 1; i <= NF; i++) {
                if ($i == "ssh-ed25519") {
                  found = 1
                }
              }
            }
            END { exit found ? 0 : 1 }
          '; then
            echo "::error title=Invalid STAGING_HOST_KEY::known_hosts has no ssh-ed25519 entry for ${LOOKUP_KEY}"
            echo "OpenSSH is requiring the server's ed25519 host key for strict host checking."
            echo "Re-generate the secret with: ssh-keyscan -p ${STAGING_PORT} -t ed25519,rsa,ecdsa ${STAGING_HOST}"
            exit 1
          fi

      - name: Deploy on staging host
        env:
          # Dispatch-only: the ref selected in the GitHub UI is what deploys.
          DEPLOY_SHA: ${{ github.sha }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT || '22' }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          # Token for the private routewise git dependency in the backend
          # image build (compose forwards it as the github_token build secret).
          ROUTEWISE_GITHUB_TOKEN: ${{ secrets.ROUTEWISE_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail

          # Self-heal the checkout's ownership before syncing. A git or install
          # command accidentally run as root (or a prior root-owned deploy) can
          # leave parts of /srv/hybridInference owned by another user, which makes
          # `git fetch`/`git reset --hard` fail with "Permission denied" (exit
          # 1/128) and silently wedges every deploy — the host keeps serving the
          # old code. `sudo -n` never blocks on a password prompt; if the deploy
          # user lacks passwordless sudo the reclaim is skipped and the original
          # git error still surfaces below, so this only ever helps.
          remote_cmd="{ git config --global --get-all safe.directory 2>/dev/null \
                        | grep -qxF /srv/hybridInference \
                        || git config --global --add safe.directory /srv/hybridInference; } \
            && cd /srv/hybridInference \
            && { sudo -n chown -R '${STAGING_USER}' /srv/hybridInference 2>/dev/null \
                 || echo '[deploy-staging] ownership reclaim skipped (no passwordless sudo?); continuing'; } \
            && git fetch origin dev \
            && git reset --hard '${DEPLOY_SHA}' \
            && DEPLOY_SHA='${DEPLOY_SHA}' GITHUB_TOKEN='${ROUTEWISE_GITHUB_TOKEN}' bash ops/deploy/deploy_staging.sh"

          ssh \
            -i "${HOME}/.ssh/staging_deploy_key" \
            -p "${STAGING_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            "${STAGING_USER}@${STAGING_HOST}" \
            "${remote_cmd}"
