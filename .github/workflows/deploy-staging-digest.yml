name: Deploy Staging by Digest

# Parallel, opt-in staging deploy path (artifact-consumer chain, slice 1).
#
# Pulls candidate images by immutable digest and restarts the compose
# services from them — no `git reset`, no image build on the host. The
# classic "Deploy Staging" workflow is untouched and remains the escape
# hatch: re-running it rebuilds from the checkout and fully restores the
# old path.
#
# What this proves: staging runs FreeInference without building from
# source at deploy time; the deployment unit is a digest. What it does
# NOT yet remove: the host checkout, which still supplies the compose
# files, config/, distributions/ and .env as mounts (those migrate in
# later slices). Production is not touched by this workflow at all.
#
# Rollback: re-run this workflow with the previous digest (see
# var/deploy-digest.log on the host or past run summaries), or re-run
# the classic Deploy Staging workflow.
#
# Shares the "staging-deploy" concurrency group with the classic
# workflow so the two paths can never race the same host.

on:
  workflow_dispatch:
    inputs:
      backend_image:
        description: "Full reference: ghcr.io/<owner>/hybridinference-backend@sha256:..."
        type: string
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy pinned digests
    runs-on: [self-hosted, Linux, deploy-staging]
    environment: staging
    timeout-minutes: 30

    steps:
      # Two gates in one. Injection: the reference gets spliced into the
      # remote SSH command below, and this character class admits no quotes,
      # spaces, or shell metacharacters, so a crafted input cannot break out
      # of its quoting on the staging host. Allowlist: only the one package
      # this repository's Build Candidate Images run publishes — an arbitrary
      # ghcr.io image would be handed staging's secrets, database and
      # writable mounts. (The package name moves with the repo owner; revisit
      # when this workflow migrates to the freeInference repository.)
      - name: Validate dispatch inputs
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
        run: |
          set -euo pipefail
          re_backend='^ghcr\.io/harvardmadsys/hybridinference-backend@sha256:[0-9a-f]{64}$'
          if ! [[ "${BACKEND_IMAGE}" =~ ${re_backend} ]]; then
            echo "::error title=Bad input::backend_image must be ghcr.io/harvardmadsys/hybridinference-backend pinned by @sha256 digest"
            exit 1
          fi

      - name: Configure SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_HOST_KEY: ${{ secrets.STAGING_HOST_KEY }}
          STAGING_PORT: ${{ secrets.STAGING_PORT || '22' }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          printf '%s\n' "${STAGING_SSH_KEY}" > "${HOME}/.ssh/staging_deploy_key"
          chmod 600 "${HOME}/.ssh/staging_deploy_key"

          # Same sanitation as deploy-staging.yml: keep only well-formed
          # known_hosts entries from the secret.
          printf '%s\n' "${STAGING_HOST_KEY}" \
            | awk 'NF>=3 && $1 !~ /^#/ && ($2 == "ssh-rsa" || $2 == "ssh-ed25519" || $2 ~ /^ecdsa-sha2-/)' \
            > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          for var in STAGING_HOST STAGING_HOST_KEY STAGING_USER STAGING_SSH_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error title=Missing secret::${var} is not configured for the 'staging' environment"
              exit 1
            fi
          done

      - name: Deploy digests on staging host
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          GHCR_USER: ${{ github.actor }}
          # Repo-scoped token; grants read on packages published by this
          # repository's workflows (the Build Candidate Images run).
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT || '22' }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "${HOME}/.ssh/staging_deploy_key" \
            -p "${STAGING_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            "${STAGING_USER}@${STAGING_HOST}" \
            "BACKEND_IMAGE='${BACKEND_IMAGE}' GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' RUN_ID='${RUN_ID}' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          # Self-heal the checkout's trust and ownership first, same as the
          # classic deploy: a git or install command accidentally run as root
          # leaves files another user owns, which fails every git command
          # below and would wedge the digest path on `git status` forever.
          # `sudo -n` never prompts; without passwordless sudo the reclaim is
          # skipped and the real git error still surfaces, so it only helps.
          git config --global --get-all safe.directory 2>/dev/null \
            | grep -qxF /srv/hybridInference \
            || git config --global --add safe.directory /srv/hybridInference
          cd /srv/hybridInference
          sudo -n chown -R "$(id -un)" /srv/hybridInference 2>/dev/null \
            || echo "[digest-deploy] ownership reclaim skipped (no passwordless sudo?); continuing"

          echo "[digest-deploy] host arch: $(uname -m); $(docker --version)"
          [ -f .env ] || { echo "[digest-deploy] missing /srv/hybridInference/.env"; exit 1; }

          # The classic deploy resets the checkout before composing; this
          # path deliberately never resets, so it must refuse a dirty one
          # instead — same HEAD with edited or extra files means the config
          # mounts no longer match the revision the image was built from.
          # Porcelain with untracked included (diff alone misses a stray
          # file riding into the mounts); ignored files (.env, var/) stay
          # exempt by construction.
          dirty="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "${dirty}" ]; then
            echo "[digest-deploy] host checkout is not clean; commit/stash/remove these or run the classic Deploy Staging (which resets):"
            printf '%s\n' "${dirty}" | sed -n '1,20p'
            exit 1
          fi

          case "${BACKEND_IMAGE}" in
            *@sha256:*) ;;
            *) echo "[digest-deploy] backend_image must be pinned by @sha256 digest"; exit 1 ;;
          esac

          # Isolated credential store: the deploy user's default
          # ~/.docker/config.json may hold credentials other services rely
          # on, and a login/logout pair here would overwrite and then delete
          # them. The ephemeral token lives in a private temp dir (mktemp -d
          # creates 0700) that dies with this deploy; only login and pull
          # use it — compose keeps the default config, so user-level
          # cli-plugins still resolve, and it needs no registry auth because
          # the image is already in the local daemon store by then.
          docker_cfg="$(mktemp -d)"
          trap 'rm -rf "${docker_cfg}"' EXIT
          printf '%s' "${GHCR_TOKEN}" | DOCKER_CONFIG="${docker_cfg}" docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          DOCKER_CONFIG="${docker_cfg}" docker pull "${BACKEND_IMAGE}"
          files=(-f deploy/docker/docker-compose.yml -f deploy/docker/docker-compose.digest-backend.yml)

          # The image carries the code; this checkout supplies the config
          # mounts. Slice 1 exists to prove a packaging-only change, so the
          # two must agree on the source revision — no override. (The
          # two-repo era replaces this check entirely: there the mounts come
          # from freeInference and the expectation lives in upstream.lock.)
          host_rev=$(git rev-parse HEAD)

          # Classic staging only ever deploys dev; the digest path must not
          # become a quiet bypass for shipping arbitrary refs. The image is
          # pinned to HEAD by the revision gate below, so anchoring HEAD to
          # origin/dev anchors the image too.
          git fetch --quiet origin dev
          if ! git merge-base --is-ancestor "${host_rev}" origin/dev; then
            echo "[digest-deploy] host checkout ${host_rev} is not an ancestor of origin/dev; refusing"
            exit 1
          fi

          check_revision() {
            local image="$1" rev
            rev=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${image}")
            if [ -z "${rev}" ]; then
              echo "[digest-deploy] ${image} carries no org.opencontainers.image.revision label; rebuild it with a current Build Candidate Images run"
              exit 1
            fi
            if [ "${rev}" != "${host_rev}" ]; then
              echo "[digest-deploy] ${image} built from ${rev} but the host checkout (config mounts) is at ${host_rev}; refusing"
              exit 1
            fi
          }
          check_revision "${BACKEND_IMAGE}"

          # Same env-file layering as the classic staging deploy: shared
          # distribution layer, then the staging layer (deploy_staging.sh
          # sets COMPOSE_EXTRA_ENV_FILES to it), host .env last so it wins.
          # The shared layer alone says DEPLOYMENT_ENV=production — without
          # the staging layer this deploy would label staging as production;
          # without both, it would restart a neutral gateway on staging's
          # DNS. Single-distribution host layout, like the Makefile's
          # auto-discovery.
          overlay_envs=()
          for f in distributions/*/deploy/*.env; do
            [ -e "${f}" ] || continue
            overlay_envs+=(--env-file "${f}")
          done
          if [ "${#overlay_envs[@]}" -eq 0 ]; then
            echo "[digest-deploy] no overlay env-files under distributions/*/deploy/ — refusing a neutral restart"
            exit 1
          fi
          staging_envs=()
          for f in distributions/*/deploy/staging/*.env; do
            [ -e "${f}" ] || continue
            staging_envs+=(--env-file "${f}")
          done
          if [ "${#staging_envs[@]}" -eq 0 ]; then
            echo "[digest-deploy] no staging env layer under distributions/*/deploy/staging/ — the shared layer would label staging as production; refusing"
            exit 1
          fi

          docker compose "${files[@]}" "${overlay_envs[@]}" "${staging_envs[@]}" --env-file .env up -d --no-build backend

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "[digest-deploy] backend healthy"
              break
            fi
            if [ "$i" = 30 ]; then
              echo "[digest-deploy] backend health check failed"
              docker compose "${files[@]}" "${overlay_envs[@]}" "${staging_envs[@]}" --env-file .env logs --tail=80 backend || true
              exit 1
            fi
            sleep 2
          done

          mkdir -p var
          echo "$(date -u +%FT%TZ) run=${RUN_ID} source=${host_rev} backend=${BACKEND_IMAGE}" >> var/deploy-digest.log
          echo "[digest-deploy] recorded in var/deploy-digest.log"
          REMOTE
