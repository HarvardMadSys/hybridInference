name: Deploy Staging by Digest

# Parallel, opt-in staging deploy path (artifact-consumer chain, slice 1).
#
# Pulls the candidate image by immutable digest and restarts the compose
# service from it — no image build on the host. The checkout is aligned
# to the image's own source revision (clean tree + ancestor-of-dev only),
# so the config mounts always match the packaged code: deploying
# yesterday's digest also rewinds config to yesterday, which is what
# makes previous-digest rollback a real, complete operation — and the
# local image cache keeps it working through a registry outage. A failed
# health check restores the last-known-good image and revision by
# itself. The classic "Deploy Staging" workflow is untouched and remains
# the escape hatch: re-running it rebuilds from source at dev.
#
# What this proves: staging runs FreeInference without building from
# source at deploy time; the deployment unit is a digest. What it does
# NOT yet remove: the host checkout, which still supplies the compose
# files, config/, distributions/ and .env as mounts (those migrate in
# later slices). Production is not touched by this workflow at all.
#
# Rollback: re-run this workflow with the previous digest (see
# var/deploy-digest.log on the host or past run summaries), or re-run
# the classic Deploy Staging workflow.
#
# Shares the "staging-deploy" concurrency group with the classic
# workflow so the two paths can never race the same host.

on:
  workflow_dispatch:
    inputs:
      backend_image:
        description: "Full reference: ghcr.io/<owner>/hybridinference-backend@sha256:..."
        type: string
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy pinned digests
    runs-on: [self-hosted, Linux, deploy-staging]
    environment: staging
    timeout-minutes: 30

    steps:
      # Two gates in one. Injection: the reference gets spliced into the
      # remote SSH command below, and this character class admits no quotes,
      # spaces, or shell metacharacters, so a crafted input cannot break out
      # of its quoting on the staging host. Allowlist: only the one package
      # this repository's Build Candidate Images run publishes — an arbitrary
      # ghcr.io image would be handed staging's secrets, database and
      # writable mounts. (The package name moves with the repo owner; revisit
      # when this workflow migrates to the freeInference repository.)
      - name: Validate dispatch inputs
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
        run: |
          set -euo pipefail
          re_backend='^ghcr\.io/harvardmadsys/hybridinference-backend@sha256:[0-9a-f]{64}$'
          if ! [[ "${BACKEND_IMAGE}" =~ ${re_backend} ]]; then
            echo "::error title=Bad input::backend_image must be ghcr.io/harvardmadsys/hybridinference-backend pinned by @sha256 digest"
            exit 1
          fi

      - name: Configure SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_HOST_KEY: ${{ secrets.STAGING_HOST_KEY }}
          STAGING_PORT: ${{ secrets.STAGING_PORT || '22' }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          printf '%s\n' "${STAGING_SSH_KEY}" > "${HOME}/.ssh/staging_deploy_key"
          chmod 600 "${HOME}/.ssh/staging_deploy_key"

          # Same sanitation as deploy-staging.yml: keep only well-formed
          # known_hosts entries from the secret.
          printf '%s\n' "${STAGING_HOST_KEY}" \
            | awk 'NF>=3 && $1 !~ /^#/ && ($2 == "ssh-rsa" || $2 == "ssh-ed25519" || $2 ~ /^ecdsa-sha2-/)' \
            > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          for var in STAGING_HOST STAGING_HOST_KEY STAGING_USER STAGING_SSH_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error title=Missing secret::${var} is not configured for the 'staging' environment"
              exit 1
            fi
          done

      - name: Deploy digests on staging host
        env:
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          GHCR_USER: ${{ github.actor }}
          # Repo-scoped token; grants read on packages published by this
          # repository's workflows (the Build Candidate Images run).
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT || '22' }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "${HOME}/.ssh/staging_deploy_key" \
            -p "${STAGING_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            "${STAGING_USER}@${STAGING_HOST}" \
            "BACKEND_IMAGE='${BACKEND_IMAGE}' GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' RUN_ID='${RUN_ID}' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          # Self-heal the checkout's trust and ownership first, same as the
          # classic deploy: a git or install command accidentally run as root
          # leaves files another user owns, which fails every git command
          # below and would wedge the digest path on `git status` forever.
          # `sudo -n` never prompts; without passwordless sudo the reclaim is
          # skipped and the real git error still surfaces, so it only helps.
          git config --global --get-all safe.directory 2>/dev/null \
            | grep -qxF /srv/hybridInference \
            || git config --global --add safe.directory /srv/hybridInference
          cd /srv/hybridInference
          sudo -n chown -R "$(id -un)" /srv/hybridInference 2>/dev/null \
            || echo "[digest-deploy] ownership reclaim skipped (no passwordless sudo?); continuing"

          echo "[digest-deploy] host arch: $(uname -m); docker server: $(docker version --format '{{.Server.Os}}/{{.Server.Arch}}' 2>/dev/null || echo unknown); $(docker --version)"
          [ -f .env ] || { echo "[digest-deploy] missing /srv/hybridInference/.env"; exit 1; }

          # The classic deploy resets to dev unconditionally; this path
          # resets only to align with the image's revision — and never over
          # local changes, so an operator's uncommitted hotfix is preserved
          # rather than discarded. Refuse a dirty tree outright: edited or
          # extra files would ride into the config mounts regardless of
          # revision. Porcelain with untracked included (diff alone misses a
          # stray file); ignored files (.env, var/) stay exempt by
          # construction.
          dirty="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "${dirty}" ]; then
            echo "[digest-deploy] host checkout is not clean; commit/stash/remove these or run the classic Deploy Staging (which resets):"
            printf '%s\n' "${dirty}" | sed -n '1,20p'
            exit 1
          fi

          case "${BACKEND_IMAGE}" in
            *@sha256:*) ;;
            *) echo "[digest-deploy] backend_image must be pinned by @sha256 digest"; exit 1 ;;
          esac

          # A digest reference is content-addressed: if this exact digest is
          # already in the local daemon store, that IS the image, and the
          # deploy needs no registry at all — which is what lets a rollback
          # to a previous digest succeed during a GHCR outage. Only a
          # missing image takes the credentialed path.
          if docker image inspect "${BACKEND_IMAGE}" >/dev/null 2>&1; then
            echo "[digest-deploy] ${BACKEND_IMAGE} already in the local daemon store; skipping registry login/pull"
          else
            # Isolated credential store: the deploy user's default
            # ~/.docker/config.json may hold credentials other services rely
            # on, and a login/logout pair here would overwrite and then
            # delete them. The ephemeral token lives in a private temp dir
            # (mktemp -d creates 0700) that dies with this deploy; only
            # login and pull use it — compose keeps the default config, so
            # user-level cli-plugins still resolve, and it needs no registry
            # auth because the image is already in the local daemon store.
            docker_cfg="$(mktemp -d)"
            trap 'rm -rf "${docker_cfg}"' EXIT
            printf '%s' "${GHCR_TOKEN}" | DOCKER_CONFIG="${docker_cfg}" docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            DOCKER_CONFIG="${docker_cfg}" docker pull "${BACKEND_IMAGE}"
          fi

          # Architecture hard gate. A wrong-arch image survives pull and
          # compose recreate and only dies at exec time — after the old
          # backend is already gone. Containers run on the Docker *server*,
          # so that is the platform compared (uname above is record only);
          # an unreadable server platform fails closed.
          host_platform="$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}' 2>/dev/null || true)"
          if [ -z "${host_platform}" ] || [ "${host_platform}" = "/" ]; then
            echo "[digest-deploy] cannot determine the Docker server platform; refusing (fail closed)"
            exit 1
          fi
          img_platform="$(docker image inspect --format '{{ .Os }}/{{ .Architecture }}' "${BACKEND_IMAGE}")"
          if [ "${img_platform}" != "${host_platform}" ]; then
            echo "[digest-deploy] image is ${img_platform} but the Docker server is ${host_platform}; refusing before compose touches the running backend"
            exit 1
          fi

          files=(-f deploy/docker/docker-compose.yml -f deploy/docker/docker-compose.digest-backend.yml)

          # The image is the SHA truth for this deploy; the checkout follows
          # it so the config mounts always match the packaged code. Aligning
          # is safe by construction: the tree is porcelain-clean (checked
          # above) and only ancestors of origin/dev are eligible — so
          # deploying yesterday's digest rewinds config to yesterday too,
          # which is exactly what a rollback means. (The two-repo era
          # replaces this with upstream.lock.source_commit.)
          img_rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${BACKEND_IMAGE}")"
          if [ -z "${img_rev}" ]; then
            echo "[digest-deploy] ${BACKEND_IMAGE} carries no org.opencontainers.image.revision label; rebuild it with a current Build Candidate Images run"
            exit 1
          fi
          git fetch --quiet origin dev
          if ! git merge-base --is-ancestor "${img_rev}" origin/dev; then
            echo "[digest-deploy] image revision ${img_rev} is not an ancestor of origin/dev; refusing"
            exit 1
          fi
          prev_rev="$(git rev-parse HEAD)"
          if [ "${img_rev}" != "${prev_rev}" ]; then
            echo "[digest-deploy] aligning checkout ${prev_rev} -> image revision ${img_rev}"
            git reset --hard "${img_rev}"
          fi

          # Env-file layering, same as the classic staging deploy: the
          # FreeInference shared layer, then the staging layer
          # (deploy_staging.sh's COMPOSE_EXTRA_ENV_FILES), host .env last so
          # it wins. The shared layer alone says DEPLOYMENT_ENV=production —
          # without the staging layer this deploy would label staging as
          # production; without both, it would restart a neutral gateway on
          # staging's DNS. Re-discovered after every checkout move, since
          # the file set belongs to the tree.
          discover_env_args() {
            overlay_envs=()
            for f in distributions/freeinference/deploy/*.env; do
              [ -e "${f}" ] || continue
              overlay_envs+=(--env-file "${f}")
            done
            if [ "${#overlay_envs[@]}" -eq 0 ]; then
              echo "[digest-deploy] no overlay env-files under distributions/freeinference/deploy/ — refusing a neutral restart"
              exit 1
            fi
            staging_envs=()
            for f in distributions/freeinference/deploy/staging/*.env; do
              [ -e "${f}" ] || continue
              staging_envs+=(--env-file "${f}")
            done
            if [ "${#staging_envs[@]}" -eq 0 ]; then
              echo "[digest-deploy] no staging env layer under distributions/freeinference/deploy/staging/ — the shared layer would label staging as production; refusing"
              exit 1
            fi
          }
          discover_env_args

          # Last-known-good, captured before compose touches anything, so a
          # failed health check can put staging back by itself instead of
          # leaving a broken container running.
          prev_container="$(docker compose "${files[@]}" "${overlay_envs[@]}" "${staging_envs[@]}" --env-file .env ps -q backend 2>/dev/null || true)"
          prev_image=""
          if [ -n "${prev_container}" ]; then
            prev_image="$(docker inspect --format '{{ .Image }}' "${prev_container}" 2>/dev/null || true)"
          fi

          wait_backend_healthy() {
            # Bounded probe: --max-time keeps a connected-but-hanging /health
            # from pinning one curl (and this loop) to the whole job timeout,
            # which would skip the restore below.
            for i in $(seq 1 30); do
              if curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/health >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          # `set -e` would abort on a failed `up` before the restore could
          # run, stranding whatever compose left behind — so the start
          # command and the health check funnel into the same recovery path.
          deploy_ok=1
          docker compose "${files[@]}" "${overlay_envs[@]}" "${staging_envs[@]}" --env-file .env up -d --no-build backend || deploy_ok=0
          if [ "${deploy_ok}" -eq 1 ] && wait_backend_healthy; then
            echo "[digest-deploy] backend healthy"
          else
            echo "[digest-deploy] deploy failed (start ok=${deploy_ok}); last logs:"
            docker compose "${files[@]}" "${overlay_envs[@]}" "${staging_envs[@]}" --env-file .env logs --tail=80 backend || true
            if [ -n "${prev_image}" ]; then
              echo "[digest-deploy] restoring last-known-good backend ${prev_image} at checkout ${prev_rev}"
              [ "$(git rev-parse HEAD)" = "${prev_rev}" ] || git reset --hard "${prev_rev}"
              discover_env_args
              if BACKEND_IMAGE="${prev_image}" docker compose "${files[@]}" "${overlay_envs[@]}" "${staging_envs[@]}" --env-file .env up -d --no-build backend \
                 && wait_backend_healthy; then
                echo "[digest-deploy] last-known-good restored; the new digest never became healthy"
              else
                echo "[digest-deploy] RESTORE FAILED TOO — staging is down and needs manual attention: run the classic Deploy Staging (rebuilds from source), or compose up the previous image by hand"
              fi
            else
              echo "[digest-deploy] no previous backend container to restore; run the classic Deploy Staging to rebuild from source"
            fi
            exit 1
          fi

          mkdir -p var
          echo "$(date -u +%FT%TZ) run=${RUN_ID} source=${img_rev} backend=${BACKEND_IMAGE}" >> var/deploy-digest.log
          echo "[digest-deploy] recorded in var/deploy-digest.log"
          REMOTE
