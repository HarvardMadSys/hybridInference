name: Alert Control Plane Staging Lifecycle

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type run-staging-control-plane-lifecycle
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: alert-control-plane-staging-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Deploy and verify authenticated staging lifecycle
    runs-on: ubuntu-22.04
    environment: staging
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/alert-control-plane-worker
    env:
      CLOUDFLARE_ACCOUNT_ID: d04cebbc3b75c45caec3e4fdb4ee451a
      WORKER_NAME: freeinference-alert-control-plane-staging

    steps:
      - name: Check out selected dev commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the reviewed dev workflow and explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          CONTROL_PLANE_URL: ${{ vars.ALERT_CONTROL_PLANE_STAGING_URL }}
          SLACK_CHANNEL_ID: ${{ vars.ALERT_CONTROL_PLANE_SLACK_CHANNEL_ID }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/dev" ]; then
            echo "::error title=Wrong ref::Dispatch this workflow with ref=dev."
            exit 1
          fi
          if [ "${CONFIRMATION}" != "run-staging-control-plane-lifecycle" ]; then
            echo "::error title=Confirmation required::Enter the exact lifecycle confirmation value."
            exit 1
          fi
          if ! [[ "${CONTROL_PLANE_URL}" =~ ^https://[^/]+/?$ ]]; then
            echo "::error title=Invalid Worker URL::Configure ALERT_CONTROL_PLANE_STAGING_URL in the protected staging environment."
            exit 1
          fi
          if ! [[ "${SLACK_CHANNEL_ID}" =~ ^[CGD][A-Z0-9]{1,255}$ ]]; then
            echo "::error title=Invalid channel::Enter a Slack conversation ID."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/alert-control-plane-worker/package-lock.json

      - name: Require staging credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROUTE_KEY_V1: ${{ secrets.ALERT_CONTROL_PLANE_ROUTE_KEY_V1 }}
          PRODUCER_SIGNING_KEY_V1: ${{ secrets.ALERT_CONTROL_PLANE_PRODUCER_SIGNING_KEY_V1 }}
          SLACK_BOT_TOKEN: ${{ secrets.CODEX_ONCALL_SLACK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN ROUTE_KEY_V1 PRODUCER_SIGNING_KEY_V1 SLACK_BOT_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing staging secret::${name} is not configured."
              exit 1
            fi
          done

      - name: Install and verify
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
          npm exec -- wrangler deploy --dry-run --config wrangler.example.toml

      - name: Deploy dormant schema before provisioning secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npm exec -- wrangler deploy \
            --config wrangler.example.toml \
            --name "${WORKER_NAME}"

      - name: Provision Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ROUTE_KEY_V1: ${{ secrets.ALERT_CONTROL_PLANE_ROUTE_KEY_V1 }}
          PRODUCER_SIGNING_KEY_V1: ${{ secrets.ALERT_CONTROL_PLANE_PRODUCER_SIGNING_KEY_V1 }}
          SLACK_BOT_TOKEN: ${{ secrets.CODEX_ONCALL_SLACK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${ROUTE_KEY_V1}" \
            | npm exec -- wrangler secret put ROUTE_KEY_V1 \
                --config wrangler.example.toml --name "${WORKER_NAME}"
          printf '%s' "${PRODUCER_SIGNING_KEY_V1}" \
            | npm exec -- wrangler secret put PRODUCER_TOKEN_SIGNING_KEY_V1 \
                --config wrangler.example.toml --name "${WORKER_NAME}"
          printf '%s' "${SLACK_BOT_TOKEN}" \
            | npm exec -- wrangler secret put SLACK_BOT_TOKEN \
                --config wrangler.example.toml --name "${WORKER_NAME}"

      - name: Deploy fail-closed C2 ingress configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.ALERT_CONTROL_PLANE_SLACK_CHANNEL_ID }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          set -euo pipefail
          npm exec -- wrangler deploy \
            --config wrangler.example.toml \
            --name "${WORKER_NAME}" \
            --var CONTROL_PLANE_MODE:staging-ingress \
            --var SLACK_CHANNEL_ID:"${SLACK_CHANNEL_ID}" \
            --var SLACK_SINK_ID:slack-staging \
            --var PRINCIPAL_ACTIVE_LIMIT:10 \
            --var QUOTA_PENDING_LEASE_MS:120000 \
            --var PRODUCER_TOKEN_TTL_SECONDS:3600 \
            --var GITHUB_OIDC_SUBJECT:"repo:${GITHUB_REPOSITORY}:environment:staging" \
            --var GITHUB_OIDC_REPOSITORY:"${GITHUB_REPOSITORY}" \
            --var GITHUB_OIDC_REPOSITORY_ID:"${REPOSITORY_ID}" \
            --var GITHUB_OIDC_REPOSITORY_OWNER_ID:"${REPOSITORY_OWNER_ID}" \
            --var GITHUB_OIDC_WORKFLOW_REF:"${GITHUB_REPOSITORY}/.github/workflows/alert-control-plane-staging-lifecycle.yml@refs/heads/dev" \
            --var GITHUB_OIDC_REF:refs/heads/dev \
            --var GITHUB_OIDC_ENVIRONMENT:staging \
            --var GITHUB_OIDC_EVENT_NAME:workflow_dispatch

      - name: Wait for configured health
        env:
          CONTROL_PLANE_URL: ${{ vars.ALERT_CONTROL_PLANE_STAGING_URL }}
        run: |
          set -euo pipefail
          origin="${CONTROL_PLANE_URL%/}"
          for attempt in $(seq 1 30); do
            status="$(curl -fsS "${origin}/healthz" || true)"
            if node -e '
              const body = JSON.parse(process.argv[1] || "{}");
              process.exit(body.status === "staging_ingress_configured" &&
                body.ready === true && body.accepts_events === true ? 0 : 1);
            ' "${status}"; then
              exit 0
            fi
            sleep 2
          done
          echo "::error title=Worker not ready::C2 health did not become ready."
          exit 1

      - name: Activate a CI-attested synthetic deployment
        id: activate
        env:
          CONTROL_PLANE_URL: ${{ vars.ALERT_CONTROL_PLANE_STAGING_URL }}
        run: |
          set -euo pipefail
          origin="${CONTROL_PLANE_URL%/}"
          deployment_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_hex="$(git archive "${GITHUB_SHA}" . | sha256sum | awk '{print $1}')"
          activated_at="$(($(date +%s) * 1000))"
          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"
          echo "artifact_digest=sha256:${artifact_hex}" >> "${GITHUB_OUTPUT}"
          echo "cleanup=true" >> "${GITHUB_OUTPUT}"

          oidc_response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=alert-control-plane-deployment-attestation")"
          oidc_token="$(printf '%s' "${oidc_response}" | node -e '
            let body = "";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(body);
              if (typeof value.value !== "string" || value.value.length === 0) process.exit(1);
              process.stdout.write(value.value);
            });
          ')"
          echo "::add-mask::${oidc_token}"

          activation_body="$(node -e '
            const [deploymentId, digest, sha, activatedAt] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({
              action: "activate",
              deployment: {
                environment: "staging",
                service: "synthetic-alert-producer",
                deployment_id: deploymentId,
                artifact_digest: `sha256:${digest}`,
              },
              deployment_sha: sha,
              activated_at: Number(activatedAt),
              source: "gateway",
              principal: "staging-synthetic",
            }));
          ' "${deployment_id}" "${artifact_hex}" "${GITHUB_SHA}" "${activated_at}")"
          activation_response="$(curl -fsS \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            --data "${activation_body}" \
            "${origin}/v1/deployments/attest")"
          producer_token="$(printf '%s' "${activation_response}" | node -e '
            let body = "";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(body);
              if (typeof value.producer_token !== "string" ||
                  value.producer_token.length === 0) process.exit(1);
              process.stdout.write(value.producer_token);
            });
          ')"
          echo "::add-mask::${producer_token}"
          echo "producer_token=${producer_token}" >> "${GITHUB_OUTPUT}"

      - name: Run the visible synthetic lifecycle
        env:
          CONTROL_PLANE_LIVE_CONFIRM: ${{ inputs.confirmation }}
          CONTROL_PLANE_URL: ${{ vars.ALERT_CONTROL_PLANE_STAGING_URL }}
          CONTROL_PLANE_PRODUCER_TOKEN: ${{ steps.activate.outputs.producer_token }}
          CONTROL_PLANE_SYNTHETIC_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          SLACK_BOT_TOKEN: ${{ secrets.CODEX_ONCALL_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.ALERT_CONTROL_PLANE_SLACK_CHANNEL_ID }}
        run: npm run test:control-plane-live

      - name: Retire the synthetic deployment
        if: ${{ always() && steps.activate.outputs.cleanup == 'true' }}
        env:
          CONTROL_PLANE_URL: ${{ vars.ALERT_CONTROL_PLANE_STAGING_URL }}
          DEPLOYMENT_ID: ${{ steps.activate.outputs.deployment_id }}
          ARTIFACT_DIGEST: ${{ steps.activate.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          origin="${CONTROL_PLANE_URL%/}"
          oidc_response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=alert-control-plane-deployment-attestation")"
          oidc_token="$(printf '%s' "${oidc_response}" | node -e '
            let body = "";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const value = JSON.parse(body);
              if (typeof value.value !== "string" || value.value.length === 0) process.exit(1);
              process.stdout.write(value.value);
            });
          ')"
          echo "::add-mask::${oidc_token}"
          retired_at="$(($(date +%s) * 1000))"
          retirement_body="$(node -e '
            const [deploymentId, digest, retiredAt] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({
              action: "retire",
              deployment: {
                environment: "staging",
                service: "synthetic-alert-producer",
                deployment_id: deploymentId,
                artifact_digest: digest,
              },
              retired_at: Number(retiredAt),
            }));
          ' "${DEPLOYMENT_ID}" "${ARTIFACT_DIGEST}" "${retired_at}")"
          status="$(curl -sS \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --output /dev/null \
            --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            --data "${retirement_body}" \
            "${origin}/v1/deployments/attest")"
          if [ "${status}" != "200" ] && [ "${status}" != "404" ]; then
            echo "::error title=Synthetic retirement failed::Registry returned HTTP ${status}."
            exit 1
          fi
