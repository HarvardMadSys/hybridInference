name: Sequential follow-up PRs

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Inspect and validate eligible units without pushing or opening PRs"
        required: false
        default: true
        type: boolean

concurrency:
  group: hybridinference-sequential-prs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    env:
      # gh reads upstream state and creates the cross-repository PR with this
      # token. The workflow GITHUB_TOKEN handles writes to this fork.
      GH_TOKEN: ${{ secrets.HYBRIDINFERENCE_PR_TOKEN || github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Check out the fork's dev workflow revision
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.5.0"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Fetch current upstream and prepared refs
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/HarvardMadSys/hybridInference.git 2>/dev/null || true
          git fetch --prune upstream dev
          git fetch --prune origin '+refs/heads/prep/*:refs/remotes/origin/prep/*'

      - name: Require publication credentials
        if: env.DRY_RUN != 'true'
        env:
          UPSTREAM_TOKEN: ${{ secrets.HYBRIDINFERENCE_PR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${UPSTREAM_TOKEN}" || { echo 'HYBRIDINFERENCE_PR_TOKEN is required for scheduled publication' >&2; exit 1; }

      - name: Preflight upstream, fork, and publication access
        env:
          UPSTREAM_REPOSITORY: HarvardMadSys/hybridInference
          FORK_REPOSITORY: B-A-M-N/hybridInference
        run: |
          set -euo pipefail

          upstream_url=$(git config --get remote.upstream.url)
          origin_url=$(git config --get remote.origin.url)
          case "${upstream_url}" in
            "https://github.com/${UPSTREAM_REPOSITORY}"|"https://github.com/${UPSTREAM_REPOSITORY}.git") ;;
            *) echo "unexpected upstream remote: ${upstream_url}" >&2; exit 1 ;;
          esac
          case "${origin_url}" in
            "https://github.com/${FORK_REPOSITORY}"|"https://github.com/${FORK_REPOSITORY}.git") ;;
            *) echo "unexpected origin remote: ${origin_url}" >&2; exit 1 ;;
          esac
          git ls-remote --exit-code upstream refs/heads/dev >/dev/null
          git ls-remote --exit-code origin refs/heads/dev >/dev/null

          identity=$(gh api user --jq .login)
          test -n "${identity}"
          test "$(gh api "repos/${UPSTREAM_REPOSITORY}" --jq .full_name)" = "${UPSTREAM_REPOSITORY}"
          test "$(gh api "repos/${FORK_REPOSITORY}" --jq .full_name)" = "${FORK_REPOSITORY}"

          for pr in 1419 1427 1428 1430; do
            base=$(gh api "repos/${UPSTREAM_REPOSITORY}/pulls/${pr}" --jq .base.ref)
            test "${base}" = dev
          done

          # This is a non-mutating write-auth check. It must succeed before
          # the sequencer is allowed to publish a prepared branch.
          git push --dry-run origin "HEAD:refs/heads/sequencer-preflight/${GITHUB_RUN_ID}"

      - name: Run sequencer
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            uv run python ops/sequential_prs.py --manifest .github/sequential-prs.yml --dry-run
          else
            uv run python ops/sequential_prs.py --manifest .github/sequential-prs.yml
          fi
