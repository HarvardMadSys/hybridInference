name: Deploy Production

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Docker Compose stack
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    environment: production
    timeout-minutes: 30

    steps:
      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_HOST_KEY: ${{ secrets.PROD_HOST_KEY }}
          PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          printf '%s\n' "${PROD_SSH_KEY}" > "${HOME}/.ssh/production_deploy_key"
          chmod 600 "${HOME}/.ssh/production_deploy_key"

          printf '%s\n' "${PROD_HOST_KEY}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          for var in PROD_HOST PROD_HOST_KEY PROD_USER PROD_SSH_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error title=Missing secret::${var} is not configured for the 'production' environment"
              exit 1
            fi
          done

          echo "known_hosts entries (host_token algorithm):"
          awk 'NF>=3 && $1 !~ /^#/ {printf "  %s %s\n", $1, $2}' "${HOME}/.ssh/known_hosts"

          LOOKUP_KEY="${PROD_HOST}"
          if [ "${PROD_PORT}" != "22" ]; then
            LOOKUP_KEY="[${PROD_HOST}]:${PROD_PORT}"
          fi

          if ! ssh-keygen -F "${LOOKUP_KEY}" -f "${HOME}/.ssh/known_hosts" >/dev/null; then
            echo "::error title=Invalid PROD_HOST_KEY::known_hosts has no entry for ${LOOKUP_KEY}"
            echo "Re-generate the secret with: ssh-keyscan -p ${PROD_PORT} -t ed25519,rsa,ecdsa ${PROD_HOST}"
            exit 1
          fi

          if ! awk -v lookup_key="${LOOKUP_KEY}" '
            NF >= 3 && $1 == lookup_key && $2 == "ssh-ed25519" { found = 1 }
            END { exit found ? 0 : 1 }
          ' "${HOME}/.ssh/known_hosts"; then
            echo "::error title=Invalid PROD_HOST_KEY::known_hosts has no ssh-ed25519 entry for ${LOOKUP_KEY}"
            echo "OpenSSH is requiring the server's ed25519 host key for strict host checking."
            echo "Re-generate the secret with: ssh-keyscan -p ${PROD_PORT} -t ed25519,rsa,ecdsa ${PROD_HOST}"
            exit 1
          fi

      - name: Deploy on production host
        env:
          # workflow_run deploys the CI-validated commit; manual dispatch uses
          # the workflow file revision selected in the GitHub UI.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "${HOME}/.ssh/production_deploy_key" \
            -p "${PROD_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${PROD_USER}@${PROD_HOST}" \
            "git config --global --add safe.directory /srv/hybridInference && cd /srv/hybridInference && DEPLOY_SHA=${DEPLOY_SHA} bash ops/deploy/deploy_production.sh"
