name: Build Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'serving/**'
      - 'routing/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:  # Allow manual trigger

# NOTE: Documentation is deployed via Cloudflare Pages:
#   - User docs (prod):    https://doc.freeinference.org/        (tracks main)
#   - User docs (staging): https://doc.staging.freeinference.org/ (tracks dev)
#   - Developer docs:      https://internaldoc.freeinference.org/ (tracks main)
# Cloudflare Pages builds and deploys automatically: main → production, dev → staging (CF Pages branch config, not this workflow).
# This workflow only validates that documentation builds without errors.
permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.0"
  UV_SYSTEM_PYTHON: 1

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv
          uv sync --group dev

      - name: Build developer documentation
        run: |
          cd docs
          uv run sphinx-build -b html source build/html -W --keep-going

      - name: Build user documentation
        run: |
          cd docs/free_inference/docs
          uv run sphinx-build -b html source build/html -W --keep-going

      - name: Upload developer docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: developer-documentation
          path: docs/build/html
          retention-days: 7

      - name: Upload user docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-documentation
          path: docs/free_inference/docs/build/html
          retention-days: 7
