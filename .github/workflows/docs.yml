name: Build Documentation

on:
  push:
    branches: [dev]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.0"
  UV_SYSTEM_PYTHON: 1

jobs:
  build:
    name: Build Documentation
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          uv venv
          uv sync --group dev

      - name: Build developer documentation
        run: |
          cd docs
          uv run sphinx-build -b html source build/html -W --keep-going

      - name: Build user documentation
        run: |
          cd docs/free_inference/docs
          uv run sphinx-build -b html source build/html -W --keep-going

      - name: Upload developer docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: developer-documentation
          path: docs/build/html
          retention-days: 7

      - name: Upload user docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-documentation
          path: docs/free_inference/docs/build/html
          retention-days: 7
