name: CI

# Verification only: nothing in this workflow publishes an image or deploys.
# Every job runs on a GitHub-hosted runner, discarded with the job. The
# self-hosted runners and the automatic candidate publishing that ran on them
# were retired after the 2026-11-22 incident; images are now published only by
# a person, through the dispatch-only Publish Images workflow
# (publish-images.yml), which requires this workflow's green push run on dev
# for the commit it publishes.
on:
  workflow_dispatch:
  schedule:
    # Daily full run is a backstop for mistakes in PR path classification.
    - cron: '23 18 * * *'
  push:
    branches: [main, dev, "murphy/dev/*"]
    # No paths-ignore on pushes: every dev SHA needs a complete CI verdict,
    # because Publish Images refuses a commit without a green push run, and a
    # path-filtered push creates no workflow run at all — a job-level
    # condition can never rescue that. The per-job path classification below
    # still keeps docs-only runs cheap.
  pull_request:
    branches: [main, dev]

# Read-only unless a job asks for more: the token a step could leak or misuse
# holds no write scope by default, and a job that needs the package scope
# names it.
permissions:
  contents: read

concurrency:
  # Keep daily/manual backstops from cancelling a push run on dev or main.
  group: ci-v2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # deploy/docker/uv-requirements.txt pins the backend image's uv to this
  # release, with its hashes; bump both together.
  UV_VERSION: "0.5.0"
  UV_SYSTEM_PYTHON: 1
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.1"
  # An exact release, not whatever PyPI calls latest when the job starts.
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  changes:
    name: Classify Changes
    # Every event runs on GitHub-hosted runners (free and unlimited-minutes
    # for public repos); the arm64 image jobs use ubuntu-24.04-arm.
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.validate.outputs.backend }}
      frontend: ${{ steps.validate.outputs.frontend }}
      docker_shared: ${{ steps.validate.outputs.docker_shared }}
      python_tests: ${{ steps.validate.outputs.python_tests }}
      docs: ${{ steps.validate.outputs.docs }}
      tutorial_e2e: ${{ steps.validate.outputs.tutorial_e2e }}
      site_ui: ${{ steps.validate.outputs.site_ui }}
      security_only: ${{ steps.validate.outputs.security_only }}
      full: ${{ steps.validate.outputs.full }}
      docker_matrix: ${{ steps.validate.outputs.docker_matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history so base...head / before..sha diffs resolve; matches
          # the shallow-clone workaround used by every other job here.
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          python3 ops/ci/classify_changes.py \
            --event-name "${EVENT_NAME}" \
            --pr-base "${PR_BASE_SHA}" \
            --pr-head "${PR_HEAD_SHA}" \
            --push-before "${PUSH_BEFORE}" \
            --push-sha "${PUSH_SHA}" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Validate classifier outputs
        id: validate
        env:
          CLASSIFICATION_JSON: >-
            {"backend":${{ toJSON(steps.classify.outputs.backend) }},
            "frontend":${{ toJSON(steps.classify.outputs.frontend) }},
            "docker_shared":${{ toJSON(steps.classify.outputs.docker_shared) }},
            "python_tests":${{ toJSON(steps.classify.outputs.python_tests) }},
            "docs":${{ toJSON(steps.classify.outputs.docs) }},
            "tutorial_e2e":${{ toJSON(steps.classify.outputs.tutorial_e2e) }},
            "site_ui":${{ toJSON(steps.classify.outputs.site_ui) }},
            "security_only":${{ toJSON(steps.classify.outputs.security_only) }},
            "full":${{ toJSON(steps.classify.outputs.full) }},
            "docker_matrix":${{ toJSON(steps.classify.outputs.docker_matrix) }}}
        run: |
          python3 ops/ci/verify_ci_gate.py validate-classification \
            --classification-json "${CLASSIFICATION_JSON}" \
            --github-output "${GITHUB_OUTPUT}"

  backend-quality:
    name: Backend Quality
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Isolate uv cache dir
        # Set via GITHUB_ENV because job-level env cannot use the runner
        # context. The default ~/.cache/uv is shared by every runner process on
        # the machine, and an entry vanishing mid-install fails the job with
        # ENOENT while uv hardlinks into the venv — before tests start.
        #
        # RUNNER_TEMP is the whole isolation: it belongs to one runner process
        # (.../actions-runners/<runner>/_work/_temp), and a runner runs one job
        # at a time. Nothing run-specific may go in this path — see the note on
        # `enable-cache` below.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          # This only caches while UV_CACHE_DIR is stable across runs. The
          # cache service derives an entry's version from the paths it covers,
          # so a path holding GITHUB_RUN_ID misses on every restore and
          # uploads a fresh copy every time. It did: three consecutive runs
          # asked for key `setup-uv-2-aarch64-...-018060ae` and all three were
          # told "No GitHub Actions cache found" — an identical key missing is
          # the version differing, which is the path.
          enable-cache: true
          # Still disable prune: even with UV_CACHE_DIR off the shared default,
          # prune --ci is unnecessary on self-hosted and has raced with other
          # installs.
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        # No .venv cache, here or in the other jobs that sync: `uv venv`
        # replaces the directory, so a restored one was thrown away unread
        # after its download. The uv cache above is what keeps the sync fast.
        run: |
          set -euo pipefail
          uv venv
          # Bounded retry for residual install-time cache ENOENT.
          for attempt in 1 2 3; do
            if uv sync --group dev; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "uv sync failed (attempt ${attempt}/3); retrying..." >&2
              sleep $((attempt * 2))
            fi
          done
          echo "uv sync failed after 3 attempts" >&2
          exit 1

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run Ruff lint
        run: uv run ruff check --no-fix .

      - name: Run pydocstyle
        run: uv run pydocstyle --match-dir='^((?!(tests|\.venv|node_modules|apps/frontend|ops|docs)).)*$'

  frontend-quality:
    name: Frontend Quality
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run type-check

      - name: Run frontend tests
        env:
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
            # A hosted runner is a single-job VM: one worker per CPU is right.
            npm run test
          else
            # Self-hosted runners share a host four ways (see "Select pytest
            # worker budget"). Vitest's default of one worker per visible CPU
            # oversubscribed it, and tests that take a second alone passed the
            # 5s test timeout on dev pushes: four Frontend Quality failures in
            # sixteen dev runs, never on PRs, which run hosted. Same budget as
            # pytest's.
            case "${CI_RUNNER_ARCH}" in
              ARM64) workers=5 ;;
              *) workers=2 ;;
            esac
            npm run test -- --maxWorkers="${workers}"
          fi

      # Keep the audit fail-closed, but run it last so an upstream advisory
      # does not suppress formatting, lint, type-check, and test results.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  site-ui-containers:
    name: Site UI Containers
    needs: changes
    # `site_ui`, not `frontend`: the example module, `.dockerignore` and the
    # built-in marker are inputs of these builds without being frontend source.
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.site_ui == 'true')
    # A daemon is the point of this job, so it needs a runner that has one.
    runs-on: ubuntu-latest
    env:
      # Image tags and container names belong to one run: on a self-hosted
      # runner a second run of this job can overlap this one, and a fixed name
      # left behind by a failed run blocked every run after it.
      SITE_UI_RUN: site-ui-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Two builds of one Dockerfile, which is the compatibility claim this
      # interface makes: the command that existed before modules still produces
      # the neutral image, and the named context is what compiles a module in.
      # Asserted by *building both* rather than by reading the Dockerfile,
      # because the failure mode is a build that succeeds and quietly ignores
      # its context.
      - name: Build the neutral image with no new arguments
        run: |
          docker buildx build -f deploy/docker/Dockerfile.frontend \
            --load -t "${SITE_UI_RUN}-neutral:ci" .

      # The other half of that claim: module settings without the module's
      # context are a mistake, and building the neutral UI in its place is the
      # silent failure. Checked on the refusal's message, so a build that fails
      # for an unrelated reason cannot pass for this one.
      - name: Refuse module settings without a module context
        run: |
          log="${RUNNER_TEMP}/site-ui-no-context.log"
          if docker buildx build -f deploy/docker/Dockerfile.frontend --progress=plain \
            --build-arg SITE_UI_API=1 --build-arg SITE_UI_SUBDIR=site-ui . >"${log}" 2>&1; then
            echo "SITE_UI_API without a site-ui context built an image" >&2
            exit 1
          fi
          grep -q 'the context holds no module' "${log}" || {
            tail -n 40 "${log}" >&2
            echo "the build failed, but not because the module context was missing" >&2
            exit 1
          }

      - name: Build the example module through the named context
        run: |
          docker buildx build -f deploy/docker/Dockerfile.frontend \
            --build-context site-ui=./distributions/example/frontend/site-ui \
            --build-arg SITE_UI_API=1 \
            --load -t "${SITE_UI_RUN}-example:ci" .

      # The image says which module it contains. A neutral image that reported
      # the example's id — or the reverse — would mean the context was ignored,
      # which is the one failure both builds can produce while succeeding.
      - name: Check each image recorded the module it was built with
        run: |
          neutral=$(docker run --rm --entrypoint cat "${SITE_UI_RUN}-neutral:ci" /app/site-ui-manifest.json)
          example=$(docker run --rm --entrypoint cat "${SITE_UI_RUN}-example:ci" /app/site-ui-manifest.json)
          echo "neutral: $neutral"
          echo "example: $example"
          echo "$neutral" | grep -q '"kind": "neutral"' || {
            echo "the neutral image did not record the neutral UI" >&2; exit 1; }
          echo "$example" | grep -q '"id": "example"' || {
            echo "the example image did not record the example module" >&2; exit 1; }

      - name: Select the example container's port
        run: |
          port="$(python3 -c 'import socket; sock = socket.socket(); sock.bind(("127.0.0.1", 0)); print(sock.getsockname()[1]); sock.close()')"
          test -n "${port}"
          echo "SITE_UI_PORT=${port}" >> "${GITHUB_ENV}"

      # A module's assets are served by the `/site-assets` route, after the
      # deployment's own directory. Packaged under `public/` they were served by
      # Next's static handler instead, which answers before any route: a runtime
      # file could not override them and the route's headers never applied. So
      # this asks a real container, created with a runtime directory holding a
      # replacement for the example's mark, then started.
      - name: The example's asset is served by the route, runtime copy first
        run: |
          runtime="${RUNNER_TEMP}/${SITE_UI_RUN}-assets"
          packaged=distributions/example/frontend/site-ui/public/site-assets/example/mark.svg
          mkdir -p "${runtime}/example"
          printf '<svg xmlns="http://www.w3.org/2000/svg"><!-- runtime %s --></svg>\n' \
            "${SITE_UI_RUN}" >"${runtime}/example/mark.svg"
          docker create --name "${SITE_UI_RUN}-example" \
            -e SITE_ASSETS_DIR=/srv/site-assets \
            -p "127.0.0.1:${SITE_UI_PORT}:3001" "${SITE_UI_RUN}-example:ci"
          docker cp "${runtime}/." "${SITE_UI_RUN}-example:/srv/site-assets"
          docker start "${SITE_UI_RUN}-example"
          # Ready when the asset route answers. Not `/`: with no gateway behind
          # this container every page is a 500, since pages read /site-config.
          url="http://127.0.0.1:${SITE_UI_PORT}/site-assets/example/mark.svg"
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "${url}" && break || sleep 1
          done

          # The runtime file wins over the packaged file at the same path.
          curl -fsS -o "${RUNNER_TEMP}/runtime.svg" "${url}"
          cmp "${RUNNER_TEMP}/runtime.svg" "${runtime}/example/mark.svg" || {
            echo "the packaged mark was served instead of the runtime copy" >&2; exit 1; }

          # Without it the packaged file answers, through the route: its bytes,
          # its SVG sandbox and its cache policy, none of which Next's static
          # handler would send. As root: `docker cp` wrote the file as root,
          # and the image runs as an unprivileged user that may only read it.
          docker exec -u 0 "${SITE_UI_RUN}-example" rm /srv/site-assets/example/mark.svg
          curl -fsS -D "${RUNNER_TEMP}/packaged.headers" -o "${RUNNER_TEMP}/packaged.svg" "${url}"
          cmp "${RUNNER_TEMP}/packaged.svg" "${packaged}"
          tr -d '\r' <"${RUNNER_TEMP}/packaged.headers" | tee "${RUNNER_TEMP}/packaged.txt"
          grep -qix "content-security-policy: default-src 'none'; style-src 'unsafe-inline'; sandbox" \
            "${RUNNER_TEMP}/packaged.txt"
          grep -qix 'cache-control: public, max-age=300, must-revalidate' "${RUNNER_TEMP}/packaged.txt"

      - name: Show the example container's log
        if: failure()
        run: docker logs "${SITE_UI_RUN}-example" || true

      # Whatever happened above: a container or image left behind by a failed
      # step is otherwise kept forever by a self-hosted runner.
      - name: Remove this run's Site UI containers and images
        if: always()
        run: |
          docker rm -f "${SITE_UI_RUN}-example" >/dev/null 2>&1 || true
          docker image rm "${SITE_UI_RUN}-neutral:ci" "${SITE_UI_RUN}-example:ci" >/dev/null 2>&1 || true

  docs-build:
    name: Docs Build
    needs: changes
    # The whole job is a dependency install plus one sphinx-build that takes
    # seconds; without this it would inherit the 360-minute default and could
    # hold a shared self-hosted runner for hours if a step hangs.
    timeout-minutes: 5
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases, which has been failing random jobs at checkout.
          fetch-depth: 0

      - name: Isolate uv cache dir
        # Off the shared ~/.cache/uv, which concurrent self-hosted jobs race on
        # while hardlinking into the venv. Stable across runs — see the note on
        # `enable-cache` in Backend Quality.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        # --only-group: this job runs sphinx-build and nothing else, so it
        # needs the `dev` group (which carries sphinx, myst-parser and
        # sphinx-rtd-theme) but not the project or its runtime dependencies,
        # which this job never imports.
        run: |
          set -euo pipefail
          uv venv
          # Bounded retry for residual install-time cache ENOENT.
          for attempt in 1 2 3; do
            if uv sync --only-group dev; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "uv sync failed (attempt ${attempt}/3); retrying..." >&2
              sleep $((attempt * 2))
            fi
          done
          echo "uv sync failed after 3 attempts" >&2
          exit 1

      - name: Build developer docs and verify translations
        # `make docs-verify` is `make docs` (which builds every published
        # language, English at the tree root and each translation beneath it)
        # plus local-link and translation checks. Going through the Makefile rather than
        # repeating the sphinx-build command here is what keeps this job and a
        # contributor's local run from drifting apart.
        #
        # The `-W` that `make docs` passes is the same one the published site
        # builds with, so a toctree or xref break fails here rather than
        # silently leaving the site stale. The checker covers what `-W` cannot
        # see: a translation reverts to English silently, so a stale or missing
        # catalog builds perfectly clean. Sphinx, myst-parser and
        # sphinx-rtd-theme come from the `dev` dependency group, so the
        # versions track uv.lock.
        #
        # --no-sync: plain `uv run` would re-sync the environment and pull the
        # full project closure back in, undoing the narrowed install above.
        run: make docs-verify UV_RUN="uv run --no-sync"

  test:
    # No custom name: skipped jobs do not expand matrix expressions in names;
    # the default job-id name renders cleanly before matrix expansion.
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.python_tests == 'true')
    # Service containers need Docker socket access; keep these jobs off the
    # generic-pool hosts that lack that access.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, db]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybridinference_test_db
        ports:
          - 5432/tcp
        # The data directory on tmpfs. postgres:15 declares it a volume, and
        # the runner removes service containers without their volumes, so on
        # a self-hosted runner every shard stranded one per run.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data:rw,size=2g

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Isolate uv cache dir
        # Same path, and deliberately the same for every shard: RUNNER_TEMP
        # already belongs to one runner process running one job at a time, so
        # the shard number added nothing to the isolation and cost all four
        # shards their cache. See the note on `enable-cache` in Backend
        # Quality for why nothing run-specific belongs in this path.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # Still disable prune: even with UV_CACHE_DIR off the shared default,
          # prune --ci is unnecessary on self-hosted and has raced with other
          # installs.
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          set -euo pipefail
          uv venv
          # Bounded retry for residual install-time cache ENOENT.
          for attempt in 1 2 3; do
            if uv sync --group dev; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "uv sync failed (attempt ${attempt}/3); retrying..." >&2
              sleep $((attempt * 2))
            fi
          done
          echo "uv sync failed after 3 attempts" >&2
          exit 1

      - name: Select pytest worker budget
        env:
          CI_RUNNER_NAME: ${{ runner.name }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
            # A hosted runner is an ephemeral single-job VM: no co-tenants to
            # budget for, so use every core it has.
            pytest_workers="$(nproc)"
          else
            # Four runner services share each physical host: 20 CPUs on ARM64
            # and 8 CPUs on X64. Keep their combined pytest budget within that.
            case "${CI_RUNNER_ARCH}" in
              ARM64) pytest_workers=5 ;;
              X64) pytest_workers=2 ;;
              *)
                pytest_workers=2
                echo "::warning title=Unknown runner architecture::Using conservative pytest worker budget for ${CI_RUNNER_ARCH}"
                ;;
            esac
          fi

          runner_hostname="$(hostname)"
          if command -v nproc >/dev/null 2>&1; then
            visible_cpus="$(nproc)"
          else
            visible_cpus="$(getconf _NPROCESSORS_ONLN)"
          fi
          echo "PYTEST_WORKERS=${pytest_workers}" >> "${GITHUB_ENV}"

          echo "pytest worker budget: runner=${CI_RUNNER_NAME} arch=${CI_RUNNER_ARCH} hostname=${runner_hostname} visible_cpus=${visible_cpus} workers=${pytest_workers}"
          {
            echo "### Pytest worker budget"
            echo
            echo "| Runner | Architecture | Hostname | Visible CPUs | Workers |"
            echo "| --- | --- | --- | ---: | ---: |"
            echo "| ${CI_RUNNER_NAME} | ${CI_RUNNER_ARCH} | ${runner_hostname} | ${visible_cpus} | ${pytest_workers} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Prepare PostgreSQL test databases
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          TEST_DB_NAME: hybridinference_test_db
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
        run: |
          # The same preparation `make test-db` runs locally: schema on the base
          # database, then one copy per xdist worker (tests/fixtures/postgres.py).
          uv run python -m tests.fixtures.postgres prepare --workers "${PYTEST_WORKERS}"

      - name: Prepare pytest shard
        id: pytest-shard
        if: matrix.shard != 'db'
        env:
          PYTEST_SHARD: ${{ matrix.shard }}
          PYTEST_SHARDS: "4"
          PYTEST_SHARD_FILE: ${{ runner.temp }}/pytest-shard-${{ matrix.shard }}.txt
        run: |
          uv run python ops/ci/partition_pytest_files.py \
            --shard-index "${PYTEST_SHARD}" \
            --shard-count "${PYTEST_SHARDS}" \
            --output "${PYTEST_SHARD_FILE}"
          cat "${PYTEST_SHARD_FILE}"
          echo "file=${PYTEST_SHARD_FILE}" >> "${GITHUB_OUTPUT}"
          if [ -s "${PYTEST_SHARD_FILE}" ]; then
            echo "has_tests=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_tests=false" >> "${GITHUB_OUTPUT}"
            echo "No tests selected for this shard"
          fi

      - name: Run isolated PostgreSQL integration tests
        if: matrix.shard == 'db'
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          TEST_DB_NAME: hybridinference_test_db
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          # A database test that cannot reach PostgreSQL fails instead of skipping.
          TEST_DB_REQUIRED: "1"
          USER_AUTH_ENABLED: "1"
          API_KEY_SECRET: integration-test-secret-for-ci-only
        # Parallel like the other shards: every database test now gets a fully
        # migrated database of its own worker (tests/fixtures/postgres.py), so
        # file order no longer matters.
        run: uv run pytest -q -rs -n "${PYTEST_WORKERS}" --dist=loadfile -m "not external and dbtest"

      - name: Run tests (PR/manual, sharded, no coverage)
        if: >-
          matrix.shard != 'db' && github.event_name != 'push' &&
          steps.pytest-shard.outputs.has_tests == 'true'
        env:
          # Database configuration for auth and integration tests
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          DB_NAME: hybridinference_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          TEST_DB_HOST: localhost
          TEST_DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          TEST_DB_NAME: hybridinference_test_db
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_REQUIRED: "1"
          # Auth system configuration
          JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
          SIGNUP_ENABLED: "1"
          SIGNUP_DEFAULT_TIER: free
          SIGNUP_DEFAULT_DAILY_QUOTA_USD: "100.00"
          SIGNUP_REQUIRE_EMAIL_VERIFICATION: "0"
          COOKIE_SECURE: "0"
          COOKIE_SAMESITE: lax
          BASE_URL: http://localhost:8000
        run: |
          mapfile -t pytest_files < "${{ steps.pytest-shard.outputs.file }}"
          uv run pytest -n "${PYTEST_WORKERS}" --dist=loadfile -v -rs -m "not external and not dbtest" "${pytest_files[@]}"

      - name: Run tests (push, coverage shard)
        if: >-
          matrix.shard != 'db' && github.event_name == 'push' &&
          steps.pytest-shard.outputs.has_tests == 'true'
        env:
          # Database configuration for auth and integration tests
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          DB_NAME: hybridinference_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          TEST_DB_HOST: localhost
          TEST_DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          TEST_DB_NAME: hybridinference_test_db
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_REQUIRED: "1"
          # Auth system configuration
          JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
          SIGNUP_ENABLED: "1"
          SIGNUP_DEFAULT_TIER: free
          SIGNUP_DEFAULT_DAILY_QUOTA_USD: "100.00"
          SIGNUP_REQUIRE_EMAIL_VERIFICATION: "0"
          COOKIE_SECURE: "0"
          COOKIE_SAMESITE: lax
          BASE_URL: http://localhost:8000
          PYTEST_SHARD: ${{ matrix.shard }}
          PYTEST_FILE_DURATIONS_OUTPUT: ${{ runner.temp }}/pytest-file-durations-${{ matrix.shard }}.json
        run: |
          mapfile -t pytest_files < "${{ steps.pytest-shard.outputs.file }}"
          uv run pytest \
            -p ops.ci.pytest_file_durations \
            -n "${PYTEST_WORKERS}" \
            --dist=loadfile \
            --cov=. \
            --cov-report=term-missing \
            --cov-report="xml:coverage-${PYTEST_SHARD}.xml" \
            -v \
            -rs \
            -m "not external and not dbtest" \
            "${pytest_files[@]}"

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && steps.pytest-shard.outputs.has_tests == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: ./coverage-${{ matrix.shard }}.xml
          flags: backend-shard-${{ matrix.shard }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload pytest file durations
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-file-durations-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest-file-durations-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      # Into RUNNER_TEMP and onto GITHUB_PATH, not `sudo install` into
      # /usr/local/bin: the self-hosted runners' accounts have no sudo, and
      # their machine outlives the job and is shared with other repositories'
      # CI, whose scan would otherwise run whichever gitleaks was installed
      # last. Unpacking outside the workspace also keeps the tarball out of
      # the tree the next step scans.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="x64" ;;
            aarch64|arm64) arch="arm64" ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          asset="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          bindir="${RUNNER_TEMP}/bin"
          mkdir -p "${bindir}"
          cd "${RUNNER_TEMP}"
          curl -fsSLO "${base_url}/${asset}"
          curl -fsSLO "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  ${asset}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" > gitleaks.sha256
          sha256sum -c gitleaks.sha256
          tar -xzf "${asset}" gitleaks
          install -m 0755 gitleaks "${bindir}/gitleaks"
          echo "${bindir}" >> "${GITHUB_PATH}"
          "${bindir}/gitleaks" version

      - name: Run gitleaks
        run: gitleaks detect --source . --no-git --redact --verbose --no-banner

      - name: Isolate uv cache dir
        # Job-level env cannot use the runner context; set via GITHUB_ENV.
        # This job does not enable the remote cache, so the run id here cost
        # nothing — it is dropped anyway so the pattern is not copied into a
        # job that does.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Verify secret scanner coverage
        run: uv run --no-project --python "${PYTHON_VERSION}" python ops/ci/check_gitleaks_config.py

      # The requirements go to RUNNER_TEMP, not a fixed name in /tmp: every
      # runner account on a self-hosted machine shares that sticky directory,
      # and a file another account left there cannot be replaced
      # (fs.protected_regular), which fails the export on the next account.
      - name: Security audit
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          requirements="${RUNNER_TEMP}/audit-requirements.txt"
          uv export --no-dev --no-hashes --format requirements-txt -o "${requirements}"
          uvx --python ${{ env.PYTHON_VERSION }} --from "pip-audit==${PIP_AUDIT_VERSION}" \
            pip-audit --progress-spinner off --no-deps --disable-pip -r "${requirements}"

  docker-build:
    # No custom name: skipped jobs do not expand matrix expressions in names;
    # the default job-id name renders cleanly before matrix expansion.
    needs: changes
    # PRs build only affected images. Scheduled/manual runs build all images.
    # Branch pushes skip this job: Tutorial E2E already builds both images on
    # every push, and publishing is the manual Publish Images workflow.
    # A classifier failure fails open to all images; CI Gate still fails closed.
    if: >-
      always() &&
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.docker_matrix != '[]')
    # Buildx needs Docker daemon access; pin image verification to ARM64.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # The fallback keeps the matrix non-empty even when the PR job-level
        # condition skips it. It also safely builds all images if outputs are
        # unavailable or malformed.
        image: ${{ fromJSON(needs.changes.outputs.docker_matrix != '' && needs.changes.outputs.docker_matrix != '[]' && needs.changes.outputs.docker_matrix || '["frontend","backend"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full fetch avoids the intermittent unresolved-delta failures seen
          # with shallow clones on the self-hosted runner pool.
          fetch-depth: 0

      - name: Reap Compose volumes stranded by older CI runs
        run: |
          # An always() teardown does not survive a hard cancel, so every run
          # reaps what earlier ones stranded. Both Compose stacks in this
          # workflow use a per-run project name, so these prefixes match this
          # workflow's own volumes and nothing else, and the six-hour floor sits
          # far past the longest timeout here -- a sibling job sharing this
          # self-hosted runner can never fall inside the window.
          cutoff="$(($(date -u +%s) - 6 * 60 * 60))"
          docker volume ls --quiet \
            --filter 'name=^hi-tutorial-' \
            --filter 'name=^hi-example-' |
            while read -r volume; do
              created="$(docker volume inspect \
                --format '{{.CreatedAt}}' "${volume}" 2>/dev/null)" || continue
              created_epoch="$(date -u -d "${created}" +%s 2>/dev/null)" || continue
              if test "${created_epoch}" -lt "${cutoff}"; then
                if docker volume rm "${volume}" >/dev/null 2>&1; then
                  echo "reaped stale CI volume ${volume}"
                fi
              fi
            done

      # Same-user self-hosted runners share Buildx default builder state.
      # Keep builds, retries, Compose, and post-step cleanup within each job.
      - name: Isolate the Buildx config per job
        run: echo "BUILDX_CONFIG=${RUNNER_TEMP}/buildx" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build ${{ matrix.image }} image
        id: build
        # A transient buildkit/runner recycle can surface as graceful_stop.
        # Recreate the builder and retry once before failing the matrix cell.
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image }}
          push: false
          # The backend cell immediately runs the documented example against
          # this exact image. Other cells only need build verification.
          load: ${{ matrix.image == 'backend' }}
          tags: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}

      - name: Set up Docker Buildx (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build ${{ matrix.image }} image (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image }}
          push: false
          load: ${{ matrix.image == 'backend' }}
          tags: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}

      - name: Select runnable example port
        if: matrix.image == 'backend'
        run: |
          port="$(python3 -c 'import socket; sock = socket.socket(); sock.bind(("127.0.0.1", 0)); print(sock.getsockname()[1]); sock.close()')"
          test -n "${port}"
          echo "BACKEND_PORT=${port}" >> "${GITHUB_ENV}"

      - name: Start runnable router example
        id: example-up
        if: matrix.image == 'backend'
        env:
          COMPOSE_PROJECT_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}
          EXAMPLE_BACKEND_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-backend
          EXAMPLE_PROVIDER_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-provider
        run: make up DISTRIBUTION=example

      - name: Smoke runnable router example
        id: example-smoke
        if: matrix.image == 'backend'
        env:
          EXAMPLE_BACKEND_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-backend
        run: |
          port="$(docker container inspect --format '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          test "${port}" = "${BACKEND_PORT}"
          SMOKE_BASE_URL="http://localhost:${port}" make smoke DISTRIBUTION=example

      - name: Show runnable example logs
        if: >-
          always() && matrix.image == 'backend' &&
          (steps.example-up.outcome == 'failure' || steps.example-smoke.outcome == 'failure')
        env:
          EXAMPLE_BACKEND_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-backend
          EXAMPLE_PROVIDER_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-provider
        run: |
          docker logs "${EXAMPLE_BACKEND_CONTAINER_NAME}" || true
          docker logs "${EXAMPLE_PROVIDER_CONTAINER_NAME}" || true

      - name: Stop runnable router example
        if: always() && matrix.image == 'backend'
        env:
          COMPOSE_PROJECT_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}
          EXAMPLE_BACKEND_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-backend
          EXAMPLE_PROVIDER_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-provider
        run: |
          make down DISTRIBUTION=example || true
          docker image rm \
            "${COMPOSE_PROJECT_NAME}-backend" \
            "${COMPOSE_PROJECT_NAME}-example-provider" || true
          # `down` keeps volumes on purpose -- it is the documented tutorial
          # stop command -- and `down --volumes` would only remove the ones its
          # services still reference. This project name belongs to this run
          # alone, so anything still carrying its label is a leak on a runner
          # that never forgets. Remove it, then fail: the next one gets caught
          # here rather than on a disk that filled up months later.
          leaked_volumes="$(docker volume ls --quiet \
            --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}")"
          if test -n "${leaked_volumes}"; then
            echo "${leaked_volumes}" | xargs -r docker volume rm || true
            echo "example cleanup left volumes behind:" >&2
            echo "${leaked_volumes}" >&2
            exit 1
          fi

  tutorial-e2e:
    name: Tutorial E2E
    needs: changes
    # This two-image integration run stays classifier-driven on pushes as well
    # as PRs. Scheduled/manual runs and classifier failures select `full`, so
    # they still exercise the complete tutorial fail-open.
    if: >-
      always() &&
      (needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.tutorial_e2e == 'true')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    # packages: read pulls the previous backend candidate for the restore drill.
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_PROJECT_NAME: hi-tutorial-${{ github.run_id }}-${{ github.run_attempt }}
      EXAMPLE_BACKEND_CONTAINER_NAME: hi-tutorial-${{ github.run_id }}-${{ github.run_attempt }}-backend
      EXAMPLE_PROVIDER_CONTAINER_NAME: hi-tutorial-${{ github.run_id }}-${{ github.run_attempt }}-provider
      EXAMPLE_FRONTEND_CONTAINER_NAME: hi-tutorial-${{ github.run_id }}-${{ github.run_attempt }}-frontend
      EXAMPLE_POSTGRES_CONTAINER_NAME: hi-tutorial-${{ github.run_id }}-${{ github.run_attempt }}-postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          # The token holds packages: read, and nothing here fetches again.
          persist-credentials: false

      - name: Select tutorial ports
        id: tutorial-port
        run: |
          ports="$(python3 -c 'import socket; sockets = [socket.socket() for _ in range(3)]; [sock.bind(("127.0.0.1", 0)) for sock in sockets]; print(*(sock.getsockname()[1] for sock in sockets)); [sock.close() for sock in sockets]')"
          read -r backend_port frontend_port db_port <<< "${ports}"
          test -n "${backend_port}"
          test -n "${frontend_port}"
          test -n "${db_port}"
          {
            echo "BACKEND_PORT=${backend_port}"
            echo "FRONTEND_PORT=${frontend_port}"
            echo "DB_PORT=${db_port}"
            echo "EXAMPLE_RESET_STATE_FILE=${RUNNER_TEMP}/hi-tutorial-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-reset.json"
          } >> "${GITHUB_ENV}"
          echo "frontend_port=${frontend_port}" >> "${GITHUB_OUTPUT}"

      - name: Reap Compose volumes stranded by older CI runs
        run: |
          # An always() teardown does not survive a hard cancel, so every run
          # reaps what earlier ones stranded. Both Compose stacks in this
          # workflow use a per-run project name, so these prefixes match this
          # workflow's own volumes and nothing else, and the six-hour floor sits
          # far past the longest timeout here -- a sibling job sharing this
          # self-hosted runner can never fall inside the window.
          cutoff="$(($(date -u +%s) - 6 * 60 * 60))"
          docker volume ls --quiet \
            --filter 'name=^hi-tutorial-' \
            --filter 'name=^hi-example-' |
            while read -r volume; do
              created="$(docker volume inspect \
                --format '{{.CreatedAt}}' "${volume}" 2>/dev/null)" || continue
              created_epoch="$(date -u -d "${created}" +%s 2>/dev/null)" || continue
              if test "${created_epoch}" -lt "${cutoff}"; then
                if docker volume rm "${volume}" >/dev/null 2>&1; then
                  echo "reaped stale CI volume ${volume}"
                fi
              fi
            done

      - name: Isolate the Buildx config per job
        run: echo "BUILDX_CONFIG=${RUNNER_TEMP}/buildx" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build exact tutorial backend image
        id: tutorial-backend-build
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          push: false
          load: true
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-backend
          cache-from: |
            type=gha,scope=backend
            type=gha,scope=tutorial-e2e-backend
          cache-to: type=gha,mode=min,scope=tutorial-e2e-backend

      - name: Set up Docker Buildx for backend retry
        if: steps.tutorial-backend-build.outcome == 'failure'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build exact tutorial backend image (retry)
        if: steps.tutorial-backend-build.outcome == 'failure'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          push: false
          load: true
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-backend
          cache-from: |
            type=gha,scope=backend
            type=gha,scope=tutorial-e2e-backend
          cache-to: type=gha,mode=min,scope=tutorial-e2e-backend

      - name: Build exact same-origin tutorial frontend image
        id: tutorial-frontend-build
        continue-on-error: true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend
          push: false
          load: true
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-frontend
          build-args: |
            NEXT_PUBLIC_API_BASE=
            BACKEND_INTERNAL_URL=http://backend:8080
            NEXT_PUBLIC_APP_NAME=Example Router
            NEXT_PUBLIC_EXAMPLE_API_BASE=http://localhost:${{ steps.tutorial-port.outputs.frontend_port }}
            NEXT_PUBLIC_EXAMPLE_MODEL=example-chat
            NEXT_PUBLIC_STORAGE_KEY_PREFIX=hybridinference-example
          cache-from: |
            type=gha,scope=frontend
            type=gha,scope=tutorial-e2e-frontend
          cache-to: type=gha,mode=min,scope=tutorial-e2e-frontend

      - name: Set up Docker Buildx for frontend retry
        if: steps.tutorial-frontend-build.outcome == 'failure'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build exact same-origin tutorial frontend image (retry)
        if: steps.tutorial-frontend-build.outcome == 'failure'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend
          push: false
          load: true
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-frontend
          build-args: |
            NEXT_PUBLIC_API_BASE=
            BACKEND_INTERNAL_URL=http://backend:8080
            NEXT_PUBLIC_APP_NAME=Example Router
            NEXT_PUBLIC_EXAMPLE_API_BASE=http://localhost:${{ steps.tutorial-port.outputs.frontend_port }}
            NEXT_PUBLIC_EXAMPLE_MODEL=example-chat
            NEXT_PUBLIC_STORAGE_KEY_PREFIX=hybridinference-example
          cache-from: |
            type=gha,scope=frontend
            type=gha,scope=tutorial-e2e-frontend
          cache-to: type=gha,mode=min,scope=tutorial-e2e-frontend

      - name: Start tutorial Stage 1
        id: tutorial-up
        run: make up DISTRIBUTION=example

      - name: Smoke tutorial Stage 1 and record container state
        id: stage1-state
        run: |
          port="$(docker container inspect --format '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          test "${port}" = "${BACKEND_PORT}"
          SMOKE_BASE_URL="http://localhost:${port}" make smoke DISTRIBUTION=example

          for absent in "${EXAMPLE_FRONTEND_CONTAINER_NAME}" "${EXAMPLE_POSTGRES_CONTAINER_NAME}"; do
            if docker container inspect "${absent}" >/dev/null 2>&1; then
              echo "Stage 1 unexpectedly started ${absent}" >&2
              exit 1
            fi
          done
          if docker volume inspect \
            "${COMPOSE_PROJECT_NAME}_example_postgres_data" >/dev/null 2>&1; then
            echo "Stage 1 unexpectedly created the example database volume" >&2
            exit 1
          fi

          registry="distributions/example/config/models.json"
          registry_backup="${RUNNER_TEMP}/tutorial-models-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          cp "${registry}" "${registry_backup}"
          restore_registry() {
            cp "${registry_backup}" "${registry}"
            make up DISTRIBUTION=example >/dev/null 2>&1 || true
            rm -f "${registry_backup}"
          }
          trap restore_registry EXIT

          backend_image_before="$(docker container inspect --format '{{.Image}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          sed -i 's/"name": "Runnable Example Chat"/"name": "Reloaded Example Chat"/' "${registry}"
          grep -q '"name": "Reloaded Example Chat"' "${registry}"
          make up DISTRIBUTION=example
          for _ in $(seq 1 30); do
            if models_json="$(curl --fail --silent "http://localhost:${port}/v1/models")" && \
              python3 -c 'import json, sys; assert json.load(sys.stdin)["data"][0]["name"] == "Reloaded Example Chat"' <<< "${models_json}"; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://localhost:${port}/v1/models" | \
            python3 -c 'import json, sys; assert json.load(sys.stdin)["data"][0]["name"] == "Reloaded Example Chat"'
          backend_image_after="$(docker container inspect --format '{{.Image}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          test "${backend_image_after}" = "${backend_image_before}"

          cp "${registry_backup}" "${registry}"
          make up DISTRIBUTION=example
          rm -f "${registry_backup}"
          trap - EXIT
          SMOKE_BASE_URL="http://localhost:${port}" make smoke DISTRIBUTION=example

          provider_id="$(docker container inspect --format '{{.Id}}' "${EXAMPLE_PROVIDER_CONTAINER_NAME}")"
          backend_container_id="$(docker container inspect --format '{{.Id}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          backend_image_id="$(docker container inspect --format '{{.Image}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          loaded_backend_image_id="$(docker image inspect --format '{{.Id}}' "${COMPOSE_PROJECT_NAME}-backend")"
          test "${backend_image_id}" = "${loaded_backend_image_id}"
          {
            echo "provider_id=${provider_id}"
            echo "backend_container_id=${backend_container_id}"
            echo "backend_image_id=${backend_image_id}"
          } >> "${GITHUB_OUTPUT}"

      - name: Promote Stage 1 to the full local demo
        id: demo-up
        run: |
          make demo DISTRIBUTION=example

          provider_id="$(docker container inspect --format '{{.Id}}' "${EXAMPLE_PROVIDER_CONTAINER_NAME}")"
          backend_container_id="$(docker container inspect --format '{{.Id}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          backend_image_id="$(docker container inspect --format '{{.Image}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          frontend_image_id="$(docker container inspect --format '{{.Image}}' "${EXAMPLE_FRONTEND_CONTAINER_NAME}")"
          loaded_frontend_image_id="$(docker image inspect --format '{{.Id}}' "${COMPOSE_PROJECT_NAME}-frontend")"

          test "${provider_id}" = "${{ steps.stage1-state.outputs.provider_id }}"
          test "${backend_container_id}" != "${{ steps.stage1-state.outputs.backend_container_id }}"
          test "${backend_image_id}" = "${{ steps.stage1-state.outputs.backend_image_id }}"
          test "${frontend_image_id}" = "${loaded_frontend_image_id}"
          docker container inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}" | grep -qx 'DB_ENABLED=true'
          docker container inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}" | grep -qx 'USER_AUTH_ENABLED=true'

      - name: Smoke the full local demo
        id: demo-smoke
        run: |
          port="$(docker container inspect --format '{{(index (index .NetworkSettings.Ports "3001/tcp") 0).HostPort}}' "${EXAMPLE_FRONTEND_CONTAINER_NAME}")"
          test "${port}" = "${FRONTEND_PORT}"
          test ! -e "${EXAMPLE_RESET_STATE_FILE}"
          DEMO_SMOKE_STATE_FILE="${EXAMPLE_RESET_STATE_FILE}" \
            DEMO_BASE_URL="http://localhost:${port}" \
            make demo-smoke DISTRIBUTION=example

      - name: Restore the previous backend on the migrated database
        id: demo-previous-smoke
        # A failed deploy restores the image that ran before it, on the schema
        # this image has just migrated, and without running that image's
        # migrations. The previous dev candidate must start there and keep
        # serving the accounts, keys and requests the smoke above created.
        # `make demo-previous` starts it through `make rollback`'s own code:
        # the pinned-artifact overlay, the base file's pass-through of the
        # configuration selectors an older image reads, and the deploy
        # acceptance.
        env:
          PREVIOUS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${PREVIOUS_SHA}" ] || [ -z "${PREVIOUS_SHA//0/}" ]; then
            echo "::notice title=Restore drill skipped::no previous commit to restore"
            exit 0
          fi
          # The token lives only in this directory, removed however the step
          # ends.
          docker_cfg="$(mktemp -d)"
          trap 'rm -rf "${docker_cfg}"' EXIT
          printf '%s' "${GHCR_TOKEN}" | DOCKER_CONFIG="${docker_cfg}" docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The newest published candidate at or before the previous commit:
          # what a deployment would roll back to. Candidates are published by
          # hand (publish-images.yml), so most commits have none; the window
          # covers dev's first-parent history back across many of them (the
          # checkout has the full history).
          image=""
          for sha in $(git rev-list --first-parent --max-count=200 "${PREVIOUS_SHA}"); do
            candidate="ghcr.io/harvardmadsys/hybridinference-backend:dev-${sha}"
            if DOCKER_CONFIG="${docker_cfg}" docker manifest inspect "${candidate}" >/dev/null 2>&1; then
              image="${candidate}"
              break
            fi
          done
          if [ -z "${image}" ]; then
            echo "::warning title=Restore drill skipped::no candidate published for ${PREVIOUS_SHA} or its 199 first-parent ancestors"
            exit 0
          fi
          [ "${image}" = "ghcr.io/harvardmadsys/hybridinference-backend:dev-${PREVIOUS_SHA}" ] \
            || echo "::notice title=Restore drill::${PREVIOUS_SHA} has no candidate; restoring ${image}"
          DOCKER_CONFIG="${docker_cfg}" docker pull --quiet "${image}"
          port="$(docker container inspect --format '{{(index (index .NetworkSettings.Ports "3001/tcp") 0).HostPort}}' "${EXAMPLE_FRONTEND_CONTAINER_NAME}")"
          PREVIOUS_BACKEND_IMAGE="${image}" \
            DEMO_SMOKE_EXPECT_STATE_FILE="${EXAMPLE_RESET_STATE_FILE}" \
            DEMO_BASE_URL="http://localhost:${port}" \
            make demo-previous DISTRIBUTION=example
          # A rollback starts the recorded image by its ID.
          test "$(docker container inspect --format '{{.Image}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")" = \
            "$(docker image inspect --format '{{.Id}}' "${image}")"
          # Back to this image: its migration finds the database at its head.
          make demo DISTRIBUTION=example
          DEMO_SMOKE_EXPECT_STATE_FILE="${EXAMPLE_RESET_STATE_FILE}" \
            DEMO_BASE_URL="http://localhost:${port}" \
            make demo-smoke DISTRIBUTION=example

      - name: Preserve state across full stop and resume
        id: demo-resume-smoke
        run: |
          volume="${COMPOSE_PROJECT_NAME}_example_postgres_data"
          volume_created_at="$(docker volume inspect --format '{{.CreatedAt}}' "${volume}")"
          test -n "${volume_created_at}"

          docker logs "${EXAMPLE_PROVIDER_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-provider.log" 2>&1 || true
          docker logs "${EXAMPLE_POSTGRES_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-postgres.log" 2>&1 || true
          docker logs "${EXAMPLE_BACKEND_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-backend.log" 2>&1 || true
          docker logs "${EXAMPLE_FRONTEND_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-frontend.log" 2>&1 || true

          make demo-down DISTRIBUTION=example
          docker volume inspect "${volume}" >/dev/null
          for removed in \
            "${EXAMPLE_PROVIDER_CONTAINER_NAME}" \
            "${EXAMPLE_POSTGRES_CONTAINER_NAME}" \
            "${EXAMPLE_BACKEND_CONTAINER_NAME}" \
            "${EXAMPLE_FRONTEND_CONTAINER_NAME}"; do
            if docker container inspect "${removed}" >/dev/null 2>&1; then
              echo "demo-down left ${removed} behind" >&2
              exit 1
            fi
          done

          make demo DISTRIBUTION=example
          test "$(docker volume inspect --format '{{.CreatedAt}}' "${volume}")" = "${volume_created_at}"
          port="$(docker container inspect --format '{{(index (index .NetworkSettings.Ports "3001/tcp") 0).HostPort}}' "${EXAMPLE_FRONTEND_CONTAINER_NAME}")"
          test "${port}" = "${FRONTEND_PORT}"
          DEMO_SMOKE_EXPECT_STATE_FILE="${EXAMPLE_RESET_STATE_FILE}" \
            DEMO_BASE_URL="http://localhost:${port}" \
            make demo-smoke DISTRIBUTION=example

      - name: Route Stage 3 through a host-side local provider
        id: stage3-local-provider
        run: |
          fixture_log="${RUNNER_TEMP}/tutorial-host-provider.log"
          fixture_pid=""

          stop_fixture() {
            if test -n "${fixture_pid}"; then
              kill "${fixture_pid}" 2>/dev/null || true
              wait "${fixture_pid}" 2>/dev/null || true
            fi
          }
          trap stop_fixture EXIT

          host_provider_port="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          test -n "${host_provider_port}"
          python3 distributions/example/fixtures/fake-openai-provider/server.py \
            --host 0.0.0.0 \
            --port "${host_provider_port}" \
            --response-text STAGE3_HOST_FIXTURE_OK \
            --expected-model host-fixture-model \
            --expected-api-key local-placeholder \
            > "${fixture_log}" 2>&1 &
          fixture_pid="$!"

          for _ in $(seq 1 30); do
            if curl --fail --silent \
              "http://127.0.0.1:${host_provider_port}/health" >/dev/null; then
              break
            fi
            kill -0 "${fixture_pid}"
            sleep 1
          done
          curl --fail --silent --show-error \
            "http://127.0.0.1:${host_provider_port}/health" >/dev/null

          export EXAMPLE_UPSTREAM_BASE_URL="http://host.docker.internal:${host_provider_port}/v1"
          export EXAMPLE_UPSTREAM_API_KEY="local-placeholder"
          export EXAMPLE_UPSTREAM_MODEL="host-fixture-model"
          export EXAMPLE_EXPECTED_CONTENT="STAGE3_HOST_FIXTURE_OK"

          port="$(docker container inspect --format '{{(index (index .NetworkSettings.Ports "3001/tcp") 0).HostPort}}' "${EXAMPLE_FRONTEND_CONTAINER_NAME}")"
          test "${port}" = "${FRONTEND_PORT}"

          # Stage 2's first start stored the bundled provider's EXAMPLE_UPSTREAM_*
          # values in the example database, where they outrank the environment.
          # Change them as the tutorial does -- an admin edit of the stored
          # configuration -- then recreate the backend, because the model
          # registry reads them only at startup.
          python3 distributions/example/full_smoke.py \
            --base-url "http://localhost:${port}" \
            --timeout 120 \
            --configure-upstream
          make demo DISTRIBUTION=example

          # Anyone may read /routing, but only an administrator is shown where
          # a route sends requests. That the route now reaches the host fixture
          # is proved by the smoke below: only the fixture answers
          # STAGE3_HOST_FIXTURE_OK, for the model and key it was started with.
          routing="$(curl --fail --silent --show-error "http://localhost:${BACKEND_PORT}/routing")"
          if grep -qF "host.docker.internal" <<< "${routing}"; then
            echo "anonymous /routing disclosed an upstream address" >&2
            exit 1
          fi

          EXAMPLE_DEMO_EXPECT_EXISTING=1 \
            DEMO_BASE_URL="http://localhost:${port}" \
            make demo-smoke DISTRIBUTION=example

      - name: Verify destructive reset isolation
        id: demo-reset-smoke
        run: |
          test -f "${EXAMPLE_RESET_STATE_FILE}"
          docker logs "${EXAMPLE_PROVIDER_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-provider.log" 2>&1 || true
          docker logs "${EXAMPLE_POSTGRES_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-postgres.log" 2>&1 || true
          docker logs "${EXAMPLE_BACKEND_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-backend.log" 2>&1 || true
          docker logs "${EXAMPLE_FRONTEND_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-frontend.log" 2>&1 || true
          make demo-reset DISTRIBUTION=example
          if docker volume inspect \
            "${COMPOSE_PROJECT_NAME}_example_postgres_data" >/dev/null 2>&1; then
            echo "example database volume survived demo-reset" >&2
            exit 1
          fi

          make demo DISTRIBUTION=example
          port="$(docker container inspect --format '{{(index (index .NetworkSettings.Ports "3001/tcp") 0).HostPort}}' "${EXAMPLE_FRONTEND_CONTAINER_NAME}")"
          test "${port}" = "${FRONTEND_PORT}"
          python3 distributions/example/full_smoke.py \
            --base-url "http://localhost:${port}" \
            --timeout 120 \
            --verify-reset-state "${EXAMPLE_RESET_STATE_FILE}"

      - name: Show tutorial E2E logs
        if: failure()
        run: |
          if test -f "${RUNNER_TEMP}/tutorial-host-provider.log"; then
            sed -n '1,100p' "${RUNNER_TEMP}/tutorial-host-provider.log"
          fi
          for snapshot in \
            "${RUNNER_TEMP}/tutorial-provider.log" \
            "${RUNNER_TEMP}/tutorial-postgres.log" \
            "${RUNNER_TEMP}/tutorial-backend.log" \
            "${RUNNER_TEMP}/tutorial-frontend.log"; do
            if test -f "${snapshot}"; then
              echo "Saved log: ${snapshot##*/}"
              sed -n '1,400p' "${snapshot}"
            fi
          done
          docker logs "${EXAMPLE_PROVIDER_CONTAINER_NAME}" || true
          docker logs "${EXAMPLE_POSTGRES_CONTAINER_NAME}" || true
          docker logs "${EXAMPLE_BACKEND_CONTAINER_NAME}" || true
          docker logs "${EXAMPLE_FRONTEND_CONTAINER_NAME}" || true

      - name: Reset tutorial E2E
        if: always()
        run: |
          if test -n "${EXAMPLE_RESET_STATE_FILE:-}"; then
            rm -f "${EXAMPLE_RESET_STATE_FILE}"
          fi
          make demo-reset DISTRIBUTION=example
          for leaked in \
            "${EXAMPLE_PROVIDER_CONTAINER_NAME}" \
            "${EXAMPLE_POSTGRES_CONTAINER_NAME}" \
            "${EXAMPLE_BACKEND_CONTAINER_NAME}" \
            "${EXAMPLE_FRONTEND_CONTAINER_NAME}"; do
            if docker container inspect "${leaked}" >/dev/null 2>&1; then
              echo "tutorial cleanup left ${leaked} behind" >&2
              exit 1
            fi
          done
          if docker volume inspect \
            "${COMPOSE_PROJECT_NAME}_example_postgres_data" >/dev/null 2>&1; then
            echo "tutorial cleanup left the example database volume behind" >&2
            exit 1
          fi
          for network in hybridinference pgadmin; do
            if docker network inspect \
              "${COMPOSE_PROJECT_NAME}_${network}" >/dev/null 2>&1; then
              echo "tutorial cleanup left the example ${network} network behind" >&2
              exit 1
            fi
          done
          docker image rm \
            "${COMPOSE_PROJECT_NAME}-backend" \
            "${COMPOSE_PROJECT_NAME}-frontend" \
            "${COMPOSE_PROJECT_NAME}-example-provider" || true
          # `demo-reset` removes the volumes its services still reference, which
          # is every volume this stack is supposed to have. This project name
          # belongs to this run alone, so anything still carrying its label is a
          # leak on a runner that never forgets. Remove it, then fail: the next
          # one gets caught here rather than on a disk that filled up months
          # later.
          leaked_volumes="$(docker volume ls --quiet \
            --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}")"
          if test -n "${leaked_volumes}"; then
            echo "${leaked_volumes}" | xargs -r docker volume rm || true
            echo "tutorial cleanup left volumes behind:" >&2
            echo "${leaked_volumes}" >&2
            exit 1
          fi
          test ! -e var
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  ci-gate:
    name: CI Gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend-quality
      - frontend-quality
      - site-ui-containers
      - docs-build
      - test
      - security
      - docker-build
      - tutorial-e2e
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Verify exact required CI job results
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFICATION_JSON: >-
            {"backend":${{ toJSON(needs.changes.outputs.backend) }},
            "frontend":${{ toJSON(needs.changes.outputs.frontend) }},
            "docker_shared":${{ toJSON(needs.changes.outputs.docker_shared) }},
            "python_tests":${{ toJSON(needs.changes.outputs.python_tests) }},
            "docs":${{ toJSON(needs.changes.outputs.docs) }},
            "tutorial_e2e":${{ toJSON(needs.changes.outputs.tutorial_e2e) }},
            "site_ui":${{ toJSON(needs.changes.outputs.site_ui) }},
            "security_only":${{ toJSON(needs.changes.outputs.security_only) }},
            "full":${{ toJSON(needs.changes.outputs.full) }},
            "docker_matrix":${{ toJSON(needs.changes.outputs.docker_matrix) }}}
          JOB_RESULTS_JSON: >-
            {"changes":${{ toJSON(needs.changes.result) }},
            "backend-quality":${{ toJSON(needs.backend-quality.result) }},
            "frontend-quality":${{ toJSON(needs.frontend-quality.result) }},
            "site-ui-containers":${{ toJSON(needs.site-ui-containers.result) }},
            "docs-build":${{ toJSON(needs.docs-build.result) }},
            "test":${{ toJSON(needs.test.result) }},
            "security":${{ toJSON(needs.security.result) }},
            "docker-build":${{ toJSON(needs.docker-build.result) }},
            "tutorial-e2e":${{ toJSON(needs.tutorial-e2e.result) }}}
        run: |
          python3 ops/ci/verify_ci_gate.py verify-gate \
            --event-name "${EVENT_NAME}" \
            --classification-json "${CLASSIFICATION_JSON}" \
            --job-results-json "${JOB_RESULTS_JSON}"
