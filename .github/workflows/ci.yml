name: CI

on:
  workflow_dispatch:
  schedule:
    # Daily full run is a backstop for mistakes in PR path classification.
    - cron: '23 18 * * *'
  push:
    branches: [main, dev, "murphy/dev/*"]
    # No paths-ignore on pushes (2026-08-19): every dev SHA must publish a
    # backend candidate for the distribution repo's bump bot, and a
    # path-filtered push creates no workflow run at all — a job-level
    # condition can never rescue that. Accepted cost: docs-only merges run
    # full CI and ride the normal staging deploy. The per-job path
    # classification below still keeps those runs cheap.
  pull_request:
    branches: [main, dev]

concurrency:
  # Keep daily/manual backstops from cancelling a deployment-triggering push.
  group: ci-v2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.0"
  UV_SYSTEM_PYTHON: 1
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  changes:
    name: Classify Changes
    runs-on: [self-hosted, Linux, ci-general]
    outputs:
      backend: ${{ steps.validate.outputs.backend }}
      frontend: ${{ steps.validate.outputs.frontend }}
      oncall: ${{ steps.validate.outputs.oncall }}
      docker_shared: ${{ steps.validate.outputs.docker_shared }}
      python_tests: ${{ steps.validate.outputs.python_tests }}
      docs: ${{ steps.validate.outputs.docs }}
      tutorial_e2e: ${{ steps.validate.outputs.tutorial_e2e }}
      security_only: ${{ steps.validate.outputs.security_only }}
      full: ${{ steps.validate.outputs.full }}
      docker_matrix: ${{ steps.validate.outputs.docker_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so base...head / before..sha diffs resolve; matches
          # the shallow-clone workaround used by every other job here.
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          python3 ops/ci/classify_changes.py \
            --event-name "${EVENT_NAME}" \
            --pr-base "${PR_BASE_SHA}" \
            --pr-head "${PR_HEAD_SHA}" \
            --push-before "${PUSH_BEFORE}" \
            --push-sha "${PUSH_SHA}" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Validate classifier outputs
        id: validate
        env:
          CLASSIFICATION_JSON: >-
            {"backend":${{ toJSON(steps.classify.outputs.backend) }},
            "frontend":${{ toJSON(steps.classify.outputs.frontend) }},
            "oncall":${{ toJSON(steps.classify.outputs.oncall) }},
            "docker_shared":${{ toJSON(steps.classify.outputs.docker_shared) }},
            "python_tests":${{ toJSON(steps.classify.outputs.python_tests) }},
            "docs":${{ toJSON(steps.classify.outputs.docs) }},
            "tutorial_e2e":${{ toJSON(steps.classify.outputs.tutorial_e2e) }},
            "security_only":${{ toJSON(steps.classify.outputs.security_only) }},
            "full":${{ toJSON(steps.classify.outputs.full) }},
            "docker_matrix":${{ toJSON(steps.classify.outputs.docker_matrix) }}}
        run: |
          python3 ops/ci/verify_ci_gate.py validate-classification \
            --classification-json "${CLASSIFICATION_JSON}" \
            --github-output "${GITHUB_OUTPUT}"

  backend-quality:
    name: Backend Quality
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.backend == 'true')
    runs-on: [self-hosted, Linux, ci-general]
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Isolate uv cache dir
        # Set via GITHUB_ENV because job-level env cannot use the runner
        # context. The default ~/.cache/uv is shared by every runner process on
        # the machine, and an entry vanishing mid-install fails the job with
        # ENOENT while uv hardlinks into the venv — before tests start.
        #
        # RUNNER_TEMP is the whole isolation: it belongs to one runner process
        # (.../actions-runners/spark2_5/_work/_temp), and a runner runs one job
        # at a time. Nothing run-specific may go in this path — see the note on
        # `enable-cache` below.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          # This only caches while UV_CACHE_DIR is stable across runs. The
          # cache service derives an entry's version from the paths it covers,
          # so a path holding GITHUB_RUN_ID misses on every restore and
          # uploads a fresh copy every time. It did: three consecutive runs
          # asked for key `setup-uv-2-aarch64-...-018060ae` and all three were
          # told "No GitHub Actions cache found" — an identical key missing is
          # the version differing, which is the path.
          enable-cache: true
          # Still disable prune: even with UV_CACHE_DIR off the shared default,
          # prune --ci is unnecessary on self-hosted and has raced with other
          # installs.
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          uv venv
          # Bounded retry for residual install-time cache ENOENT.
          for attempt in 1 2 3; do
            if uv sync --group dev; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "uv sync failed (attempt ${attempt}/3); retrying..." >&2
              sleep $((attempt * 2))
            fi
          done
          echo "uv sync failed after 3 attempts" >&2
          exit 1

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run Ruff lint
        run: uv run ruff check --no-fix .

      - name: Run pydocstyle
        run: uv run pydocstyle --match-dir='^((?!(tests|\.venv|node_modules|apps/frontend|ops|docs)).)*$'

  frontend-quality:
    name: Frontend Quality
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.frontend == 'true')
    runs-on: [self-hosted, Linux, ci-general]
    defaults:
      run:
        working-directory: ./apps/frontend
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run type-check

      - name: Run frontend tests
        run: npm run test

      # Keep the audit fail-closed, but run it last so an upstream advisory
      # does not suppress formatting, lint, type-check, and test results.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docs-build:
    name: Docs Build
    needs: changes
    # The whole job is a dependency install plus one sphinx-build that takes
    # seconds; without this it would inherit the 360-minute default and could
    # hold a shared self-hosted runner for hours if a step hangs.
    timeout-minutes: 5
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.docs == 'true')
    runs-on: [self-hosted, Linux, ci-general]
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases, which has been failing random jobs at checkout.
          fetch-depth: 0

      - name: Isolate uv cache dir
        # Off the shared ~/.cache/uv, which concurrent self-hosted jobs race on
        # while hardlinking into the venv. Stable across runs — see the note on
        # `enable-cache` in Backend Quality.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          # Own key namespace: this job's venv holds only the `dev` group, so
          # sharing the `venv-` key with the jobs that install the full
          # application closure would let whichever job misses first publish a
          # venv the others then have to repair.
          key: docs-venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            docs-venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        # --only-group: this job runs sphinx-build and nothing else, so it
        # needs the `dev` group (which carries sphinx, myst-parser and
        # sphinx-rtd-theme) but not the project or its runtime dependencies,
        # which this job never imports.
        run: |
          set -euo pipefail
          uv venv
          # Bounded retry for residual install-time cache ENOENT.
          for attempt in 1 2 3; do
            if uv sync --only-group dev; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "uv sync failed (attempt ${attempt}/3); retrying..." >&2
              sleep $((attempt * 2))
            fi
          done
          echo "uv sync failed after 3 attempts" >&2
          exit 1

      - name: Build developer docs and verify translations
        # `make docs-verify` is `make docs` (which builds every published
        # language, English at the tree root and each translation beneath it)
        # plus the translation checker. Going through the Makefile rather than
        # repeating the sphinx-build command here is what keeps this job and a
        # contributor's local run from drifting apart.
        #
        # The `-W` that `make docs` passes is the same one the published site
        # builds with, so a toctree or xref break fails here rather than
        # silently leaving the site stale. The checker covers what `-W` cannot
        # see: a translation reverts to English silently, so a stale or missing
        # catalog builds perfectly clean. Sphinx, myst-parser and
        # sphinx-rtd-theme come from the `dev` dependency group, so the
        # versions track uv.lock.
        #
        # --no-sync: plain `uv run` would re-sync the environment and pull the
        # full project closure back in, undoing the narrowed install above.
        run: make docs-verify UV_RUN="uv run --no-sync"

  test:
    # No custom name: skipped jobs do not expand matrix expressions in names;
    # the default job-id name renders cleanly before matrix expansion.
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.python_tests == 'true')
    # Service containers need Docker socket access; keep these jobs off the
    # generic pool that includes gpu1, which lacks that access.
    runs-on: [self-hosted, Linux, ci-general]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybridinference_test_db
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Isolate uv cache dir
        # Same path, and deliberately the same for every shard: RUNNER_TEMP
        # already belongs to one runner process running one job at a time, so
        # the shard number added nothing to the isolation and cost all four
        # shards their cache. See the note on `enable-cache` in Backend
        # Quality for why nothing run-specific belongs in this path.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # Still disable prune: even with UV_CACHE_DIR off the shared default,
          # prune --ci is unnecessary on self-hosted and has raced with other
          # installs.
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          uv venv
          # Bounded retry for residual install-time cache ENOENT.
          for attempt in 1 2 3; do
            if uv sync --group dev; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "uv sync failed (attempt ${attempt}/3); retrying..." >&2
              sleep $((attempt * 2))
            fi
          done
          echo "uv sync failed after 3 attempts" >&2
          exit 1

      - name: Select pytest worker budget
        env:
          CI_RUNNER_NAME: ${{ runner.name }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          # Four runner services share each physical host: 20 CPUs on ARM64
          # and 8 CPUs on X64. Keep their combined pytest budget within that.
          case "${CI_RUNNER_ARCH}" in
            ARM64) pytest_workers=5 ;;
            X64) pytest_workers=2 ;;
            *)
              pytest_workers=2
              echo "::warning title=Unknown runner architecture::Using conservative pytest worker budget for ${CI_RUNNER_ARCH}"
              ;;
          esac

          runner_hostname="$(hostname)"
          if command -v nproc >/dev/null 2>&1; then
            visible_cpus="$(nproc)"
          else
            visible_cpus="$(getconf _NPROCESSORS_ONLN)"
          fi
          echo "PYTEST_WORKERS=${pytest_workers}" >> "${GITHUB_ENV}"

          echo "pytest worker budget: runner=${CI_RUNNER_NAME} arch=${CI_RUNNER_ARCH} hostname=${runner_hostname} visible_cpus=${visible_cpus} workers=${pytest_workers}"
          {
            echo "### Pytest worker budget"
            echo
            echo "| Runner | Architecture | Hostname | Visible CPUs | Workers |"
            echo "| --- | --- | --- | ---: | ---: |"
            echo "| ${CI_RUNNER_NAME} | ${CI_RUNNER_ARCH} | ${runner_hostname} | ${visible_cpus} | ${pytest_workers} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Prepare pytest shard
        id: pytest-shard
        env:
          PYTEST_SHARD: ${{ matrix.shard }}
          PYTEST_SHARDS: "4"
          PYTEST_SHARD_FILE: ${{ runner.temp }}/pytest-shard-${{ matrix.shard }}.txt
        run: |
          uv run python ops/ci/partition_pytest_files.py \
            --shard-index "${PYTEST_SHARD}" \
            --shard-count "${PYTEST_SHARDS}" \
            --output "${PYTEST_SHARD_FILE}"
          cat "${PYTEST_SHARD_FILE}"
          echo "file=${PYTEST_SHARD_FILE}" >> "${GITHUB_OUTPUT}"
          if [ -s "${PYTEST_SHARD_FILE}" ]; then
            echo "has_tests=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_tests=false" >> "${GITHUB_OUTPUT}"
            echo "No tests selected for this shard"
          fi

      - name: Run tests (PR/manual, sharded, no coverage)
        if: github.event_name != 'push' && steps.pytest-shard.outputs.has_tests == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # Database configuration for auth tests
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          DB_NAME: hybridinference_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          # Auth system configuration
          JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
          SIGNUP_ENABLED: "1"
          SIGNUP_DEFAULT_TIER: free
          SIGNUP_DEFAULT_DAILY_QUOTA_USD: "100.00"
          SIGNUP_REQUIRE_EMAIL_VERIFICATION: "0"
          COOKIE_SECURE: "0"
          COOKIE_SAMESITE: lax
          BASE_URL: http://localhost:8000
        run: |
          mapfile -t pytest_files < "${{ steps.pytest-shard.outputs.file }}"
          uv run pytest -n "${PYTEST_WORKERS}" --dist=loadfile -v -m "not external" "${pytest_files[@]}"

      - name: Run tests (push, coverage shard)
        if: github.event_name == 'push' && steps.pytest-shard.outputs.has_tests == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # Database configuration for auth tests
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          DB_NAME: hybridinference_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          # Auth system configuration
          JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
          SIGNUP_ENABLED: "1"
          SIGNUP_DEFAULT_TIER: free
          SIGNUP_DEFAULT_DAILY_QUOTA_USD: "100.00"
          SIGNUP_REQUIRE_EMAIL_VERIFICATION: "0"
          COOKIE_SECURE: "0"
          COOKIE_SAMESITE: lax
          BASE_URL: http://localhost:8000
          PYTEST_SHARD: ${{ matrix.shard }}
          PYTEST_FILE_DURATIONS_OUTPUT: ${{ runner.temp }}/pytest-file-durations-${{ matrix.shard }}.json
        run: |
          mapfile -t pytest_files < "${{ steps.pytest-shard.outputs.file }}"
          uv run pytest \
            -p ops.ci.pytest_file_durations \
            -n "${PYTEST_WORKERS}" \
            --dist=loadfile \
            --cov=. \
            --cov-report=term-missing \
            --cov-report="xml:coverage-${PYTEST_SHARD}.xml" \
            -v \
            -m "not external" \
            "${pytest_files[@]}"

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && steps.pytest-shard.outputs.has_tests == 'true'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage-${{ matrix.shard }}.xml
          flags: backend-shard-${{ matrix.shard }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload pytest file durations
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-file-durations-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest-file-durations-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  security:
    name: Security Scan
    runs-on: [self-hosted, Linux, ci-general]
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="x64" ;;
            aarch64|arm64) arch="arm64" ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          asset="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base_url}/${asset}"
          curl -fsSLO "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  ${asset}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" > gitleaks.sha256
          sha256sum -c gitleaks.sha256
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --no-git --redact --verbose --no-banner

      - name: Isolate uv cache dir
        # Job-level env cannot use the runner context; set via GITHUB_ENV.
        # This job does not enable the remote cache, so the run id here cost
        # nothing — it is dropped anyway so the pattern is not copied into a
        # job that does.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Security audit
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          uv export --no-dev --no-hashes --format requirements-txt -o /tmp/audit-requirements.txt
          uvx --python ${{ env.PYTHON_VERSION }} pip-audit --progress-spinner off --no-deps --disable-pip -r /tmp/audit-requirements.txt

  docker-build:
    # No custom name: skipped jobs do not expand matrix expressions in names;
    # the default job-id name renders cleanly before matrix expansion.
    needs: changes
    # PRs build only affected images. Scheduled/manual runs build all images,
    # while branch pushes leave image publishing to the deployment pipeline.
    # A classifier failure fails open to all images; CI Gate still fails closed.
    if: >-
      always() &&
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.docker_matrix != '[]')
    # Buildx needs Docker daemon access; pin image verification to ARM64.
    runs-on: [self-hosted, Linux, ARM64, image-verify-arm64]
    strategy:
      fail-fast: false
      matrix:
        # The fallback keeps the matrix non-empty even when the PR job-level
        # condition skips it. It also safely builds all images if outputs are
        # unavailable or malformed.
        image: ${{ fromJSON(needs.changes.outputs.docker_matrix != '' && needs.changes.outputs.docker_matrix != '[]' && needs.changes.outputs.docker_matrix || '["frontend","backend","oncall"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch avoids the intermittent unresolved-delta failures seen
          # with shallow clones on the self-hosted runner pool.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        id: build
        # A transient buildkit/runner recycle can surface as graceful_stop.
        # Recreate the builder and retry once before failing the matrix cell.
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image }}
          push: false
          # The backend cell immediately runs the documented example against
          # this exact image. Other cells only need build verification.
          load: ${{ matrix.image == 'backend' }}
          tags: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}

      - name: Set up Docker Buildx (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image }}
          push: false
          load: ${{ matrix.image == 'backend' }}
          tags: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}

      - name: Select runnable example port
        if: matrix.image == 'backend'
        run: |
          port="$(python3 -c 'import socket; sock = socket.socket(); sock.bind(("127.0.0.1", 0)); print(sock.getsockname()[1]); sock.close()')"
          test -n "${port}"
          echo "BACKEND_PORT=${port}" >> "${GITHUB_ENV}"

      - name: Start runnable router example
        id: example-up
        if: matrix.image == 'backend'
        env:
          COMPOSE_PROJECT_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}
          EXAMPLE_BACKEND_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-backend
          EXAMPLE_PROVIDER_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-provider
        run: make up DISTRIBUTION=example

      - name: Smoke runnable router example
        id: example-smoke
        if: matrix.image == 'backend'
        env:
          EXAMPLE_BACKEND_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-backend
        run: |
          port="$(docker container inspect --format '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          test "${port}" = "${BACKEND_PORT}"
          SMOKE_BASE_URL="http://localhost:${port}" make smoke DISTRIBUTION=example

      - name: Show runnable example logs
        if: >-
          always() && matrix.image == 'backend' &&
          (steps.example-up.outcome == 'failure' || steps.example-smoke.outcome == 'failure')
        env:
          EXAMPLE_BACKEND_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-backend
          EXAMPLE_PROVIDER_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-provider
        run: |
          docker logs "${EXAMPLE_BACKEND_CONTAINER_NAME}" || true
          docker logs "${EXAMPLE_PROVIDER_CONTAINER_NAME}" || true

      - name: Stop runnable router example
        if: always() && matrix.image == 'backend'
        env:
          COMPOSE_PROJECT_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}
          EXAMPLE_BACKEND_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-backend
          EXAMPLE_PROVIDER_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-provider
        run: |
          make down DISTRIBUTION=example || true
          docker image rm \
            "${COMPOSE_PROJECT_NAME}-backend" \
            "${COMPOSE_PROJECT_NAME}-example-provider" || true

  tutorial-e2e:
    name: Tutorial E2E
    needs: changes
    # This two-image integration run stays classifier-driven on pushes as well
    # as PRs. Scheduled/manual runs and classifier failures select `full`, so
    # they still exercise the complete tutorial fail-open.
    if: >-
      always() &&
      (needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.tutorial_e2e == 'true')
    runs-on: [self-hosted, Linux, ARM64, image-verify-arm64]
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: hi-tutorial-${{ github.run_id }}-${{ github.run_attempt }}
      EXAMPLE_BACKEND_CONTAINER_NAME: hi-tutorial-${{ github.run_id }}-${{ github.run_attempt }}-backend
      EXAMPLE_PROVIDER_CONTAINER_NAME: hi-tutorial-${{ github.run_id }}-${{ github.run_attempt }}-provider
      EXAMPLE_FRONTEND_CONTAINER_NAME: hi-tutorial-${{ github.run_id }}-${{ github.run_attempt }}-frontend
      EXAMPLE_POSTGRES_CONTAINER_NAME: hi-tutorial-${{ github.run_id }}-${{ github.run_attempt }}-postgres
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select tutorial ports
        id: tutorial-port
        run: |
          ports="$(python3 -c 'import socket; sockets = [socket.socket() for _ in range(3)]; [sock.bind(("127.0.0.1", 0)) for sock in sockets]; print(*(sock.getsockname()[1] for sock in sockets)); [sock.close() for sock in sockets]')"
          read -r backend_port frontend_port db_port <<< "${ports}"
          test -n "${backend_port}"
          test -n "${frontend_port}"
          test -n "${db_port}"
          {
            echo "BACKEND_PORT=${backend_port}"
            echo "FRONTEND_PORT=${frontend_port}"
            echo "DB_PORT=${db_port}"
            echo "EXAMPLE_RESET_STATE_FILE=${RUNNER_TEMP}/hi-tutorial-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-reset.json"
          } >> "${GITHUB_ENV}"
          echo "frontend_port=${frontend_port}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build exact tutorial backend image
        id: tutorial-backend-build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          push: false
          load: true
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-backend
          cache-from: |
            type=gha,scope=backend
            type=gha,scope=tutorial-e2e-backend
          cache-to: type=gha,mode=min,scope=tutorial-e2e-backend

      - name: Set up Docker Buildx for backend retry
        if: steps.tutorial-backend-build.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Build exact tutorial backend image (retry)
        if: steps.tutorial-backend-build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          push: false
          load: true
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-backend
          cache-from: |
            type=gha,scope=backend
            type=gha,scope=tutorial-e2e-backend
          cache-to: type=gha,mode=min,scope=tutorial-e2e-backend

      - name: Build exact same-origin tutorial frontend image
        id: tutorial-frontend-build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend
          push: false
          load: true
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-frontend
          build-args: |
            NEXT_PUBLIC_API_BASE=
            BACKEND_INTERNAL_URL=http://backend:8080
            NEXT_PUBLIC_APP_NAME=Example Router
            NEXT_PUBLIC_EXAMPLE_API_BASE=http://localhost:${{ steps.tutorial-port.outputs.frontend_port }}
            NEXT_PUBLIC_EXAMPLE_MODEL=example-chat
            NEXT_PUBLIC_STORAGE_KEY_PREFIX=hybridinference-example
          cache-from: |
            type=gha,scope=frontend
            type=gha,scope=tutorial-e2e-frontend
          cache-to: type=gha,mode=min,scope=tutorial-e2e-frontend

      - name: Set up Docker Buildx for frontend retry
        if: steps.tutorial-frontend-build.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Build exact same-origin tutorial frontend image (retry)
        if: steps.tutorial-frontend-build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.frontend
          push: false
          load: true
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-frontend
          build-args: |
            NEXT_PUBLIC_API_BASE=
            BACKEND_INTERNAL_URL=http://backend:8080
            NEXT_PUBLIC_APP_NAME=Example Router
            NEXT_PUBLIC_EXAMPLE_API_BASE=http://localhost:${{ steps.tutorial-port.outputs.frontend_port }}
            NEXT_PUBLIC_EXAMPLE_MODEL=example-chat
            NEXT_PUBLIC_STORAGE_KEY_PREFIX=hybridinference-example
          cache-from: |
            type=gha,scope=frontend
            type=gha,scope=tutorial-e2e-frontend
          cache-to: type=gha,mode=min,scope=tutorial-e2e-frontend

      - name: Start tutorial Stage 1
        id: tutorial-up
        run: make up DISTRIBUTION=example

      - name: Smoke tutorial Stage 1 and record container state
        id: stage1-state
        run: |
          port="$(docker container inspect --format '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          test "${port}" = "${BACKEND_PORT}"
          SMOKE_BASE_URL="http://localhost:${port}" make smoke DISTRIBUTION=example

          for absent in "${EXAMPLE_FRONTEND_CONTAINER_NAME}" "${EXAMPLE_POSTGRES_CONTAINER_NAME}"; do
            if docker container inspect "${absent}" >/dev/null 2>&1; then
              echo "Stage 1 unexpectedly started ${absent}" >&2
              exit 1
            fi
          done
          if docker volume inspect \
            "${COMPOSE_PROJECT_NAME}_example_postgres_data" >/dev/null 2>&1; then
            echo "Stage 1 unexpectedly created the example database volume" >&2
            exit 1
          fi

          registry="distributions/example/config/models.yaml"
          registry_backup="${RUNNER_TEMP}/tutorial-models-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.yaml"
          cp "${registry}" "${registry_backup}"
          restore_registry() {
            cp "${registry_backup}" "${registry}"
            make restart s=backend DISTRIBUTION=example >/dev/null 2>&1 || true
            rm -f "${registry_backup}"
          }
          trap restore_registry EXIT

          backend_image_before="$(docker container inspect --format '{{.Image}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          sed -i 's/name: Runnable Example Chat/name: Reloaded Example Chat/' "${registry}"
          grep -q 'name: Reloaded Example Chat' "${registry}"
          make restart s=backend DISTRIBUTION=example
          for _ in $(seq 1 30); do
            if models_json="$(curl --fail --silent "http://localhost:${port}/v1/models")" && \
              python3 -c 'import json, sys; assert json.load(sys.stdin)["data"][0]["name"] == "Reloaded Example Chat"' <<< "${models_json}"; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "http://localhost:${port}/v1/models" | \
            python3 -c 'import json, sys; assert json.load(sys.stdin)["data"][0]["name"] == "Reloaded Example Chat"'
          backend_image_after="$(docker container inspect --format '{{.Image}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          test "${backend_image_after}" = "${backend_image_before}"

          cp "${registry_backup}" "${registry}"
          make restart s=backend DISTRIBUTION=example
          rm -f "${registry_backup}"
          trap - EXIT
          SMOKE_BASE_URL="http://localhost:${port}" make smoke DISTRIBUTION=example

          provider_id="$(docker container inspect --format '{{.Id}}' "${EXAMPLE_PROVIDER_CONTAINER_NAME}")"
          backend_container_id="$(docker container inspect --format '{{.Id}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          backend_image_id="$(docker container inspect --format '{{.Image}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          loaded_backend_image_id="$(docker image inspect --format '{{.Id}}' "${COMPOSE_PROJECT_NAME}-backend")"
          test "${backend_image_id}" = "${loaded_backend_image_id}"
          {
            echo "provider_id=${provider_id}"
            echo "backend_container_id=${backend_container_id}"
            echo "backend_image_id=${backend_image_id}"
          } >> "${GITHUB_OUTPUT}"

      - name: Promote Stage 1 to the full local demo
        id: demo-up
        run: |
          make demo DISTRIBUTION=example

          provider_id="$(docker container inspect --format '{{.Id}}' "${EXAMPLE_PROVIDER_CONTAINER_NAME}")"
          backend_container_id="$(docker container inspect --format '{{.Id}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          backend_image_id="$(docker container inspect --format '{{.Image}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          frontend_image_id="$(docker container inspect --format '{{.Image}}' "${EXAMPLE_FRONTEND_CONTAINER_NAME}")"
          loaded_frontend_image_id="$(docker image inspect --format '{{.Id}}' "${COMPOSE_PROJECT_NAME}-frontend")"

          test "${provider_id}" = "${{ steps.stage1-state.outputs.provider_id }}"
          test "${backend_container_id}" != "${{ steps.stage1-state.outputs.backend_container_id }}"
          test "${backend_image_id}" = "${{ steps.stage1-state.outputs.backend_image_id }}"
          test "${frontend_image_id}" = "${loaded_frontend_image_id}"
          docker container inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}" | grep -qx 'DB_ENABLED=true'
          docker container inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}" | grep -qx 'USER_AUTH_ENABLED=true'

      - name: Smoke the full local demo
        id: demo-smoke
        run: |
          port="$(docker container inspect --format '{{(index (index .NetworkSettings.Ports "3001/tcp") 0).HostPort}}' "${EXAMPLE_FRONTEND_CONTAINER_NAME}")"
          test "${port}" = "${FRONTEND_PORT}"
          test ! -e "${EXAMPLE_RESET_STATE_FILE}"
          DEMO_SMOKE_STATE_FILE="${EXAMPLE_RESET_STATE_FILE}" \
            DEMO_BASE_URL="http://localhost:${port}" \
            make demo-smoke DISTRIBUTION=example

      - name: Preserve state across full stop and resume
        id: demo-resume-smoke
        run: |
          volume="${COMPOSE_PROJECT_NAME}_example_postgres_data"
          volume_created_at="$(docker volume inspect --format '{{.CreatedAt}}' "${volume}")"
          test -n "${volume_created_at}"

          docker logs "${EXAMPLE_PROVIDER_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-provider.log" 2>&1 || true
          docker logs "${EXAMPLE_POSTGRES_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-postgres.log" 2>&1 || true
          docker logs "${EXAMPLE_BACKEND_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-backend.log" 2>&1 || true
          docker logs "${EXAMPLE_FRONTEND_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-frontend.log" 2>&1 || true

          make demo-down DISTRIBUTION=example
          docker volume inspect "${volume}" >/dev/null
          for removed in \
            "${EXAMPLE_PROVIDER_CONTAINER_NAME}" \
            "${EXAMPLE_POSTGRES_CONTAINER_NAME}" \
            "${EXAMPLE_BACKEND_CONTAINER_NAME}" \
            "${EXAMPLE_FRONTEND_CONTAINER_NAME}"; do
            if docker container inspect "${removed}" >/dev/null 2>&1; then
              echo "demo-down left ${removed} behind" >&2
              exit 1
            fi
          done

          make demo DISTRIBUTION=example
          test "$(docker volume inspect --format '{{.CreatedAt}}' "${volume}")" = "${volume_created_at}"
          port="$(docker container inspect --format '{{(index (index .NetworkSettings.Ports "3001/tcp") 0).HostPort}}' "${EXAMPLE_FRONTEND_CONTAINER_NAME}")"
          test "${port}" = "${FRONTEND_PORT}"
          DEMO_SMOKE_EXPECT_STATE_FILE="${EXAMPLE_RESET_STATE_FILE}" \
            DEMO_BASE_URL="http://localhost:${port}" \
            make demo-smoke DISTRIBUTION=example

      - name: Route Stage 3 through a host-side local provider
        id: stage3-local-provider
        run: |
          fixture_log="${RUNNER_TEMP}/tutorial-host-provider.log"
          fixture_pid=""

          stop_fixture() {
            if test -n "${fixture_pid}"; then
              kill "${fixture_pid}" 2>/dev/null || true
              wait "${fixture_pid}" 2>/dev/null || true
            fi
          }
          trap stop_fixture EXIT

          host_provider_port="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
          test -n "${host_provider_port}"
          python3 distributions/example/fixtures/fake-openai-provider/server.py \
            --host 0.0.0.0 \
            --port "${host_provider_port}" \
            --response-text STAGE3_HOST_FIXTURE_OK \
            --expected-model host-fixture-model \
            --expected-api-key local-placeholder \
            > "${fixture_log}" 2>&1 &
          fixture_pid="$!"

          for _ in $(seq 1 30); do
            if curl --fail --silent \
              "http://127.0.0.1:${host_provider_port}/health" >/dev/null; then
              break
            fi
            kill -0 "${fixture_pid}"
            sleep 1
          done
          curl --fail --silent --show-error \
            "http://127.0.0.1:${host_provider_port}/health" >/dev/null

          export EXAMPLE_UPSTREAM_BASE_URL="http://host.docker.internal:${host_provider_port}/v1"
          export EXAMPLE_UPSTREAM_API_KEY="local-placeholder"
          export EXAMPLE_UPSTREAM_MODEL="host-fixture-model"
          export EXAMPLE_EXPECTED_CONTENT="STAGE3_HOST_FIXTURE_OK"
          make demo DISTRIBUTION=example

          backend_env="$(docker container inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          grep -qx "EXAMPLE_UPSTREAM_BASE_URL=${EXAMPLE_UPSTREAM_BASE_URL}" <<< "${backend_env}"
          grep -qx "EXAMPLE_UPSTREAM_API_KEY=${EXAMPLE_UPSTREAM_API_KEY}" <<< "${backend_env}"
          grep -qx "EXAMPLE_UPSTREAM_MODEL=${EXAMPLE_UPSTREAM_MODEL}" <<< "${backend_env}"

          port="$(docker container inspect --format '{{(index (index .NetworkSettings.Ports "3001/tcp") 0).HostPort}}' "${EXAMPLE_FRONTEND_CONTAINER_NAME}")"
          test "${port}" = "${FRONTEND_PORT}"
          EXAMPLE_DEMO_EXPECT_EXISTING=1 \
            DEMO_BASE_URL="http://localhost:${port}" \
            make demo-smoke DISTRIBUTION=example

      - name: Verify destructive reset isolation
        id: demo-reset-smoke
        run: |
          test -f "${EXAMPLE_RESET_STATE_FILE}"
          docker logs "${EXAMPLE_PROVIDER_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-provider.log" 2>&1 || true
          docker logs "${EXAMPLE_POSTGRES_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-postgres.log" 2>&1 || true
          docker logs "${EXAMPLE_BACKEND_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-backend.log" 2>&1 || true
          docker logs "${EXAMPLE_FRONTEND_CONTAINER_NAME}" \
            > "${RUNNER_TEMP}/tutorial-frontend.log" 2>&1 || true
          make demo-reset DISTRIBUTION=example
          if docker volume inspect \
            "${COMPOSE_PROJECT_NAME}_example_postgres_data" >/dev/null 2>&1; then
            echo "example database volume survived demo-reset" >&2
            exit 1
          fi

          make demo DISTRIBUTION=example
          port="$(docker container inspect --format '{{(index (index .NetworkSettings.Ports "3001/tcp") 0).HostPort}}' "${EXAMPLE_FRONTEND_CONTAINER_NAME}")"
          test "${port}" = "${FRONTEND_PORT}"
          python3 distributions/example/full_smoke.py \
            --base-url "http://localhost:${port}" \
            --timeout 120 \
            --verify-reset-state "${EXAMPLE_RESET_STATE_FILE}"

      - name: Show tutorial E2E logs
        if: failure()
        run: |
          if test -f "${RUNNER_TEMP}/tutorial-host-provider.log"; then
            sed -n '1,100p' "${RUNNER_TEMP}/tutorial-host-provider.log"
          fi
          for snapshot in \
            "${RUNNER_TEMP}/tutorial-provider.log" \
            "${RUNNER_TEMP}/tutorial-postgres.log" \
            "${RUNNER_TEMP}/tutorial-backend.log" \
            "${RUNNER_TEMP}/tutorial-frontend.log"; do
            if test -f "${snapshot}"; then
              echo "Saved log: ${snapshot##*/}"
              sed -n '1,400p' "${snapshot}"
            fi
          done
          docker logs "${EXAMPLE_PROVIDER_CONTAINER_NAME}" || true
          docker logs "${EXAMPLE_POSTGRES_CONTAINER_NAME}" || true
          docker logs "${EXAMPLE_BACKEND_CONTAINER_NAME}" || true
          docker logs "${EXAMPLE_FRONTEND_CONTAINER_NAME}" || true

      - name: Reset tutorial E2E
        if: always()
        run: |
          if test -n "${EXAMPLE_RESET_STATE_FILE:-}"; then
            rm -f "${EXAMPLE_RESET_STATE_FILE}"
          fi
          make demo-reset DISTRIBUTION=example
          for leaked in \
            "${EXAMPLE_PROVIDER_CONTAINER_NAME}" \
            "${EXAMPLE_POSTGRES_CONTAINER_NAME}" \
            "${EXAMPLE_BACKEND_CONTAINER_NAME}" \
            "${EXAMPLE_FRONTEND_CONTAINER_NAME}"; do
            if docker container inspect "${leaked}" >/dev/null 2>&1; then
              echo "tutorial cleanup left ${leaked} behind" >&2
              exit 1
            fi
          done
          if docker volume inspect \
            "${COMPOSE_PROJECT_NAME}_example_postgres_data" >/dev/null 2>&1; then
            echo "tutorial cleanup left the example database volume behind" >&2
            exit 1
          fi
          if docker network inspect \
            "${COMPOSE_PROJECT_NAME}_hybridinference" >/dev/null 2>&1; then
            echo "tutorial cleanup left the example network behind" >&2
            exit 1
          fi
          docker image rm \
            "${COMPOSE_PROJECT_NAME}-backend" \
            "${COMPOSE_PROJECT_NAME}-frontend" \
            "${COMPOSE_PROJECT_NAME}-example-provider" || true
          test ! -e var
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  ci-gate:
    name: CI Gate
    if: always()
    runs-on: [self-hosted, Linux, ci-general]
    needs:
      - changes
      - backend-quality
      - frontend-quality
      - docs-build
      - test
      - security
      - docker-build
      - tutorial-e2e
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact required CI job results
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFICATION_JSON: >-
            {"backend":${{ toJSON(needs.changes.outputs.backend) }},
            "frontend":${{ toJSON(needs.changes.outputs.frontend) }},
            "oncall":${{ toJSON(needs.changes.outputs.oncall) }},
            "docker_shared":${{ toJSON(needs.changes.outputs.docker_shared) }},
            "python_tests":${{ toJSON(needs.changes.outputs.python_tests) }},
            "docs":${{ toJSON(needs.changes.outputs.docs) }},
            "tutorial_e2e":${{ toJSON(needs.changes.outputs.tutorial_e2e) }},
            "security_only":${{ toJSON(needs.changes.outputs.security_only) }},
            "full":${{ toJSON(needs.changes.outputs.full) }},
            "docker_matrix":${{ toJSON(needs.changes.outputs.docker_matrix) }}}
          JOB_RESULTS_JSON: >-
            {"changes":${{ toJSON(needs.changes.result) }},
            "backend-quality":${{ toJSON(needs.backend-quality.result) }},
            "frontend-quality":${{ toJSON(needs.frontend-quality.result) }},
            "docs-build":${{ toJSON(needs.docs-build.result) }},
            "test":${{ toJSON(needs.test.result) }},
            "security":${{ toJSON(needs.security.result) }},
            "docker-build":${{ toJSON(needs.docker-build.result) }},
            "tutorial-e2e":${{ toJSON(needs.tutorial-e2e.result) }}}
        run: |
          python3 ops/ci/verify_ci_gate.py verify-gate \
            --event-name "${EVENT_NAME}" \
            --classification-json "${CLASSIFICATION_JSON}" \
            --job-results-json "${JOB_RESULTS_JSON}"

  # ---- Backend candidate publishing --------------------------------------
  # Every green dev push publishes its backend candidate image so the
  # distribution repository's bump bot always finds a digest for dev HEAD
  # (W4 of the repo-split plan). Deliberately unconditional on path
  # classification: a docs-only push still gets a candidate — the bump bot
  # pins exact SHAs and would otherwise wait forever on one.
  #
  # Multi-arch is built as two NATIVE builds stitched into one manifest
  # list, never QEMU emulation: the amd64 half under qemu-user on the arm64
  # runner segfaulted `uv sync` instantly (dev@2e4edfa4, exit 139 —
  # qemu-user cannot run uv's static binary). Each half pushes by digest
  # with no tag; the stitch job below is the only thing that creates the
  # dev-<sha> tags, so a tag's existence still means "complete candidate".
  #
  # Gate shape (all publish jobs): !cancelled() suppresses the implicit
  # success() GitHub prepends to any job `if` lacking a status function.
  # Implicit success() evaluates the WHOLE transitive needs chain — and
  # docker-build, an ancestor via ci-gate, is legitimately skipped on many
  # pushes, which silently skipped publishing (observed on dev@04b4f305).
  # The explicit result checks are the real gate. The precheck's RESULT is
  # deliberately not required: if it failed, its empty output simply means
  # "build" — the safe direction.
  publish-backend-precheck:
    name: Publish backend candidate (precheck)
    # ONE existence query, shared by both arch builds and the stitch. When
    # each job asked the Packages API independently, the answers could
    # disagree — only ever through a transient API error, since nothing
    # mints the tag between the checks — and a disagreement wedged the
    # pipeline: the erring side built, the other side skipped, and the
    # stitch had neither a full digest pair nor an existing verdict it
    # trusted (the round-1 P2). A single verdict makes that impossible.
    # Query errors deliberately report "no candidate" (fail-open): the cost
    # is an idempotent rebuild + re-tag of identical content, never a wrong
    # publish.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.ci-gate.result == 'success' }}
    needs: [ci-gate]
    runs-on: [self-hosted, Linux, arm64-docker]
    timeout-minutes: 5
    outputs:
      existing: ${{ steps.existing.outputs.digest }}
    steps:
      - name: Look up an existing candidate for this SHA
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest="$(gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/hybridinference-backend/versions?per_page=100" \
                    --jq ".[] | select(.metadata.container.tags[]? == \"dev-${GITHUB_SHA}\") | .name" 2>/dev/null | head -1 || true)"
          if [ -n "${digest}" ]; then
            echo "candidate dev-${GITHUB_SHA} already published (${digest}); downstream jobs will skip"
          else
            echo "no candidate for dev-${GITHUB_SHA} (or the lookup errored); downstream jobs will build"
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  publish-backend-arm64:
    name: Publish backend candidate (arm64)
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.ci-gate.result == 'success' }}
    needs: [ci-gate, publish-backend-precheck]
    runs-on: [self-hosted, Linux, arm64-docker]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        if: needs.publish-backend-precheck.outputs.existing == ''
        with:
          # Full fetch avoids the intermittent unresolved-delta failures seen
          # with shallow clones on the self-hosted runner pool.
          fetch-depth: 0

      - name: Set up Docker Buildx
        if: needs.publish-backend-precheck.outputs.existing == ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.publish-backend-precheck.outputs.existing == ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (native arm64)
        if: needs.publish-backend-precheck.outputs.existing == ''
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          platforms: linux/arm64
          # Push by digest, no tags: the per-arch halves are anonymous until
          # the stitch job assembles them under the dev-<sha> tags.
          outputs: type=image,name=ghcr.io/harvardmadsys/hybridinference-backend,name-canonical=true,push-by-digest=true,push=true
          # The digest deploy and the bump gate both read the revision label
          # back and compare it against their SHA truth; a candidate without
          # it is refused at deploy time.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend-arm64
          cache-to: type=gha,mode=min,scope=backend-arm64

  publish-backend-amd64:
    name: Publish backend candidate (amd64)
    # Native twin of the arm64 half, on the dedicated x86_64 build runner
    # (rtx6000b-docker-1). Deliberately NOT on the production serving host:
    # a runner in the docker group is root-equivalent on its machine, so
    # builds live alongside the other CI-class workloads on rtx6000b, never
    # with production serving.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.ci-gate.result == 'success' }}
    needs: [ci-gate, publish-backend-precheck]
    runs-on: [self-hosted, Linux, x64-docker]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
        if: needs.publish-backend-precheck.outputs.existing == ''
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        if: needs.publish-backend-precheck.outputs.existing == ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.publish-backend-precheck.outputs.existing == ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (native amd64)
        if: needs.publish-backend-precheck.outputs.existing == ''
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/harvardmadsys/hybridinference-backend,name-canonical=true,push-by-digest=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend-amd64
          cache-to: type=gha,mode=min,scope=backend-amd64

  publish-backend:
    name: Publish backend candidate
    # The stitch: assemble both native halves into one manifest list under
    # the dev-<sha> tags. Keeps the historical job name — this is the job
    # whose success means "a complete candidate exists for this SHA", which
    # is what the bump bot's CI gate and humans both read. Requires BOTH
    # arch results explicitly: a half-published candidate must never get a
    # tag (the tag is the completeness signal). The skip verdict comes from
    # the precheck's single query, the same one the arch jobs obeyed.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.ci-gate.result == 'success' && needs.publish-backend-arm64.result == 'success' && needs.publish-backend-amd64.result == 'success' }}
    needs: [ci-gate, publish-backend-precheck, publish-backend-arm64, publish-backend-amd64]
    runs-on: [self-hosted, Linux, arm64-docker]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        if: needs.publish-backend-precheck.outputs.existing == ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stitch and tag the multi-arch manifest
        id: stitch
        env:
          ARM_DIGEST: ${{ needs.publish-backend-arm64.outputs.digest }}
          AMD_DIGEST: ${{ needs.publish-backend-amd64.outputs.digest }}
          EXISTING: ${{ needs.publish-backend-precheck.outputs.existing }}
        run: |
          set -euo pipefail
          img="ghcr.io/harvardmadsys/hybridinference-backend"
          short="${GITHUB_SHA:0:8}"
          if [ -n "${EXISTING}" ]; then
            echo "candidate dev-${GITHUB_SHA} already published (${EXISTING}); nothing to stitch"
            echo "digest=${EXISTING}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${ARM_DIGEST}" ] || [ -z "${AMD_DIGEST}" ]; then
            echo "::error title=Missing arch digest::arm64='${ARM_DIGEST}' amd64='${AMD_DIGEST}' — precheck said build, but an arch job produced no digest"
            exit 1
          fi
          # Full-SHA tag is what the bump bot resolves (an 8-char prefix is
          # not a SHA claim); the short tag stays for humans. imagetools
          # flattens the per-arch indexes (image + provenance manifests)
          # into one list; the revision-label walk is index-aware and
          # already proven against attestation children.
          docker buildx imagetools create \
            -t "${img}:dev-${GITHUB_SHA}" \
            -t "${img}:dev-${short}" \
            "${img}@${ARM_DIGEST}" \
            "${img}@${AMD_DIGEST}"
          index="$(docker buildx imagetools inspect "${img}:dev-${GITHUB_SHA}" --format '{{ json .Manifest.Digest }}' | tr -d '"')"
          echo "digest=${index}" >> "$GITHUB_OUTPUT"

      - name: Candidate summary
        env:
          EXISTING: ${{ needs.publish-backend-precheck.outputs.existing }}
          INDEX: ${{ steps.stitch.outputs.digest }}
        run: |
          {
            echo "## Backend candidate"
            echo ""
            echo "- source SHA: \`${GITHUB_SHA}\`"
            if [ -n "${EXISTING}" ]; then
              echo "- already published: \`ghcr.io/harvardmadsys/hybridinference-backend@${EXISTING}\`"
            else
              echo "- pushed multi-arch (arm64+amd64): \`ghcr.io/harvardmadsys/hybridinference-backend@${INDEX}\` (tag \`dev-${GITHUB_SHA:0:8}\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
