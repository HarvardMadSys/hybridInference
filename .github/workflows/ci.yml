name: CI

on:
  workflow_dispatch:
  schedule:
    # Daily full run is a backstop for mistakes in PR path classification.
    - cron: '23 18 * * *'
  push:
    branches: [main, dev, "murphy/dev/*"]
    # No paths-ignore on pushes (2026-08-19): every dev SHA must publish a
    # backend candidate for the distribution repo's bump bot, and a
    # path-filtered push creates no workflow run at all — a job-level
    # condition can never rescue that. Accepted cost: docs-only merges run
    # full CI and ride the normal staging deploy. The per-job path
    # classification below still keeps those runs cheap.
  pull_request:
    branches: [main, dev]

concurrency:
  # Keep daily/manual backstops from cancelling a deployment-triggering push.
  group: ci-v2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.0"
  UV_SYSTEM_PYTHON: 1
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  changes:
    name: Classify Changes
    runs-on: [self-hosted, Linux, ci-general]
    outputs:
      backend: ${{ steps.validate.outputs.backend }}
      frontend: ${{ steps.validate.outputs.frontend }}
      oncall: ${{ steps.validate.outputs.oncall }}
      status_monitor: ${{ steps.validate.outputs.status_monitor }}
      alert_control_plane: ${{ steps.validate.outputs.alert_control_plane }}
      docker_shared: ${{ steps.validate.outputs.docker_shared }}
      python_tests: ${{ steps.validate.outputs.python_tests }}
      docs: ${{ steps.validate.outputs.docs }}
      security_only: ${{ steps.validate.outputs.security_only }}
      full: ${{ steps.validate.outputs.full }}
      docker_matrix: ${{ steps.validate.outputs.docker_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so base...head / before..sha diffs resolve; matches
          # the shallow-clone workaround used by every other job here.
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          python3 ops/ci/classify_changes.py \
            --event-name "${EVENT_NAME}" \
            --pr-base "${PR_BASE_SHA}" \
            --pr-head "${PR_HEAD_SHA}" \
            --push-before "${PUSH_BEFORE}" \
            --push-sha "${PUSH_SHA}" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: Validate classifier outputs
        id: validate
        env:
          CLASSIFICATION_JSON: >-
            {"backend":${{ toJSON(steps.classify.outputs.backend) }},
            "frontend":${{ toJSON(steps.classify.outputs.frontend) }},
            "oncall":${{ toJSON(steps.classify.outputs.oncall) }},
            "status_monitor":${{ toJSON(steps.classify.outputs.status_monitor) }},
            "alert_control_plane":${{ toJSON(steps.classify.outputs.alert_control_plane) }},
            "docker_shared":${{ toJSON(steps.classify.outputs.docker_shared) }},
            "python_tests":${{ toJSON(steps.classify.outputs.python_tests) }},
            "docs":${{ toJSON(steps.classify.outputs.docs) }},
            "security_only":${{ toJSON(steps.classify.outputs.security_only) }},
            "full":${{ toJSON(steps.classify.outputs.full) }},
            "docker_matrix":${{ toJSON(steps.classify.outputs.docker_matrix) }}}
        run: |
          python3 ops/ci/verify_ci_gate.py validate-classification \
            --classification-json "${CLASSIFICATION_JSON}" \
            --github-output "${GITHUB_OUTPUT}"

  backend-quality:
    name: Backend Quality
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.backend == 'true')
    runs-on: [self-hosted, Linux, ci-general]
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Isolate uv cache dir
        # Set via GITHUB_ENV because job-level env cannot use the runner
        # context. The default ~/.cache/uv is shared by every runner process on
        # the machine, and an entry vanishing mid-install fails the job with
        # ENOENT while uv hardlinks into the venv — before tests start.
        #
        # RUNNER_TEMP is the whole isolation: it belongs to one runner process
        # (.../actions-runners/spark2_5/_work/_temp), and a runner runs one job
        # at a time. Nothing run-specific may go in this path — see the note on
        # `enable-cache` below.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          # This only caches while UV_CACHE_DIR is stable across runs. The
          # cache service derives an entry's version from the paths it covers,
          # so a path holding GITHUB_RUN_ID misses on every restore and
          # uploads a fresh copy every time. It did: three consecutive runs
          # asked for key `setup-uv-2-aarch64-...-018060ae` and all three were
          # told "No GitHub Actions cache found" — an identical key missing is
          # the version differing, which is the path.
          enable-cache: true
          # Still disable prune: even with UV_CACHE_DIR off the shared default,
          # prune --ci is unnecessary on self-hosted and has raced with other
          # installs.
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          uv venv
          # Bounded retry for residual install-time cache ENOENT.
          for attempt in 1 2 3; do
            if uv sync --group dev; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "uv sync failed (attempt ${attempt}/3); retrying..." >&2
              sleep $((attempt * 2))
            fi
          done
          echo "uv sync failed after 3 attempts" >&2
          exit 1

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run Ruff lint
        run: uv run ruff check --no-fix .

      - name: Run pydocstyle
        run: uv run pydocstyle --match-dir='^((?!(tests|\.venv|node_modules|apps/frontend|ops|docs)).)*$'

  frontend-quality:
    name: Frontend Quality
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.frontend == 'true')
    runs-on: [self-hosted, Linux, ci-general]
    defaults:
      run:
        working-directory: ./apps/frontend
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run type-check

      - name: Run frontend tests
        run: npm run test

      # Keep the audit fail-closed, but run it last so an upstream advisory
      # does not suppress formatting, lint, type-check, and test results.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docs-build:
    name: Docs Build
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.docs == 'true')
    runs-on: [self-hosted, Linux, ci-general]
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases, which has been failing random jobs at checkout.
          fetch-depth: 0

      - name: Isolate uv cache dir
        # Off the shared ~/.cache/uv, which concurrent self-hosted jobs race on
        # while hardlinking into the venv. Stable across runs — see the note on
        # `enable-cache` in Backend Quality.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          uv venv
          # Bounded retry for residual install-time cache ENOENT.
          for attempt in 1 2 3; do
            if uv sync --group dev; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "uv sync failed (attempt ${attempt}/3); retrying..." >&2
              sleep $((attempt * 2))
            fi
          done
          echo "uv sync failed after 3 attempts" >&2
          exit 1

      - name: Build internal docs (warnings are errors)
        # Mirrors the Cloudflare Pages build command for the `hybridinference`
        # project (internaldoc.freeinference.org), which runs `sphinx-build -W`
        # and therefore fails its deploy on any Sphinx warning. Preview
        # deployments are effectively disabled for non-production branches, so
        # without this job a broken toctree or xref only surfaces after merge,
        # as a stale site. Sphinx/myst-parser/sphinx-rtd-theme come from the
        # `dev` dependency group so the versions track uv.lock.
        run: uv run sphinx-build -b html docs/developer docs/build/html -W --keep-going

  alert-control-plane-check:
    name: Alert Service Quality
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.alert_control_plane == 'true')
    runs-on: [self-hosted, Linux, ci-general]
    defaults:
      run:
        working-directory: services/alert-control-plane-worker
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/alert-control-plane-worker/package-lock.json

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Run TypeScript check
        if: always() && steps.dependencies.outcome == 'success'
        run: npm run typecheck

      - name: Run tests
        if: always() && steps.dependencies.outcome == 'success'
        run: npm test

      - name: Run Wrangler deployment dry run
        if: always() && steps.dependencies.outcome == 'success'
        run: npm exec -- wrangler deploy --dry-run --config wrangler.example.toml

  test:
    # No custom name: skipped jobs do not expand matrix expressions in names;
    # the default job-id name renders cleanly before matrix expansion.
    needs: changes
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.python_tests == 'true')
    # Service containers need Docker socket access; keep these jobs off the
    # generic pool that includes gpu1, which lacks that access.
    runs-on: [self-hosted, Linux, ci-general]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybridinference_test_db
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Isolate uv cache dir
        # Same path, and deliberately the same for every shard: RUNNER_TEMP
        # already belongs to one runner process running one job at a time, so
        # the shard number added nothing to the isolation and cost all four
        # shards their cache. See the note on `enable-cache` in Backend
        # Quality for why nothing run-specific belongs in this path.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # Still disable prune: even with UV_CACHE_DIR off the shared default,
          # prune --ci is unnecessary on self-hosted and has raced with other
          # installs.
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          uv venv
          # Bounded retry for residual install-time cache ENOENT.
          for attempt in 1 2 3; do
            if uv sync --group dev; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "uv sync failed (attempt ${attempt}/3); retrying..." >&2
              sleep $((attempt * 2))
            fi
          done
          echo "uv sync failed after 3 attempts" >&2
          exit 1

      - name: Select pytest worker budget
        env:
          CI_RUNNER_NAME: ${{ runner.name }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          # Four runner services share each physical host: 20 CPUs on ARM64
          # and 8 CPUs on X64. Keep their combined pytest budget within that.
          case "${CI_RUNNER_ARCH}" in
            ARM64) pytest_workers=5 ;;
            X64) pytest_workers=2 ;;
            *)
              pytest_workers=2
              echo "::warning title=Unknown runner architecture::Using conservative pytest worker budget for ${CI_RUNNER_ARCH}"
              ;;
          esac

          runner_hostname="$(hostname)"
          if command -v nproc >/dev/null 2>&1; then
            visible_cpus="$(nproc)"
          else
            visible_cpus="$(getconf _NPROCESSORS_ONLN)"
          fi
          echo "PYTEST_WORKERS=${pytest_workers}" >> "${GITHUB_ENV}"

          echo "pytest worker budget: runner=${CI_RUNNER_NAME} arch=${CI_RUNNER_ARCH} hostname=${runner_hostname} visible_cpus=${visible_cpus} workers=${pytest_workers}"
          {
            echo "### Pytest worker budget"
            echo
            echo "| Runner | Architecture | Hostname | Visible CPUs | Workers |"
            echo "| --- | --- | --- | ---: | ---: |"
            echo "| ${CI_RUNNER_NAME} | ${CI_RUNNER_ARCH} | ${runner_hostname} | ${visible_cpus} | ${pytest_workers} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Prepare pytest shard
        id: pytest-shard
        env:
          PYTEST_SHARD: ${{ matrix.shard }}
          PYTEST_SHARDS: "4"
          PYTEST_SHARD_FILE: ${{ runner.temp }}/pytest-shard-${{ matrix.shard }}.txt
        run: |
          uv run python ops/ci/partition_pytest_files.py \
            --shard-index "${PYTEST_SHARD}" \
            --shard-count "${PYTEST_SHARDS}" \
            --output "${PYTEST_SHARD_FILE}"
          cat "${PYTEST_SHARD_FILE}"
          echo "file=${PYTEST_SHARD_FILE}" >> "${GITHUB_OUTPUT}"
          if [ -s "${PYTEST_SHARD_FILE}" ]; then
            echo "has_tests=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_tests=false" >> "${GITHUB_OUTPUT}"
            echo "No tests selected for this shard"
          fi

      - name: Run tests (PR/manual, sharded, no coverage)
        if: github.event_name != 'push' && steps.pytest-shard.outputs.has_tests == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # Database configuration for auth tests
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          DB_NAME: hybridinference_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          # Auth system configuration
          JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
          SIGNUP_ENABLED: "1"
          SIGNUP_DEFAULT_TIER: free
          SIGNUP_DEFAULT_DAILY_QUOTA_USD: "100.00"
          SIGNUP_REQUIRE_EMAIL_VERIFICATION: "0"
          COOKIE_SECURE: "0"
          COOKIE_SAMESITE: lax
          BASE_URL: http://localhost:8000
        run: |
          mapfile -t pytest_files < "${{ steps.pytest-shard.outputs.file }}"
          uv run pytest -n "${PYTEST_WORKERS}" --dist=loadfile -v -m "not external" "${pytest_files[@]}"

      - name: Run tests (push, coverage shard)
        if: github.event_name == 'push' && steps.pytest-shard.outputs.has_tests == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # Database configuration for auth tests
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          DB_NAME: hybridinference_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          # Auth system configuration
          JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
          SIGNUP_ENABLED: "1"
          SIGNUP_DEFAULT_TIER: free
          SIGNUP_DEFAULT_DAILY_QUOTA_USD: "100.00"
          SIGNUP_REQUIRE_EMAIL_VERIFICATION: "0"
          COOKIE_SECURE: "0"
          COOKIE_SAMESITE: lax
          BASE_URL: http://localhost:8000
          PYTEST_SHARD: ${{ matrix.shard }}
          PYTEST_FILE_DURATIONS_OUTPUT: ${{ runner.temp }}/pytest-file-durations-${{ matrix.shard }}.json
        run: |
          mapfile -t pytest_files < "${{ steps.pytest-shard.outputs.file }}"
          uv run pytest \
            -p ops.ci.pytest_file_durations \
            -n "${PYTEST_WORKERS}" \
            --dist=loadfile \
            --cov=. \
            --cov-report=term-missing \
            --cov-report="xml:coverage-${PYTEST_SHARD}.xml" \
            -v \
            -m "not external" \
            "${pytest_files[@]}"

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && steps.pytest-shard.outputs.has_tests == 'true'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage-${{ matrix.shard }}.xml
          flags: backend-shard-${{ matrix.shard }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload pytest file durations
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-file-durations-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/pytest-file-durations-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  security:
    name: Security Scan
    runs-on: [self-hosted, Linux, ci-general]
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="x64" ;;
            aarch64|arm64) arch="arm64" ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          asset="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base_url}/${asset}"
          curl -fsSLO "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  ${asset}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" > gitleaks.sha256
          sha256sum -c gitleaks.sha256
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --no-git --redact --verbose --no-banner

      - name: Isolate uv cache dir
        # Job-level env cannot use the runner context; set via GITHUB_ENV.
        # This job does not enable the remote cache, so the run id here cost
        # nothing — it is dropped anyway so the pattern is not copied into a
        # job that does.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Security audit
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          uv export --no-dev --no-hashes --format requirements-txt -o /tmp/audit-requirements.txt
          uvx --python ${{ env.PYTHON_VERSION }} pip-audit --progress-spinner off --no-deps --disable-pip -r /tmp/audit-requirements.txt

  docker-build:
    # No custom name: skipped jobs do not expand matrix expressions in names;
    # the default job-id name renders cleanly before matrix expansion.
    needs: changes
    # PRs build only affected images. Scheduled/manual runs build all images,
    # while branch pushes leave image publishing to the deployment pipeline.
    # A classifier failure fails open to all images; CI Gate still fails closed.
    if: >-
      always() &&
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
      needs.changes.result != 'success' ||
      needs.changes.outputs.docker_matrix != '[]')
    # Buildx needs Docker daemon access; pin image verification to ARM64.
    runs-on: [self-hosted, Linux, ARM64, image-verify-arm64]
    strategy:
      fail-fast: false
      matrix:
        # The fallback keeps the matrix non-empty even when the PR job-level
        # condition skips it. It also safely builds all images if outputs are
        # unavailable or malformed.
        image: ${{ fromJSON(needs.changes.outputs.docker_matrix != '' && needs.changes.outputs.docker_matrix != '[]' && needs.changes.outputs.docker_matrix || '["frontend","backend","oncall"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch avoids the intermittent unresolved-delta failures seen
          # with shallow clones on the self-hosted runner pool.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        id: build
        # A transient buildkit/runner recycle can surface as graceful_stop.
        # Recreate the builder and retry once before failing the matrix cell.
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image }}
          push: false
          secrets: |
            github_token=${{ secrets.ROUTEWISE_GITHUB_TOKEN || github.token }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}

      - name: Set up Docker Buildx (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image }}
          push: false
          secrets: |
            github_token=${{ secrets.ROUTEWISE_GITHUB_TOKEN || github.token }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}

  ci-gate:
    name: CI Gate
    if: always()
    runs-on: [self-hosted, Linux, ci-general]
    needs:
      - changes
      - backend-quality
      - frontend-quality
      - docs-build
      - alert-control-plane-check
      - test
      - security
      - docker-build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify exact required CI job results
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFICATION_JSON: >-
            {"backend":${{ toJSON(needs.changes.outputs.backend) }},
            "frontend":${{ toJSON(needs.changes.outputs.frontend) }},
            "oncall":${{ toJSON(needs.changes.outputs.oncall) }},
            "status_monitor":${{ toJSON(needs.changes.outputs.status_monitor) }},
            "alert_control_plane":${{ toJSON(needs.changes.outputs.alert_control_plane) }},
            "docker_shared":${{ toJSON(needs.changes.outputs.docker_shared) }},
            "python_tests":${{ toJSON(needs.changes.outputs.python_tests) }},
            "docs":${{ toJSON(needs.changes.outputs.docs) }},
            "security_only":${{ toJSON(needs.changes.outputs.security_only) }},
            "full":${{ toJSON(needs.changes.outputs.full) }},
            "docker_matrix":${{ toJSON(needs.changes.outputs.docker_matrix) }}}
          JOB_RESULTS_JSON: >-
            {"changes":${{ toJSON(needs.changes.result) }},
            "backend-quality":${{ toJSON(needs.backend-quality.result) }},
            "frontend-quality":${{ toJSON(needs.frontend-quality.result) }},
            "docs-build":${{ toJSON(needs.docs-build.result) }},
            "alert-control-plane-check":${{ toJSON(needs.alert-control-plane-check.result) }},
            "test":${{ toJSON(needs.test.result) }},
            "security":${{ toJSON(needs.security.result) }},
            "docker-build":${{ toJSON(needs.docker-build.result) }}}
        run: |
          python3 ops/ci/verify_ci_gate.py verify-gate \
            --event-name "${EVENT_NAME}" \
            --classification-json "${CLASSIFICATION_JSON}" \
            --job-results-json "${JOB_RESULTS_JSON}"

  publish-backend:
    name: Publish backend candidate
    # Every green dev push publishes its backend candidate image so the
    # distribution repository's bump bot always finds a digest for dev HEAD
    # (W4 of the repo-split plan). Deliberately unconditional on path
    # classification: a docs-only push still gets a candidate — the bump bot
    # pins exact SHAs and would otherwise wait forever on one. Publishing
    # rides the arm64 fleet runner for the same billing reality as the
    # dispatch-only Build Candidate Images workflow (#1279), and stays
    # native for the staging host's architecture; single-arch until the
    # production architecture is registered (plan W4 note), at which point
    # a differing prod arch upgrades this to a multi-arch manifest.
    # !cancelled() suppresses the implicit success() GitHub prepends to any
    # job `if` lacking a status function. Implicit success() evaluates the
    # WHOLE transitive needs chain — and docker-build, an ancestor via
    # ci-gate, is legitimately skipped on many pushes, which silently
    # skipped this job too: publish-per-SHA would have held only when
    # docker-build happened to run, the exact coupling this job exists to
    # ban. The explicit ci-gate result check below is the real gate.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.ci-gate.result == 'success' }}
    needs: [ci-gate]
    runs-on: [self-hosted, Linux, arm64-docker]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch avoids the intermittent unresolved-delta failures seen
          # with shallow clones on the self-hosted runner pool.
          fetch-depth: 0

      - name: Skip when this SHA's candidate already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:8}"
          digest="$(gh api "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/hybridinference-backend/versions?per_page=100" \
                    --jq ".[] | select(.metadata.container.tags[]? == \"dev-${GITHUB_SHA}\") | .name" 2>/dev/null | head -1 || true)"
          if [ -n "${digest}" ]; then
            echo "candidate dev-${GITHUB_SHA} already published (${digest}); skipping the build"
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "shortsha=${short}" >> "$GITHUB_OUTPUT"

      # QEMU: the amd64 half of the manifest builds emulated on this arm64
      # runner. Slower, but publishing is asynchronous to every deploy, and
      # amd64 Python wheels are the best-supported kind — mostly downloads.
      - name: Set up QEMU
        if: steps.existing.outputs.digest == ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.existing.outputs.digest == ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.existing.outputs.digest == ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend candidate
        if: steps.existing.outputs.digest == ''
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          # Multi-arch since 2026-08-20: production (freeinference-direct)
          # is x86_64 while staging (spark2) is arm64 — the plan's W4 note,
          # armed the day the prod architecture was registered. The pushed
          # digest is the manifest LIST; each host resolves its own platform,
          # and the revision-label walk is index-aware.
          platforms: linux/arm64,linux/amd64
          push: true
          # Full-SHA tag is what the bump bot resolves (an 8-char prefix is
          # not a SHA claim); the short tag stays for humans.
          tags: |
            ghcr.io/harvardmadsys/hybridinference-backend:dev-${{ github.sha }}
            ghcr.io/harvardmadsys/hybridinference-backend:dev-${{ steps.existing.outputs.shortsha }}
          # The digest deploy and the bump gate both read the revision label
          # back and compare it against their SHA truth; a candidate without
          # it is refused at deploy time.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          secrets: |
            github_token=${{ secrets.ROUTEWISE_GITHUB_TOKEN || github.token }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=min,scope=backend

      - name: Candidate summary
        env:
          EXISTING: ${{ steps.existing.outputs.digest }}
          PUSHED: ${{ steps.push.outputs.digest }}
          SHORT: ${{ steps.existing.outputs.shortsha }}
        run: |
          {
            echo "## Backend candidate"
            echo ""
            echo "- source SHA: \`${GITHUB_SHA}\`"
            if [ -n "${EXISTING}" ]; then
              echo "- already published: \`ghcr.io/harvardmadsys/hybridinference-backend@${EXISTING}\`"
            else
              echo "- pushed: \`ghcr.io/harvardmadsys/hybridinference-backend@${PUSHED}\` (tag \`dev-${SHORT}\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
