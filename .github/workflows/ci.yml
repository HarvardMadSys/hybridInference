name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev, "murphy/dev/*"]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ci-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.0"
  UV_SYSTEM_PYTHON: 1
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  backend-quality:
    name: Backend Quality
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Isolate uv cache dir
        # Per-job UV_CACHE_DIR via GITHUB_ENV: job-level env cannot use the
        # runner context. Concurrent self-hosted jobs otherwise share
        # ~/.cache/uv; when a cache entry disappears mid-install, uv fails
        # with ENOENT while hardlinking into the venv — before tests start.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-${GITHUB_RUN_ID}-${GITHUB_JOB}" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # Still disable prune: even with per-job UV_CACHE_DIR, prune --ci
          # is unnecessary on self-hosted and has raced with other installs.
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          uv venv
          # Bounded retry for residual install-time cache ENOENT.
          for attempt in 1 2 3; do
            if uv sync --group dev; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "uv sync failed (attempt ${attempt}/3); retrying..." >&2
              sleep $((attempt * 2))
            fi
          done
          echo "uv sync failed after 3 attempts" >&2
          exit 1

      - name: Check Ruff formatting
        run: uv run ruff format --check .

      - name: Run Ruff lint
        run: uv run ruff check --no-fix .

      - name: Run pydocstyle
        run: uv run pydocstyle --match-dir='^((?!(tests|\.venv|node_modules|apps/frontend|ops|docs)).)*$'

  frontend-quality:
    name: Frontend Quality
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./apps/frontend
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run type-check

      - name: Run frontend tests
        run: npm run test

  test:
    name: Test (shard ${{ matrix.shard }}/4)
    # Service containers need Docker socket access; keep these jobs off the
    # generic pool that includes gpu1, which lacks that access.
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freeinference_test_db
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Isolate uv cache dir
        # Per-job UV_CACHE_DIR via GITHUB_ENV: job-level env cannot use the
        # runner context. Concurrent self-hosted jobs otherwise share
        # ~/.cache/uv; when a cache entry disappears mid-install, uv fails
        # with ENOENT while hardlinking into the venv — before tests start.
        env:
          UV_CACHE_SUFFIX: ${{ matrix.shard }}
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-${GITHUB_RUN_ID}-${GITHUB_JOB}-${UV_CACHE_SUFFIX}" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # Still disable prune: even with per-job UV_CACHE_DIR, prune --ci
          # is unnecessary on self-hosted and has raced with other installs.
          prune-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          uv venv
          # Bounded retry for residual install-time cache ENOENT.
          for attempt in 1 2 3; do
            if uv sync --group dev; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "uv sync failed (attempt ${attempt}/3); retrying..." >&2
              sleep $((attempt * 2))
            fi
          done
          echo "uv sync failed after 3 attempts" >&2
          exit 1

      - name: Prepare pytest shard
        id: pytest-shard
        env:
          PYTEST_SHARD: ${{ matrix.shard }}
          PYTEST_SHARDS: "4"
          PYTEST_SHARD_FILE: ${{ runner.temp }}/pytest-shard-${{ matrix.shard }}.txt
        run: |
          uv run python ops/ci/partition_pytest_files.py \
            --shard-index "${PYTEST_SHARD}" \
            --shard-count "${PYTEST_SHARDS}" \
            --output "${PYTEST_SHARD_FILE}"
          cat "${PYTEST_SHARD_FILE}"
          echo "file=${PYTEST_SHARD_FILE}" >> "${GITHUB_OUTPUT}"
          if [ -s "${PYTEST_SHARD_FILE}" ]; then
            echo "has_tests=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_tests=false" >> "${GITHUB_OUTPUT}"
            echo "No tests selected for this shard"
          fi

      - name: Run tests (PR/manual, sharded, no coverage)
        if: github.event_name != 'push' && steps.pytest-shard.outputs.has_tests == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # Database configuration for auth tests
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          DB_NAME: freeinference_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          # Auth system configuration
          JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
          SIGNUP_ENABLED: "1"
          SIGNUP_DEFAULT_TIER: free
          SIGNUP_DEFAULT_DAILY_QUOTA_USD: "100.00"
          SIGNUP_REQUIRE_EMAIL_VERIFICATION: "0"
          COOKIE_SECURE: "0"
          COOKIE_SAMESITE: lax
          BASE_URL: http://localhost:8000
        run: |
          mapfile -t pytest_files < "${{ steps.pytest-shard.outputs.file }}"
          uv run pytest -n auto --dist=loadfile -v -m "not external" "${pytest_files[@]}"

      - name: Run tests (push, coverage shard)
        if: github.event_name == 'push' && steps.pytest-shard.outputs.has_tests == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # Database configuration for auth tests
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          DB_NAME: freeinference_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          # Auth system configuration
          JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
          SIGNUP_ENABLED: "1"
          SIGNUP_DEFAULT_TIER: free
          SIGNUP_DEFAULT_DAILY_QUOTA_USD: "100.00"
          SIGNUP_REQUIRE_EMAIL_VERIFICATION: "0"
          COOKIE_SECURE: "0"
          COOKIE_SAMESITE: lax
          BASE_URL: http://localhost:8000
          PYTEST_SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t pytest_files < "${{ steps.pytest-shard.outputs.file }}"
          uv run pytest -n auto --dist=loadfile --cov=. --cov-report=term-missing --cov-report=xml:coverage-${PYTEST_SHARD}.xml -v -m "not external" "${pytest_files[@]}"

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && steps.pytest-shard.outputs.has_tests == 'true'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage-${{ matrix.shard }}.xml
          flags: backend-shard-${{ matrix.shard }}
          fail_ci_if_error: false
          verbose: true

  security:
    name: Security Scan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          # Full fetch: GitHub intermittently serves shallow-clone packs with
          # missing delta bases ("pack has N unresolved deltas" / "missing
          # blob object"), which has been failing random jobs at checkout.
          # A full fetch is self-contained and immune to that.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch="x64" ;;
            aarch64|arm64) arch="arm64" ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          asset="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base_url}/${asset}"
          curl -fsSLO "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  ${asset}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" > gitleaks.sha256
          sha256sum -c gitleaks.sha256
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --no-git --redact --verbose --no-banner

      - name: Isolate uv cache dir
        # Job-level env cannot use the runner context; set via GITHUB_ENV.
        run: |
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-${GITHUB_RUN_ID}-${GITHUB_JOB}" >> "${GITHUB_ENV}"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Security audit
        env:
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          uv export --no-dev --no-hashes --format requirements-txt -o /tmp/audit-requirements.txt
          uvx --python ${{ env.PYTHON_VERSION }} pip-audit --progress-spinner off --no-deps --disable-pip -r /tmp/audit-requirements.txt

  ci-gate:
    name: CI Gate
    if: always()
    runs-on: self-hosted
    needs:
      - backend-quality
      - frontend-quality
      - test
      - security
    steps:
      - name: Verify required CI jobs
        env:
          BACKEND_QUALITY_RESULT: ${{ needs.backend-quality.result }}
          FRONTEND_QUALITY_RESULT: ${{ needs.frontend-quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          failed=0
          for result_name in \
            BACKEND_QUALITY_RESULT \
            FRONTEND_QUALITY_RESULT \
            TEST_RESULT \
            SECURITY_RESULT; do
            result="${!result_name}"
            echo "${result_name}=${result}"
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done
          exit "${failed}"
