name: CI

on:
  push:
    branches: [main, dev, "murphy/dev/*"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.0"
  UV_SYSTEM_PYTHON: 1
  NODE_VERSION: "20"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv
          uv sync --group dev

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run ruff lint
        run: uv run ruff check --no-fix .

      - name: Run pydocstyle
        run: uv run pydocstyle

  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v6

      - name: Check for package-lock.json
        id: check-lock
        run: |
          if [ -f "package-lock.json" ]; then
            echo "cache=npm" >> $GITHUB_OUTPUT
          else
            echo "cache=" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.check-lock.outputs.cache }}
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier format check
        run: npm run format:check

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run tests
        run: npm run test

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freeinference_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv
          uv sync --group dev

      - name: Run tests with coverage
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # Database configuration for auth tests
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: freeinference_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          # Auth system configuration
          JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
          SIGNUP_ENABLED: "1"
          SIGNUP_DEFAULT_TIER: free
          SIGNUP_DEFAULT_DAILY_QUOTA_USD: "100.00"
          SIGNUP_REQUIRE_EMAIL_VERIFICATION: "0"
          COOKIE_SECURE: "0"
          COOKIE_SAMESITE: lax
          BASE_URL: http://localhost:8000
        run: |
          uv run pytest --cov=. --cov-report=term-missing --cov-report=xml -v -m "not external"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install gitleaks
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base_url}/${asset}"
          curl -fsSLO "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  ${asset}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" > gitleaks.sha256
          sha256sum -c gitleaks.sha256
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --no-git --redact --verbose --no-banner

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Security audit
        run: uvx pip-audit --progress-spinner off
