name: CI

on:
  push:
    branches: [main, dev, "murphy/dev/*"]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.0"
  UV_SYSTEM_PYTHON: 1
  NODE_VERSION: "20"
  GITLEAKS_VERSION: "8.30.1"
  PYTEST_SHARDS: "4"

jobs:
  backend-lint:
    name: Backend ${{ matrix.check.name }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Ruff Format
            command: uv run ruff format --check .
          - name: Ruff Lint
            command: uv run ruff check --no-fix .
          - name: Pydocstyle
            command: uv run pydocstyle
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          uv venv
          uv sync --group dev

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  frontend-check:
    name: Frontend ${{ matrix.check.name }}
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./apps/frontend
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Audit
            command: npm audit --omit=dev --audit-level=high
          - name: ESLint
            command: npm run lint
          - name: Prettier
            command: npm run format:check
          - name: TypeScript
            command: npm run type-check
          - name: Tests
            command: npm run test
    steps:
      - uses: actions/checkout@v6

      - name: Check for package-lock.json
        id: check-lock
        run: |
          if [ -f "package-lock.json" ]; then
            echo "cache=npm" >> $GITHUB_OUTPUT
          else
            echo "cache=" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.check-lock.outputs.cache }}
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

  test:
    name: Test (shard ${{ matrix.shard }}/4)
    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freeinference_test_db
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          uv venv
          uv sync --group dev

      - name: Run tests (PR, sharded, no coverage)
        if: github.event_name == 'pull_request'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # Database configuration for auth tests
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          DB_NAME: freeinference_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          # Auth system configuration
          JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
          SIGNUP_ENABLED: "1"
          SIGNUP_DEFAULT_TIER: free
          SIGNUP_DEFAULT_DAILY_QUOTA_USD: "100.00"
          SIGNUP_REQUIRE_EMAIL_VERIFICATION: "0"
          COOKIE_SECURE: "0"
          COOKIE_SAMESITE: lax
          BASE_URL: http://localhost:8000
          PYTEST_SHARD: ${{ matrix.shard }}
          PYTEST_SHARD_FILE: ${{ runner.temp }}/pytest-shard-${{ matrix.shard }}.txt
        run: |
          uv run python - <<'PY' > "${PYTEST_SHARD_FILE}"
          import os
          import pathlib
          import sys
          import zlib

          shard = int(os.environ["PYTEST_SHARD"])
          total = int(os.environ["PYTEST_SHARDS"])
          paths = sorted(pathlib.Path("tests").rglob("test_*.py"))
          selected = [str(path) for path in paths if zlib.crc32(str(path).encode()) % total == shard - 1]
          print("\n".join(selected))
          print(f"Selected {len(selected)} of {len(paths)} test files for shard {shard}/{total}", file=sys.stderr)
          PY
          cat "${PYTEST_SHARD_FILE}"
          if [ ! -s "${PYTEST_SHARD_FILE}" ]; then
            echo "No tests selected for this shard"
            exit 0
          fi
          uv run pytest -n auto --dist=loadfile -v -m "not external" $(cat "${PYTEST_SHARD_FILE}")

      - name: Run tests (push, coverage shard)
        if: github.event_name == 'push'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          # Database configuration for auth tests
          DB_HOST: localhost
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          DB_NAME: freeinference_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          # Auth system configuration
          JWT_SECRET_KEY: test-secret-key-for-ci-only-do-not-use-in-production
          JWT_ALGORITHM: HS256
          JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
          JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
          SIGNUP_ENABLED: "1"
          SIGNUP_DEFAULT_TIER: free
          SIGNUP_DEFAULT_DAILY_QUOTA_USD: "100.00"
          SIGNUP_REQUIRE_EMAIL_VERIFICATION: "0"
          COOKIE_SECURE: "0"
          COOKIE_SAMESITE: lax
          BASE_URL: http://localhost:8000
          PYTEST_SHARD: ${{ matrix.shard }}
          PYTEST_SHARD_FILE: ${{ runner.temp }}/pytest-shard-${{ matrix.shard }}.txt
        run: |
          uv run python - <<'PY' > "${PYTEST_SHARD_FILE}"
          import os
          import pathlib
          import sys
          import zlib

          shard = int(os.environ["PYTEST_SHARD"])
          total = int(os.environ["PYTEST_SHARDS"])
          paths = sorted(pathlib.Path("tests").rglob("test_*.py"))
          selected = [str(path) for path in paths if zlib.crc32(str(path).encode()) % total == shard - 1]
          print("\n".join(selected))
          print(f"Selected {len(selected)} of {len(paths)} test files for shard {shard}/{total}", file=sys.stderr)
          PY
          cat "${PYTEST_SHARD_FILE}"
          if [ ! -s "${PYTEST_SHARD_FILE}" ]; then
            echo "No tests selected for this shard"
            exit 0
          fi
          uv run pytest -n auto --dist=loadfile --cov=. --cov-report=term-missing --cov-report=xml:coverage-${PYTEST_SHARD}.xml -v -m "not external" $(cat "${PYTEST_SHARD_FILE}")

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage-${{ matrix.shard }}.xml
          flags: backend-shard-${{ matrix.shard }}
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        image: [frontend, backend]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.image }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}

  security:
    name: Security Scan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Install gitleaks
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base_url}/${asset}"
          curl -fsSLO "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "  ${asset}$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" > gitleaks.sha256
          sha256sum -c gitleaks.sha256
          tar -xzf "${asset}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --no-git --redact --verbose --no-banner

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Security audit
        run: |
          uv export --no-dev --no-hashes --format requirements-txt -o /tmp/audit-requirements.txt
          uvx --python "$(which python)" pip-audit --progress-spinner off -r /tmp/audit-requirements.txt
