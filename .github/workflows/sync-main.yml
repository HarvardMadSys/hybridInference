name: Sync dev to main

on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize dispatches so two runs can't both fast-forward from the same old
# main and race on release creation. Runs queue rather than cancel so an
# in-flight sync always completes.
concurrency:
  group: sync-dev-to-main
  cancel-in-progress: false

jobs:
  sync:
    name: Fast-forward main to dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward main to dev
        id: sync
        run: |
          set -euo pipefail
          git checkout main
          before="$(git rev-parse HEAD)"
          git merge --ff-only origin/dev
          git push origin main
          after="$(git rev-parse HEAD)"
          echo "before=${before}" >> "${GITHUB_OUTPUT}"
          echo "after=${after}" >> "${GITHUB_OUTPUT}"
          if [ "${before}" != "${after}" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "main already up to date with dev; skipping release."
          fi

      - name: Create release
        if: ${{ steps.sync.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Date-based tag (YYYYMMDD), matching the existing release convention.
          # If a release already exists for today (e.g. a second sync the same
          # day), append an incrementing suffix so the tag stays unique.
          base="$(date -u +%Y%m%d)"
          tag="${base}"
          suffix=1
          while gh release view "${tag}" >/dev/null 2>&1; do
            tag="${base}.${suffix}"
            suffix=$((suffix + 1))
          done

          # Pin the release to this run's synced commit rather than `main`, so a
          # concurrent push advancing main can't make us tag the wrong commit.
          target="${{ steps.sync.outputs.after }}"
          echo "Creating release ${tag} from ${target}"
          gh release create "${tag}" \
            --target "${target}" \
            --title "${tag}" \
            --generate-notes
