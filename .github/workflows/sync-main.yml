name: Sync dev to main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Fast-forward main to dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward main to dev
        id: sync
        run: |
          set -euo pipefail
          git checkout main
          before="$(git rev-parse HEAD)"
          git merge --ff-only origin/dev
          git push origin main
          after="$(git rev-parse HEAD)"
          echo "before=${before}" >> "${GITHUB_OUTPUT}"
          echo "after=${after}" >> "${GITHUB_OUTPUT}"
          if [ "${before}" != "${after}" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "main already up to date with dev; skipping release."
          fi

      - name: Create release
        if: ${{ steps.sync.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Date-based tag (YYYYMMDD), matching the existing release convention.
          # If a release already exists for today (e.g. a second sync the same
          # day), append an incrementing suffix so the tag stays unique.
          base="$(date -u +%Y%m%d)"
          tag="${base}"
          suffix=1
          while gh release view "${tag}" >/dev/null 2>&1; do
            tag="${base}.${suffix}"
            suffix=$((suffix + 1))
          done

          echo "Creating release ${tag} from $(git rev-parse HEAD)"
          gh release create "${tag}" \
            --target main \
            --title "${tag}" \
            --generate-notes
