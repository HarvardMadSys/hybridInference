name: Build Candidate Images

# Manual diagnostic image slicer. Canonical deployable backend and neutral-
# console candidates are published automatically by ci.yml as multi-arch
# manifests under the dev-<full-sha> tag; distribution bump chains consume
# only those candidates.
#
# This dispatch-only tool intentionally builds one operator-selected platform
# under a separate manual-<full-sha>-<arch> tag. It diagnoses Dockerfile/build
# problems without minting a deployable candidate or repointing either
# canonical dev tag.
#
# Backend only: this dispatch workflow remains a narrow diagnostic slicer. The
# console's canonical neutral candidate is automatic because it must carry no
# distribution branding or private route target at all; ci.yml builds that
# exact artifact after the normal gate rather than accepting operator-supplied
# build arguments here.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Diagnostic image platform; output is not consumed by upstream.lock"
        type: choice
        options:
          - linux/amd64
          - linux/arm64
        default: linux/amd64

permissions:
  contents: read
  packages: write

concurrency:
  group: build-candidates
  cancel-in-progress: false

jobs:
  build:
    name: Build and push candidates
    # Self-hosted: arm64-docker builds arm64 diagnostics natively, so this
    # job skips QEMU entirely. An operator may still request an amd64
    # diagnostic; canonical deployable candidates are built natively per
    # architecture in ci.yml.
    runs-on: [self-hosted, Linux, arm64-docker]
    timeout-minutes: 45
    steps:
      # The choice type constrains the UI and the dispatch API both, but the
      # value still lands in shell steps, so gate it in shell
      # too — from an env var, never a ${{ }} splice into run:. This runs
      # before checkout and login: nothing else may touch a bad input first.
      - name: Validate platform input
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          case "${PLATFORM}" in
            linux/amd64|linux/arm64) ;;
            *) echo "::error title=Bad input::platform must be linux/amd64 or linux/arm64"; exit 1 ;;
          esac

      # A dispatch runs the chosen ref's code, reviewed or not, with this
      # workflow's packages: write token, on a host the publish jobs use; the
      # operator's choices that would bound that are listed at the top of
      # ci.yml.
      - name: Keep the registry login in this job's own Docker config
        # See "Credentials" above publish-backend-precheck in ci.yml.
        run: |
          set -euo pipefail
          plugins="${DOCKER_CONFIG:-${HOME}/.docker}/cli-plugins"
          docker_config="${RUNNER_TEMP}/docker-config"
          rm -rf "${docker_config}"
          mkdir -m 0700 "${docker_config}"
          if [ -d "${plugins}" ]; then
            ln -s "${plugins}" "${docker_config}/cli-plugins"
          fi
          echo "DOCKER_CONFIG=${docker_config}" >> "${GITHUB_ENV}"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full fetch, matching ci.yml: shallow fetches of this repository
          # intermittently fail with "pack has N unresolved deltas" /
          # "missing blob" (see the fetch-depth comments in ci.yml).
          fetch-depth: 0
          persist-credentials: false

      - name: Compute image names
        id: names
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/hybridinference-backend" >> "$GITHUB_OUTPUT"
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          platforms: ${{ inputs.platform }}
          push: true
          tags: ${{ steps.names.outputs.backend }}:manual-${{ github.sha }}-${{ steps.names.outputs.arch }}
          # Preserve source provenance for diagnosis even though distribution
          # lock chains deliberately ignore manual-* tags.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Candidate summary
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          {
            echo "## Candidate images"
            echo ""
            echo "- source SHA: \`${GITHUB_SHA}\`"
            echo "- platform: \`${PLATFORM}\`"
            echo "- diagnostic image: \`${{ steps.names.outputs.backend }}:manual-${GITHUB_SHA}-${{ steps.names.outputs.arch }}@${BACKEND_DIGEST}\`"
            echo ""
            echo "Diagnostic only: upstream.lock never consumes manual-* tags."
            echo "For deployment, use the automatic dev CI multi-arch candidate and the consuming distribution repository's upstream bump flow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the registry login
        if: always()
        run: rm -f "${RUNNER_TEMP}/docker-config/config.json"
