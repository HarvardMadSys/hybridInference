name: Build Candidate Images

# Manual diagnostic image slicer. Canonical deployable backend candidates are
# published automatically by ci.yml as multi-arch manifests under the
# dev-<full-sha> tag; distribution bump chains consume only those candidates.
#
# This dispatch-only tool intentionally builds one operator-selected platform
# under a separate manual-<full-sha>-<arch> tag. It diagnoses Dockerfile/build
# problems without minting a deployable candidate or repointing either
# canonical dev tag.
#
# Backend only. Frontend images are distribution-specific and are built by a
# distribution's own bump pipeline; this neutral upstream workflow has none of
# the branding or route build args needed to produce one.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Diagnostic image platform; output is not consumed by upstream.lock"
        type: choice
        options:
          - linux/amd64
          - linux/arm64
        default: linux/amd64

permissions:
  contents: read
  packages: write

concurrency:
  group: build-candidates
  cancel-in-progress: false

jobs:
  build:
    name: Build and push candidates
    # Self-hosted, by billing reality (2026-08-18): the original design ran
    # this on GitHub-hosted runners so publishing would not depend on the
    # FreeInference fleet, but the org's hosted minutes are billing-blocked
    # — the same constraint that moved CI onto the fleet. arm64-docker is
    # native for arm64 diagnostics, so that choice skips QEMU entirely. An
    # operator may still request an amd64 diagnostic; canonical deployable
    # candidates are built natively per architecture in ci.yml.
    runs-on: [self-hosted, Linux, arm64-docker]
    timeout-minutes: 45
    steps:
      # The choice type constrains the UI and the dispatch API both, but the
      # value still lands in shell steps, so gate it in shell
      # too — from an env var, never a ${{ }} splice into run:. This runs
      # before checkout and login: nothing else may touch a bad input first.
      - name: Validate platform input
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          case "${PLATFORM}" in
            linux/amd64|linux/arm64) ;;
            *) echo "::error title=Bad input::platform must be linux/amd64 or linux/arm64"; exit 1 ;;
          esac

      - uses: actions/checkout@v6
        with:
          # Full fetch, matching ci.yml: shallow fetches of this repository
          # intermittently fail with "pack has N unresolved deltas" /
          # "missing blob" (see the fetch-depth comments in ci.yml).
          fetch-depth: 0

      - name: Compute image names
        id: names
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/hybridinference-backend" >> "$GITHUB_OUTPUT"
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          platforms: ${{ inputs.platform }}
          push: true
          tags: ${{ steps.names.outputs.backend }}:manual-${{ github.sha }}-${{ steps.names.outputs.arch }}
          # Preserve source provenance for diagnosis even though distribution
          # lock chains deliberately ignore manual-* tags.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Candidate summary
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          {
            echo "## Candidate images"
            echo ""
            echo "- source SHA: \`${GITHUB_SHA}\`"
            echo "- platform: \`${PLATFORM}\`"
            echo "- diagnostic image: \`${{ steps.names.outputs.backend }}:manual-${GITHUB_SHA}-${{ steps.names.outputs.arch }}@${BACKEND_DIGEST}\`"
            echo ""
            echo "Diagnostic only: upstream.lock never consumes manual-* tags."
            echo "For deployment, use the automatic dev CI multi-arch candidate and the consuming distribution repository's upstream bump flow."
          } >> "$GITHUB_STEP_SUMMARY"
