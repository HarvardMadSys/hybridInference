name: Build Candidate Images

# Staging artifact-consumer chain, slice 1 (route (b)-minimal):
# build the backend image from the current source and push it to GHCR so
# staging can deploy by immutable digest instead of building from a
# source checkout.
#
# Manual-only: nothing builds or publishes automatically. This slice
# deliberately does NOT add a release manifest, signing, or attestation —
# the digest printed in the run summary is the whole deliverable.
#
# First run: dispatch this at the exact SHA staging currently runs, so the
# digest deploy that follows is provably a packaging-only change.
#
# Backend only. A frontend candidate is deliberately not offered: the
# frontend bakes its identity at build time — ~25 NEXT_PUBLIC_* values,
# and the /agents rewrites from AGENT_*_INTERNAL_URL — none of which a CI
# build can see, and the digest deploy attaches no cloud-agent network for
# those rewrites to resolve into. The frontend digest path arrives with W7
# (runtime branding), not before.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Image platform; must match the staging host (the digest deploy logs its uname -m)"
        type: choice
        options:
          - linux/amd64
          - linux/arm64
        default: linux/amd64

permissions:
  contents: read
  packages: write

concurrency:
  group: build-candidates
  cancel-in-progress: false

jobs:
  build:
    name: Build and push candidates
    # Self-hosted, by billing reality (2026-08-18): the original design ran
    # this on GitHub-hosted runners so publishing would not depend on the
    # FreeInference fleet, but the org's hosted minutes are billing-blocked
    # — the same constraint that moved CI onto the fleet. arm64-docker is
    # native for the staging host's architecture, so arm64 candidates skip
    # QEMU entirely; QEMU stays installed for cross-arch builds (a future
    # amd64 prod candidate). Revisit at Step 3: a public repository gets
    # hosted minutes free, which restores the original stance.
    runs-on: [self-hosted, Linux, arm64-docker]
    timeout-minutes: 45
    steps:
      # The choice type constrains the UI and the dispatch API both, but the
      # value still lands in shell via the summary step, so gate it in shell
      # too — from an env var, never a ${{ }} splice into run:. This runs
      # before checkout and login: nothing else may touch a bad input first.
      - name: Validate platform input
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          case "${PLATFORM}" in
            linux/amd64|linux/arm64) ;;
            *) echo "::error title=Bad input::platform must be linux/amd64 or linux/arm64"; exit 1 ;;
          esac

      - uses: actions/checkout@v6
        with:
          # Full fetch, matching ci.yml: shallow fetches of this repository
          # intermittently fail with "pack has N unresolved deltas" /
          # "missing blob" (see the fetch-depth comments in ci.yml).
          fetch-depth: 0

      - name: Compute image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${owner}/hybridinference-backend" >> "$GITHUB_OUTPUT"
          echo "shortsha=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.backend
          platforms: ${{ inputs.platform }}
          push: true
          tags: ${{ steps.names.outputs.backend }}:dev-${{ steps.names.outputs.shortsha }}
          # The digest deploy reads the revision label back and refuses to
          # start an image whose source SHA differs from the host checkout
          # that supplies its config mounts.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Same private-dependency token the staging deploy forwards to the
          # compose build (routewise git dependency).
          secrets: |
            github_token=${{ secrets.ROUTEWISE_GITHUB_TOKEN || github.token }}

      - name: Candidate summary
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          {
            echo "## Candidate images"
            echo ""
            echo "- source SHA: \`${GITHUB_SHA}\`"
            echo "- platform: \`${PLATFORM}\`"
            echo "- backend: \`${{ steps.names.outputs.backend }}@${BACKEND_DIGEST}\`"
            echo ""
            echo "Deploy: use the consuming distribution repository's upstream bump flow; staging deploys only from upstream.lock, never from a pasted digest."
            echo "Record kept on the staging host in var/deploy-digest.log."
          } >> "$GITHUB_STEP_SUMMARY"
