# Runs one read-only Codex on-call analysis per alert dispatched by the
# codex-oncall relay (apps/backend/serving/oncall). The relay has already
# posted the original alert to Slack; this workflow investigates the current
# `dev` checkout and replies in the same thread.
#
# Untrusted-input rule: everything inside client_payload comes from alert
# producers. It must only ever reach files (via env indirection), never be
# interpolated into `run:` scripts. Relay-owned fields (model, base URL,
# Slack coordinates) are read from the payload file with jq/python.
name: Codex On-Call

on:
  repository_dispatch:
    types: [codex-oncall]

permissions:
  contents: read

# One analysis per incident fingerprint at a time; duplicates queue up.
concurrency:
  group: codex-oncall-${{ github.event.client_payload.oncall.fingerprint }}
  cancel-in-progress: false

env:
  CODEX_CLI_VERSION: "0.144.4"

jobs:
  oncall:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Write dispatch payload
        env:
          ONCALL_PAYLOAD: ${{ toJSON(github.event.client_payload.oncall) }}
        run: printf '%s' "$ONCALL_PAYLOAD" > "$RUNNER_TEMP/oncall-payload.json"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI and workflow dependencies
        run: |
          npm install --global --no-audit --no-fund "@openai/codex@${CODEX_CLI_VERSION}"
          python -m pip install --quiet "pydantic>=2" "httpx>=0.27"

      - name: Render prompt and output schema
        run: |
          PYTHONPATH=apps/backend python -m serving.oncall.gha render \
            --payload "$RUNNER_TEMP/oncall-payload.json" \
            --prompt-out "$RUNNER_TEMP/prompt.txt" \
            --schema-out "$RUNNER_TEMP/schema.json"

      - name: Sandbox self-check
        id: sandbox
        # The lesson from the h200b incident: never let a broken layer degrade
        # silently. If Codex's Linux sandbox cannot run on this runner, say so
        # loudly and fall back to the ephemeral runner VM as the isolation
        # boundary (the job token is read-only and secrets are step-scoped).
        run: |
          if codex sandbox -- echo ok >/dev/null 2>&1 \
             || codex sandbox echo ok >/dev/null 2>&1; then
            echo "mode=read-only" >> "$GITHUB_OUTPUT"
            echo "codex sandbox self-check passed; using --sandbox read-only"
          else
            echo "::warning::codex sandbox self-check failed on this runner; relying on the ephemeral VM as the isolation boundary (--sandbox danger-full-access)"
            echo "mode=danger-full-access" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Codex analysis
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_ONCALL_HYBRID_API_KEY }}
          SANDBOX_MODE: ${{ steps.sandbox.outputs.mode }}
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          MODEL=$(jq -r '.model' "$RUNNER_TEMP/oncall-payload.json")
          BASE_URL_JSON=$(jq -c '.responses_base_url' "$RUNNER_TEMP/oncall-payload.json")
          codex exec --json --sandbox "$SANDBOX_MODE" \
            --ignore-user-config --ignore-rules \
            --disable hooks --disable apps --disable multi_agent \
            -c 'web_search="disabled"' \
            -c 'shell_environment_policy.include_only=["PATH","HOME","LANG","LC_ALL"]' \
            -c 'model_provider="hybrid_inference"' \
            -c 'model_providers.hybrid_inference.name="HybridInference"' \
            -c "model_providers.hybrid_inference.base_url=${BASE_URL_JSON}" \
            -c 'model_providers.hybrid_inference.env_key="CODEX_API_KEY"' \
            -c 'model_providers.hybrid_inference.wire_api="responses"' \
            -C "$GITHUB_WORKSPACE" \
            --model "$MODEL" \
            --output-schema "$RUNNER_TEMP/schema.json" \
            --output-last-message "$RUNNER_TEMP/analysis.json" \
            - < "$RUNNER_TEMP/prompt.txt" > "$RUNNER_TEMP/codex-stdout.jsonl"

      - name: Post analysis to Slack thread
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CODEX_ONCALL_SLACK_BOT_TOKEN }}
        run: |
          PYTHONPATH=apps/backend python -m serving.oncall.gha post \
            --payload "$RUNNER_TEMP/oncall-payload.json" \
            --analysis "$RUNNER_TEMP/analysis.json" \
            --codex-log "$RUNNER_TEMP/codex-stdout.jsonl"

      - name: Post failure notice
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CODEX_ONCALL_SLACK_BOT_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PYTHONPATH=apps/backend python -m serving.oncall.gha post \
            --payload "$RUNNER_TEMP/oncall-payload.json" \
            --failed --run-url "$RUN_URL"
