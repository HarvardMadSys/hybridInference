name: Rollback Production

# Break-glass rollback: redeploy production from a published GitHub Release
# instead of the tip of main. Releases are created only by "Sync dev to main"
# (sync-main.yml), each pinned to the exact commit that was promoted to main —
# i.e. a known "workable main" snapshot. Because every release commit is an
# ancestor of main, ops/deploy/deploy_production.sh accepts it as a DEPLOY_SHA
# and this workflow can roll production back to any prior release (or redeploy
# the latest one) without touching git history.

on:
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Release tag to deploy (e.g. 20260615 or 20260615.1). Leave blank to
          deploy the latest published release. Must be a tag created by
          "Sync dev to main"; bare tags without a GitHub Release are rejected.
        required: false
        type: string

concurrency:
  # Share the production-deploy lock (deploy.yml uses the same group) so a
  # rollback can never run against the host at the same time as a normal
  # deploy and clobber it. Queue rather than cancel so an in-flight deploy
  # finishes first.
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back Docker Compose stack
    runs-on: [self-hosted, Linux, deploy-production]
    environment: production
    timeout-minutes: 30

    steps:
      - name: Resolve rollback target
        id: target
        uses: actions/github-script@v7
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const input = (process.env.RELEASE_INPUT || '').trim();

            // Resolve the release tag. A blank input means "latest published
            // release"; getLatestRelease already ignores drafts and
            // prereleases. An explicit tag is validated via getReleaseByTag so
            // that a stray/leftover git tag with no GitHub Release attached
            // (which does NOT represent a blessed main snapshot) is rejected.
            let tag;
            if (input) {
              try {
                const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: input });
                tag = data.tag_name;
              } catch (err) {
                if (err.status === 404) {
                  core.setFailed(`No GitHub Release found for tag "${input}". ` +
                    `Only tags published by "Sync dev to main" are valid rollback targets.`);
                  return;
                }
                throw err;
              }
            } else {
              try {
                const { data } = await github.rest.repos.getLatestRelease({ owner, repo });
                tag = data.tag_name;
              } catch (err) {
                if (err.status === 404) {
                  core.setFailed('No published releases exist yet; run "Sync dev to main" first.');
                  return;
                }
                throw err;
              }
            }

            // Dereference the tag (annotated or lightweight) to its commit SHA.
            // getCommit follows tag objects and returns the underlying commit.
            const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: tag });
            const sha = commit.sha;

            core.setOutput('tag', tag);
            core.setOutput('sha', sha);
            core.notice(`Rolling back production to release ${tag} (${sha}).`);
            await core.summary
              .addHeading('Production rollback', 2)
              .addRaw(`Deploying release **${tag}** at commit \`${sha}\`.`)
              .write();

      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_HOST_KEY: ${{ secrets.PROD_HOST_KEY }}
          PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          printf '%s\n' "${PROD_SSH_KEY}" > "${HOME}/.ssh/production_deploy_key"
          chmod 600 "${HOME}/.ssh/production_deploy_key"

          # Sanitize: keep only well-formed known_hosts entries. The
          # PROD_HOST_KEY secret can include ssh-keyscan banner lines
          # (e.g. "<host>:<port> SSH-2.0-OpenSSH_9.6p1") when stderr was
          # captured alongside stdout. Those malformed lines cause ssh to
          # fail with "No ED25519 host key is known" under strict checking.
          printf '%s\n' "${PROD_HOST_KEY}" \
            | awk 'NF>=3 && $1 !~ /^#/ && ($2 == "ssh-rsa" || $2 == "ssh-ed25519" || $2 ~ /^ecdsa-sha2-/)' \
            > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          for var in PROD_HOST PROD_HOST_KEY PROD_USER PROD_SSH_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error title=Missing secret::${var} is not configured for the 'production' environment"
              exit 1
            fi
          done

          echo "known_hosts entries (host_token algorithm):"
          awk 'NF>=3 && $1 !~ /^#/ {printf "  %s %s\n", $1, $2}' "${HOME}/.ssh/known_hosts"

          LOOKUP_KEY="${PROD_HOST}"
          if [ "${PROD_PORT}" != "22" ]; then
            LOOKUP_KEY="[${PROD_HOST}]:${PROD_PORT}"
          fi

          MATCHED_HOST_KEYS="$(ssh-keygen -F "${LOOKUP_KEY}" -f "${HOME}/.ssh/known_hosts" || true)"

          if [ -z "${MATCHED_HOST_KEYS}" ]; then
            echo "::error title=Invalid PROD_HOST_KEY::known_hosts has no entry for ${LOOKUP_KEY}"
            echo "Re-generate the secret with: ssh-keyscan -p ${PROD_PORT} -t ed25519,rsa,ecdsa ${PROD_HOST}"
            exit 1
          fi

          if ! printf '%s\n' "${MATCHED_HOST_KEYS}" | awk '
            /^#/ { next }
            {
              for (i = 1; i <= NF; i++) {
                if ($i == "ssh-ed25519") {
                  found = 1
                }
              }
            }
            END { exit found ? 0 : 1 }
          '; then
            echo "::error title=Invalid PROD_HOST_KEY::known_hosts has no ssh-ed25519 entry for ${LOOKUP_KEY}"
            echo "OpenSSH is requiring the server's ed25519 host key for strict host checking."
            echo "Re-generate the secret with: ssh-keyscan -p ${PROD_PORT} -t ed25519,rsa,ecdsa ${PROD_HOST}"
            exit 1
          fi

      - name: Roll back on production host
        env:
          # The resolved release commit. deploy_production.sh fetches
          # origin/main and refuses any SHA that is not an ancestor of main, so
          # only genuinely-promoted release commits can be deployed here.
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT || '22' }}
          PROD_USER: ${{ secrets.PROD_USER }}
          # Token for the private routewise git dependency in the backend
          # image build (compose forwards it as the github_token build secret).
          ROUTEWISE_GITHUB_TOKEN: ${{ secrets.ROUTEWISE_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail

          ssh \
            -i "${HOME}/.ssh/production_deploy_key" \
            -p "${PROD_PORT}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            "${PROD_USER}@${PROD_HOST}" \
            "( git config --global --get-all safe.directory 2>/dev/null | grep -qxF /srv/hybridInference || git config --global --add safe.directory /srv/hybridInference ) && cd /srv/hybridInference && DEPLOY_SHA=${DEPLOY_SHA} GITHUB_TOKEN='${ROUTEWISE_GITHUB_TOKEN}' bash ops/deploy/deploy_production.sh"
