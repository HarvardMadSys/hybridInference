name: Slack Readback Gate

on:
  workflow_dispatch:
    inputs:
      channel_id:
        description: Target Slack conversation ID used by staging
        required: true
        type: string
      sink_id:
        description: Stable staging Slack sink ID
        required: true
        default: slack-staging
        type: string
      confirmation:
        description: Type write-synthetic-messages to confirm visible test writes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: slack-readback-gate
  cancel-in-progress: false

jobs:
  verify:
    name: Verify target Slack metadata readback
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/alert-control-plane-worker
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/alert-control-plane-worker/package-lock.json

      - name: Validate manual inputs
        env:
          SLACK_LIVE_GATE_CONFIRM: ${{ inputs.confirmation }}
          SLACK_CHANNEL_ID: ${{ inputs.channel_id }}
          SLACK_SINK_ID: ${{ inputs.sink_id }}
        run: |
          set -euo pipefail
          if [ "$SLACK_LIVE_GATE_CONFIRM" != "write-synthetic-messages" ]; then
            echo "::error title=Confirmation required::Enter the exact live-gate confirmation value."
            exit 1
          fi
          if ! [[ "$SLACK_CHANNEL_ID" =~ ^[CGD][A-Z0-9]{1,255}$ ]]; then
            echo "::error title=Invalid channel::Enter a Slack conversation ID."
            exit 1
          fi
          if ! [[ "$SLACK_SINK_ID" =~ ^[a-z][a-z0-9_-]{0,63}$ ]]; then
            echo "::error title=Invalid sink::Enter a stable lowercase sink ID."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run default unit tests
        run: npm test

      - name: Run target-workspace live gate
        env:
          SLACK_LIVE_GATE_CONFIRM: ${{ inputs.confirmation }}
          SLACK_BOT_TOKEN: ${{ secrets.CODEX_ONCALL_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.channel_id }}
          SLACK_SINK_ID: ${{ inputs.sink_id }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN:-}" ]; then
            echo "::error title=Missing secret::CODEX_ONCALL_SLACK_BOT_TOKEN is not configured."
            exit 1
          fi
          npm run test:slack-live
