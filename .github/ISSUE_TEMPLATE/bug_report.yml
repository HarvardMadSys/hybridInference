name: Bug report
description: Something in the gateway or console behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report bugs in HybridInference's gateway or console.

        Please redact credentials, API keys and cookies from anything you paste.
        For a security vulnerability, use
        [private reporting](https://github.com/HarvardMadSys/hybridInference/security/advisories/new)
        instead of this form.

  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        Release tag or full source commit SHA. For containers, include the image
        digest and report backend/console versions separately if they differ.
        See [how to identify your build](https://doc.hybridinference.org/releases.html#include-the-version-in-a-bug-report).
      placeholder: e.g. YYYYMMDD, a full commit SHA, or image@sha256:...
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        For API issues, include the request and response, ideally as a `curl`,
        whether it was streaming, and the model and route involved. For console
        issues, include the page, browser, steps to reproduce and screenshots
        if helpful. Redact credentials and personal information from attachments.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: >-
        The `models.yaml` / `routing.yaml` entry for the affected model, with
        keys and hostnames removed.
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Gateway log lines around the failure, redacted.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
        - label: I removed credentials, keys and cookies from everything above.
          required: true
