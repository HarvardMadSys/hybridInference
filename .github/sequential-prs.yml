version: 1

upstream:
  repository: HarvardMadSys/hybridInference
  fork_owner: B-A-M-N
  fork_repository: hybridInference
  base_ref: dev
  upstream_remote: upstream
  fork_remote: origin

# Already-published foundation PRs. The sequencer asks GitHub for live state
# and never rewrites these branches.
threads:
  - id: prefill
    foundation:
      pr: 1419
      branch: bamn/routewise/prefill-load-routing-v2
    units:
      - id: reviewable-core
        branch: prep/1419-reviewable-core
        source_ref: origin/prep/1419-reviewable-core-clean-v2
        source_base: 4462e6308c475761c71bdbea37439573afaa91cf
        source_tip: ee9c169e80dc6928193480686e3952becd0bdc09
        title: "fix(routewise): complete prefill reservation lifecycle"
        body: |
          ## Summary

          - Completes the RouteWise prefill and hedge reservation lifecycle.
          - Keeps winner/loser cleanup and cancellation paths bounded and
            reviewable after #1419 lands.

          ## Scope

          This is the first sequential follow-up to #1419. Mixed-workload
          benchmark tooling remains deferred to the next unit; no benchmark
          publication is included here.

          ## Validation

          The sequencer reconstructs this unit from its isolated source range
          on current `dev` and runs the focused RouteWise tests plus repository
          quality gates before publication.
        validation:
          - [uv, run, ruff, format, --check, "."]
          - [uv, run, ruff, check, --no-fix, "."]
          - [uv, run, pytest, -q, tests/unit/routing/test_routewise_hedging.py, tests/unit/routing/test_routewise_router.py]
      - id: prefill-benchmarks
        branch: prep/1419-prefill-benchmarks
        source_ref: origin/prep/1419-prefill-benchmarks-v3
        source_base: ee9c169e80dc6928193480686e3952becd0bdc09
        source_tip: 74c6c606f10d3e58769dfdf02127af61515f5a94
        title: "bench(routewise): validate prefill-load routing"
        body: |
          ## Summary

          - Adds the deferred mixed-workload prefill benchmark and validation
            coverage for the completed RouteWise lifecycle.

          ## Scope

          This is the measurement-only follow-up after the #1419 foundation and
          its reviewable lifecycle unit have landed. It does not change the
          routing implementation or combine later work.

          ## Validation

          The sequencer reconstructs only this benchmark unit on current `dev`
          and runs the focused benchmark tests plus repository quality gates
          before publication.
        validation:
          - [uv, run, ruff, format, --check, "."]
          - [uv, run, ruff, check, --no-fix, "."]
          - [uv, run, pytest, -q, tests/benchmarks/test_prefill_load_benchmark.py, tests/benchmarks/test_prefill_load_validation.py]

