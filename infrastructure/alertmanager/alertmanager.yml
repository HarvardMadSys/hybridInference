route:
  receiver: blackhole
  group_by: ['alertname']
  group_wait: 1m
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Allowlist: only forward these actionable alerts to the local alert logger.
    # Configure external notification receivers from alertmanager.yml.example
    # without committing webhook URLs or SMTP credentials.
    # Everything else falls through to the blackhole default receiver.
    - match_re:
        alertname: "ServiceDown|ServiceUnreachable|DatabaseDisconnected"
      receiver: alert-logger

receivers:
  - name: blackhole
  - name: alert-logger
    webhook_configs:
      - url: 'http://alert-logger:5001/alerts'
        send_resolved: true
