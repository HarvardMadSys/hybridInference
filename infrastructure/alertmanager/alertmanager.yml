route:
  receiver: blackhole
  group_by: ['alertname']
  group_wait: 1m
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Allowlist: only forward these 3 actionable alerts to Slack + logger.
    # Everything else falls through to the blackhole default receiver.
    - match_re:
        alertname: "ServiceDown|ServiceUnreachable|DatabaseDisconnected"
      receiver: slack-default
      continue: true
    - match_re:
        alertname: "ServiceDown|ServiceUnreachable|DatabaseDisconnected"
      receiver: alert-logger

receivers:
  - name: blackhole
  - name: slack-default
    slack_configs:
      - send_resolved: true
        api_url: https://hooks.slack.com/services/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
        channel: '#free-inference-alert'
        title: '{{ if eq .Status "resolved" }}[RESOLVED] {{ end }}[ALERT] {{ .CommonAnnotations.summary }}'
        text: >-
          {{ range .Alerts }}
          {{ if eq .Status "resolved" }}:white_check_mark:{{ else }}:rotating_light:{{ end }}
          *{{ .Labels.alertname }}* ({{ .Labels.severity }})
            {{ .Annotations.description }}
          {{ end }}
  - name: alert-logger
    webhook_configs:
      - url: 'http://127.0.0.1:5001/alerts'
        send_resolved: true
