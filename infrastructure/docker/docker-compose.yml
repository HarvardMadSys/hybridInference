# Docker Compose configuration for hybridInference
#
# Usage (via Makefile from project root — recommended):
#   make up            Start all services
#   make down          Stop all services
#   make ps            Show running services
#   make logs s=backend  Tail logs for a specific service
#   make build         Rebuild images and restart
#
# Or directly:
#   docker compose -f infrastructure/docker/docker-compose.yml --env-file .env up -d
#   docker compose -f infrastructure/docker/docker-compose.yml --env-file .env --profile admin up -d

# Pin the project name so volume names are deterministic regardless of CWD.
# Volumes will always be: hybridinference_postgres_data, hybridinference_prometheus_data, etc.
name: hybridinference

services:
  # ===== Application =====

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: hybridinference-backend
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"     # always use container-internal port; DB_PORT in .env controls host mapping only
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../config:/app/config:ro
      - ../../var/data:/app/var/data          # subscription adapter credentials (read-write)
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hybridinference

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://freeinference.org}
        NEXT_PUBLIC_DEPLOY_TARGET: ${NEXT_PUBLIC_DEPLOY_TARGET:-production}
        NEXT_PUBLIC_BUILD_SHA: ${BUILD_SHA:-}
        NEXT_PUBLIC_BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: hybridinference-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
    ports:
      - "${FRONTEND_HOST:-0.0.0.0}:${FRONTEND_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hybridinference

  # ===== Database =====

  postgres:
    image: postgres:16
    container_name: hybridinference-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env file}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env file}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    networks:
      - hybridinference

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: hybridinference-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "${PGADMIN_CONFIG_SERVER_MODE:-False}"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      SCRIPT_NAME: /pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hybridinference
    profiles:
      - admin

  # ===== Observability =====

  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: hybridinference-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - hybridinference

  alertmanager:
    image: prom/alertmanager:v0.31.1
    container_name: hybridinference-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - hybridinference

  alert-logger:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.alert-logger
    container_name: hybridinference-alert-logger
    restart: unless-stopped
    volumes:
      - alert_log_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',5001),2); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - hybridinference

  grafana:
    image: grafana/grafana:12.1.1
    container_name: hybridinference-grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "https://freeinference.org/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Only the DB credentials needed by datasource provisioning.
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - hybridinference

volumes:
  postgres_data:
    external: true
    name: hybridinference_postgres_data
  pgadmin_data:
    driver: local
  prometheus_data:
    external: true
    name: hybridinference_prometheus_data
  alertmanager_data:
    external: true
    name: hybridinference_alertmanager_data
  alert_log_data:
    external: true
    name: hybridinference_alert_log_data
  grafana_data:
    external: true
    name: hybridinference_grafana_data

networks:
  hybridinference:
    driver: bridge
