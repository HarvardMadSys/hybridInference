# FreeInference reverse proxy template.
# Copy this file to /etc/nginx/sites-available/freeinference.conf and symlink it
# into /etc/nginx/sites-enabled/ once the upstream services are ready.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream freeinference_api {
    # Move the backend off of port 80 once Nginx is in front, e.g. 8080.
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream freeinference_web {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name freeinference.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name freeinference.org;

    ssl_certificate /etc/letsencrypt/live/freeinference.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freeinference.org/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=63072000" always;

    access_log /var/log/nginx/freeinference.access.log;
    error_log /var/log/nginx/freeinference.error.log warn;

    # Public LLM API endpoints such as https://freeinference.org/v1/...
    location ^~ /v1/ {
        proxy_pass http://freeinference_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Web app backend API for auth/user dashboard, e.g. /auth/login, /user/me
    location ^~ /auth/ {
        proxy_pass http://freeinference_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /user/ {
        proxy_pass http://freeinference_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Admin dashboard (FastAPI Admin UI)
    location ^~ /admin/ {
        proxy_pass http://freeinference_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }


    # All other paths serve the front-end app on port 3001.
    location / {
        proxy_pass http://freeinference_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
