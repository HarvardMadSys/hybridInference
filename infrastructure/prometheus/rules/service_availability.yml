groups:
  - name: service-availability
    interval: 30s
    rules:
      # Instance is down (up==0) - process crashed or unreachable
      - alert: ServiceDown
        expr: up{job="app"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API Service is Down"
          description: "Instance {{ $labels.instance }} is down (up==0) for >2m."

      # No up series at all - Prometheus cannot scrape the job
      - alert: ServiceUnreachable
        expr: absent(up{job="app"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API Service Unreachable"
          description: "Prometheus cannot scrape job=app (no up series)."

      # Database connection lost or metric missing
      # Uses min_over_time to reduce false positives from transient failures
      - alert: DatabaseDisconnected
        expr: (min_over_time(database_connected{job="app"}[30s]) == 0) or absent(database_connected{job="app"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database Connection Lost"
          description: "DB disconnected or metric missing on {{ $labels.instance }} for >2m. Users will receive 500 errors for authenticated requests."

