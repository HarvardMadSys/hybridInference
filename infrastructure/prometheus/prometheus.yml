global:
  # Default for local/dev; consider 30s in production to reduce overhead.
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    source: internal

scrape_configs:
  - job_name: app
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8080"]
    relabel_configs: []

  # Example: blackbox probe (requires blackbox-exporter running)
  # - job_name: blackbox
  #   metrics_path: /probe
  #   params:
  #     module: [http_2xx]
  #   static_configs:
  #     - targets:
  #       - http://localhost:8000/health
  #       - http://localhost:8000/metrics
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: __param_target
  #     - source_labels: [__param_target]
  #       target_label: instance
  #     - target_label: __address__
  #       replacement: 127.0.0.1:9115 # blackbox-exporter

rule_files: []
# Note: previously referenced rules/service_availability.yml which was
# removed in commit ec0dec4 ("remove prometheus + grafana, keep
# alertmanager + alert-logger"). The rules depended on `up{job="app"}`
# and the `database_connected` gauge, both of which no longer exist —
# `prometheus-client` was dropped and metrics are no-op shims. Re-add
# rule files here only after a metrics source is wired back in.

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]  # Alertmanager address
