[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-inference"
version = "0.1.0"
description = "Hybrid inference server, provide local deployment and offline API to openrouter"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "HarvardSys" }]
dependencies = [
    "aiohttp>=3.8.0",
    "APScheduler>=3.10.4",
    "boto3>=1.28.0",
    "asyncpg>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.110.0",
    "google-genai>=1.33.0",
    "openai>=1.0.0",
    "passlib[argon2]>=1.7.4",
    "pulp>=2.7.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyJWT>=2.8.0",
    "python-dotenv>=1.1.1",
    "python-ulid>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "uvicorn[standard]>=0.27.0",
    "uvloop>=0.19.0",
    "httpx>=0.28.1",
    "cryptography>=47.0.0",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.12",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["apps/backend"]
include = [
  "serving",
  "serving.*",
  "routing",
  "routing.*",
  "benchmark",
  "benchmark.*",
  "utils",
  "utils.*",
]

[tool.pytest.ini_options]
pythonpath = ["apps/backend", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 300
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov-branch",
  "--maxfail=10",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "perf: performance regression tests",
  "external: tests that hit external/local servers",
  "dbtest: tests that require a running PostgreSQL test database",
  "d1: tests that require live Cloudflare D1 credentials (D1_ACCOUNT_ID, D1_DATABASE_ID, D1_API_TOKEN)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["apps/backend", "."]
exclude = [
  "services/llm-prober",
  "docs/free_inference",
  "services/freeinference-harness",
  ".venv",
]

[tool.ruff.lint]
extend-select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "RUF", # Ruff-specific rules
]
ignore = [
  "E203",  # whitespace before ':' (black/pep8 conflict)
  "E501",  # line too long (handled by formatter)
  "E402",  # module import not at top of file (for now)
  "B008",  # FastAPI Depends pattern is OK
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydocstyle]
convention = "google"
add-ignore = [
  "D104",  # missing docstring in public package
  "D105",  # magic method docstring not required
  "D107",  # __init__ docstring not required
]
match = ".+\\.py"
match-dir = "(?!tests|.venv|node_modules|apps/frontend).*"

[dependency-groups]
dev = [
  "ruff>=0.5.0",
  "pydocstyle>=6.3.0",
  "pre-commit>=3.6.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.14.0",
  "pytest-xdist>=3.6.0",
  "httpx>=0.27.0",
  "sphinx>=8.1.3",
  "myst-parser>=4.0.1",
  "sphinx-rtd-theme>=3.0.2",
  "mypy>=1.20.2",
  "pytest-timeout>=2.3.0",
]
