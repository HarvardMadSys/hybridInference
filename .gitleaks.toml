[extend]
useDefault = true

[[allowlists]]
description = "Documented placeholder API keys and intentionally blank example secrets."
regexTarget = "line"
regexes = [
  '''(?i)(authorization|x-api-key):\s*(bearer\s*)?(hyi-your-api-key|your-api-key|<your-api-key>|YOUR_API_KEY)''',
  '''(?i)api_url:\s*https://hooks\.slack\.com/services/T000/B000/XXXX''',
  '''(?i)^(DB_PASSWORD|PGADMIN_PASSWORD)=\s*$''',
  '''(?i)DB_PASSWORD=\s*\nDB_ENABLED=true''',
]

# Public ShareGPT-derived dataset. Tokens inside its `prompt_text` fields are
# example credentials embedded in user conversations, not org secrets. New
# real org secrets must not be added to this file.
[[allowlists]]
description = "ShareGPT training dataset (external content)"
paths = [
  '''^dataset/sharegpt_direct\.jsonl$''',
]
