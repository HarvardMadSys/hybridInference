groups:
  - name: external-probe
    interval: 30s
    rules:
      - alert: ExternalServiceDown
        expr: probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "FreeInference is unreachable from external"
          description: "External probe to freeinference.org failed for >2m."
