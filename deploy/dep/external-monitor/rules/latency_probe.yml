groups:
  - name: llm-latency-probe
    interval: 5m
    rules:
      - alert: LLMProbeDown
        expr: llm_probe_success == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "LLM probe failing for {{ $labels.target }}"
          description: >
            The latency prober has been unable to complete a request to
            {{ $labels.target }} (model: {{ $labels.model }}) for >5 minutes.
            This may indicate the gateway is down or the API key is invalid.

      - alert: LLMProbeTTFTHigh
        expr: llm_probe_ttft_seconds > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High TTFT on {{ $labels.target }}"
          description: >
            Time-to-first-token for {{ $labels.target }} ({{ $labels.model }})
            has been above 5s for >10 minutes (current: {{ $value | humanizeDuration }}).

      - alert: LLMProbeThroughputLow
        expr: llm_probe_throughput_tokens_per_second < 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low throughput on {{ $labels.target }}"
          description: >
            Output throughput for {{ $labels.target }} ({{ $labels.model }})
            has been below 5 tokens/sec for >10 minutes
            (current: {{ $value | humanize }} tok/s).
