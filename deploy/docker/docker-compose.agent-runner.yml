# Self-hosted agent runners (issue #1041).
#
# Overlay, not a replacement: compose this alongside the main stack when you
# want jobs executed on your own machines instead of GitHub Actions.
#
#   docker compose -f deploy/docker/docker-compose.yml \
#                  -f deploy/docker/docker-compose.agent-runner.yml up -d
#
# Concurrency is AGENT_RUNNER_REPLICAS, and it lives here rather than in a
# `--scale` flag on purpose: each runner takes ONE job at a time and only
# claims the next when that one finishes, so the replica count *is* the number
# of jobs the deployment can run at once. A `--scale` typed by hand survives
# until the next deploy runs `docker compose up` without it and silently drops
# the fleet back to one — which reads as "everyone is queueing" long after
# anyone remembers scaling it.
#
# Replicas need no coordination: AgentJobStore.claim_job uses FOR UPDATE SKIP
# LOCKED, so they share one queue with no leader and no sharding, and a replica
# dying mid-job is handled by the lease reaper rather than by anything here.
# Budget roughly one sandbox's limits (4g / 2 cpus by default) per replica.
#
# The runner is the TRUSTED side. It holds the dispatcher credential and the
# full capability token, and it spawns a disposable sandbox per job — only a
# model-scoped token crosses into that sandbox. That is why this service mounts
# the Docker socket and the sandbox does not: the boundary is between the
# runner and the container it starts, not around the runner itself.

services:
  # The gateway also joins the sandbox's network. Without this the sandbox has
  # an internal network with nothing on it: the model calls and the event
  # reporting that make a job work both go to the gateway, so a sandbox that
  # cannot reach it fails every job at the first request.
  backend:
    environment:
      AGENT_WORKSPACE_BROKER_URL: http://agent-workspace-broker:8092
      # Reuse the already-required trusted-service credential by default.  It
      # never reaches the browser or sandbox; a deployment can split the
      # secret later without changing the protocol.
      AGENT_WORKSPACE_BROKER_TOKEN: ${AGENT_DISPATCHER_TOKEN:?dispatcher credential is required}
    networks:
      - hybridinference
      - agent-egress

  agent-workspace-broker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent-runner
      secrets:
        - github_token
    restart: unless-stopped
    environment:
      AGENT_WORKSPACE_BROKER_TOKEN: ${AGENT_DISPATCHER_TOKEN:?dispatcher credential is required}
      AGENT_WORKDIR_ROOT: ${AGENT_WORKDIR_ROOT:-/var/lib/hybridinference/agent-jobs}
      AGENT_SANDBOX_BACKEND: ${AGENT_SANDBOX_BACKEND:-kata}
      AGENT_SANDBOX_IMAGE: ${AGENT_SANDBOX_IMAGE:?name the sandbox image this deployment runs}
      AGENT_EGRESS_NETWORK_PLATFORM_ONLY: ${AGENT_EGRESS_NETWORK_PLATFORM_ONLY:-agent-egress}
      AGENT_EGRESS_SETUP_TIER: ${AGENT_EGRESS_SETUP_TIER:-platform_only}
      AGENT_EGRESS_AGENT_TIER: ${AGENT_EGRESS_AGENT_TIER:-platform_only}
      AGENT_EGRESS_NETWORK_TRUSTED: ${AGENT_EGRESS_NETWORK_TRUSTED:-}
      AGENT_EGRESS_NETWORK_CUSTOM: ${AGENT_EGRESS_NETWORK_CUSTOM:-}
      AGENT_EGRESS_NETWORK_FULL: ${AGENT_EGRESS_NETWORK_FULL:-}
      AGENT_EGRESS_ALLOWLIST: ${AGENT_EGRESS_ALLOWLIST:-}
    command:
      - python
      - -m
      - serving.agent_jobs.workspace_broker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${AGENT_WORKDIR_ROOT:-/var/lib/hybridinference/agent-jobs}:${AGENT_WORKDIR_ROOT:-/var/lib/hybridinference/agent-jobs}
    networks:
      - hybridinference
    depends_on:
      - backend

  agent-runner:
    # How many jobs this deployment runs at once — one per replica. Compose
    # honours `deploy.replicas` for `up` outside swarm, so the count survives
    # a deploy instead of depending on someone re-typing --scale.
    deploy:
      replicas: ${AGENT_RUNNER_REPLICAS:-3}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent-runner
      secrets:
        - github_token
    restart: unless-stopped
    environment:
      AGENT_GATEWAY_URL: ${AGENT_GATEWAY_URL:-http://backend:8080}
      AGENT_DISPATCHER_TOKEN: ${AGENT_DISPATCHER_TOKEN:?dispatcher credential is required}

      # Isolation. `kata` gives each job its own kernel and is what untrusted
      # multi-tenant code needs; `container` shares the host kernel and is a
      # reasonable choice only for repositories you already trust.
      AGENT_SANDBOX_BACKEND: ${AGENT_SANDBOX_BACKEND:-kata}
      # Required, not defaulted. Upstream publishes no images, so any default
      # here names a registry path that does not resolve, and a runner that
      # pulls nothing fails one job at a time, far from the cause. The deploy
      # scripts do not invoke this file, so it never sees an overlay env file;
      # whoever launches the runner supplies this.
      AGENT_SANDBOX_IMAGE: ${AGENT_SANDBOX_IMAGE:?name the sandbox image this deployment runs}

      # Who published commits are attributed to; the code's defaults name the
      # software rather than one site.
      AGENT_GIT_AUTHOR_NAME: ${AGENT_GIT_AUTHOR_NAME:-}
      AGENT_GIT_AUTHOR_EMAIL: ${AGENT_GIT_AUTHOR_EMAIL:-}

      # Where job directories live — identical inside this container and on the
      # host, which the bind mount below depends on rather than merely prefers.
      AGENT_WORKDIR_ROOT: ${AGENT_WORKDIR_ROOT:-/var/lib/hybridinference/agent-jobs}
      AGENT_WORKSPACE_TTL_S: ${AGENT_WORKSPACE_TTL_S:-604800}

      # Egress policy. `agent-egress` is an internal network with no route to
      # the internet: a sandbox on it reaches the gateway (models + event
      # reporting) and nothing else. This is the *closed* tier and must stay
      # the network the gateway is on — a setup tier with an allowlist proxy is
      # AGENT_EGRESS_NETWORK_TRUSTED, which this overlay does not ship.
      # Egress is a per-phase tier, not one network. `platform_only` reaches
      # the gateway and nothing else; `trusted` additionally reaches whatever
      # the setup network is fronted by, for installing dependencies. The agent
      # turn — the one driven by untrusted model output — gets the closed one.
      # One variable decides all three: the network compose creates, the one
      # the gateway joins, and the one the runner spawns onto. AGENT_SANDBOX_NETWORK
      # is deliberately not set here — the tier variable shadows it, so offering
      # both invited an override that silently did nothing.
      AGENT_EGRESS_NETWORK_PLATFORM_ONLY: ${AGENT_EGRESS_NETWORK_PLATFORM_ONLY:-agent-egress}
      AGENT_EGRESS_SETUP_TIER: ${AGENT_EGRESS_SETUP_TIER:-platform_only}
      AGENT_EGRESS_AGENT_TIER: ${AGENT_EGRESS_AGENT_TIER:-platform_only}
      # The other tiers' networks must be passed through too, or selecting a
      # tier here sets the name and not the network — the runner then refuses
      # at preflight with "names no network", which is correct but baffling
      # when the operator did set the variable in their .env.
      AGENT_EGRESS_NETWORK_TRUSTED: ${AGENT_EGRESS_NETWORK_TRUSTED:-}
      AGENT_EGRESS_NETWORK_CUSTOM: ${AGENT_EGRESS_NETWORK_CUSTOM:-}
      AGENT_EGRESS_NETWORK_FULL: ${AGENT_EGRESS_NETWORK_FULL:-}
      AGENT_EGRESS_ALLOWLIST: ${AGENT_EGRESS_ALLOWLIST:-}

      # Setup snapshots. Keyed on repository + setup script, so a retry or a
      # later job with the same dependencies restores the tree instead of
      # reinstalling. Same-path bind as the worktrees, for the same reason.
      AGENT_SNAPSHOT_ROOT: ${AGENT_SNAPSHOT_ROOT:-/var/lib/hybridinference/agent-snapshots}
      AGENT_SNAPSHOT_TTL_S: ${AGENT_SNAPSHOT_TTL_S:-604800}

      AGENT_LEASE_TTL: ${AGENT_LEASE_TTL:-120}
      AGENT_TIMEOUT_S: ${AGENT_TIMEOUT_S:-3600}
    command:
      - python
      - -m
      - serving.agent_jobs.runner
      - --loop
      # No --worker-id: the flag would pin every replica to the same literal,
      # and `lease_owner` is how an operator tells them apart. The runner
      # derives `${AGENT_WORKER_ID:-runner}-<container hostname>`, so the
      # configured value still groups the fleet while each member is distinct.
      - --workdir-root
      - ${AGENT_WORKDIR_ROOT:-/var/lib/hybridinference/agent-jobs}
    volumes:
      # The runner starts the sandbox containers, so it needs the daemon.
      # Read-only: the runner creates and removes its own containers and has no
      # business reconfiguring the daemon.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Job worktrees, bind-mounted **at the same path inside and out**. This
      # has to be a host path, and it has to be the same string on both sides:
      # the runner asks the daemon to bind-mount each job directory into the
      # sandbox, and the daemon resolves that path on the *host*, not inside
      # this container. A named volume looks like it works right up until every
      # job dies at spawn with exit 125.
      - ${AGENT_WORKDIR_ROOT:-/var/lib/hybridinference/agent-jobs}:${AGENT_WORKDIR_ROOT:-/var/lib/hybridinference/agent-jobs}
      - ${AGENT_SNAPSHOT_ROOT:-/var/lib/hybridinference/agent-snapshots}:${AGENT_SNAPSHOT_ROOT:-/var/lib/hybridinference/agent-snapshots}
    networks:
      - hybridinference
    depends_on:
      - backend

networks:
  agent-egress:
    # Explicit name: Compose prefixes generated network names with the project
    # ("hybridinference_agent-egress"), but the runner passes this value
    # straight to `docker run --network`. Without the pin, every sandbox
    # spawn fails on a network the daemon has never heard of.
    name: ${AGENT_EGRESS_NETWORK_PLATFORM_ONLY:-agent-egress}
    # internal: no gateway to the outside world. The sandbox can talk to
    # services on this network and nothing else, which is the PlatformOnly
    # tier from the design doc expressed as infrastructure rather than policy
    # an agent could talk its way around.
    internal: true
