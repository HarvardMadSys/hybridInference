# Docker Compose configuration for hybridInference
#
# Usage (via Makefile from project root — recommended):
#   make up            Start all services
#   make down          Stop all services
#   make ps            Show running services
#   make logs s=backend  Tail logs for a specific service
#   make build         Rebuild images and restart
#
# Or directly:
#   docker compose -f deploy/docker/docker-compose.yml --env-file .env up -d
#   docker compose -f deploy/docker/docker-compose.yml --env-file .env --profile admin up -d

# Pin the project name so volume names are deterministic regardless of CWD.
# Volumes will always be: hybridinference_postgres_data, hybridinference_pgadmin_data, etc.
name: hybridinference

services:
  # ===== Application =====

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      secrets:
        # Token for installing the private routewise git dependency. Sourced
        # from the GITHUB_TOKEN env var of the compose invocation (the deploy
        # workflows export ROUTEWISE_GITHUB_TOKEN); empty when unset locally.
        - github_token
    container_name: hybridinference-backend
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"     # always use container-internal port; DB_PORT in .env controls host mapping only
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-1}
      # Opt-in only. Trusting CF-Connecting-IP is safe solely when the origin
      # cannot be reached except through Cloudflare (Authenticated Origin Pulls
      # or a Cloudflare IP allowlist) — otherwise anyone hitting the origin
      # directly can forge it. Set to 1 in .env once that is true.
      TRUST_CLOUDFLARE_HEADERS: ${TRUST_CLOUDFLARE_HEADERS:-0}
      GEOIP_COUNTRY_DB: /app/var/data/geoip/dbip-country-lite.mmdb
      GEOIP_COUNTRY_PROVIDER: dbip-lite
      # Alert thresholds and inboxes belong to a deployment, so upstream
      # ships none. This default names a path a clone does not have, and
      # the loader falls back to built-in defaults there — which is right
      # for a clone and wrong for a deployment, so a deployment names its
      # own file in distributions/*/deploy/backend.env. Losing that line
      # would swap production's thresholds for the defaults in silence,
      # which is why a test pins it. Empty upstream because there is no
      # example alerts file to point at and the built-in thresholds are a
      # working answer — a dangling path would not be.
      ALERTS_CONFIG_PATH: ${ALERTS_CONFIG_PATH-}
      # Same shape, sharper edge: without this a deployment loses its whole
      # endpoint map and every health-check setting, and the gateway starts
      # anyway — verified by booting with the file absent. Pinned by a test.
      ROUTING_CONFIG_PATH: ${ROUTING_CONFIG_PATH-}
      # The last of the three, and the only one that fails loudly: without a
      # registry there are no models, /v1/models is empty, and every request
      # is a 404. A deployment names its own; a clone starts from
      # config/examples/.
      MODELS_CONFIG_PATH: ${MODELS_CONFIG_PATH-}
      # Which distribution manifest supplies the three paths above, and
      # whether it is applied or only compared. Neutral upstream sets neither:
      # a clone has no overlay, and an unset path leaves the loader inert.
      # A deployment names its own in distributions/*/deploy/backend.env —
      # these lines are what carry it from that file into the container, which
      # the --env-file layer alone does not do.
      DISTRIBUTION_CONFIG_PATH: ${DISTRIBUTION_CONFIG_PATH-}
      DISTRIBUTION_CONFIG_MODE: ${DISTRIBUTION_CONFIG_MODE-}
      # Which environment alerts are labelled with. Left unset upstream so
      # the existing inference from the base URL still applies; a
      # deployment states it outright, because inferring it makes the
      # label depend on whether someone remembered a line in the server's
      # .env — which is not something you can check by reading the repo.
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV-}
      # Identity rendered into emails, links, CORS, the docs-assistant prompt
      # and OpenRouter attribution. The defaults below name no deployment, so
      # `docker compose up` on a fresh clone brings up *your* gateway, not
      # someone else's. A deployment supplies its own values through an env
      # file (see distributions/*/deploy/backend.env and ops/deploy/*.sh);
      # the server's own .env still overrides each one.
      SITE_NAME: ${SITE_NAME-HybridInference}
      SITE_PUBLIC_BASE_URL: ${SITE_PUBLIC_BASE_URL-}
      SITE_DOCS_URL: ${SITE_DOCS_URL-}
      SITE_SUPPORT_EMAIL: ${SITE_SUPPORT_EMAIL-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL-noreply@localhost}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME-HybridInference}
      BASE_URL: ${BASE_URL-}
      FRONTEND_URL: ${FRONTEND_URL-http://localhost:3001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,https://localhost:8443,https://127.0.0.1:8443}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../config:/app/config:ro
      # Distribution overlay (read-only): mounted rather than baked into the
      # image so the neutral image never carries distribution content. Inert
      # unless DISTRIBUTION_CONFIG_PATH is set in .env.
      - ../../distributions:/app/distributions:ro
      - ../../var/data:/app/var/data          # credentials and downloaded GeoIP data (read-write)
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hybridinference

  codex-oncall:
    profiles: ["oncall"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.oncall
    container_name: hybridinference-codex-oncall
    restart: unless-stopped
    init: true
    env_file:
      - ${CODEX_ONCALL_ENV_FILE:-../../.env.oncall}
    environment:
      CODEX_ONCALL_STATE_DIR: /var/lib/codex-oncall
      HOME: /var/lib/codex-oncall
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - codex_oncall_data:/var/lib/codex-oncall
    ports:
      - "127.0.0.1:${CODEX_ONCALL_PORT:-8091}:8091"
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - hybridinference

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        # Console identity. Every value below is empty by default, and the
        # console's own code supplies a neutral fallback for each, so a clone
        # builds a console that names no deployment. A deployment fills these
        # in through an env file (distributions/*/deploy/frontend.env, fed to
        # `docker compose --env-file` by ops/deploy/*.sh); the server's .env
        # still overrides any of them.
        # Explicitly local rather than empty: the console resolves an empty
        # value through `||`, and with DEPLOY_TARGET defaulting to production
        # that lands on the upstream author's own gateway. Where requests go
        # is the one value that must not depend on a fallback elsewhere.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE-http://localhost:8080}
        NEXT_PUBLIC_DEPLOY_TARGET: ${NEXT_PUBLIC_DEPLOY_TARGET:-production}
        NEXT_PUBLIC_BUILD_SHA: ${BUILD_SHA:-}
        NEXT_PUBLIC_BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME-}
        NEXT_PUBLIC_APP_DESCRIPTION: ${NEXT_PUBLIC_APP_DESCRIPTION-}
        NEXT_PUBLIC_SITE_HOST: ${NEXT_PUBLIC_SITE_HOST-}
        NEXT_PUBLIC_ORG_NAME: ${NEXT_PUBLIC_ORG_NAME-}
        NEXT_PUBLIC_ORG_URL: ${NEXT_PUBLIC_ORG_URL-}
        NEXT_PUBLIC_ORG_TAGLINE: ${NEXT_PUBLIC_ORG_TAGLINE-}
        NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL-}
        NEXT_PUBLIC_STATUS_URL: ${NEXT_PUBLIC_STATUS_URL-}
        # The upstream project's own repository, not a deployment's: a fork
        # that wants its own overrides it like any other value.
        NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL-https://github.com/HarvardMadSys/hybridInference}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL-}
        NEXT_PUBLIC_EXAMPLE_API_BASE: ${NEXT_PUBLIC_EXAMPLE_API_BASE-}
        NEXT_PUBLIC_EXAMPLE_API_KEY_ENV_VAR: ${NEXT_PUBLIC_EXAMPLE_API_KEY_ENV_VAR-}
        NEXT_PUBLIC_EXAMPLE_MODEL: ${NEXT_PUBLIC_EXAMPLE_MODEL-}
        NEXT_PUBLIC_STATCOUNTER_PROJECT_ID: ${NEXT_PUBLIC_STATCOUNTER_PROJECT_ID-}
        NEXT_PUBLIC_STATCOUNTER_SECURITY_KEY: ${NEXT_PUBLIC_STATCOUNTER_SECURITY_KEY-}
        NEXT_PUBLIC_FAST_TRACK_DOMAIN: ${NEXT_PUBLIC_FAST_TRACK_DOMAIN-}
        NEXT_PUBLIC_FAST_TRACK_ORG: ${NEXT_PUBLIC_FAST_TRACK_ORG-}
        NEXT_PUBLIC_STORAGE_KEY_PREFIX: ${NEXT_PUBLIC_STORAGE_KEY_PREFIX-}
        NEXT_PUBLIC_DATA_POLICY_NOTICE: ${NEXT_PUBLIC_DATA_POLICY_NOTICE-}
        NEXT_PUBLIC_TEAM_JSON: ${NEXT_PUBLIC_TEAM_JSON-}
        NEXT_PUBLIC_SPONSORS_JSON: ${NEXT_PUBLIC_SPONSORS_JSON-}
        NEXT_PUBLIC_TEAM_IMAGE_HOST: ${NEXT_PUBLIC_TEAM_IMAGE_HOST-}
    container_name: hybridinference-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
    ports:
      - "${FRONTEND_HOST:-0.0.0.0}:${FRONTEND_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hybridinference

  # ===== Database =====

  postgres:
    image: postgres:16
    container_name: hybridinference-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env file}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env file}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    networks:
      - hybridinference

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: hybridinference-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "${PGADMIN_CONFIG_SERVER_MODE:-False}"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      SCRIPT_NAME: /pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hybridinference
    profiles:
      - admin

volumes:
  postgres_data:
    external: true
    name: hybridinference_postgres_data
  pgadmin_data:
    driver: local
  codex_oncall_data:
    driver: local

networks:
  hybridinference:
    driver: bridge

secrets:
  github_token:
    environment: GITHUB_TOKEN
