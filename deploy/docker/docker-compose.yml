# Docker Compose configuration for hybridInference
#
# Usage (via Makefile from project root — recommended):
#   make up            Start all services
#   make down          Stop all services
#   make ps            Show running services
#   make logs s=backend  Tail logs for a specific service
#   make build         Rebuild images and restart
#
# Or directly:
#   docker compose -f deploy/docker/docker-compose.yml --env-file .env up -d
#   docker compose -f deploy/docker/docker-compose.yml --env-file .env --profile admin up -d

# Pin the project name so volume names are deterministic regardless of CWD.
# Volumes will always be: hybridinference_postgres_data, hybridinference_pgadmin_data, etc.
name: hybridinference

services:
  # ===== Application =====

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
      secrets:
        # Token for installing the private routewise git dependency. Sourced
        # from the GITHUB_TOKEN env var of the compose invocation (the deploy
        # workflows export ROUTEWISE_GITHUB_TOKEN); empty when unset locally.
        - github_token
    container_name: hybridinference-backend
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"     # always use container-internal port; DB_PORT in .env controls host mapping only
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-1}
      # Opt-in only. Trusting CF-Connecting-IP is safe solely when the origin
      # cannot be reached except through Cloudflare (Authenticated Origin Pulls
      # or a Cloudflare IP allowlist) — otherwise anyone hitting the origin
      # directly can forge it. Set to 1 in .env once that is true.
      # See docs/developer/freeinference.md#client-ip-resolution.
      TRUST_CLOUDFLARE_HEADERS: ${TRUST_CLOUDFLARE_HEADERS:-0}
      GEOIP_COUNTRY_DB: /app/var/data/geoip/dbip-country-lite.mmdb
      GEOIP_COUNTRY_PROVIDER: dbip-lite
      # Identity rendered into emails, the docs-assistant prompt, quota help
      # text and OpenRouter attribution. Supplied here so the upstream code
      # defaults can stay neutral; .env still overrides each one.
      SITE_NAME: ${SITE_NAME-FreeInference}
      SITE_PUBLIC_BASE_URL: ${SITE_PUBLIC_BASE_URL-https://freeinference.org}
      SITE_DOCS_URL: ${SITE_DOCS_URL-https://doc.freeinference.org}
      SITE_SUPPORT_EMAIL: ${SITE_SUPPORT_EMAIL-admin@freeinference.org}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../config:/app/config:ro
      # Distribution overlay (read-only): mounted rather than baked into the
      # image so the neutral image never carries distribution content. Inert
      # unless DISTRIBUTION_CONFIG_PATH is set in .env.
      - ../../distributions:/app/distributions:ro
      - ../../var/data:/app/var/data          # credentials and downloaded GeoIP data (read-write)
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hybridinference

  codex-oncall:
    profiles: ["oncall"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.oncall
    container_name: hybridinference-codex-oncall
    restart: unless-stopped
    init: true
    env_file:
      - ${CODEX_ONCALL_ENV_FILE:-../../.env.oncall}
    environment:
      CODEX_ONCALL_STATE_DIR: /var/lib/codex-oncall
      HOME: /var/lib/codex-oncall
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - codex_oncall_data:/var/lib/codex-oncall
    ports:
      - "127.0.0.1:${CODEX_ONCALL_PORT:-8091}:8091"
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - hybridinference

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://freeinference.org}
        NEXT_PUBLIC_DEPLOY_TARGET: ${NEXT_PUBLIC_DEPLOY_TARGET:-production}
        NEXT_PUBLIC_BUILD_SHA: ${BUILD_SHA:-}
        NEXT_PUBLIC_BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME-FreeInference}
        NEXT_PUBLIC_APP_DESCRIPTION: ${NEXT_PUBLIC_APP_DESCRIPTION-Free LLM inference for research, built at Harvard SEAS.}
        NEXT_PUBLIC_SITE_HOST: ${NEXT_PUBLIC_SITE_HOST-freeinference.org}
        NEXT_PUBLIC_ORG_NAME: ${NEXT_PUBLIC_ORG_NAME-Harvard SEAS}
        NEXT_PUBLIC_ORG_URL: ${NEXT_PUBLIC_ORG_URL-https://madsys.seas.harvard.edu}
        NEXT_PUBLIC_ORG_TAGLINE: ${NEXT_PUBLIC_ORG_TAGLINE-Built at Harvard SEAS · MadSys Lab}
        NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL-https://doc.freeinference.org/}
        NEXT_PUBLIC_STATUS_URL: ${NEXT_PUBLIC_STATUS_URL-https://status.staging.freeinference.org/}
        NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL-https://github.com/HarvardMadSys/hybridInference}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL-admin@freeinference.org}
        NEXT_PUBLIC_EXAMPLE_API_BASE: ${NEXT_PUBLIC_EXAMPLE_API_BASE-https://freeinference.org}
        NEXT_PUBLIC_EXAMPLE_API_KEY_ENV_VAR: ${NEXT_PUBLIC_EXAMPLE_API_KEY_ENV_VAR-FREEINFERENCE_API_KEY}
        NEXT_PUBLIC_EXAMPLE_MODEL: ${NEXT_PUBLIC_EXAMPLE_MODEL-glm-5.1}
        # Use `${VAR-default}` (not `:-`) so an explicit empty value can
        # disable analytics and the signup fast-track hint.
        NEXT_PUBLIC_STATCOUNTER_PROJECT_ID: ${NEXT_PUBLIC_STATCOUNTER_PROJECT_ID-13224568}
        NEXT_PUBLIC_STATCOUNTER_SECURITY_KEY: ${NEXT_PUBLIC_STATCOUNTER_SECURITY_KEY-2d8ab84a}
        NEXT_PUBLIC_FAST_TRACK_DOMAIN: ${NEXT_PUBLIC_FAST_TRACK_DOMAIN-harvard.edu}
        NEXT_PUBLIC_FAST_TRACK_ORG: ${NEXT_PUBLIC_FAST_TRACK_ORG-Harvard}
        NEXT_PUBLIC_STORAGE_KEY_PREFIX: ${NEXT_PUBLIC_STORAGE_KEY_PREFIX-freeinference}
        NEXT_PUBLIC_TEAM_JSON: ${NEXT_PUBLIC_TEAM_JSON-}
        NEXT_PUBLIC_SPONSORS_JSON: ${NEXT_PUBLIC_SPONSORS_JSON-}
        NEXT_PUBLIC_TEAM_IMAGE_HOST: ${NEXT_PUBLIC_TEAM_IMAGE_HOST-junchengyang.com}
    container_name: hybridinference-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
    ports:
      - "${FRONTEND_HOST:-0.0.0.0}:${FRONTEND_PORT:-3001}:3001"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hybridinference

  # ===== Database =====

  postgres:
    image: postgres:16
    container_name: hybridinference-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env file}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env file}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    networks:
      - hybridinference

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: hybridinference-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "${PGADMIN_CONFIG_SERVER_MODE:-False}"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      SCRIPT_NAME: /pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hybridinference
    profiles:
      - admin

volumes:
  postgres_data:
    external: true
    name: hybridinference_postgres_data
  pgadmin_data:
    driver: local
  codex_oncall_data:
    driver: local

networks:
  hybridinference:
    driver: bridge

secrets:
  github_token:
    environment: GITHUB_TOKEN
