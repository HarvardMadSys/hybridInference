# Docker Compose configuration for hybridInference
#
# Usage (via Makefile from project root — recommended):
#   make up            Start all services
#   make down          Stop all services
#   make ps            Show running services
#   make logs s=backend  Tail logs for a specific service
#   make build         Rebuild images and restart
#
# Or directly:
#   docker compose -f deploy/docker/docker-compose.yml --env-file .env up -d
#   docker compose -f deploy/docker/docker-compose.yml --env-file .env --profile admin up -d

# Pin the project name so volume names are deterministic regardless of CWD.
# Volumes will always be: hybridinference_postgres_data, hybridinference_pgadmin_data, etc.
name: hybridinference

# Every service rotates its log. Docker's json-file driver otherwise keeps a
# container's whole log, on the disk Postgres uses, and the backend logs
# request headers at INFO: a client sending large headers could fill that
# disk. The driver stays json-file, so `docker logs` and anything reading the
# files work as before; each container keeps at most 5 files of 100 MB.
#
# A service's logging is part of its configuration, so the first `make up`
# after this recreates each running service once, Postgres included: a
# restart of a few seconds.
x-logging: &logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  # ===== Application =====

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: hybridinference-backend
    restart: unless-stopped
    logging: *logging
    # A deploy or a restart stops the backend with SIGTERM, then SIGKILL once
    # the grace period ends (10 s unless set). Open requests get 5 s
    # (--timeout-graceful-shutdown in Dockerfile.backend), and the shutdown
    # that writes queued request-log rows and unflushed costs has the rest.
    # A container keeps the grace period it was created with, so the first
    # `make up` after this still stops the old backend at 10 s.
    stop_grace_period: 30s
    # Open files, which for the gateway are sockets: one for each request in
    # flight, another to the model server it is relayed to, and the database
    # pool. Unless told otherwise Docker passes a container its daemon's
    # limits, under systemd's defaults a soft one of 1024, and a gateway that
    # has reached it accepts no connection, a health check included. 65536 is
    # what deploy/systemd/*.service give the same process. The console needs
    # no line: Node raises its soft limit to the hard one when it starts.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Source-revision stamp on the running container. A digest deploy sets
    # BUILD_SHA to the image's revision label. The digest path's last-known-good
    # restore reads this label back from the container it is about to replace
    # — image and revision from the same object — and fails closed when the
    # label is absent rather than guessing from the checkout HEAD.
    labels:
      org.opencontainers.image.revision: ${BUILD_SHA:-}
    # Production keeps using the repo-root .env. A public, secret-free example
    # may point BACKEND_ENV_FILE at its checked-in local defaults instead.
    env_file: ${BACKEND_ENV_FILE:-../../.env}
    # Most names below are application settings, which live in the database
    # and are edited under Admin > Configuration. These lines carry an overlay's
    # values into the container, where the backend copies each one into the
    # database at startup when the database has none yet; after that the stored
    # value wins. The database connection, GeoIP paths and restart declaration
    # stay environment-only.
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"     # always use container-internal port; DB_PORT in .env controls host mapping only
      # `restart: unless-stopped` above starts the backend again when it exits,
      # which is what lets Admin > Configuration offer "Restart backend". An
      # override that drops the policy must drop this line with it.
      SUPERVISOR_RESTARTS_BACKEND: "1"
      # Fail closed: the compose default does NOT trust forwarding headers.
      # Proxy-header processing is inert without a non-empty TRUSTED_PROXIES /
      # TRUSTED_CLOUDFLARE_NETWORKS authorizing the socket peer. Those two and
      # both TRUST_*_HEADERS switches are application settings, copied into the
      # database the first time the environment gives them a value, as
      # described above. This line always gives one, its 0, so the first boot
      # stores it. Set the proxy topology in .env before that boot; afterwards
      # change these settings under Admin > Configuration or with
      # `python -m serving.config.manage set`, because a stored value ignores
      # later .env edits.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
      # Opt-in only. Trusting CF-Connecting-IP is safe solely when the origin
      # cannot be reached except through Cloudflare (Authenticated Origin Pulls
      # or a Cloudflare IP allowlist) — otherwise anyone hitting the origin
      # directly can forge it. Turn it on once that is true; as with
      # TRUST_PROXY_HEADERS, after the first boot that is done under
      # Admin > Configuration, not in .env.
      TRUST_CLOUDFLARE_HEADERS: ${TRUST_CLOUDFLARE_HEADERS:-0}
      GEOIP_COUNTRY_DB: /app/var/data/geoip/dbip-country-lite.mmdb
      GEOIP_COUNTRY_PROVIDER: dbip-lite
      # Application documents are stored in Admin/database settings.
      # Optional JSON environment seeds are for explicit local demos only.
      MODEL_CATALOG: ${MODEL_CATALOG-}
      ROUTING_POLICY: ${ROUTING_POLICY-}
      ALERT_RULES: ${ALERT_RULES-}
      SITE_CONFIGURATION: ${SITE_CONFIGURATION-}
      SITE_BRANDING: ${SITE_BRANDING-}
      # Retired selectors, kept for the rollback window. This release reads
      # the documents above from the database and ignores these, warning at
      # boot while one is set; the release before it read its manifest and its
      # model, routing and alert files through them. A deploy that fails
      # acceptance, and `make rollback`, start that release again from this
      # file, and these lines are what carry a deployment's values -- from its
      # overlay's deploy/*.env or .env -- into its container, which the
      # --env-file layer alone does not do. `import-legacy`, run in the new
      # image, reads ALERTS_CONFIG_PATH from here too. Remove the values once
      # no earlier release will run.
      #
      # No value here, so Compose takes each one from those files or the
      # shell, and a selector set nowhere stays out of the container: unset is
      # what the previous release expects (its mode then defaults to dark),
      # and a default here would outrank its manifest.
      DISTRIBUTION_CONFIG_PATH:
      DISTRIBUTION_CONFIG_MODE:
      MODELS_CONFIG_PATH:
      ROUTING_CONFIG_PATH:
      ALERTS_CONFIG_PATH:
      # Which environment alerts are labelled with. Left unset upstream so
      # the existing inference from the base URL still applies; a
      # deployment states it outright, because inferring it makes the
      # label depend on whether someone remembered a line in the server's
      # .env — which is not something you can check by reading the repo.
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV-}
      # Identity rendered into emails, links, CORS, the docs-assistant prompt
      # and OpenRouter attribution. The defaults below name no deployment, so
      # `docker compose up` on a fresh clone brings up *your* gateway, not
      # someone else's. A deployment supplies its own values through an env
      # file (see distributions/*/deploy/backend.env);
      # the server's own .env still overrides each one.
      SITE_NAME: ${SITE_NAME-HybridInference}
      SITE_PUBLIC_BASE_URL: ${SITE_PUBLIC_BASE_URL-}
      SITE_DOCS_URL: ${SITE_DOCS_URL-}
      SITE_SUPPORT_EMAIL: ${SITE_SUPPORT_EMAIL-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL-noreply@localhost}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME-HybridInference}
      BASE_URL: ${BASE_URL-}
      FRONTEND_URL: ${FRONTEND_URL-http://localhost:3001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,https://localhost:8443,https://127.0.0.1:8443}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Trusted deployment extension code and assets stay outside the neutral
      # image. Application documents are read from the database.
      - ../../distributions:/app/distributions:ro
      - ../../var/data:/app/var/data          # credentials and downloaded GeoIP data (read-write)
    ports:
      - "${BACKEND_HOST:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    # The gateway runs as root (see Dockerfile.backend for why), so what it may
    # do is bounded here instead: no privilege gained through exec, and none of
    # root's capabilities but the four that let it read and write the files
    # mounted above whoever owns them. Gone are raw sockets, changing user,
    # signalling other processes, binding low ports and the rest.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hybridinference

  frontend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        # Transition compatibility for local/source builds and pre-W7 branded
        # distributions. Canonical published consoles omit every identity
        # value below and load the active deployment through /site-config at
        # runtime. Empty defaults keep a fresh clone neutral.
        # Explicitly local when omitted. An explicitly supplied empty string is
        # distinct: the console preserves it as a same-origin API base, which
        # distributions can combine with the Next.js rewrites below.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE-http://localhost:8080}
        BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL-http://backend:8080}
        NEXT_PUBLIC_DEPLOY_TARGET: ${NEXT_PUBLIC_DEPLOY_TARGET:-production}
        NEXT_PUBLIC_BUILD_SHA: ${BUILD_SHA:-}
        NEXT_PUBLIC_BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME-}
        NEXT_PUBLIC_APP_DESCRIPTION: ${NEXT_PUBLIC_APP_DESCRIPTION-}
        NEXT_PUBLIC_SITE_HOST: ${NEXT_PUBLIC_SITE_HOST-}
        NEXT_PUBLIC_ORG_NAME: ${NEXT_PUBLIC_ORG_NAME-}
        NEXT_PUBLIC_ORG_URL: ${NEXT_PUBLIC_ORG_URL-}
        NEXT_PUBLIC_ORG_TAGLINE: ${NEXT_PUBLIC_ORG_TAGLINE-}
        NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL-}
        NEXT_PUBLIC_STATUS_URL: ${NEXT_PUBLIC_STATUS_URL-}
        # The upstream project's own repository, not a deployment's: a fork
        # that wants its own overrides it like any other value.
        NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL-https://github.com/HarvardMadSys/hybridInference}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL-}
        NEXT_PUBLIC_EXAMPLE_API_BASE: ${NEXT_PUBLIC_EXAMPLE_API_BASE-}
        NEXT_PUBLIC_EXAMPLE_API_KEY_ENV_VAR: ${NEXT_PUBLIC_EXAMPLE_API_KEY_ENV_VAR-}
        NEXT_PUBLIC_EXAMPLE_MODEL: ${NEXT_PUBLIC_EXAMPLE_MODEL-}
        NEXT_PUBLIC_STATCOUNTER_PROJECT_ID: ${NEXT_PUBLIC_STATCOUNTER_PROJECT_ID-}
        NEXT_PUBLIC_STATCOUNTER_SECURITY_KEY: ${NEXT_PUBLIC_STATCOUNTER_SECURITY_KEY-}
        NEXT_PUBLIC_FAST_TRACK_DOMAIN: ${NEXT_PUBLIC_FAST_TRACK_DOMAIN-}
        NEXT_PUBLIC_FAST_TRACK_ORG: ${NEXT_PUBLIC_FAST_TRACK_ORG-}
        NEXT_PUBLIC_STORAGE_KEY_PREFIX: ${NEXT_PUBLIC_STORAGE_KEY_PREFIX-}
        NEXT_PUBLIC_DATA_POLICY_NOTICE: ${NEXT_PUBLIC_DATA_POLICY_NOTICE-}
        NEXT_PUBLIC_TEAM_JSON: ${NEXT_PUBLIC_TEAM_JSON-}
        NEXT_PUBLIC_SPONSORS_JSON: ${NEXT_PUBLIC_SPONSORS_JSON-}
        # Agent targets are deliberately absent here. The Dockerfile still
        # accepts them for pre-W7 downstream build pipelines, but passing this
        # deployment's runtime values into a source build would compile legacy
        # beforeFiles rewrites that outrank the runtime route handler below.
    container_name: hybridinference-frontend
    restart: unless-stopped
    # A ceiling on what this container can take from the host. The console
    # fronts the whole API; request bodies stream through it to the gateway,
    # and of a body sent to anything else Next copies no more than
    # middlewareClientMaxBodySize (apps/frontend/next.config.js). Past the
    # ceiling the kernel ends this container, which `restart` brings back,
    # instead of starving the backend and the database on the same host.
    # FRONTEND_MEM_LIMIT raises it for a deployment that needs more.
    mem_limit: ${FRONTEND_MEM_LIMIT:-1g}
    environment:
      NODE_ENV: production
      PORT: "3001"
      # BACKEND_INTERNAL_URL is deliberately absent here. Next compiles it into
      # both the rewrite table and BUILT_BACKEND_INTERNAL_URL; changing only a
      # running container would otherwise split backend traffic across targets.
      # The server-side pgAdmin proxy must strip the same session cookie the
      # backend issues. Production keeps the established default; local
      # side-by-side deployments can choose a collision-free name.
      REFRESH_TOKEN_COOKIE_NAME: ${REFRESH_TOKEN_COOKIE_NAME:-refresh_token}
      # Read on every request by the server-only `/agents` route. Both must be
      # set or the route truthfully answers 404. The values never reach the
      # browser bundle.
      AGENT_WEB_INTERNAL_URL: ${AGENT_WEB_INTERNAL_URL-}
      AGENT_CONTROL_PLANE_INTERNAL_URL: ${AGENT_CONTROL_PLANE_INTERNAL_URL-}
      # Optional public entry point for an agent served on its own origin.
      # This enables the dashboard link without enabling the /agents proxy.
      AGENT_PUBLIC_URL: ${AGENT_PUBLIC_URL-}
      # Absolute path inside this container to a dedicated, read-only branding
      # image directory. Deployment overlays that use it also bind-mount that
      # directory. A file there wins over one of the same path packaged with the
      # image's UI module; unset, `/site-assets/*` serves only the packaged
      # assets, which the neutral image has none of.
      SITE_ASSETS_DIR: ${SITE_ASSETS_DIR-}
    ports:
      - "${FRONTEND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3001}:3001"
    logging: *logging
    # The image runs as an unprivileged user and needs no capability at all.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        # Ordering only, deliberately not service_healthy. The console is a
        # separate app the tunnel routes to independently of the API, so gating
        # it on backend health converts a *degraded* backend into a total site
        # outage: the backend reports unhealthy whenever its database logging is
        # down, compose then refuses to start the frontend, and every path the
        # tunnel serves through it 502s — including the API paths that were
        # answering fine. That is a real outage this project has had.
        condition: service_started
    networks:
      - hybridinference
      # Where it reaches pgAdmin for /pgadmin; see the pgadmin service.
      - pgadmin

  # ===== Database =====

  # An exact release, so that no pull changes the database under a running
  # stack: 16.15 is what `postgres:16` named when this was pinned. On a host
  # whose local `postgres:16` is older, the first `make up` after this pulls
  # 16.15 and restarts the database on it, a minor upgrade. Bump it by hand,
  # after reading that release's notes. Pinning the digest too
  # (`postgres:16.15@sha256:...`) closes the tag moving under it; Dependabot
  # (.github/dependabot.yml) then keeps tag and digest current.
  postgres:
    image: postgres:16.15
    container_name: hybridinference-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env file}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env file}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    # The entrypoint starts as root, fixes ownership of the data directory and
    # switches to the postgres user itself; nothing it runs gains a privilege
    # through exec. Its capabilities are left as they are: which of them that
    # startup needs is not something to find out on a production restart.
    security_opt:
      - no-new-privileges:true
    networks:
      - hybridinference
      # pgAdmin reaches the database here, not on `hybridinference`.
      - pgadmin

  # Reached through the console at /pgadmin/, which gates it on an admin
  # session — see apps/frontend/src/app/pgadmin/[[...path]]/route.ts — and
  # pgAdmin asks for its own login behind that check: SERVER_MODE defaults to
  # True. False serves pgAdmin with no login of its own, leaving the console's
  # check the only gate. Changing SCRIPT_NAME means changing the path the
  # route handler serves.
  #
  # It publishes no host port. A loopback port handed pgAdmin, its saved
  # database connection included, to every account on the host, past the
  # console's check; `PGADMIN_PUBLISH=1` adds one for an SSH tunnel
  # (docker-compose.pgadmin-port.yml).
  #
  # The login is PGADMIN_EMAIL / PGADMIN_PASSWORD, and there is no fallback
  # password: with none set, pgAdmin refuses to set up a new volume and says
  # so in its log. A `${PGADMIN_PASSWORD:?}` here would say it sooner but stop
  # every Compose command, since Compose reads every service, those of
  # profiles not in use included. pgAdmin keeps the login it first started
  # with in its volume and ignores these afterwards: a volume first started
  # with no password has admin@local.dev / admin, and one first started with
  # SERVER_MODE False has no login at all (docs/developer/database.md).
  #
  # The `admin` profile means nothing starts this unless a profile is named:
  # `make up COMPOSE_PROFILES=admin`, or an env file the deploy reads (a
  # distribution's `deploy/compose.env`).
  #
  # It is on its own network, `pgadmin`, shared only with the console that
  # proxies it and the database it manages. On `hybridinference` every other
  # service -- the internet-facing backend first -- could open pgAdmin, which
  # with SERVER_MODE False asks for no login. The image binds port 80 as an
  # unprivileged user through a file capability, which `no-new-privileges` or
  # dropping capabilities would take away, so neither is set here.
  #
  # An exact release, not a moving major tag: pgAdmin 8 is past its end of
  # life, and a pull should never change the version under a running stack.
  # pgAdmin upgrades its own settings database on the first start of a newer
  # release; the volume then cannot go back to an older one.
  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: hybridinference-pgadmin
    restart: unless-stopped
    logging: *logging
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD-}
      PGADMIN_CONFIG_SERVER_MODE: "${PGADMIN_CONFIG_SERVER_MODE:-True}"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      SCRIPT_NAME: /pgadmin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pgadmin
    profiles:
      - admin

volumes:
  postgres_data:
    external: true
    name: hybridinference_postgres_data
  pgadmin_data:
    driver: local

networks:
  hybridinference:
    driver: bridge
  # pgAdmin, the console that proxies it and the database it manages: see the
  # pgadmin service.
  pgadmin:
    driver: bridge
