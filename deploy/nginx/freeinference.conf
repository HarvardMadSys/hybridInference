# FreeInference reverse proxy template.
# Copy this file to /etc/nginx/sites-available/freeinference.conf and symlink it
# into /etc/nginx/sites-enabled/ once the upstream services are ready.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Trusted upstream proxies (Cloudflare). For requests arriving from these
# CIDRs, Nginx replaces $remote_addr with the value of CF-Connecting-IP, which
# Cloudflare sets to the real client IP and is not derived from any
# client-supplied header. The locations below then forward
# `X-Forwarded-For: $remote_addr` (overwrite, not append) so the backend's
# get_client_ip() always sees the true client IP and a direct
# (Cloudflare-bypass) client cannot spoof the leftmost XFF entry.
#
# Source: https://www.cloudflare.com/ips/  (refresh periodically).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

upstream freeinference_api {
    # Move the backend off of port 80 once Nginx is in front, e.g. 8080.
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream freeinference_web {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name freeinference.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name freeinference.org;

    ssl_certificate /etc/ssl/freeinference/fullchain.pem;
    ssl_certificate_key /etc/ssl/freeinference/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Restore real client IP from Cloudflare — generated by setup_nginx.sh
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    access_log /var/log/nginx/freeinference.access.log;
    error_log /var/log/nginx/freeinference.error.log warn;

    # Public LLM API endpoints such as https://freeinference.org/v1/...
    # Cloudflare upstream timeout is 100s; set ours slightly higher so the
    # bottleneck is always at the Cloudflare edge, not here.
    location ^~ /v1/ {
        client_max_body_size 50m;
        proxy_pass http://freeinference_api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Always overwrite (don't append) so a Cloudflare-bypass client cannot
        # inject a spoofed leftmost X-Forwarded-For entry. $remote_addr is the
        # true client IP for connections from Cloudflare (rewritten via
        # real_ip_header CF-Connecting-IP above) and the peer IP for any
        # direct connection.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Web app backend API for auth/user dashboard, e.g. /auth/login, /user/me
    location ^~ /auth/ {
        proxy_pass http://freeinference_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Always overwrite (don't append) so a Cloudflare-bypass client cannot
        # inject a spoofed leftmost X-Forwarded-For entry. $remote_addr is the
        # true client IP for connections from Cloudflare (rewritten via
        # real_ip_header CF-Connecting-IP above) and the peer IP for any
        # direct connection.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /user/ {
        proxy_pass http://freeinference_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Always overwrite (don't append) so a Cloudflare-bypass client cannot
        # inject a spoofed leftmost X-Forwarded-For entry. $remote_addr is the
        # true client IP for connections from Cloudflare (rewritten via
        # real_ip_header CF-Connecting-IP above) and the peer IP for any
        # direct connection.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Admin dashboard (FastAPI Admin UI)
    location ^~ /admin/ {
        proxy_pass http://freeinference_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Always overwrite (don't append) so a Cloudflare-bypass client cannot
        # inject a spoofed leftmost X-Forwarded-For entry. $remote_addr is the
        # true client IP for connections from Cloudflare (rewritten via
        # real_ip_header CF-Connecting-IP above) and the peer IP for any
        # direct connection.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Nginx auth subrequest endpoints (internal only)
    location = /internal/verify-admin {
        internal;
        proxy_pass http://127.0.0.1:8080/internal/verify-admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @admin_login {
        return 302 /login;
    }

    location @admin_forbidden {
        default_type text/html;
        return 403 '<html><body><h1>403 Forbidden</h1><p>Admin access required. <a href="/dashboard">Back to Dashboard</a></p></body></html>';
    }

    # pgAdmin — admin-only via dedicated auth_request endpoint
    location = /pgadmin { return 302 /pgadmin/; }
    location ^~ /pgadmin/ {
        auth_request /internal/verify-admin;
        error_page 401 = @admin_login;
        error_page 403 = @admin_forbidden;

        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Always overwrite (don't append) so a Cloudflare-bypass client cannot
        # inject a spoofed leftmost X-Forwarded-For entry. $remote_addr is the
        # true client IP for connections from Cloudflare (rewritten via
        # real_ip_header CF-Connecting-IP above) and the peer IP for any
        # direct connection.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Script-Name /pgadmin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Playground API — explicitly proxied (keep /internal/ namespace private by default)
    location ^~ /internal/playground/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Always overwrite (don't append) so a Cloudflare-bypass client cannot
        # inject a spoofed leftmost X-Forwarded-For entry. $remote_addr is the
        # true client IP for connections from Cloudflare (rewritten via
        # real_ip_header CF-Connecting-IP above) and the peer IP for any
        # direct connection.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other paths serve the front-end app on port 3001.
    location / {
        # Block fake Next.js Server Action requests (bot/scanner traffic).
        # This app does not use Server Actions.
        if ($http_next_action) {
            return 403;
        }

        proxy_pass http://freeinference_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Always overwrite (don't append) so a Cloudflare-bypass client cannot
        # inject a spoofed leftmost X-Forwarded-For entry. $remote_addr is the
        # true client IP for connections from Cloudflare (rewritten via
        # real_ip_header CF-Connecting-IP above) and the peer IP for any
        # direct connection.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
