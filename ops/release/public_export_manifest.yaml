# What the public export leaves behind.
#
# The split design settles the publication route as "new public repository +
# filtered export" and forbids rewriting this repository's history, so the
# export carries a tree, not a past. Which tree is the question this file
# answers — and until now it was answered only by a parenthetical in the design
# doc ("排除 distributions/、ops/db/analysis 及公开面审计标记的内容"), where the
# last clause names an audit whose results had never been written down.
#
# Two rules keep this honest, both enforced by
# tests/unit/release/test_public_export_manifest.py:
#
#   1. Every path here exists. A stale entry is worse than no entry — it reads
#      as protection that is no longer protecting anything.
#   2. What survives the exclusions passes the public-surface audit. If a
#      credential, a personal mailbox, or a cluster path appears in the exported
#      tree, the test fails and names it.
#
# Run `python ops/release/public_export.py` to see what today's export would
# carry, and what it would leak.

schema_version: 1

# Settled by the split design.
exclude:
  - path: distributions/
    reason: >-
      Distribution overlays are the visibility boundary by construction: real
      model directories, alert thresholds, machine scripts, RAG corpora, site
      identity. The whole point of the overlay is that it does not travel.

  - path: ops/db/analysis/
    reason: >-
      Ad-hoc queries against the production database, written against real user
      accounts. Named in the design doc's exclusion list for that reason.

  # A test whose subject is excluded has to go with it. Found by building the
  # export tree and collecting in it: both import ops.db.analysis, so the
  # exported suite could not start — 2 collection errors, from a repository
  # that otherwise looks fine.
  - path: tests/unit/analytics/test_geo_exporter.py
    reason: Tests ops/db/analysis/geo_hourly_export.py, which does not travel.
  - path: tests/unit/ops/test_trace_viewer_core.py
    reason: Tests the trace viewer in ops/db/analysis/, which does not travel.
  - path: tests/test_local_deployment_proxy.py
    reason: Tests ops/local_deployment_proxy/, one deployment's GPU orchestration.
  - path: tests/test_spark_idle_proxy.py
    reason: Tests ops/spark_idle_proxy/, the DGX Spark box's idle proxy.
  - path: tests/unit/deploy/test_geoip_deployment.py
    reason: Asserts what this deployment's deploy scripts install; both go together.
  - path: tests/unit/release/test_public_export_manifest.py
    reason: >-
      Checks this manifest, which is part of the export tooling rather than of
      the result — ops/release/ does not travel either.

  # Found the same way as the rest: build the export tree and run it. Each of
  # these asserts something about a directory the export removes, so they fail
  # in the result while passing here.
  - path: tests/unit/deploy/test_oncall_container.py
    reason: Asserts the on-call image build, which lives in services/.
  - path: tests/unit/deploy/test_status_monitor_control_plane_workflow.py
    reason: Asserts the status-monitor deploy workflow and its wrangler pin.
  - path: tests/unit/deploy/test_slack_readback_gate_workflow.py
    reason: Asserts a workflow in .github/workflows/, which the export replaces.
  - path: tests/unit/observability/test_control_plane_contract.py
    reason: >-
      Reads the alert control plane's shared fixtures from
      services/alert-control-plane-worker/test/, which does not travel.
  - path: tests/unit/config/test_distribution_manifests_discovery.py
    reason: >-
      Asserts that this deployment's manifest resolves its config inside the
      overlay — a claim about distributions/, which the export removes. The
      overlay keeps its own copy of the same check.

# Flagged by the public-surface audit (2026-07-28). Each entry cites what was
# found, so a future reader can re-judge rather than inherit a bare rule.
  # ops/ is not uniformly this deployment's, and excluding it wholesale was a
  # mistake: it took `create_admin.py` with it, and there is no other documented
  # way to make the first admin account, so the exported gateway could not be
  # opened. Judged per directory instead, by how much of each names this site's
  # machines.
  - path: ops/release/
    reason: >-
      The export tooling belongs to whoever runs the export, not to the result.
      It also names this deployment's hosts in its own reasons — the audit
      caught that, reading this file, which is the tool working on itself.

  - path: ops/deploy/
    reason: Deploy scripts pinned to this deployment's hosts and directory layout.

  - path: ops/h200_idle_proxy/
    reason: One machine's idle proxy — every file in it names that machine.

  - path: ops/spark_idle_proxy/
    reason: As above, for the DGX Spark box.

  - path: ops/local_deployment_proxy/
    reason: >-
      The reverse-tunnel proxy for this deployment's local GPUs, named after its
      hosts throughout.

  - path: ops/setup/setup_cloudflared.sh
    reason: This deployment's ingress choice, with its tunnel topology.

  - path: ops/setup/setup_anthropic.sh
    reason: This deployment's provider setup.

  - path: ops/setup/setup_claude_code.sh
    reason: This deployment's agent tooling setup.

  - path: services/
    reason: >-
      Workers belonging to this deployment. Their wrangler configs carry the
      Cloudflare account id and D1 database id that the pre-publication
      checklist flags; excluding the tree is what makes parameterising them
      optional rather than blocking.

  - path: deploy/systemd/
    reason: >-
      Unit files named after this deployment, with reverse-tunnel targets
      naming internal.freeinference.org and the H200/Spark machines. The rest
      of deploy/ is generic and does travel.

  - path: docs/agents/
    reason: >-
      Design records and plans. They describe how this deployment reached its
      decisions, cite internal hosts and past incidents, and are the one place
      a live API key was found. Nothing downstream needs them.

  - path: docs/superpowers/
    reason: Same category as docs/agents/ — historical design records.

  - path: docs/reviews/
    reason: Review records naming reviewers and internal context.

  - path: docs/collaboration/
    optional: true   # untracked by design — absent from a fresh clone
    reason: >-
      Business correspondence naming people outside this project. Never
      committed (see .gitignore); listed so a directory-copy export excludes it
      too.

  - path: .workbuddy/
    optional: true   # untracked by design — absent from a fresh clone
    reason: >-
      Agent scratch memory. Never committed; listed for the same reason as
      docs/collaboration/.

  - path: tests/fixtures/data/
    optional: true   # #1075 deletes it outright; excluded either way
    reason: >-
      Third-party research datasets with their own terms and no attribution
      here. Being removed outright in #1075; excluded regardless so the export
      does not republish someone else's data under this project's licence.

# Decisions this file cannot make. The export tool refuses to run while any
# remain, so the list is short on purpose.
  # docs/developer/ is mixed, so it is split by name rather than dropped. The
  # four below are this deployment's own runbooks — the rest are how-tos any
  # operator needs and they travel. Same judgment as #1060, which left these
  # four unedited for the same reason: they move with the distribution instead
  # of being reworded into something generic and useless.
  - path: docs/developer/freeinference.md
    reason: This deployment's own Cloudflare + Nginx + FastAPI topology.
  - path: docs/developer/staging.md
    reason: This deployment's staging environment.
  - path: docs/developer/fasrc.md
    reason: >-
      A Harvard FASRC cluster runbook, down to login nodes and scratch
      directories. The audit's densest single source of host topology.
  - path: docs/developer/codex-oncall.md
    reason: This deployment's on-call pipeline.

  - path: config/models.yaml
    optional: true   # #1060 moves it into the overlay; the replacement below still applies
    reason: >-
      This deployment's production registry: fourteen models across its own
      provider accounts, needing twenty-four environment variables. A clone
      that inherited it would boot with nothing available and an error naming
      all twenty-four. Replaced by the reference registry — see `overlay:`.

  - path: config/routing.yaml
    optional: true   # #1060 moves it into the overlay; the replacement below still applies
    reason: >-
      This deployment's endpoint map, down to a model directory on a Harvard
      cluster. Replaced by the minimal example — see `overlay:`.

  - path: tests/fixtures/e2e_config.yaml
    reason: >-
      Names one deployment's e2e machines, including a model path on a Harvard
      cluster. The file's shape is generic, so it is replaced rather than
      dropped — see `overlay:`; deleting it would leave tests/e2e/ pointing at
      nothing.

  - path: .github/workflows/
    reason: >-
      Every job targets self-hosted runners this deployment owns, and the deploy
      workflows are its own. An exported repository whose CI cannot run is worse
      than one with no CI, so the export replaces the directory rather than
      carrying it — see `overlay:` below.

# Files the export adds that this repository does not have. The exported
# repository needs a CI that runs on runners anyone can reach, which is not the
# same file as the one this repository uses.
overlay:
  - path: .github/workflows/ci.yml
    source: ops/release/export_overlay/github-workflows-ci.yml
    reason: >-
      Lint, backend tests and frontend tests on GitHub-hosted runners. No
      deploy jobs, no self-hosted labels, no secrets — a fork can run it, which
      is the whole point.

  - path: deploy/systemd/hybridinference.service
    source: ops/release/export_overlay/deploy-systemd-hybridinference.service
    reason: >-
      Excluding deploy/systemd/ wholesale left an operator who does not want
      Docker with no systemd example at all — the same gap as taking
      create_admin.py out with ops/. This site's own unit cannot travel (it
      names its user and its install path), so the export supplies a template
      with those two as placeholders.

  - path: config/models.yaml
    source: config/examples/models.openrouter.yaml
    requires: "#1067"   # source lands with that PR; delete this line once it has
    reason: >-
      The default registry a clone starts from: three models behind one
      credential, including a local-first hybrid entry. Same file the README
      quickstart uses, so the documented path and the default path agree.

  - path: config/routing.yaml
    source: config/examples/routing.minimal.yaml
    requires: "#1067"   # source lands with that PR; delete this line once it has
    reason: >-
      Declares no endpoint at all. A fresh gateway knows about no machines
      until its operator adds theirs.

  - path: tests/fixtures/e2e_config.yaml
    source: ops/release/export_overlay/tests-fixtures-e2e_config.yaml
    reason: >-
      The same file with plain model ids instead of one cluster's paths. An
      `expected_model_id` has to match what your own server reports, so a path
      from somebody else's filesystem is wrong for you as well as a disclosure
      of their machine layout.

undecided: []

# ---------------------------------------------------------------------------
# What this list is *not*
#
# The split design has the overlay grow until it holds everything specific to a
# deployment, so that moving the deployment means moving one directory. That
# migration is staged and unfinished: distributions/freeinference/ currently
# holds four files, while the truth it is meant to carry still sits in config/,
# ops/, services/ and deploy/systemd/.
#
# This file excludes those in place instead. Which is enough for publishing —
# the public repository does not receive them either way — but it is not the
# same thing, and reading a clean audit as "the split is done" would be wrong.
#
# The useful consequence is the other direction: publishing does not have to
# wait for the migration. `exclude:` is also the inventory of what still has to
# move, so the two can proceed in either order.
# ---------------------------------------------------------------------------

# What the exported tree still leaks today, with the reason each is pending.
# The test treats this as a ceiling: anything new fails, and an entry that stops
# being found must be deleted, so the list can only shrink.
known_findings:
  - where: tests/fixtures/test_models.yaml
    what: cluster path
    pending: Fixed in #1082 — delete this entry once that merges.

  - where: apps/backend/serving/config/settings.py
    what: internal hostname
    pending: >-
      The CORS default still carries this site's origins on dev. Fixed in
      #1060, which moves them into the distribution overlay — delete this entry
      once that merges.

  - where: tests/unit/config/test_contract_settings_defaults.py
    what: internal hostname
    pending: Frozen contract for the CORS default above; flips with #1060.
