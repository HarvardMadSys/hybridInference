# CI for the exported public repository.
#
# Not a copy of this repository's .github/workflows/ci.yml: that one runs every
# job on self-hosted runners this deployment owns, which an exported repository
# cannot reach and a fork must never be given. This runs on GitHub-hosted
# runners, needs no secrets, and has no deploy jobs — so a contributor's fork
# gets the same answer a maintainer does.
#
# Installed by the filtered export (see ops/release/public_export_manifest.yaml,
# `overlay:`). It is not used by this repository.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: make lint UV_RUN="uv run"

      # Excludes the external and dbtest tiers: one calls live providers and
      # needs credentials, the other needs a database. Neither belongs in a
      # check that has to pass for a first-time contributor.
      - name: Test
        run: make test UV_RUN="uv run"

      # This is the same two-command contract documented for users. The fake
      # OpenAI-compatible upstream keeps it deterministic and secret-free.
      - name: Run runnable router example
        id: example-smoke
        env:
          COMPOSE_PROJECT_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}
          EXAMPLE_BACKEND_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-backend
          EXAMPLE_PROVIDER_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-provider
          BACKEND_PORT: "0"
        run: |
          make up DISTRIBUTION=example
          port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "8080/tcp") 0).HostPort}}' "${EXAMPLE_BACKEND_CONTAINER_NAME}")"
          test -n "${port}"
          SMOKE_BASE_URL="http://127.0.0.1:${port}" make smoke DISTRIBUTION=example

      - name: Show runnable example logs
        if: failure() && steps.example-smoke.outcome == 'failure'
        env:
          EXAMPLE_BACKEND_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-backend
          EXAMPLE_PROVIDER_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-provider
        run: |
          docker logs "${EXAMPLE_BACKEND_CONTAINER_NAME}" || true
          docker logs "${EXAMPLE_PROVIDER_CONTAINER_NAME}" || true

      - name: Stop runnable router example
        if: always()
        env:
          COMPOSE_PROJECT_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}
          EXAMPLE_BACKEND_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-backend
          EXAMPLE_PROVIDER_CONTAINER_NAME: hi-example-${{ github.run_id }}-${{ github.run_attempt }}-provider
          BACKEND_PORT: "0"
        run: |
          make down DISTRIBUTION=example || true
          docker image rm \
            "${COMPOSE_PROJECT_NAME}-backend" \
            "${COMPOSE_PROJECT_NAME}-example-provider" || true

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      # Next.js prerenders every static route here, so this fails on things
      # the three steps above cannot see. Without it a pull request that
      # type-checks, lints and unit-tests cleanly can still merge a build the
      # repository cannot ship.
      - name: Build
        run: npm run build
