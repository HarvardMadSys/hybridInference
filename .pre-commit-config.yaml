default_language_version:
  python: python3

# Run hooks on commit only to avoid re-linting the whole branch at push time.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
      # - id: no-commit-to-branch
      #   args: ["--branch", "main", "--branch", "master"]

  # Pin the same ruff version CI uses and lint the same files (whole repo) so
  # local commits can't pass while CI's repo-wide `ruff check/format .` fails.
  # Previously this hook pinned v0.5.6 and excluded ops/ + tests/, which let
  # unformatted / lint-violating ops scripts land on dev and turn CI red.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        additional_dependencies: ["tomli"]
        exclude: "^tests/"

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Frontend hooks
  - repo: https://github.com/pre-commit/mirrors-eslint
    # mirrors-eslint stops at v8.56.0; eslint 8.57.x and 9.x are not tagged.
    # additional_dependencies below pins the ACTUAL eslint version used at
    # hook execution (8.57.1 — required by @typescript-eslint 8.x peer dep).
    # The repo rev only governs the hook script, which is version-agnostic.
    rev: v8.56.0
    hooks:
      - id: eslint
        files: ^apps/frontend/.*\.[jt]sx?$
        types: [file]
        additional_dependencies:
          - eslint@8.57.1
          - eslint-config-next@15.5.15
          - eslint-config-prettier@9.1.2
          - "@typescript-eslint/parser@8.59.1"
          - "@typescript-eslint/eslint-plugin@8.59.1"
          - typescript@5.3.3
          - eslint-plugin-react@7.37.5
          - eslint-plugin-react-hooks@5.2.0
          - eslint-plugin-jsx-a11y@6.10.2

  # Use the maintained fork: pre-commit/mirrors-prettier is archived and stopped
  # tagging after v3.1.0, which pinned prettier 3.1.0 here while the frontend
  # (package-lock.json) and CI's `npm run format:check` use 3.8.3. That skew made
  # the hook rewrap template-literal/ternary lines that CI accepts, so every
  # frontend PR either churned unrelated lines or had to bypass the hook. rev
  # tracks the prettier release and additional_dependencies pins the ACTUAL
  # version to match the lockfile — keep both in sync when bumping prettier.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.3
    hooks:
      - id: prettier
        additional_dependencies: ["prettier@3.8.3"]
        files: ^apps/frontend/.*\.(ts|tsx|js|jsx|json|css|md)$
