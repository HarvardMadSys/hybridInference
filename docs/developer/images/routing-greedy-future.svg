  <path class="e" d="M762 610 L762 650" marker-end="url(#a)"/>
  <g>
    <rect class="n plain" x="290" y="20" width="320" height="62" rx="11"/>
    <text class="t" x="450" y="48">ModelRouterRegistry</text>
    <text class="d" x="450" y="69">model C</text>
  </g>
  <g>
    <rect class="n future" x="290" y="126" width="320" height="78" rx="11"/>
    <text class="t" x="450" y="162">GreedyRouter</text>
    <text class="d" x="450" y="183">not built yet · owns local admission</text>
  </g>
  <g>
