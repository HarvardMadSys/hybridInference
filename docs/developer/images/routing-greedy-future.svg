<svg xmlns="http://www.w3.org/2000/svg" width="900" height="790" viewBox="0 0 900 790" role="img" aria-labelledby="t-greedy-future d-greedy-future">
  <title id="t-greedy-future">Greedy with a cloud-scoped RouteWise</title>
  <desc id="d-greedy-future">A planned topology, not a configuration that exists. A future GreedyRouter, drawn dashed, either admits a local endpoint or delegates the cloud pool to a TreeBackend holding a cloud-scoped RouteWiseRouter. Those pool classes exist today; only the entry router and the configuration that would reach it are missing. Each selected cloud endpoint runs through its own LeafBackend and Adapter.</desc>
  <!-- Editable SVG source. No browser scripts, external fonts or build-time renderer. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse"><path d="M0 0.6L9.4 5L0 9.4Z" fill="#8b97a8"/></marker>
    <marker id="i" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9"
            orient="auto"><path d="M1.2 1.2L10.8 6L1.2 10.8Z" fill="#fbfcfe" stroke="#8b97a8"
            stroke-width="1.4"/></marker>
    <filter id="sh" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1f2a37" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; text-anchor: middle; fill: #1f2a37; }
    .t { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; font-size: 16px; font-weight: 600; fill: #111827; }
    .d { font-size: 13.5px; fill: #64748b; }
    .l { font-size: 12.5px; fill: #52607a; paint-order: stroke; stroke: #fbfcfe;
         stroke-width: 6px; stroke-linejoin: round; }
    .m { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; font-size: 12.5px; fill: #3f4c63; paint-order: stroke;
         stroke: #fbfcfe; stroke-width: 6px; stroke-linejoin: round; }
    .lg { font-size: 12.5px; fill: #64748b; text-anchor: start; }
    .ct { font-size: 12.5px; fill: #8b97a8; text-anchor: start; }
    .cm { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; font-size: 13px; fill: #3f4c63; text-anchor: start; }
    .cs { font-size: 12.3px; fill: #64748b; text-anchor: start; }
    .e { fill: none; stroke: #8b97a8; stroke-width: 1.8; stroke-linecap: round; }
    .dash { stroke-dasharray: 7 5; }
    .n { stroke-width: 1.5; filter: url(#sh); }
    .router { fill: #eef5ff; stroke: #5b8def; }
    .pool { fill: #f5f2ff; stroke: #8b7cd8; }
    .leaf { fill: #ecfbf4; stroke: #3aa987; }
    .plain { fill: #f7f9fc; stroke: #9fb0c4; }
    .future { fill: #fffaef; stroke: #d99a2b; stroke-dasharray: 7 5; }
  </style>
  <rect x="0.75" y="0.75" width="898.5" height="788.5" rx="14" fill="#fbfcfe" stroke="#e7ecf3"/>
  <path class="e dash" d="M450 82 L450 126" marker-end="url(#a)"/>
  <path class="e dash" d="M370 204 L370 233 Q370 244 359 244 L176 244 Q165 244 165 255 L165 296" marker-end="url(#a)"/>
  <path class="e dash" d="M530 204 L530 221 Q530 232 541 232 L629 232 Q640 232 640 243 L640 264" marker-end="url(#a)"/>
