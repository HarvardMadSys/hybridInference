    <text class="d" x="165" y="465">local</text>
  </g>
  <g>
    <rect class="n plain" x="35" y="528" width="260" height="66" rx="11"/>
    <text class="t" x="165" y="567">Owned local service</text>
  </g>
  <g>
    <rect class="n pool" x="450" y="264" width="400" height="92" rx="11"/>
    <text class="t" x="650" y="297">TreeBackend</text>
    <text class="d" x="650" y="318">scope = cloud</text>
    <text class="d" x="650" y="337">e.g. RouteWiseCloudBackend</text>
  </g>
  <g>
    <rect class="n router" x="450" y="396" width="400" height="80" rx="11"/>
    <text class="t" x="650" y="433">RouteWiseRouter</text>
    <text class="d" x="650" y="454">scope = cloud</text>
  </g>
  <g>
    <rect class="n leaf" x="400" y="544" width="215" height="66" rx="11"/>
    <text class="t" x="507.5" y="574">LeafBackend</text>
    <text class="d" x="507.5" y="595">cloud endpoint 1</text>
  </g>
  <g>
    <rect class="n leaf" x="655" y="544" width="215" height="66" rx="11"/>
    <text class="t" x="762.5" y="574">LeafBackend</text>
    <text class="d" x="762.5" y="595">cloud endpoint 2</text>
  </g>
  <g>
    <rect class="n plain" x="400" y="650" width="215" height="72" rx="11"/>
    <text class="t" x="507.5" y="683">Adapter</text>
    <text class="d" x="507.5" y="704">provider_type: concurrency</text>
  </g>
  <g>
    <rect class="n plain" x="655" y="650" width="215" height="72" rx="11"/>
    <text class="t" x="762.5" y="683">Adapter</text>
    <text class="d" x="762.5" y="704">provider_type: on_demand</text>
  </g>
  <text class="l" x="165" y="236">local admission succeeds</text>
  <text class="m" x="690" y="224">DelegatePool(cloud)</text>
  <text class="l" x="712" y="386">scoped router</text>
  <text class="l" x="600" y="504">selects one cloud endpoint</text>
  <g>
    <rect class="future" x="35" y="748" width="20" height="13" rx="4" stroke-width="1.5"/>
    <text class="lg" x="63" y="758">not built yet</text>
  </g>
  <text class="lg" x="185" y="758">every solid box is a class that exists today</text>
</svg>
