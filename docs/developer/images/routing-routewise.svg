<svg xmlns="http://www.w3.org/2000/svg" width="820" height="590" viewBox="0 0 820 590" role="img" aria-labelledby="t-routewise d-routewise">
  <title id="t-routewise">Full-pool RouteWise</title>
  <desc id="d-routewise">ModelRouterRegistry gives model A to RouteWiseRouter, whose candidate pool holds both local and cloud endpoints. Whichever endpoint it selects is executed through that endpoint's own LeafBackend and Adapter.</desc>
