    .d { font-size: 13.5px; fill: #64748b; }
    .l { font-size: 12.5px; fill: #52607a; paint-order: stroke; stroke: #fbfcfe;
         stroke-width: 6px; stroke-linejoin: round; }
    .m { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; font-size: 12.5px; fill: #3f4c63; paint-order: stroke;
         stroke: #fbfcfe; stroke-width: 6px; stroke-linejoin: round; }
    .lg { font-size: 12.5px; fill: #64748b; text-anchor: start; }
    .ct { font-size: 12.5px; fill: #8b97a8; text-anchor: start; }
    .cm { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; font-size: 13px; fill: #3f4c63; text-anchor: start; }
