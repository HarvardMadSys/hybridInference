<svg xmlns="http://www.w3.org/2000/svg" width="820" height="740" viewBox="0 0 820 740" role="img" aria-labelledby="title desc">
  <title id="title">Future Greedy with cloud-scoped RouteWise</title>
  <desc id="desc">Future extension, not a supported router configuration today. Greedy admits a local endpoint or delegates to a cloud TreeBackend. Its cloud RouteWise instance selects only cloud endpoints, each executed through its own LeafBackend and Adapter.</desc>
  <!-- Editable SVG source. No browser scripts, external fonts or build-time renderer. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="implements" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11Z" fill="white" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #172b4d; }
    .title { font-size: 18px; font-weight: 600; }
    .detail { font-size: 14px; fill: #475569; }
    .label { font-size: 14px; fill: #475569; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2; }
    .router { fill: #eff6ff; stroke: #4078b5; }
    .pool { fill: #f5f3ff; stroke: #8064ad; }
    .leaf { fill: #edfaf5; stroke: #35816c; }
    .plain { fill: #f8fafc; stroke: #94a3b8; }
    .future { fill: #fff9ed; stroke: #a86d12; stroke-dasharray: 7 5; }
    .node { stroke-width: 1.6; }
  </style>
  <rect width="820" height="740" fill="white"/>
  <path class="edge" d="M410 80V125" marker-end="url(#arrow)"/>
  <path class="edge" d="M335 200V240H145V309" marker-end="url(#arrow)"/>
  <path class="edge" d="M485 200V228H575V267" marker-end="url(#arrow)"/>
  <path class="edge" d="M145 373V420" marker-end="url(#arrow)"/>
  <path class="edge" d="M145 480V530" marker-end="url(#arrow)"/>
  <path class="edge" d="M575 335V385" marker-end="url(#arrow)"/>
  <path class="edge" d="M575 467V503H430V540" marker-end="url(#arrow)"/>
  <path class="edge" d="M575 503H680V540" marker-end="url(#arrow)"/>
  <path class="edge" d="M430 602V642" marker-end="url(#arrow)"/>
  <path class="edge" d="M680 602V642" marker-end="url(#arrow)"/>
  <g>
    <rect class="node plain" x="260" y="20" width="300" height="60" rx="10"/>
    <text class="title" x="410" y="45">ModelRouterRegistry</text>
    <text class="detail" x="410" y="67">model C</text>
  </g>
  <g>
    <rect class="node future" x="260" y="125" width="300" height="75" rx="10"/>
    <text class="title" x="410" y="157.5">GreedyRouter</text>
    <text class="detail" x="410" y="179.5">Future extension</text>
  </g>
  <g>
    <rect class="node leaf" x="20" y="309" width="250" height="64" rx="10"/>
    <text class="title" x="145" y="336">LeafBackend(L)</text>
    <text class="detail" x="145" y="358">Bound local endpoint</text>
  </g>
  <g>
    <rect class="node plain" x="20" y="420" width="250" height="60" rx="10"/>
    <text class="title" x="145" y="456">Adapter(L)</text>

  </g>
  <g>
    <rect class="node plain" x="20" y="530" width="250" height="65" rx="10"/>
    <text class="title" x="145" y="568.5">Owned local service</text>

  </g>
  <g>
    <rect class="node pool" x="355" y="267" width="440" height="68" rx="10"/>
    <text class="title" x="575" y="296">TreeBackend</text>
    <text class="detail" x="575" y="318">scope = cloud</text>
  </g>
  <g>
    <rect class="node router" x="355" y="385" width="440" height="82" rx="10"/>
    <text class="title" x="575" y="421">RouteWiseRouter</text>
    <text class="detail" x="575" y="443">scope = cloud</text>
  </g>
  <g>
    <rect class="node leaf" x="315" y="540" width="230" height="62" rx="10"/>
    <text class="title" x="430" y="566">LeafBackend(C1)</text>
    <text class="detail" x="430" y="588">Cloud endpoint 1</text>
  </g>
  <g>
    <rect class="node leaf" x="565" y="540" width="230" height="62" rx="10"/>
    <text class="title" x="680" y="566">LeafBackend(C2)</text>
    <text class="detail" x="680" y="588">Cloud endpoint 2</text>
  </g>
  <g>
    <rect class="node plain" x="315" y="642" width="230" height="74" rx="10"/>
    <text class="title" x="430" y="674">Adapter(C1) → Cloud</text>
    <text class="detail" x="430" y="696">concurrency</text>
  </g>
  <g>
    <rect class="node plain" x="565" y="642" width="230" height="74" rx="10"/>
    <text class="title" x="680" y="674">Adapter(C2) → Cloud</text>
    <text class="detail" x="680" y="696">on_demand / quota</text>
  </g>
  <text class="label" x="145" y="281">local admission succeeds</text>
  <text class="label" x="626" y="247">delegate cloud pool</text>
</svg>

