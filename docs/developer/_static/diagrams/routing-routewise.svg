<svg xmlns="http://www.w3.org/2000/svg" width="760" height="594" viewBox="0 0 760 594" role="img" aria-labelledby="title desc">
  <title id="title">Full-pool RouteWise</title>
  <desc id="desc">The registry selects RouteWiseRouter for a model. RouteWise selects local or cloud endpoints from its full pool. Each selected endpoint has its own LeafBackend and Adapter.</desc>
  <!-- Editable SVG source. No browser scripts, external fonts or build-time renderer. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="implements" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11Z" fill="white" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #172b4d; }
    .title { font-size: 18px; font-weight: 600; }
    .detail { font-size: 14px; fill: #475569; }
    .label { font-size: 14px; fill: #475569; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2; }
    .router { fill: #eff6ff; stroke: #4078b5; }
    .pool { fill: #f5f3ff; stroke: #8064ad; }
    .leaf { fill: #edfaf5; stroke: #35816c; }
    .plain { fill: #f8fafc; stroke: #94a3b8; }
    .future { fill: #fff9ed; stroke: #a86d12; stroke-dasharray: 7 5; }
    .node { stroke-width: 1.6; }
  </style>
  <rect width="760" height="594" fill="white"/>
  <path class="edge" d="M380 86V130" marker-end="url(#arrow)"/>
  <path class="edge" d="M380 208V241H190V282" marker-end="url(#arrow)"/>
  <path class="edge" d="M380 241H570V282" marker-end="url(#arrow)"/>
  <path class="edge" d="M190 347V392" marker-end="url(#arrow)"/>
  <path class="edge" d="M570 347V392" marker-end="url(#arrow)"/>
  <path class="edge" d="M190 452V502" marker-end="url(#arrow)"/>
  <path class="edge" d="M570 452V502" marker-end="url(#arrow)"/>
  <g>
    <rect class="node plain" x="215" y="22" width="330" height="64" rx="10"/>
    <text class="title" x="380" y="49">ModelRouterRegistry</text>
    <text class="detail" x="380" y="71">model A · router: routewise</text>
  </g>
  <g>
    <rect class="node router" x="165" y="130" width="430" height="78" rx="10"/>
    <text class="title" x="380" y="164">RouteWiseRouter</text>
    <text class="detail" x="380" y="186">scope = local + cloud</text>
  </g>
  <g>
    <rect class="node leaf" x="40" y="282" width="300" height="65" rx="10"/>
    <text class="title" x="190" y="309.5">LeafBackend(L)</text>
    <text class="detail" x="190" y="331.5">Bound local endpoint</text>
  </g>
  <g>
    <rect class="node leaf" x="420" y="282" width="300" height="65" rx="10"/>
    <text class="title" x="570" y="309.5">LeafBackend(C)</text>
    <text class="detail" x="570" y="331.5">Bound cloud endpoint</text>
  </g>
  <g>
    <rect class="node plain" x="40" y="392" width="300" height="60" rx="10"/>
    <text class="title" x="190" y="428">Adapter(L)</text>

  </g>
  <g>
    <rect class="node plain" x="420" y="392" width="300" height="60" rx="10"/>
    <text class="title" x="570" y="428">Adapter(C)</text>

  </g>
  <g>
    <rect class="node plain" x="40" y="502" width="300" height="64" rx="10"/>
    <text class="title" x="190" y="540">Local service</text>

  </g>
  <g>
    <rect class="node plain" x="420" y="502" width="300" height="64" rx="10"/>
    <text class="title" x="570" y="540">Cloud API</text>

  </g>
  <text class="label" x="190" y="265">select endpoint L</text>
  <text class="label" x="570" y="265">select endpoint C</text>
</svg>

