<svg xmlns="http://www.w3.org/2000/svg" width="840" height="548" viewBox="0 0 840 548" role="img" aria-labelledby="title desc">
  <title id="title">Router contracts and endpoint execution</title>
  <desc id="desc">FixedRouter and RouteWiseRouter implement RouterProtocol and execute through LeafBackend, which binds one Adapter. Future GreedyRouter and NimbusRouter are peers. TreeBackend implements RoutingBackend and holds a scoped RouterProtocol instance.</desc>
  <!-- Editable SVG source. No browser scripts, external fonts or build-time renderer. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="implements" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1L11 6L1 11Z" fill="white" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #172b4d; }
    .title { font-size: 18px; font-weight: 600; }
    .detail { font-size: 14px; fill: #475569; }
    .label { font-size: 14px; fill: #475569; paint-order: stroke; stroke: white; stroke-width: 5px; stroke-linejoin: round; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2; }
    .router { fill: #eff6ff; stroke: #4078b5; }
    .pool { fill: #f5f3ff; stroke: #8064ad; }
    .leaf { fill: #edfaf5; stroke: #35816c; }
    .plain { fill: #f8fafc; stroke: #94a3b8; }
    .future { fill: #fff9ed; stroke: #a86d12; stroke-dasharray: 7 5; }
    .node { stroke-width: 1.6; }
  </style>
  <rect width="840" height="548" fill="white"/>
  <path class="edge" d="M110 160V130H710V160" stroke-dasharray="6 4"/>
  <path class="edge" d="M310 160V130" stroke-dasharray="6 4"/>
  <path class="edge" d="M510 160V130" stroke-dasharray="6 4"/>
  <path class="edge" d="M420 130V88" stroke-dasharray="6 4" marker-end="url(#implements)"/>
  <path class="edge" d="M110 230V282H230V318" marker-end="url(#arrow)"/>
  <path class="edge" d="M310 230V282H230"/>
  <path class="edge" d="M510 230V270H640V318" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <path class="edge" d="M230 386V454" marker-end="url(#arrow)"/>
  <path class="edge" d="M640 450V386" stroke-dasharray="6 4" marker-end="url(#implements)"/>
  <g>
    <rect class="node router" x="200" y="22" width="440" height="66" rx="10"/>
    <text class="title" x="420" y="50">RouterProtocol</text>
    <text class="detail" x="420" y="72">Shared external contract</text>
  </g>
  <g>
    <rect class="node router" x="20" y="160" width="180" height="70" rx="10"/>
    <text class="title" x="110" y="190">FixedRouter</text>
    <text class="detail" x="110" y="212">registered: fixed</text>
  </g>
  <g>
    <rect class="node router" x="220" y="160" width="180" height="70" rx="10"/>
    <text class="title" x="310" y="190">RouteWiseRouter</text>
    <text class="detail" x="310" y="212">registered: routewise</text>
  </g>
  <g>
    <rect class="node future" x="420" y="160" width="180" height="70" rx="10"/>
    <text class="title" x="510" y="190">GreedyRouter</text>
    <text class="detail" x="510" y="212">future</text>
  </g>
  <g>
    <rect class="node future" x="620" y="160" width="180" height="70" rx="10"/>
    <text class="title" x="710" y="190">NimbusRouter</text>
    <text class="detail" x="710" y="212">future</text>
  </g>
  <g>
    <rect class="node leaf" x="100" y="318" width="260" height="68" rx="10"/>
    <text class="title" x="230" y="347">LeafBackend</text>
    <text class="detail" x="230" y="369">Bound to one endpoint</text>
  </g>
  <g>
    <rect class="node pool" x="490" y="318" width="300" height="68" rx="10"/>
    <text class="title" x="640" y="347">RoutingBackend</text>
    <text class="detail" x="640" y="369">Scoped pool contract</text>
  </g>
  <g>
    <rect class="node plain" x="100" y="454" width="260" height="66" rx="10"/>
    <text class="title" x="230" y="482">Adapter</text>
    <text class="detail" x="230" y="504">One upstream endpoint</text>
  </g>
  <g>
    <rect class="node pool" x="490" y="450" width="300" height="78" rx="10"/>
    <text class="title" x="640" y="473">TreeBackend</text>
    <text class="detail" x="640" y="495">router: RouterProtocol</text>
    <text class="detail" x="640" y="517">Holds a scoped router</text>
  </g>
  <text class="label" x="475" y="117">implements</text>
  <text class="label" x="210" y="260">executes</text>
  <text class="label" x="645" y="256">delegates (future)</text>
  <text class="label" x="306" y="425">calls</text>
  <text class="label" x="704" y="425">implements</text>
</svg>

