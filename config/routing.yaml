default_router: fixed
# DEPRECATED: `routing_parameter:` is a one-release shim consumed by
# RoutingManager for weight assignment; it will be removed once RoutingManager
# moves to per-model `router_params:` in models.yaml.
routing_parameter:
  local_fraction: 1
timeout: 2
health_check: 30
logging:
  output: output.log
local_deployment:
  - endpoint: http://host.docker.internal:10800
    models:
      - qwen3.6-27b
  - endpoint: http://host.docker.internal:10801
    models:
      - qwen3.6-35b
remote_deployment:
  # - endpoint: ${CHUTES_BASE_URL}
  #   models:
  #     - qwen3-coder-30b
  - endpoint: https://api.minimax.io/v1
    models:
      - minimax-m2.7
      - minimax-m2.5
  - endpoint: https://api.z.ai/api/coding/paas/v4/
    models:
      - glm-4.7
      - glm-4.7-flash
      - glm-5
      - glm-5.1
