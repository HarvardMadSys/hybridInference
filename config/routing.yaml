default_router: fixed
# DEPRECATED: `routing_parameter:` is a one-release shim consumed by
# RoutingManager for weight assignment; it will be removed once RoutingManager
# moves to per-model `router_params:` in models.yaml.
routing_parameter:
  local_fraction: 1
timeout: 2
health_check: 300
logging:
  output: output.log
local_deployment:
  - endpoint: ${LOCAL_DEPLOYMENT_URL}
    models:
      - qwen3.6-35b
  - endpoint: ${RC_DEPLOYMENT_URL}
    models:
      - /n/netscratch/juncheng_lab/model/GLM-5.1-FP8-2
remote_deployment:
  - endpoint: ${KIMI_CODING_BASE_URL}
    models:
      - kimi-k2.7-code
  - endpoint: ${MOONSHOT_BASE_URL}
    models:
      - kimi-k2.7-code
  - endpoint: ${CHUTES_BASE_URL}
    models:
      - moonshotai/Kimi-K2.6-TEE
      - zai-org/GLM-5-Turbo
  - endpoint: ${MINIMAX_BASE_URL}
    models:
      - minimax-m2.7
      - minimax-m2.5
  - endpoint: ${ZAI_BASE_URL}
    models:
      - glm-4.7
      - glm-4.7-flash
      - glm-5
      - glm-5-turbo
      - glm-5.1
  - endpoint: ${DEEPSEEK_BASE_URL}
    models:
      - deepseek-v4-flash
      - deepseek-v4-pro
