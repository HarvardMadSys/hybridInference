# Manifest-only reference (serving/config/distribution.py).
#
# This file now points at the adjacent, checked-in OpenRouter examples, so it
# validates and resolves without dangling paths. For the deterministic bundle
# that includes env, Compose, a fake upstream, and smoke validation, use:
#
#   make up DISTRIBUTION=example
#   make smoke DISTRIBUTION=example
#
# See examples/distributions/example/README.md.
#
# A distribution bundles site identity and config-file locations into one
# versioned document. Activate it with:
#
#   DISTRIBUTION_CONFIG_PATH=/path/to/distribution.yaml
#
# Config-path precedence: explicit env vars (MODELS_CONFIG_PATH etc.) win
# over `paths:` below, which wins over the legacy config/*.yaml defaults.
# DISTRIBUTION_CONFIG_MODE defaults to "dark": this file loads and validates,
# and divergence is logged, while current resolution stays effective.
# Applying `paths:` requires an explicit DISTRIBUTION_CONFIG_MODE=active.
#
# `site:` and `features:` are exposed as a safe public subset by
# GET /site-config when the manifest runs in active mode.
#
# Do not put secrets here — credentials stay in the environment. Relative
# `paths:` entries resolve against this file's directory.

schema_version: 1

distribution:
  id: example
  display_name: Example Inference
  release: 2026.07.1

site:
  public_base_url: https://inference.example.com
  support_email: admin@inference.example.com
  # terms_document: ./content/terms.md
  # privacy_document: ./content/privacy.md
  # branding: ./branding/site.yaml

features:
  routers: [fixed]
  public_signup: true
  rag: false

paths:
  models: ./models.openrouter.yaml
  routing: ./routing.minimal.yaml
  # alerts: ./alerts.yaml

deployment:
  target: staging
