# Experiment Configuration
# Main configuration for offline routing experiments
# Currently configured for single model (ChatGPT) experiments

models:
  # Subscription provider (Chutes) - assumes it can serve ChatGPT
  - id: chutes-subscription
    name: "Chutes Subscription"
    provider: chutes
    type: subscription
    pricing:
      monthly_fee: "20.0"      # $20/month
      daily_quota: 5000        # 5000 requests per day

  # API provider - ChatGPT pricing
  - id: openai-chatgpt
    name: "OpenAI ChatGPT"
    provider: openai
    provider_model_id: "gpt-3.5-turbo"
    type: api
    pricing:
      prompt: "1.5"            # $1.5 per 1M input tokens
      completion: "2.0"        # $2.0 per 1M output tokens

# Simulation settings
simulation:
  num_subscriptions: 1         # Number of subscription accounts
  days_per_month: 30           # Days per month for cost calculation
  default_subscription: "chutes-subscription"
  default_api_fallback: "openai-chatgpt"

# Strategy configurations
strategies:
  # Phase 1: Optimal strategy
  - name: optimal
    enabled: true

  # Phase 2: Greedy (to be implemented)
  # - name: greedy
  #   enabled: false

  # Phase 3: TwoStep (to be implemented)
  # - name: two_step
  #   enabled: false

# Dataset configuration
dataset:
  path: "data/community_logs.csv"
  timestamp_unit: "seconds"    # Timestamp unit in CSV

  # Filter to only load requests for this model (set to null for all models)
  filter_model: null           # Options: specific model name, or null for all models

# Multi-model API pricing (per 1M tokens)
# Used when calculating API cost for different models
# Prices updated: 2025-01
model_pricing:
  # Llama models (Meta) - OpenRouter pricing
  # Source: https://openrouter.ai/
  llama-3.3-70b-instruct:
    input: 0.10
    output: 0.32
  llama-4-scout:
    input: 0.10
    output: 0.32
  llama-4-maverick:
    input: 0.10
    output: 0.32
  # Gemini models (Google) - unified pricing after 2025 update
  # Source: https://ai.google.dev/gemini-api/docs/pricing
  gemini-2.5-flash:
    input: 0.30
    output: 2.50
  gemini-2.5-flash-preview-09-2025:
    input: 0.30
    output: 2.50
  # GLM models (Zhipu)
  # Source: https://bigmodel.cn/pricing
  glm-4.5:
    input: 0.35
    output: 1.55
  glm-4.6:
    input: 0.35
    output: 1.55
  # DeepSeek models
  # Source: https://api-docs.deepseek.com/quick_start/pricing
  deepseek-chat:
    input: 0.28
    output: 0.42
  # Default fallback for unknown models
  default:
    input: 1.50
    output: 2.00

# Output settings
output:
  results_dir: "experiment/results"
  save_decisions: false        # Save individual routing decisions (large file)
  generate_plots: false        # Generate visualization plots
  log_level: "INFO"            # Logging level: DEBUG, INFO, WARNING, ERROR
