# Experiment Configuration
# Stage 2: Dual-subscription routing optimization

# API pricing per 1M tokens
# Used for calculating pay-as-you-go API costs
model_pricing:
  # Llama models - OpenRouter pricing
  llama-3.3-70b-instruct:
    input: 0.25
    output: 0.75
  llama-4-scout:
    input: 0.18
    output: 0.59
  llama-4-maverick:
    input: 0.27
    output: 0.85
  # GLM models - Zhipu pricing
  glm-4.5:
    input: 0.6
    output: 2.2
  glm-4.6:
    input: 0.6
    output: 2.2
  glm-4.5-air:
    input: 0.20
    output: 1.1
  glm-4.7:
    input: 0.6
    output: 2.2
  # DeepSeek models
  deepseek-r1:
    input: 0.55
    output: 2.19
  # Qwen models
  qwen3-coder-30b:
    input: 0.07
    output: 0.27
  # MiniMax models
  minimax-m2:
    input: 0.30
    output: 1.20
  # Gemini models
  gemini-2.5-flash:
    input: 0.30
    output: 2.50

# Subscription configurations for Stage 2 routing
subscriptions:
  # S_Q: Daily Quota Subscription (Chutes)
  # https://chutes.ai/ - $20/mo for 5000 requests/day
  chutes:
    type: daily_quota
    monthly_fee: 20.0
    daily_quota: 5000
    supported_models:
      - llama-3.3-70b-instruct
      - llama-4-scout
      - llama-4-maverick
      - glm-4.5
      - glm-4.6
      - glm-4.5-air
      - glm-4.7
      - deepseek-r1
      - qwen3-coder-30b
      - minimax-m2

  # S_C Options: Concurrency-limited subscriptions
  # Choose one via --sc-config parameter

  # Option 1: Featherless AI Premium ($25/mo, C=4)
  # https://featherless.ai/docs/model-compatibility
  featherless_premium:
    type: concurrency
    monthly_fee: 25.0
    concurrency_limit: 4
    supported_models:
      llama-3.3-70b-instruct:
        multiplier: 4
      glm-4.6:
        multiplier: 4
      deepseek-r1:
        multiplier: 4

  # Option 2: Featherless AI Scale ($75/mo, C=8)
  featherless_scale:
    type: concurrency
    monthly_fee: 75.0
    concurrency_limit: 8
    supported_models:
      llama-3.3-70b-instruct:
        multiplier: 4
      glm-4.6:
        multiplier: 4
      deepseek-r1:
        multiplier: 4

  # Option 3: Local GPU (sunk cost $0, C=8)
  # Hardware already purchased, marginal cost = $0
  local_gpu:
    type: concurrency
    monthly_fee: 0.0
    concurrency_limit: 8
    supported_models:
      # 70B+ models (multiplier=4)
      llama-3.3-70b-instruct:
        multiplier: 4
      llama-4-maverick:
        multiplier: 4
      glm-4.6:
        multiplier: 4
      glm-4.5:
        multiplier: 4
      glm-4.7:
        multiplier: 4
      deepseek-r1:
        multiplier: 4
      # 30B models (multiplier=2)
      qwen3-coder-30b:
        multiplier: 2
      minimax-m2:
        multiplier: 2
      # Small models (multiplier=1)
      llama-4-scout:
        multiplier: 1
      glm-4.5-air:
        multiplier: 1
