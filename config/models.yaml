  # ── DeepSeek V4 (kind: deepseek) ─────────────────────────
  - id: deepseek-v4-flash
    name: DeepSeek V4 Flash
    provider: deepseek
    required_role: internal
    provider_model_id: "deepseek-v4-flash"
    context_length: 1000000
    max_output_length: 393216
    supports_tools: true
    supports_structured_output: true
    supported_params: [temperature, top_p, max_tokens, stop, stream, thinking, reasoning_effort]
    input_modalities: ["text"]
    output_modalities: ["text"]
    quantization: "none"
    # Pricing (original): prompt $0.14/M, cache-hit $0.0028/M, completion $0.28/M
    # Pricing (promo 75% off): prompt $0.035/M, cache-hit $0.0007/M, completion $0.07/M
    # DeepSeek API https://api-docs.deepseek.com/quick_start/pricing
    pricing:
      prompt: "0.14"
      completion: "0.28"
      image: "0"
      request: "0"
      input_cache_reads: "0.0028"
      input_cache_writes: "0"
    route:
      - kind: deepseek
        weight: 1.0
        base_url: ${DEEPSEEK_BASE_URL}
        api_keys:
          - ${DEEPSEEK_API_KEY}
        provider_model_id: "deepseek-v4-flash"

  - id: deepseek-v4-pro
