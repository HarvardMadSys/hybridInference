  # ===== Embedding Models =====
  # Served locally on a GPU box by ops/sglang_idle_proxy (sglang --is-embedding),
  # the same idle proxy that serves the local chat models. Reuses LOCAL_DEPLOYMENT_URL
  # (the proxy's reverse tunnel); the proxy routes by the model field.

  - id: bge-m3
    name: BGE-M3
    type: embedding
    provider: sglang
    quantization: "fp16"
    input_modalities: ["text"]
    output_modalities: ["embedding"]
    context_length: 8192
    max_output_length: 0
    pricing:
      prompt: "0"
      completion: "0"
    route:
      - kind: sglang
        weight: 1.0
        base_url: ${LOCAL_DEPLOYMENT_URL}
        provider_model_id: "BAAI/bge-m3"
        api_keys:
          - ${LOCAL_API_KEY}
      # staging.freeinference.org canary fallback (key via STAGING_API_KEY)
      - kind: openai_compat
        weight: 0.01
        base_url: ${STAGING_BASE_URL}
        api_keys:
          - ${STAGING_API_KEY}
        provider_model_id: "bge-m3"

