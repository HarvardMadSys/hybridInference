  #   context_length: 131072
  #   max_output_length: 8192
  #   supports_tools: true
  #   supports_structured_output: true
  #   supported_params: [temperature, top_p, max_tokens, stop, stream]
  #   input_modalities: ["text"]
  #   output_modalities: ["text"]
  #   pricing:
  #     prompt: "0.13"
