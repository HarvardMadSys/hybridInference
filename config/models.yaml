# Example models registry for the OpenRouter-compatible server.
# Values like ${ENV_VAR} will be expanded from environment variables.
#
# NOTE: Local GPU endpoints use "host.docker.internal" to reach the host machine
# from inside Docker. For bare-metal (non-Docker) development, replace with "localhost".

models:
  - id: glm-4.7
    name: GLM-4.7
    provider: zai
    quantization: "fp8"
    context_length: 200000
    max_output_length: 128000
    supports_tools: true
    supports_structured_output: true
    supported_params: [temperature, top_p, max_tokens, stop, stream, tool_stream, thinking]
    input_modalities: ["text"]
    output_modalities: ["text"]
    aliases: ["freeinference-glm-4.7"]
    # Z.AI PAYG https://docs.z.ai/guides/overview/pricing
    pricing:
      prompt: "0.6"
      completion: "2.2"
      image: "0"
      request: "0"
      input_cache_reads: "0.11"
      input_cache_writes: "0"
    route:
      - kind: zai
        weight: 1.0
        base_url: ${ZAI_BASE_URL}
        api_keys:
          - ${ZAI_API_KEY}
          - ${ZAI_API_KEY2}
        provider_model_id: "glm-4.7"
      # Ollama Cloud fallback
      - kind: ollama
        weight: 0.24
        base_url: ${OLLAMA_BASE_URL}
        api_keys:
          - ${OLLAMA_API_KEY}
        provider_model_id: "glm-4.7"
      # Chutes fallback
      - kind: chutes
        weight: 0.24
        base_url: ${CHUTES_BASE_URL}
        api_keys:
          - ${CHUTES_API_KEY}
        provider_model_id: "zai-org/GLM-4.7-FP8"
      # Featherless fallback
      - kind: featherless
        weight: 0
        base_url: ${FEATHERLESS_BASE_URL}
        api_keys:
          - ${FEATHERLESS_API_KEY}
        provider_model_id: "zai-org/GLM-4.7"

