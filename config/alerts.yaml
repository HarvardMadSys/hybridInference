rules:
  failed_request_rate:
    enabled: true
    window_sec: 3600
    threshold_pct: 10.0
    min_samples: 200
    cooldown_sec: 900
  fivexx_rate:
    enabled: true
    window_sec: 300
    threshold_pct: 2.0
    min_samples: 50
    cooldown_sec: 900
  p95_latency_per_provider:
    enabled: true
    window_sec: 600
    threshold_ms: 30000
    min_samples: 30
    cooldown_sec: 1800
    overrides: {}
  auth_failure_spike:
    enabled: true
    window_sec: 60
    threshold_count: 50
    cooldown_sec: 600
  concurrency_exhausted:
    enabled: true
    window_sec: 300
    threshold_count: 100
    cooldown_sec: 1800

state_changes:
  circuit_open:
    enabled: true
    cooldown_sec: 300
  db_disconnect:
    enabled: true
    cooldown_sec: 300

cost:
  user_overrun:
    enabled: true
    check_interval_sec: 300
    cooldown_sec: 86400
    thresholds_per_role:
      free: 5.00
      pro: 50.00
      internal: 500.00
  provider_hourly_spend:
    enabled: true
    check_interval_sec: 300
    cooldown_sec: 3600
    budgets: {}
