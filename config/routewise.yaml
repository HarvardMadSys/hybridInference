# RouteWise cost-aware routing configuration.
#
# See docs/agents/specs/ for design specifications.
# All values shown below are defaults.  Override individual fields as needed;
# any key omitted will use its default value.

routewise:
  # Optional deterministic sampling seed for offline replay/debugging.
  # null = non-deterministic process-local RNG.
  random_seed: null

  # Optional API-equivalent price scale for subscription-only RouteWise routes.
  # When a route has a real S_A API provider, RouteWise uses the cheapest S_A
  # request cost instead. Values are USD per million tokens.
  reference_api_price: null
  # reference_api_price:
  #   prompt: "1.2"
  #   completion: "4.0"

  # --- Startup DB bootstrap ---
  db_bootstrap:
    enabled: true
    max_rows: 50000

  # S_Q/S_C counters are process-local in this integration. Leave this guard
  # on unless the deployment is single-worker or shared state has been added.
  stateful_tiers_single_worker_only: true

  # --- S_Q (quota) subscription parameters ---
  quota:
    daily_quota: 5000             # requests per day
    monthly_fee: 20.0             # for amortized cost reporting only
    reset_timezone: UTC           # daily quota reset boundary
    snapshot_refresh_interval_sec: 60.0  # provider quota API refresh cadence

  # --- S_C (concurrency) subscription parameters ---
  # Stage 2 feature; disabled by default in Stage 1.
  concurrency:
    enabled: false
    limit: 8                      # max concurrent requests
    monthly_fee: 25.0

  # --- Cost envelope (quota shadow-price calibration) ---
  envelope:
    window_hours: 24              # rolling window for observed P10 / P90
    lower_percentile: 10          # L bound
    upper_percentile: 90          # U bound

  # --- Latency-aware routing ---
  latency:
    slo_sec: 3.0
    window_sec: 900.0             # profile time window
    max_samples: 5000             # bounded request outcomes retained per provider
    min_samples: 10               # warmup threshold before LP/hedging use profile
    unprofiled_ttft_ms: 5000.0    # conservative fallback for cold providers
    hedge_mode: disabled

  # --- Canary rollout (future — not yet wired in bootstrap) ---
  # NOTE: configure_canary() is not called during startup yet.
  # These fields are reserved for future canary rollout support.
  # See TODO in serving/servers/bootstrap.py for wiring plan.
  canary:
    enabled: false
    # enabled_models: null = all routewise models; [] = no models; [model-a] = specific models
    enabled_models: null
    traffic_fraction: 1.0
