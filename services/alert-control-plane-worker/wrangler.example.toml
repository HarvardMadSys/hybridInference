name = "freeinference-alert-control-plane"
main = "src/index.ts"
compatibility_date = "2026-07-20"

# This package is intentionally dormant in Phase 1. Copy this file to
# wrangler.toml only after the deployment registry and environment-specific
# producer identities have been reviewed.

[[durable_objects.bindings]]
name = "INCIDENTS"
