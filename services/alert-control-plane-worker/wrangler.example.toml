name = "freeinference-alert-control-plane"
main = "src/index.ts"
compatibility_date = "2026-07-20"

# This package is intentionally dormant in Phase 1. Copy this file to
# wrangler.toml only after the deployment registry and environment-specific
# producer identities have been reviewed.

[[durable_objects.bindings]]
name = "INCIDENTS"
class_name = "IncidentDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IncidentDurableObject"]

# ROUTE_KEY_V1 and producer credentials are Worker secrets. They must not be
# stored in this file. Phase B includes a SlackSink implementation but does not
# register it here or in src/index.ts; the Worker remains dormant.
#
# A future, separately reviewed environment config will need the secret
# SLACK_BOT_TOKEN and non-secret SLACK_CHANNEL_ID / SLACK_SINK_ID bindings.
# Their values must not be committed. The Slack app also needs chat:write and
# the target conversation's matching *:history scope for reconciliation.
