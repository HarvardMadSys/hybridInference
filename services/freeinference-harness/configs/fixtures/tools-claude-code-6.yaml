# 6-tool fixture derived from Claude Code-style agents (9,864 production requests).
# Includes the complex text_editor tool (7 params) as a schema stress test.
tools:
  - type: function
    function:
      name: bash
      description: Execute a bash command and return its output.
      parameters:
        type: object
        properties:
          cmd:
            type: string
            description: The bash command to execute.
        required:
          - cmd

  - type: function
    function:
      name: bash_session
      description: Interact with a persistent bash session.
      parameters:
        type: object
        properties:
          action:
            type: string
            description: "Action to perform: start, input, or terminate."
            enum:
              - start
              - input
              - terminate
          input:
            type: string
            description: Input to send to the session (when action is input).
        required:
          - action

  - type: function
    function:
      name: python
      description: Execute Python code and return the result.
      parameters:
        type: object
        properties:
          code:
            type: string
            description: The Python code to execute.
        required:
          - code

  - type: function
    function:
      name: text_editor
      description: View or edit a file using text editor commands.
      parameters:
        type: object
        properties:
          command:
            type: string
            description: Editor command to execute.
            enum:
              - view
              - create
              - str_replace
              - insert
          path:
            type: string
            description: Path to the file to view or edit.
          old_str:
            type: string
            description: String to replace (for str_replace command).
          new_str:
            type: string
            description: Replacement string (for str_replace or insert command).
          file_text:
            type: string
            description: Full file content (for create command).
          insert_line:
            type: integer
            description: Line number to insert at (for insert command).
          view_range:
            type: array
            description: "[start_line, end_line] range to view."
            items:
              type: integer
        required:
          - command
          - path

  - type: function
    function:
      name: think
      description: Use this tool to think through a problem step-by-step.
      parameters:
        type: object
        properties:
          thought:
            type: string
            description: Your thoughts and reasoning.
        required:
          - thought

  - type: function
    function:
      name: submit
      description: Submit the final answer.
      parameters:
        type: object
        properties:
          answer:
            type: string
            description: The final answer to submit.
        required:
          - answer
