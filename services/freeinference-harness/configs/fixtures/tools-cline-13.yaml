# 13-tool fixture derived from Cline-style agents (903+ production requests).
tools:
  - type: function
    function:
      name: apply_diff
      description: Apply a unified diff to a file.
      parameters:
        type: object
        properties:
          path:
            type: string
            description: Path to the file to patch.
          diff:
            type: string
            description: Unified diff content to apply.
        required:
          - path
          - diff

  - type: function
    function:
      name: attempt_completion
      description: Signal that the task is complete with a result message.
      parameters:
        type: object
        properties:
          result:
            type: string
            description: Summary of what was accomplished.
          command:
            type: string
            description: Optional CLI command for the user to verify the result.
        required:
          - result

  - type: function
    function:
      name: execute_command
      description: Execute a CLI command on the system.
      parameters:
        type: object
        properties:
          command:
            type: string
            description: The command to execute.
          requires_approval:
            type: boolean
            description: Whether this command needs user approval before execution.
        required:
          - command

  - type: function
    function:
      name: list_files
      description: List files and directories at a given path.
      parameters:
        type: object
        properties:
          path:
            type: string
            description: Directory path to list.
          recursive:
            type: boolean
            description: Whether to list recursively.
        required:
          - path

  - type: function
    function:
      name: read_file
      description: Read the contents of a file.
      parameters:
        type: object
        properties:
          path:
            type: string
            description: Path to the file to read.
        required:
          - path

  - type: function
    function:
      name: search_files
      description: Search for a pattern across files.
      parameters:
        type: object
        properties:
          path:
            type: string
            description: Directory path to search in.
          regex:
            type: string
            description: Regular expression pattern to search for.
          file_pattern:
            type: string
            description: Glob pattern to filter files.
        required:
          - path
          - regex

  - type: function
    function:
      name: write_to_file
      description: Write content to a file, creating it if necessary.
      parameters:
        type: object
        properties:
          path:
            type: string
            description: Path to the file to write.
          content:
            type: string
            description: The content to write.
        required:
          - path
          - content

  - type: function
    function:
      name: ask_followup_question
      description: Ask the user a follow-up question for clarification.
      parameters:
        type: object
        properties:
          question:
            type: string
            description: The question to ask the user.
        required:
          - question

  - type: function
    function:
      name: new_task
      description: Create a new task with a description.
      parameters:
        type: object
        properties:
          context:
            type: string
            description: Context and description for the new task.
          mode:
            type: string
            description: The mode to use for the new task.
        required:
          - context

  - type: function
    function:
      name: switch_mode
      description: Switch to a different operating mode.
      parameters:
        type: object
        properties:
          mode:
            type: string
            description: The target mode to switch to.
          reason:
            type: string
            description: Why this mode switch is needed.
        required:
          - mode

  - type: function
    function:
      name: update_todo_list
      description: Update the current task's todo list.
      parameters:
        type: object
        properties:
          items:
            type: array
            description: List of todo items.
            items:
              type: object
          status:
            type: string
            description: Overall status of the todo list.
        required:
          - items

  - type: function
    function:
      name: read_command_output
      description: Read the output from a previously executed command.
      parameters:
        type: object
        properties:
          command_id:
            type: string
            description: The ID of the command whose output to read.
        required:
          - command_id

  - type: function
    function:
      name: skill
      description: Execute a named skill with arguments.
      parameters:
        type: object
        properties:
          name:
            type: string
            description: The skill name to invoke.
          args:
            type: object
            description: Arguments to pass to the skill.
        required:
          - name
