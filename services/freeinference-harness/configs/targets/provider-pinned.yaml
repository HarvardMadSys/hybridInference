# Provider-pinned targets: go through the gateway but pin to a specific backend
# via the X-Route-Pin header. Tests the full adapter+processor stack per provider.
#
# Requires admin API key (X-Route-Pin is admin-only).
#
# Naming convention: {model}@{provider}-gw
# "gw" suffix distinguishes from provider-direct targets.

defaults:
  base_url: https://freeinference.org
  api_key_env: FREEINFERENCE_ADMIN_API_KEY
  sampling_count: 1
  suite_type: gateway-pinned
  extra_headers:
    X-Reasoning-Passthrough: "true"

targets:
  # ── glm-5.1: zai + ollama + chutes ──────────────────
  - name: glm-5.1@zai-gw
    model: glm-5.1
    tags: [zai, glm, pinned]
    extra_headers:
      X-Route-Pin: zai
    capabilities:
      chat: true
      streaming: true
      tools: true

  - name: glm-5.1@ollama-gw
    model: glm-5.1
    tags: [ollama, glm, pinned]
    extra_headers:
      X-Route-Pin: ollama
    capabilities:
      chat: true
      streaming: true
      tools: true

  - name: glm-5.1@chutes-gw
    model: glm-5.1
    tags: [chutes, glm, pinned]
    extra_headers:
      X-Route-Pin: chutes
    capabilities:
      chat: true
      streaming: true
      tools: true

  # ── glm-5-turbo: zai + chutes ─────────────────────────
  - name: glm-5-turbo@zai-gw
    model: glm-5-turbo
    tags: [zai, glm, pinned]
    extra_headers:
      X-Route-Pin: zai
    capabilities:
      chat: true
      streaming: true
      tools: true

  - name: glm-5-turbo@chutes-gw
    model: glm-5-turbo
    tags: [chutes, glm, pinned]
    extra_headers:
      X-Route-Pin: chutes
    capabilities:
      chat: true
      streaming: true
      tools: true

  # ── minimax-m2.7: minimax + ollama ──────────────────────────────────
  - name: minimax-m2.7@minimax-gw
    model: minimax-m2.7
    tags: [minimax, pinned]
    extra_headers:
      X-Route-Pin: openai_compat
    capabilities:
      chat: true
      streaming: true
      tools: true

  - name: minimax-m2.7@ollama-gw
    model: minimax-m2.7
    tags: [ollama, minimax, pinned]
    extra_headers:
      X-Route-Pin: ollama
    capabilities:
      chat: true
      streaming: true
      tools: true

  # ── minimax-m2.5: minimax + ollama + chutes + featherless ───────────
  - name: minimax-m2.5@minimax-gw
    model: minimax-m2.5
    tags: [minimax, pinned]
    extra_headers:
      X-Route-Pin: openai_compat
    capabilities:
      chat: true
      streaming: true
      tools: true

  - name: minimax-m2.5@ollama-gw
    model: minimax-m2.5
    tags: [ollama, minimax, pinned]
    extra_headers:
      X-Route-Pin: ollama
    capabilities:
      chat: true
      streaming: true
      tools: true

  - name: minimax-m2.5@chutes-gw
    model: minimax-m2.5
    tags: [chutes, minimax, pinned]
    extra_headers:
      X-Route-Pin: chutes
    capabilities:
      chat: true
      streaming: true
      tools: true

  - name: minimax-m2.5@featherless-gw
    model: minimax-m2.5
    tags: [featherless, minimax, pinned]
    extra_headers:
      X-Route-Pin: featherless
    capabilities:
      chat: true
      streaming: true
      tools: true

  # ── qwen3.6-35b: local sglang only ─────────────────────────
  - name: qwen3.6-35b@sglang-gw
    model: qwen3.6-35b
    tags: [sglang, qwen, pinned]
    extra_headers:
      X-Route-Pin: sglang
    capabilities:
      chat: true
      streaming: true
      tools: true
