# Provider-pinned targets: go through the gateway but pin to a specific backend
# via the X-Route-Pin header. Tests the full adapter+processor stack per provider.
#
# Requires admin API key (X-Route-Pin is admin-only).
#
# Naming convention: {model}@{provider}-gw
# "gw" suffix distinguishes from provider-direct targets.

defaults:
  base_url: https://freeinference.org
  api_key_env: FREEINFERENCE_ADMIN_API_KEY
  sampling_count: 1
  suite_type: gateway-pinned
  extra_headers:
    X-Reasoning-Passthrough: "true"

targets:
  # ── glm-4.7: zai + ollama + chutes + featherless ──────────────────
  - name: glm-4.7@zai-gw
    model: glm-4.7
    tags: [zai, glm, pinned]
    extra_headers:
      X-Route-Pin: zai
    capabilities:
      chat: true
      streaming: true
      tools: true

  - name: glm-4.7@ollama-gw
    model: glm-4.7
    tags: [ollama, glm, pinned]
    extra_headers:
      X-Route-Pin: ollama
    capabilities:
      chat: true
      streaming: true
      tools: true

  - name: glm-4.7@chutes-gw
    model: glm-4.7
    tags: [chutes, glm, pinned]
    extra_headers:
      X-Route-Pin: chutes
    capabilities:
      chat: true
      streaming: true
      tools: true

  - name: glm-4.7@featherless-gw
    model: glm-4.7
    tags: [featherless, glm, pinned]
    extra_headers:
      X-Route-Pin: featherless
    capabilities:
      chat: true
      streaming: true
      tools: true

  # ── glm-4.7-flash: local vLLM + featherless ─────────────────────────
  - name: glm-4.7-flash@local-gw
    model: glm-4.7-flash
    tags: [local, glm, pinned]
    extra_headers:
      X-Route-Pin: openai_compat
