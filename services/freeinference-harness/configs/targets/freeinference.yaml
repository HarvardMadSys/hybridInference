defaults:
  base_url: https://freeinference.org
  api_key_env: FREEINFERENCE_API_KEY
  timeout_seconds: 240
  sampling_count: 5

targets:
  # Public chat models

  - name: glm-5-turbo-public
    model: glm-5-turbo
    suite_type: gateway-public
    capabilities:
      chat: true
      streaming: true
      tools: true
      structured_output: true
      embeddings: false
      anthropic_messages: false
      admin_required: false
    tags: [glm, public]

  - name: glm-5.1-public
    model: glm-5.1
    suite_type: gateway-public
    sampling_count: 10
    capabilities:
      chat: true
      streaming: true
      tools: true
      structured_output: true
      embeddings: false
      anthropic_messages: false
      admin_required: false
    tags: [glm, public]

  - name: qwen3.6-35b-public
    model: qwen3.6-35b
    suite_type: gateway-public
    capabilities:
      chat: true
      streaming: true
      tools: true
      structured_output: true
      embeddings: false
      anthropic_messages: false
      admin_required: false
    tags: [qwen, public]

  - name: minimax-m2.7-public
    model: minimax-m2.7
    suite_type: gateway-public
    capabilities:
      chat: true
      streaming: true
      tools: true
      structured_output: true
      embeddings: false
      anthropic_messages: false
      admin_required: false
    tags: [minimax, public]

  - name: minimax-m2.5-public
    model: minimax-m2.5
    suite_type: gateway-public
    capabilities:
      chat: true
      streaming: true
      tools: true
      structured_output: true
      embeddings: false
      anthropic_messages: false
      admin_required: false
    tags: [minimax, public]

