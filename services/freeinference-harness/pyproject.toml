[project]
name = "freeinference-harness"
version = "0.1.0"
description = "Standalone black-box harness for FreeInference."
license = { file = "../LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx",
  "PyYAML",
]

[project.scripts]
freeinference-harness = "freeinference_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
