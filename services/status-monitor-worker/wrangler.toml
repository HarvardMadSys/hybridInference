name = "freeinference-monitor"
main = "src/index.ts"
compatibility_date = "2025-06-01"
# Account that owns the Worker. Not a secret (it appears in dashboard URLs);
# pinning it lets `wrangler deploy` run non-interactively in CI with only the
# CLOUDFLARE_API_TOKEN secret.
account_id = "d04cebbc3b75c45caec3e4fdb4ee451a"

# Probe every model every 20 minutes.
[triggers]
crons = ["*/20 * * * *"]

[vars]
# Gateway the probes go through (no trailing slash). The Worker discovers its
# probe targets from `${GATEWAY_BASE_URL}/models`, which is already role-filtered
# for the PROBER_API_KEY account. Production is the target because the dashboard
# reports what users actually reach; staging and production have separate user
# databases, so PROBER_API_KEY must be a key issued on production.
GATEWAY_BASE_URL = "https://freeinference.org"
# A prompt that elicits a moderate, bounded response so both TTFT and decode
# throughput are measurable (capped by PROBE_MAX_TOKENS).
PROBE_PROMPT = "Write a Python function that implements binary search over a sorted list. Include a docstring, type hints, and a short example of calling it."
PROBE_MAX_TOKENS = "1024"
# Bounded fan-out. The gateway caps per-user concurrency (3 free/pro, 10
# internal/admin) and 429s the excess; keep at/below the prober account cap.
MAX_CONCURRENCY = "3"
# Marks requests synthetic so the gateway excludes them from logs/metrics/cost.
PROBE_HEADER = "synthetic"
# Probe history retention (days). Older rows are pruned each cron cycle.
RETENTION_DAYS = "1024"
# Absolute per-probe deadline (ms); aborts a stalled stream that keeps sending
# SSE keepalives so one bad model can't wedge the cycle.
PROBE_DEADLINE_MS = "60000"
# Consecutive failed probes before a model pages Slack. Two consecutive failures
# (~20 min apart) confirms a sustained outage and suppresses a single transient
# blip. Only fires when the SLACK_WEBHOOK_URL secret is set.
ALERT_FAILURE_THRESHOLD = "2"
# Legacy rollback mode only (ALERT_DEFAULT_OWNER=legacy): above this many models
# changing state in one cycle, legacy-owned pages collapse into a single summary
# message. Control-plane incidents always open one per model (D1, 2026-07-27).
ALERT_STORM_THRESHOLD = "5"
# New individual model incidents use the unified Control Plane. Incidents opened
# before this switch stay pinned to their legacy writer until they recover.
ALERT_DEFAULT_OWNER = "control-plane"
# New cycle-level (gateway-down) incidents use the Control Plane. Deliberately a
# separate flag from ALERT_DEFAULT_OWNER: it flips only after the manually
# deployed control plane accepts monitoring_cycle_failure, because this Worker
# auto-deploys from dev and a shared flag would open a window where cycle
# events are emitted and rejected. An open cycle incident stays pinned to the
# writer that opened it until its recovery is confirmed.
ALERT_CYCLE_OWNER = "control-plane"

[version_metadata]
binding = "CF_VERSION_METADATA"

# Internal RPC capability. The target named entrypoint is deployed before this
# caller binding; no public Control Plane URL or bearer credential is involved.
[[services]]
binding = "ALERT_CONTROL_PLANE"
service = "freeinference-alert-control-plane-staging"
entrypoint = "StatusMonitorProducerEntrypoint"

# D1 database binding. `database_id` is filled in after the database is created
# (see README); the binding name `DB` is what the Worker code uses.
[[d1_databases]]
binding = "DB"
database_name = "freeinference-monitor"
database_id = "61cbb4c5-f79e-4aae-9e9a-f065e0d7679c"
migrations_dir = "migrations"

# PROBER_API_KEY is a secret, not a var. Set it with:
#   wrangler secret put PROBER_API_KEY
#
# SLACK_WEBHOOK_URL is an optional secret. When set, a model that fails
# ALERT_FAILURE_THRESHOLD consecutive probes pages this Slack incoming webhook
# (and posts a recovery notice when it comes back). Unset disables alerting.
#   wrangler secret put SLACK_WEBHOOK_URL

# ---------------------------------------------------------------------------
# Second instance: the same Worker pointed at staging.
#
# Two deployments rather than one Worker probing both, because a probe target is
# a property of a deployment: each gets its own prober key (the two gateways run
# separate user databases), its own probe history and failure counters, its own
# cycle alert, and its own principal — so a staging outage cannot exhaust the
# production instance's quota, delay its probes, or land in its incidents.
#
# `main`, `compatibility_date`, `account_id` and `triggers` are inherited.
# `vars`, `d1_databases`, `services` and `version_metadata` are NOT — wrangler
# replaces rather than merges them — so everything below is restated in full.
# The values that must stay identical across the two are asserted by
# `test/wrangler-environments.test.ts`; the only var that may differ is
# GATEWAY_BASE_URL, and the deploy derives this instance's target from it.
# ---------------------------------------------------------------------------
[env.staging]
name = "freeinference-monitor-staging"

[env.staging.vars]
GATEWAY_BASE_URL = "https://staging.freeinference.org"
PROBE_PROMPT = "Write a Python function that implements binary search over a sorted list. Include a docstring, type hints, and a short example of calling it."
PROBE_MAX_TOKENS = "1024"
MAX_CONCURRENCY = "3"
PROBE_HEADER = "synthetic"
RETENTION_DAYS = "1024"
PROBE_DEADLINE_MS = "60000"
ALERT_FAILURE_THRESHOLD = "2"
ALERT_STORM_THRESHOLD = "5"
ALERT_DEFAULT_OWNER = "control-plane"
ALERT_CYCLE_OWNER = "control-plane"

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

# The same control plane. It is an incident processor, not a per-environment
# stack: both instances are attested in the staging trust domain and are told
# apart by principal and target, not by having a control plane each.
[[env.staging.services]]
binding = "ALERT_CONTROL_PLANE"
service = "freeinference-alert-control-plane-staging"
entrypoint = "StatusMonitorProducerEntrypoint"

# Its own database, created empty. The production instance keeps the existing
# one, whose pre-cutover rows are labelled `staging` by migration 0003 but
# belong to a deployment nothing probes any more; copying them here would
# resurrect a history with an 11-day hole in it.
[[env.staging.d1_databases]]
binding = "DB"
database_name = "freeinference-monitor-staging"
database_id = "17456f32-35f0-4634-9da8-1ecd5d86cbb8"
migrations_dir = "migrations"
