name = "freeinference-status-monitor-binding-gate"
main = "src/service-binding-gate.ts"
compatibility_date = "2025-06-01"
account_id = "d04cebbc3b75c45caec3e4fdb4ee451a"
workers_dev = false
preview_urls = false

# This config is only for a runner-local post-deploy gate. Wrangler >=4.37
# keeps the gate code local and proxies only this binding to the real target.
[[services]]
binding = "ALERT_CONTROL_PLANE"
service = "freeinference-alert-control-plane-staging"
entrypoint = "StatusMonitorProducerEntrypoint"
remote = true
