name: hybridinference-example

services:
  backend:
    container_name: ${EXAMPLE_BACKEND_CONTAINER_NAME:-hybridinference-example-backend}
    environment:
      DB_ENABLED: "false"
      USER_AUTH_ENABLED: "false"
      DISTRIBUTION_CONFIG_PATH: /app/distributions/example/distribution.yaml
      DISTRIBUTION_CONFIG_MODE: active
      MODELS_CONFIG_PATH: ""
      ROUTING_CONFIG_PATH: ""
      ALERTS_CONFIG_PATH: ""
      EXAMPLE_UPSTREAM_BASE_URL: ${EXAMPLE_UPSTREAM_BASE_URL}
      EXAMPLE_UPSTREAM_API_KEY: ${EXAMPLE_UPSTREAM_API_KEY}
      EXAMPLE_UPSTREAM_MODEL: ${EXAMPLE_UPSTREAM_MODEL}
      # Keep Stage 1's published identity truthful when the tutorial port is
      # overridden (including in collision-safe CI runs). Stage 2 replaces
      # these with the frontend origin in docker-compose.demo.yml.
      SITE_PUBLIC_BASE_URL: http://localhost:${BACKEND_PORT:-18080}
      BASE_URL: http://localhost:${BACKEND_PORT:-18080}
      FRONTEND_URL: http://localhost:${BACKEND_PORT:-18080}
    # Compose merges volumes by target, so naming this one replaces the
    # production bind mount rather than adding to it. `../../var/data` is
    # read-write and `var/**` is gitignored, so Docker created the missing host
    # path itself, as root: the first CI run left a root-owned var/data that
    # `actions/checkout` could not clean, failing every later job on that runner
    # before it read a line of code. The example writes no credentials, so it
    # gets memory instead. The `distributions/` mount it keeps -- that is where
    # this overlay now lives, and the backend reads its config through it.
    volumes:
      - type: tmpfs
        target: /app/var/data

  example-provider:
    build:
      context: ../..
      dockerfile: distributions/example/fixtures/fake-openai-provider/Dockerfile
    container_name: ${EXAMPLE_PROVIDER_CONTAINER_NAME:-hybridinference-example-provider}
    restart: unless-stopped
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8351"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8351/health', timeout=2)
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - hybridinference

  # Stage 1 never starts Postgres, but Compose resolves -- and provisions -- the
  # volumes of every service in the graph it builds, including ones `--no-deps`
  # leaves stopped. So the production `postgres_data` mount reached a fresh
  # Docker host as a missing external volume and failed `make up
  # DISTRIBUTION=example` before it started anything. Renaming that declaration
  # to a per-project volume answered the fresh-host problem but created a real
  # volume nobody mounts, and `down --volumes` removes only the volumes its
  # services still reference, so every CI run with a per-run project name left
  # one behind for good. Compose merges service volumes by target, so replacing
  # the mount instead takes `postgres_data` out of the model entirely: no
  # external volume to demand, and no throwaway volume to leak. Stage 2 replaces
  # this same target with its own example_postgres_data in
  # docker-compose.demo.yml.
  postgres:
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
