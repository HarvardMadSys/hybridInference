# Stage 2 of the runnable example: add the production Postgres/frontend
# services to the existing Stage 1 project and recreate only backend.
#
# There is no administrator account and no JWT or API-key secret here. The
# backend generates both secrets into the example database on its first start
# (so sessions and encrypted API keys survive a backend recreate, and
# `make demo-reset` discards them with the data), and the console's first-run
# setup page creates the administrator with the setup code from the backend
# log.
#
# The first start also copies the application settings below into that
# database -- all but DB_ENABLED, the DISTRIBUTION_CONFIG_* lines and
# REFRESH_TOKEN_COOKIE_NAME, which stay in the environment. From then on the
# stored values win over this file: change them in Admin -> Configuration
# (USER_AUTH_ENABLED and the SIGNUP_* switches are on the Settings tab), or
# reset the example to start over.
services:
  backend:
    environment:
      DB_ENABLED: "true"
      DB_STORE_FULL_CONTENT: "false"
      USER_AUTH_ENABLED: "true"
      DISTRIBUTION_CONFIG_PATH: /app/distributions/example/distribution.demo.yaml
      DISTRIBUTION_CONFIG_MODE: active
      # Verification off keeps SMTP out of this loopback-only demo: with it on,
      # the SMTP settings would be required before anyone could sign up.
      SIGNUP_ENABLED: "true"
      SIGNUP_REQUIRE_EMAIL_VERIFICATION: "false"
      SIGNUP_ADMIN_NOTIFY_ENABLED: "false"
      COOKIE_SECURE: "false"
      # Cookies ignore ports. A distinct name keeps this localhost demo from
      # overwriting the session of another HybridInference stack.
      REFRESH_TOKEN_COOKIE_NAME: hybridinference_example_refresh
      SITE_PUBLIC_BASE_URL: http://localhost:${FRONTEND_PORT:-13001}
      BASE_URL: http://localhost:${FRONTEND_PORT:-13001}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-13001}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-13001},http://127.0.0.1:${FRONTEND_PORT:-13001}

  frontend:
    build:
      args:
        # Explicit empty means same-origin. The browser reaches every API via
        # the frontend's Next.js rewrites, including the full smoke below.
        NEXT_PUBLIC_API_BASE: ""
        BACKEND_INTERNAL_URL: http://backend:8080
        NEXT_PUBLIC_APP_NAME: Example Router
        NEXT_PUBLIC_EXAMPLE_API_BASE: http://localhost:${FRONTEND_PORT:-13001}
        NEXT_PUBLIC_EXAMPLE_MODEL: example-chat
        NEXT_PUBLIC_STORAGE_KEY_PREFIX: hybridinference-example
    container_name: ${EXAMPLE_FRONTEND_CONTAINER_NAME:-hybridinference-example-frontend}
    environment:
      REFRESH_TOKEN_COOKIE_NAME: hybridinference_example_refresh

  postgres:
    container_name: ${EXAMPLE_POSTGRES_CONTAINER_NAME:-hybridinference-example-postgres}
    # Compose merges service volumes by container target, so this replaces the
    # base production mount without overriding its explicitly named external
    # volume. The new key naturally becomes project-scoped.
    volumes:
      - example_postgres_data:/var/lib/postgresql/data

volumes:
  example_postgres_data:
    driver: local
