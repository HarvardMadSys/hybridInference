# FreeInference distribution manifest.
#
# Loaded by serving/config/distribution.py when DISTRIBUTION_CONFIG_PATH points
# here. Current state (Phase 1 of the split design): the legacy config/*.yaml
# locations remain production truth — `paths:` below points at those same
# files, so DISTRIBUTION_CONFIG_MODE=dark on staging must report every
# comparison as "identical". Real config moves into this overlay only in
# Phase 2, one category per PR, dual-read verified.
#
# No secrets in this file — credentials stay in the environment.

schema_version: 1

distribution:
  id: freeinference
  display_name: FreeInference
  release: 2026.07.1

site:
  public_base_url: https://freeinference.org
  support_email: admin@freeinference.org

features:
  routers: [fixed, routewise]
  public_signup: true
  rag: true

paths:
  # Relative paths resolve against this file's directory. All three now point
  # inside the overlay: the legacy config/ location holds none of them, so
  # there is no second copy to drift.
  models: config/models.yaml
  routing: config/routing.yaml
  # Moved in — no longer an alias back to the legacy location.
  alerts: config/alerts.yaml
