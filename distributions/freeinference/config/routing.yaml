default_router: fixed
# DEPRECATED: `routing_parameter:` is a one-release shim consumed by
# RoutingManager for weight assignment; it will be removed once RoutingManager
# moves to per-model `router_params:` in models.yaml.
routing_parameter:
  local_fraction: 1
timeout: 2
health_check: 300
logging:
  output: output.log
local_deployment:
  - endpoint: ${LOCAL_DEPLOYMENT_URL}
    models:
      - qwen3.6-35b
  # h200a (port 8003) and h200b (port 8004) both serve deepseek-v4-flash.
  - endpoint: ${H200_DEPLOYMENT_URL}
    models:
      - deepseek-v4-flash
  - endpoint: ${H200B_DEPLOYMENT_URL}
    models:
      - deepseek-v4-flash
  # h200a's second TP=2 replica (port 8005); see the deepseek-v4-flash routes in
  # models.yaml for why the box runs two TP=2 replicas instead of one TP=4.
  - endpoint: ${H200A2_DEPLOYMENT_URL}
    models:
      - deepseek-v4-flash
  - endpoint: ${RC_DEPLOYMENT_URL}
    models:
      - /n/netscratch/juncheng_lab/model/GLM-5.1-FP8-2
remote_deployment:
  # List only the primary (coding-plan) endpoint. Listing the metered Moonshot
  # endpoint too would make FixedRatioStrategy split kimi-k2.7-code 0.5/0.5 across
  # both remotes, overriding the models.yaml primary/fallback weights; keeping just
  # the coding endpoint boosts it to 1.0 and lets the metered route keep its small
  # carried-over fallback weight after renormalization.
  - endpoint: ${KIMI_CODING_BASE_URL}
    models:
      - kimi-k2.7-code
  - endpoint:  http://research-data-opt-in-proxy.chutes.ai
    models:
      - moonshotai/Kimi-K2.6-TEE
      - zai-org/GLM-5-Turbo
  - endpoint: ${MINIMAX_BASE_URL}
    models:
      - minimax-m2.7
      - minimax-m2.5
  - endpoint: ${ZAI_BASE_URL}
    models:
      - glm-5-turbo
      - glm-5.1
      - glm-5.2
  - endpoint: ${DEEPSEEK_BASE_URL}
    models:
      - deepseek-v4-flash
      - deepseek-v4-pro
