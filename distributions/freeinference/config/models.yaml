    required_role: free
    provider_model_id: "deepseek-v4-flash"
    context_length: 1000000
    max_output_length: 393216
    aliases: ["deepseek-v4", "claude-opus-4-8", "claude-opus-4.8", "claude-sonnet-5"]
    supports_tools: true
