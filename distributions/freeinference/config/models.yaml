  # ===== Embedding Models =====
  # Served locally on a GPU box by ops/local_deployment_proxy (sglang --is-embedding),
  # the same idle proxy that serves the local chat models. Reuses LOCAL_DEPLOYMENT_URL
  # (the proxy's reverse tunnel); the proxy routes by the model field.

  - id: bge-m3
    name: BGE-M3
    type: embedding
    provider: sglang
    quantization: "fp16"
    input_modalities: ["text"]
    output_modalities: ["embedding"]
    context_length: 8192
    max_output_length: 0
    pricing:
      prompt: "0"
      completion: "0"
    route:
      - kind: sglang
        weight: 1.0
        base_url: ${LOCAL_DEPLOYMENT_URL}
        provider_model_id: "BAAI/bge-m3"
        api_keys:
          - ${LOCAL_API_KEY}
      # staging.freeinference.org canary fallback (key via STAGING_API_KEY).
      # optional: route is skipped at load when STAGING_API_KEY is unset/blank,
      # so the rest of the model stays available (and staging avoids self-routing
      # by simply not setting the key).
      #
      # Embedding models don't use weighted routing: the loader registers every
      # route in YAML order and the /v1/embeddings endpoint tries them as an
      # ordered fallback chain (primary first, this canary last), so `weight` is
      # ignored here. See registry.register_from_models_yaml and
      # FallbackEmbeddingAdapter.
      - kind: staging
        optional: true
        base_url: https://staging.freeinference.org/v1
        api_keys:
          - ${STAGING_API_KEY}
        provider_model_id: "bge-m3"

