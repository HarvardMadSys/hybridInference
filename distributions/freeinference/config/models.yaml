    supported_params: [temperature, top_p, max_tokens, stop, stream, thinking, reasoning_effort]
    input_modalities: ["text"]
    output_modalities: ["text"]
    quantization: "none"
    # DeepSeek API pricing: https://api-docs.deepseek.com/quick_start/pricing
    # Current price remains active until 2026-08-16 16:00 UTC. Thereafter the
    # daily peak windows are 01:00-04:00 and 06:00-10:00 UTC; all other hours
    # use the off-peak price.
    pricing:
      prompt: "0.14"
      completion: "0.28"
      image: "0"
      request: "0"
      input_cache_reads: "0.0028"
      input_cache_writes: "0"
    pricing_schedule:
      effective_at: "2026-08-16T16:00:00Z"
      timezone: UTC
      default:
        prompt: "0.22"
        completion: "0.66"
        input_cache_reads: "0.007"
      windows:
        - start: "01:00"
          end: "04:00"
          pricing:
            prompt: "0.44"
            completion: "1.32"
            input_cache_reads: "0.014"
        - start: "06:00"
          end: "10:00"
          pricing:
            prompt: "0.44"
            completion: "1.32"
            input_cache_reads: "0.014"
    route:
      # H200 local sglang — one route per node, each running ops/h200_idle_proxy.
      # h200a keeps the unsuffixed H200_DEPLOYMENT_URL (tunnelled on port 8003) so
      # gateways configured for the earlier single-node setup need no env change;
      # h200b adds H200B_DEPLOYMENT_URL (port 8004); h200a's second TP=2
      # replica adds H200A2_DEPLOYMENT_URL (port 8005).
      # optional: each route is skipped when its own env var is unset/blank, so one
      # node being down or unconfigured does not take the other's capacity with it.
      - kind: sglang
        weight: 1.0
        optional: true
        base_url: ${H200_DEPLOYMENT_URL}
        api_keys:
          - ${LOCAL_API_KEY}
        provider_model_id: "deepseek-v4-flash"
      - kind: sglang
        weight: 1.0
        optional: true
        base_url: ${H200B_DEPLOYMENT_URL}
        api_keys:
          - ${LOCAL_API_KEY}
        provider_model_id: "deepseek-v4-flash"
      # h200a replica B (port 8005). A 4xH200 box runs two TP=2 replicas rather
      # than one TP=4 instance: TP=4 scales at only ~0.71 efficiency on these
      # cards, so measured on h200a a single TP=2 replica does 4,215 decode tok/s
      # at c=128 against TP=4's 6,014, and two project to ~8,430 (+40%). The two
      # replicas are separate routes because that is what makes the gateway's
      # weighted-random selection spread load across them -- one route can only
      # ever reach one of them.
      - kind: sglang
        weight: 1.0
        optional: true
        base_url: ${H200A2_DEPLOYMENT_URL}
        api_keys:
          - ${LOCAL_API_KEY}
        provider_model_id: "deepseek-v4-flash"
      - kind: deepseek
        weight: 1.0
        base_url: ${DEEPSEEK_BASE_URL}
        api_keys:
          - ${DEEPSEEK_API_KEY}
        provider_model_id: "deepseek-v4-flash"
      - kind: ollama
        weight: 1.0
        base_url: ${OLLAMA_BASE_URL}
        api_keys:
          - ${OLLAMA_API_KEY}
        provider_model_id: "deepseek-v4-flash:0731-cloud"
      # staging.freeinference.org canary fallback (key via STAGING_API_KEY).
      # optional: route is skipped at load when STAGING_API_KEY is unset/blank,
      # so the rest of the model stays available (and staging avoids self-routing
