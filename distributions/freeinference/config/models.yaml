        api_keys:
          - ${FEATHERLESS_API_KEY}
        provider_model_id: "MiniMaxAI/MiniMax-M2.5"
      # staging.freeinference.org canary fallback (key via STAGING_API_KEY).
      # optional: route is skipped at load when STAGING_API_KEY is unset/blank,
      # so the rest of the model stays available (and staging avoids self-routing
      # by simply not setting the key).
      - kind: staging
        weight: 0.01
        optional: true
        base_url: https://staging.freeinference.org/v1
        api_keys:
          - ${STAGING_API_KEY}
        provider_model_id: "minimax-m2.5"

  - id: minimax-m3
    name: MiniMax M3
    required_role: free
    provider: minimax
    quantization: "bf16"
    # MiniMax-M3 natively accepts image and video upstream (OpenAI-compat
    # video_url content block). Video only on the primary MiniMax route.
    input_modalities: ["text", "image", "video"]
    output_modalities: ["text"]
    context_length: 1048576
    max_output_length: 131072
    supports_tools: true
    supports_structured_output: true
    supported_params: [temperature, top_p, max_tokens, stop, stream, thinking]
    # MiniMax-M3 streams reasoning as <mm:think>...</mm:think> tags inside the
    # content field rather than a structured reasoning_content delta. Lift the
    # tagged text into the reasoning channel (applies to every route below).
    processor: reasoning_extract
    aliases: ["MiniMax-M3"]
    # MiniMax PAYG https://platform.minimax.io/docs/guides/pricing-paygo
    pricing:
      prompt: "0.5"
      completion: "2"
      image: "0"
      request: "0"
      input_cache_reads: "0.3"
      input_cache_writes: "0.0"
    route:
      # Remote MiniMax API endpoint
      - kind: minimax
        weight: 1.0
        base_url: ${MINIMAX_BASE_URL}
        api_keys:
          - ${MINIMAX_API_KEY}
          - ${MINIMAX_API_KEY2}
        provider_model_id: "MiniMax-M3"
      # Ollama Cloud fallback
      - kind: ollama
        weight: 0.01
        base_url: ${OLLAMA_BASE_URL}
        api_keys:
          - ${OLLAMA_API_KEY}
        provider_model_id: "minimax-m3"
        # Ollama serving not verified for image/video; keep text-only so media
        # is dispatched only to the MiniMax primary route.
        input_modalities: ["text"]
      # staging.freeinference.org canary fallback (key via STAGING_API_KEY).
      # optional: route is skipped at load when STAGING_API_KEY is unset/blank,
      # so the rest of the model stays available (and staging avoids self-routing
      # by simply not setting the key).
      - kind: staging
        weight: 0.01
        optional: true
        base_url: https://staging.freeinference.org/v1
        api_keys:
          - ${STAGING_API_KEY}
        provider_model_id: "minimax-m3"
        # Canary fallback proxies back to the gateway; keep text-only so media
        # stays on the verified MiniMax primary route.
        input_modalities: ["text"]

  - id: minimax-fast
    name: MiniMax Fast
    required_role: admin
    provider: minimax
    quantization: "bf16"
    # Routes to MiniMax-M2.5, which is text-only upstream; do not advertise image.
    input_modalities: ["text"]
    output_modalities: ["text"]
    context_length: 204800
    max_output_length: 131072
    supports_tools: true
    supports_structured_output: true
    supported_params: [temperature, top_p, top_k, max_tokens, stop, seed, stream]
    aliases: ["MiniMax-Fast"]
    router: routewise
    router_params:
      # RouteWise algorithm options reference. Resource limits are configured
      # per route entry below: `quota: {limit}` plus a `quota_source:` block
      # (the provider usage API is the quota truth source, incl. window/reset
      # semantics) and `concurrency: {limit}`.
      budget_alpha: 0.5
      latency_hedge_mode: probability_target
      # Cold-start the cost envelope from minimax-m2.5's logged traffic (same
      # underlying model/workload; donor rows are priced with THIS model's
      # routes and only seed the DB bootstrap -- runtime updates stay own-traffic).
      envelope_bootstrap_donor_models: ["minimax-m2.5"]
      # random_seed: null
      # reference_api_price: {prompt: "1.2", completion: "4.0"}
      # db_bootstrap_enabled: true
      # db_bootstrap_max_rows: 50000
      # stateful_providers_single_worker_only: true
      # quota_snapshot_refresh_interval_sec: 60.0
      # envelope_window_hours: 24
      # envelope_lower_percentile: 10.0
      # envelope_upper_percentile: 90.0
      # envelope_min_samples: 1
      # output_default_tokens: 512.0
      # output_min_bucket_samples: 3
      # output_min_model_samples: 3
      # output_min_global_samples: 3
      # latency_slo_sec: 3.0
      # latency_window_sec: 900.0
      # latency_history_prior_window_sec: 86400.0
      # latency_max_samples_per_profile: 5000
      # latency_min_samples: 10
      # latency_unprofiled_ttft_ms: 5000.0
      # fallback_mode: policy
      # routewise_probe_enabled: false
      # routewise_probe_interval_sec: 300.0
      # routewise_probe_timeout_sec: 30.0
      # routewise_probe_idle_only: true
      # routewise_probe_idle_threshold_sec: 900.0
      # routewise_probe_max_concurrency: 1
      # prefix_cache_cost_adjustment_enabled: false
    # MiniMax PAYG https://platform.minimax.io/docs/guides/pricing-paygo
    pricing:
      prompt: "0.3"
      completion: "1.2"
      image: "0"
      request: "0"
      input_cache_reads: "0.03"
      input_cache_writes: "0.375"
    route:
      # S_Q: Chutes subscription quota, using provider quota snapshots.
      - kind: chutes
        weight: 1.0
        base_url: ${CHUTES_BASE_URL}
        api_keys:
          - ${CHUTES_API_KEY}
        provider_model_id: "MiniMaxAI/MiniMax-M2.5-TEE"
        provider_type: quota
        quota_pool: chutes-minimax-fast-daily
        quota_source:
          provider: chutes
          usage_label: "Daily requests"
          unit: requests
        quota:
          limit: 5000
      # S_Q (future): MiniMax coding plan 5h window. The official token-plan
      # remains API works (fetcher wired for admin observability), but it
      # reports remaining PERCENT only -- counts are zero -- so there is no
      # per-request consume scale and percent-unit quota sources are rejected
      # at boot. To enable MiniMax as a quota provider later, either the API
      # must expose real counts or the plan's window capacity must be
      # configured explicitly (e.g. requests_per_window) so percent can be
      # converted to a count-based usage in the fetcher.
      # S_C: Featherless Premium; paper real-eval used C=1 for MiniMax-M2.5.
      - kind: featherless
        weight: 1.0
        base_url: ${FEATHERLESS_BASE_URL}
        api_keys:
          - ${FEATHERLESS_API_KEY}
        provider_model_id: "MiniMaxAI/MiniMax-M2.5"
        provider_type: concurrency
        concurrency_pool: featherless-minimax-fast
        concurrency:
          limit: 1
      # S_A: OpenRouter-pinned DeepInfra, cheapest/highest-use MiniMax real-eval API leg.
      - kind: openrouter[deepinfra]
        weight: 1.0
        base_url: https://openrouter.ai/api/v1
        api_keys:
          - ${OPENROUTER_API_KEY}
        provider_type: on_demand
        provider_model_id: "minimax/minimax-m2.5"
        pricing:
          prompt: "0.15"
          completion: "1.15"
          image: "0"
          request: "0"
          input_cache_reads: "0.03"
          input_cache_writes: "0"

  # ── Kimi / Moonshot (kind: kimi_coding) ─────────────────────────
  # Flagship served primarily through the Kimi Code coding-plan subscription
  # (flat fee). The coding plan exposes the unified `kimi-for-coding` model
  # (currently the latest K2.7-code). Default FixedRouter: the coding-plan route
  # is strongly preferred by weight, with the pay-per-token Moonshot API kept as
  # a weighted fallback for when the coding-plan endpoint is unhealthy.
  - id: kimi-k2.7-code
    name: Kimi K2.7 Code (only support coding agents)
    required_role: pro
    provider: kimi
    quantization: "fp8"
    # The Kimi coding endpoint supports image and video inputs.
    input_modalities: ["text", "image", "video"]
    output_modalities: ["text"]
    context_length: 262144
    max_output_length: 131072
    supports_tools: true
    supports_structured_output: true
    supported_params: [temperature, top_p, max_tokens, stop, stream, thinking]
    aliases: ["Kimi-K2.7-Code", "kimi-k2.7"]
    pricing:
      prompt: "0.8"
      completion: "2.5"
      image: "0"
      request: "0"
      input_cache_reads: "0.2"
      input_cache_writes: "0"
    route:
      - kind: kimi_coding
        weight: 1.0
        base_url: ${KIMI_CODING_BASE_URL}
        api_keys:
          - ${KIMI_CODING_API_KEY}
        provider_model_id: "kimi-for-coding"
      # Ollama Cloud fallback
      - kind: ollama
        weight: 0.01
        base_url: ${OLLAMA_BASE_URL}
        api_keys:
          - ${OLLAMA_API_KEY}
        provider_model_id: "kimi-k2.7-code"
        # Ollama serving not verified for image/video; keep text-only so media
        # is dispatched only to the Kimi coding primary route.
        input_modalities: ["text"]
      - kind: chutes
        weight: 0.01
        base_url: ${CHUTES_BASE_URL}
        api_keys:
          - ${CHUTES_API_KEY}
        provider_model_id: "moonshotai/Kimi-K2.6-TEE"
        # Chutes fallback is not verified for image/video.
        input_modalities: ["text"]
      # staging.freeinference.org canary fallback (key via STAGING_API_KEY).
      # optional: route is skipped at load when STAGING_API_KEY is unset/blank,
      # so the rest of the model stays available (and staging avoids self-routing
      # by simply not setting the key).
      - kind: staging
        weight: 0.01
        optional: true
        base_url: https://staging.freeinference.org/v1
        api_keys:
          - ${STAGING_API_KEY}
        provider_model_id: "kimi-k2.7-code"
        # Canary fallback proxies back to the gateway; keep text-only so media
        # stays on the verified Kimi coding primary route.
        input_modalities: ["text"]


