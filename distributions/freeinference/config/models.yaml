# Example models registry for the OpenRouter-compatible server.
# Values like ${ENV_VAR} will be expanded from environment variables.
#
# NOTE: Local GPU endpoints use "host.docker.internal" to reach the host machine
# from inside Docker. For bare-metal (non-Docker) development, replace with "localhost".

models:
  - id: glm-5.1
    name: GLM-5.1
    required_role: free
    provider: zai
    quantization: "fp8"
    context_length: 200000
    max_output_length: 128000
    supports_tools: true
    supports_structured_output: true
    supported_params: [temperature, top_p, max_tokens, stop, stream, tool_stream, thinking]
    input_modalities: ["text"]
    output_modalities: ["text"]
    aliases: ["freeinference-glm-5.1"]
    # Z.AI PAYG https://docs.z.ai/guides/overview/pricing
    pricing:
      prompt: "2.8"
      completion: "6.4"
      image: "0"
      request: "0"
      input_cache_reads: "0.8"
      input_cache_writes: "0"
    route:
      - kind: zai
        weight: 1.0
        base_url: ${ZAI_BASE_URL}
        api_keys:
          - ${ZAI_API_KEY}
          - ${ZAI_API_KEY2}
        provider_model_id: "glm-5.1"
      # Ollama Cloud fallback
      - kind: ollama
        weight: 0.01
        base_url: ${OLLAMA_BASE_URL}
        api_keys:
          - ${OLLAMA_API_KEY}
        provider_model_id: "glm-5.1"
      - kind: chutes
        weight: 0.01
        base_url: ${CHUTES_BASE_URL}
        api_keys:
          - ${CHUTES_API_KEY}
        provider_model_id: "zai-org/GLM-5.1-TEE"
      # staging.freeinference.org canary fallback (key via STAGING_API_KEY).
      # optional: route is skipped at load when STAGING_API_KEY is unset/blank,
      # so the rest of the model stays available (and staging avoids self-routing
      # by simply not setting the key).
      - kind: staging
        weight: 0.01
        optional: true
        base_url: https://staging.freeinference.org/v1
        api_keys:
          - ${STAGING_API_KEY}
        provider_model_id: "glm-5.1"

  - id: glm-5.2
    name: GLM-5.2
    provider: zai
    required_role: pro
    quantization: "fp8"
    context_length: 1000000
    max_output_length: 131072
    supports_tools: true
    supports_structured_output: true
    supported_params: [temperature, top_p, max_tokens, stop, stream, tool_stream, thinking]
    input_modalities: ["text"]
    output_modalities: ["text"]
    aliases: ["freeinference-glm-5.2"]
    # Intentionally billed at 2x the Z.AI PAYG rate
    # (base: prompt 1.4 / completion 4.4 / cache 0.26 — https://docs.z.ai/guides/overview/pricing).
    # These values are charged as USD/M tokens against each user's cost quota.
    pricing:
      prompt: "2.8"
      completion: "8.8"
      image: "0"
      request: "0"
      input_cache_reads: "0.8"
      input_cache_writes: "0"
    route:
      - kind: zai
        weight: 1.0
        base_url: ${ZAI_BASE_URL}
        api_keys:
          - ${ZAI_API_KEY}
          - ${ZAI_API_KEY2}
        provider_model_id: "glm-5.2"
      # Ollama Cloud fallback
      - kind: ollama
        weight: 0.01
        base_url: ${OLLAMA_BASE_URL}
        api_keys:
          - ${OLLAMA_API_KEY}
        provider_model_id: "glm-5.2"
      - kind: chutes
        weight: 0.01
        base_url: ${CHUTES_BASE_URL}
        api_keys:
          - ${CHUTES_API_KEY}
        provider_model_id: "zai-org/GLM-5.2-TEE"
      # staging.freeinference.org canary fallback (key via STAGING_API_KEY).
      # optional: route is skipped at load when STAGING_API_KEY is unset/blank,
      # so the rest of the model stays available (and staging avoids self-routing
      # by simply not setting the key).
      - kind: staging
        weight: 0.01
        optional: true
        base_url: https://staging.freeinference.org/v1
        api_keys:
          - ${STAGING_API_KEY}
        provider_model_id: "glm-5.2"

