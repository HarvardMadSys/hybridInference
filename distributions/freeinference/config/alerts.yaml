rules:
  failed_request_rate:
    enabled: true
    window_sec: 3600
    threshold_pct: 10.0
    min_samples: 200
    cooldown_sec: 900
  fivexx_rate:
    enabled: true
    window_sec: 300
    threshold_pct: 10.0
    min_samples: 50
    cooldown_sec: 900
  p95_latency_per_provider:
    enabled: true
    window_sec: 600
    threshold_ms: 64000
    min_samples: 80
    cooldown_sec: 1800
    overrides: {}
  auth_failure_spike:
    enabled: true
    window_sec: 60
    threshold_count: 50
    cooldown_sec: 600
  prefix_cache_pending_leak:
    enabled: true
    window_sec: 600
    threshold_count: 20
    cooldown_sec: 3600
  # No concurrency_exhausted rule: a user exhausting their per-user quota or
  # concurrency limit is expected user-facing rate limiting (429), not a service
  # fault, so it must never page Slack.
  tracked_task_failure_rate:
    enabled: true
    window_sec: 300       # 5 min
    threshold_pct: 5.0    # 5% failure rate
    min_samples: 50       # need at least 50 completions before alerting
    cooldown_sec: 1800    # 30 min per task_name

state_changes:
  circuit_open:
    enabled: true
    cooldown_sec: 300
    # Subscription plans running dry is routine here, and the page names nothing
    # an operator can act on: no key rotation or restart shortens the provider's
    # window, and the breaker re-arms itself once it resets. Trips for every other
    # reason still page.
    page_on_usage_limit: false
  db_disconnect:
    enabled: true
    cooldown_sec: 300

cost:
  user_overrun:
    enabled: false
    check_interval_sec: 300
    cooldown_sec: 86400
    thresholds_per_role:
      free: 20.00
      pro: 200.00
      internal: 500.00
  provider_hourly_spend:
    enabled: true
    check_interval_sec: 300
    cooldown_sec: 3600
    budgets: {}
